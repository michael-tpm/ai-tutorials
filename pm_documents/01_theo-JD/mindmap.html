<style>
/* Layout: cây ngang mở rộng dần (gốc → 10 chương → nhóm → ý cốt lõi → từ khóa); mỗi chương 1 sắc độ; bản "Dàn ý" cho màn hẹp */
:root {
  --paper: #f5f7fa;
  --sheet: #ffffff;
  --ink: #18212f;
  --muted: #5b6676;
  --line: #d3dae3;
  --ai: #24508f;
  --ai-soft: #e6eef9;
  --s: 55%;
  --l: 36%;
  --font-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0f141c; --sheet: #161d28; --ink: #e5e9ef; --muted: #9aa5b5; --line: #2a3446; --ai: #86aee8; --ai-soft: #1c2b42; --s: 62%; --l: 70%; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #0f141c; --sheet: #161d28; --ink: #e5e9ef; --muted: #9aa5b5; --line: #2a3446; --ai: #86aee8; --ai-soft: #1c2b42; --s: 62%; --l: 70%; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink); font: 14px/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1400px; margin: 0 auto; padding-block: 20px 56px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
h1 { font: 700 clamp(22px, 3.2vw, 30px)/1.2 var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.seg button { font: 500 13px var(--font-body); padding: 7px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ai); color: var(--sheet); }
.btn { font: 500 13px var(--font-body); padding: 7px 12px; border: 1px solid var(--line); color: var(--ink); background: var(--sheet); border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--ai); color: var(--ai); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.legend { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.legend button { flex: 0 0 auto; display: inline-flex; gap: 6px; align-items: center; font: 500 12.5px var(--font-body); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; white-space: nowrap; }
.legend i { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) var(--s) var(--l)); }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }

.canvas { overflow-x: auto; background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; }
svg { display: block; }
svg .link { fill: none; stroke: hsl(var(--h) var(--s) var(--l)); stroke-opacity: .55; stroke-width: 1.4; }
svg .node { cursor: pointer; }
svg .node circle { stroke: hsl(var(--h) var(--s) var(--l)); stroke-width: 1.6; fill: var(--sheet); }
svg .node.closed circle { fill: hsl(var(--h) var(--s) var(--l)); }
svg .node.leaf { cursor: default; }
svg .node text { fill: var(--ink); font: 400 13px var(--font-body); dominant-baseline: middle; }
svg .node.d0 text { font: 700 16px var(--font-display); }
svg .node.d1 text { font: 600 14.5px var(--font-display); fill: hsl(var(--h) var(--s) var(--l)); }
svg .node.d2 text { font: 600 13px var(--font-body); }
svg .node.d4 text { fill: var(--muted); font-size: 12.5px; }
svg .node text.bg { stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; fill: var(--sheet); }
svg .node:focus-visible circle { stroke-width: 3; }
svg .fade { animation: fade .25s ease-out; }
@keyframes fade { from { opacity: .2; } to { opacity: 1; } }

.outline { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
.outline details { border-left: 3px solid hsl(var(--h) var(--s) var(--l)); padding-left: 10px; margin: 6px 0; }
.outline summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.outline > details > summary { font: 600 15px var(--font-display); color: hsl(var(--h) var(--s) var(--l)); }
.outline details details { border-left-width: 1px; border-color: var(--line); }
.outline ul { margin: 2px 0 6px; padding-left: 18px; }
.outline li { margin: 3px 0; }
.outline .kw { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { svg .fade { animation: none; } }
</style>

me": "Senior PM: tham gia estimate, proposal từ đầu", "children": [{"name": "見積もり (mitsumori) · 提案書 (teiansho)"}]}, {"name": "Mục tiêu 3–5 năm đo được, gắn với công ty", "children": [{"name": "Delivery/Program Manager"}]}, {"name": "Không coi outsourcing là bước đệm sang sản phẩm"}]}, {"name": "Behavioral STAR: thành công, thất bại, bài học", "children": [{"name": "STAR + Learning, Action chiếm khoảng 60%", "children": [{"name": "Result phải có số"}]}, {"name": "Thất bại: nhận phần mình sai, nói thay đổi đã làm", "children": [{"name": "change request · Definition of Done"}]}, {"name": "Thay đổi team bằng thử nghiệm nhỏ có đo lường", "children": [{"name": "振り返り (furikaeri)"}]}, {"name": "Đóng góp cho tổ chức ngoài dự án", "children": [{"name": "横展開 (yokotenkai)"}]}, {"name": "Tách rõ việc của team và quyết định của mình", "children": [{"name": "chịu được 3 lớp \"vì sao\""}]}]}, {"name": "Behavioral: áp lực, deadline, thiếu thông tin, bất đồng", "children": [{"name": "Nhịp tình huống 4 bước", "children": [{"name": "fact → khoanh vùng → 報連相 → 再発防止 / 横展開"}]}, {"name": "Deadline bất khả: số liệu + 2–3 phương án", "children": [{"name": "giảm phạm vi · thêm người · giao từng phần"}]}, {"name": "Thiếu thông tin: đảo ngược được thì quyết nhanh", "children": [{"name": "ghi giả định · điểm kiểm tra lại"}]}, {"name": "Bất đồng sếp: dữ liệu, trao đổi riêng trước", "children": [{"name": "根回し (nemawashi)"}]}, {"name": "Không che giấu lỗi với khách", "children": [{"name": "báo fact sớm, đối sách sau"}]}, {"name": "Onsite đổ lỗi: nhìn số liệu, một tiếng nói với khách"}]}, {"name": "Phong cách lãnh đạo & giá trị cá nhân", "children": [{"name": "Servant leadership, đổi phong cách theo tình huống", "children": [{"name": "situational leadership"}]}, {"name": "Điểm yếu thật → hậu quả → hành động → bằng chứng"}, {"name": "Trao quyền theo năng lực × mức rủi ro", "children": [{"name": "kiểm soát điểm rủi ro, không kiểm soát người"}]}, {"name": "KPI bản thân 4 nhóm", "children": [{"name": "t name": "帳票"}, {"name": "和暦 (令和)"}]}, {"name": "Số hóa kênh bán theo bước nhỏ có chỉ số"}]}, {"name": "Domain sản xuất", "children": [{"name": "生産管理/ERP lập kế hoạch, MES điều hành xưởng", "children": [{"name": "MRP · traceability"}]}, {"name": "SAP: offshore làm interface, migration, test", "children": [{"name": "ECC → S/4HANA · mốc cuối 2027"}]}, {"name": "TPS định hình kỳ vọng với vendor", "children": [{"name": "トヨタ生産方式 · 自働化"}, {"name": "見える化 · カイゼン"}, {"name": "なぜなぜ分析 · 現地現物"}]}, {"name": "Nói bằng chỉ số sản xuất, không bằng tính năng", "children": [{"name": "QCD"}, {"name": "OEE = khả dụng × hiệu suất × chất lượng"}]}, {"name": "Tôn trọng hiện trường, thử một dây chuyền trước", "children": [{"name": "現場"}, {"name": "品質管理"}]}, {"name": "AI kiểm ngoại quan ưu tiên tỉ lệ bỏ sót"}]}, {"name": "Xu hướng thị trường Nhật & offshore", "children": [{"name": "Vách đá 2025 → hiện đại hóa legacy", "children": [{"name": "2025年の崖"}, {"name": "経済産業省 (METI) 2018"}, {"name": "~12 nghìn tỷ yên/năm"}]}, {"name": "Nhật thiếu kỹ sư → đội dài hạn, upstream"}, {"name": "DX có ba mức", "children": [{"name": "デジタイゼーション"}, {"name": "デジタライゼーション"}, {"name": "DX"}]}, {"name": "GenAI: đo năng suất trước khi hứa giảm giá", "children": [{"name": "chính sách dùng AI được khách duyệt"}, {"name": "review code do AI sinh"}]}, {"name": "Yên yếu ép margin → đa thị trường, giá trị cao", "children": [{"name": "Hàn · Singapore"}]}, {"name": "Khách chuyển từ giá rẻ sang năng lực", "children": [{"name": "cloud · bảo mật · chứng chỉ"}]}]}, {"name": "Tư duy chiến lược Senior PM", "children": [{"name": "Đóng góp ngoài dự án phải đo được", "children": [{"name": "process · pre-sales"}, {"name": "đào tạo · tài sản tái sử dụng"}]}, {"name": "Tầm nhìn 3 năm: tin cậy, tự chủ, trung tâm năng lực"}, {"name": "Sản phẩm riêng từ phần lặp lại, tôn trọng IP khách", "children": [{"name": "kiểm tra điều khoản sở hữu trí tuệ"}]}, {"name": "Thẻ điểm cân bằng bốn nhóm", "children": [{"name": "khách hàng · tài chính"}, {"name": "delivery · con người"}]}, {"name": "Đặt \"sàn\" dài hạn khi đánh đổi ngắn hạn"}, {"name": "Leader tầng giữa quyết định thành bại chi nhánh", "children": [{"name": "PM · tech lead · BrSE"}]}]}]}]};
const HUES = [40, 210, 140, 285, 175, 15, 245, 320, 95, 195, 355];
const DY = 26, GAP = 46, PADX = 18, PADY = 22;

const root = d3.hierarchy(DATA);
let uid = 0;
root.each(d => {
  d.uid = uid++;
  d._kids = d.children || null;
  const top = d.depth === 0 ? null : d.ancestors().find(a => a.depth === 1);
  d.hue = top ? HUES[top.data.ch ?? 0] : 215;
});

const ctx = document.createElement("canvas").getContext("2d");
const FONTS = ["700 16px Lexend, sans-serif", "600 14.5px Lexend, sans-serif", "600 13px 'Be Vietnam Pro', sans-serif", "400 13px 'Be Vietnam Pro', sans-serif", "400 12.5px 'Be Vietnam Pro', sans-serif"];
function textW(d) { ctx.font = FONTS[Math.min(d.depth, 4)]; return ctx.measureText(d.data.name).width; }

function setLevel(lv, only) {
  root.each(d => {
    const inScope = !only || d.depth === 0 || d.ancestors().some(a => a.depth === 1 && a.data.ch === only);
    d.children = d._kids && d.depth < lv && inScope ? d._kids : null;
  });
  if (only) root.children = root._kids.filter(k => k.data.ch === only);
}

const svg = d3.select("#svg");
function update(anchor) {
  const before = anchor ? document.querySelector(`[data-uid="${anchor.uid}"]`)?.getBoundingClientRect().top : null;
  d3.tree().nodeSize([DY, 1]).separation((a, b) => a.parent === b.parent ? 1 : 1.3)(root);
  const nodes = root.descendants();
  const colW = [];
  nodes.forEach(d => { d.w = textW(d); colW[d.depth] = Math.max(colW[d.depth] || 0, d.w); });
  const colX = [PADX];
  for (let i = 0; i < colW.length; i++) colX[i + 1] = colX[i] + 14 + colW[i] + GAP;
  nodes.forEach(d => { d.y = colX[d.depth]; });
  const minX = d3.min(nodes, d => d.x), maxX = d3.max(nodes, d => d.x);
  const W = colX[colW.length] - GAP + PADX, H = maxX - minX + PADY * 2;
  svg.attr("width", W).attr("height", H).attr("viewBox", [0, minX - PADY, W, H]);

  svg.selectAll("*").remove();
  const link = d3.linkHorizontal().x(p => p.y).y(p => p.x);
  svg.append("g").selectAll("path").data(root.links()).join("path")
    .attr("class", "link").attr("style", d => `--h:${d.target.hue}`)
    .attr("d", d => link({ source: { x: d.source.x, y: d.source.y + 11 + d.source.w + 8 }, target: { x: d.target.x, y: d.target.y - 5 } }));

  const g = svg.append("g").selectAll("g").data(nodes).join("g")
    .attr("class", d => `node d${Math.min(d.depth, 4)} ${d._kids ? (d.children ? "open" : "closed") : "leaf"} ${anchor && d.parent === anchor ? "fade" : ""}`)
    .attr("style", d => `--h:${d.hue}`)
    .attr("data-uid", d => d.uid)
    .attr("transform", d => `translate(${d.y},${d.x})`)
    .attr("tabindex", d => d._kids ? 0 : null)
    .attr("role", d => d._kids ? "button" : null)
    .attr("aria-expanded", d => d._kids ? String(!!d.children) : null)
    .on("click", (e, d) => toggle(d))
    .on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(d); } });
  g.append("circle").attr("r", d => d.depth === 0 ? 6 : d.depth === 1 ? 5 : 4);
  g.append("text").attr("class", "bg").attr("x", 11).text(d => d.data.name);
  g.append("text").attr("x", 11).text(d => d.data.name);

  if (anchor && before != null) {
    const after = document.querySelector(`[data-uid="${anchor.uid}"]`)?.getBoundingClientRect().top;
    if (after != null) window.scrollBy(0, after - before);
  }
}
function toggle(d) { if (!d._kids) return; d.children = d.children ? null : d._kids; update(d); }

// legend
document.getElementById("legend").innerHTML = DATA.children.map(c =>
  `<button data-ch="${c.ch}" style="--h:${HUES[c.ch]}"><i></i>${c.name.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</button>`).join("");
document.getElementById("legend").addEventListener("click", e => {
  const b = e.target.closest("button[data-ch]"); if (!b) return;
  if (outlineOn) { const el = document.getElementById("o-" + b.dataset.ch); if (el) { el.open = true; el.scrollIntoView({ block: "start", behavior: "smooth" }); } return; }
  setLevel(3, +b.dataset.ch); update();
  document.getElementById("canvas").scrollIntoView({ block: "start", behavior: "smooth" });
});
document.getElementById("mapbar").addEventListener("click", e => {
  const b = e.target.closest("button[data-lv]"); if (!b) return; setLevel(+b.dataset.lv); update();
});

// outline view
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function outline(n, depth) {
  const kids = n.children || [];
  if (depth >= 2) {
    return `<ul>${kids.map(k => `<li>${esc(k.name)}${k.children ? ` <span class="kw">— ${k.children.map(x => esc(x.name)).join(" · ")}</span>` : ""}</li>`).join("")}</ul>`;
  }
  return kids.map(k => `<details ${depth === 0 ? `id="o-${k.ch}" style="--h:${HUES[k.ch]}"` : ""}><summary>${esc(k.name)}</summary>${outline(k, depth + 1)}</details>`).join("");
}
document.getElementById("outline").innerHTML = outline(DATA, 0);

let outlineOn = false;
function setView(out) {
  outlineOn = out;
  document.getElementById("v-map").setAttribute("aria-pressed", String(!out));
  document.getElementById("v-out").setAttribute("aria-pressed", String(out));
  document.getElementById("canvas").hidden = out;
  document.getElementById("mapbar").hidden = out;
  document.getElementById("outline").hidden = !out;
  document.getElementById("hint").textContent = out
    ? "Bấm từng chương, rồi từng nhóm để mở. Mỗi dòng là 1 ý cốt lõi, phần chữ xám là từ khóa cần nhớ."
    : "Bấm vào chấm tròn đặc để mở nhánh, chấm rỗng để thu lại. Bấm tên chương ở hàng trên để chỉ mở riêng chương đó.";
}
document.getElementById("v-map").onclick = () => setView(false);
document.getElementById("v-out").onclick = () => setView(true);

setLevel(2); update();
if (window.matchMedia("(max-width: 640px)").matches) setView(true);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => update());
</script>
