hỉ cuối năm, đầu năm). Em lập lịch chung hai nước, không đặt mốc giao hay `検収` (kenshuu – nghiệm thu) sát Tết, và tính thêm việc nhiều công ty Nhật kết thúc năm tài chính vào tháng 3 nên hay dồn release/検収 vào thời điểm này.", "t": "Ghi lịch nghỉ hai nước ngay trong slide スケジュール của proposal — khách Nhật đánh giá cao vendor tính trước điều này."}, {"n": 407, "c": 5, "g": "5.1", "q": "Thành viên mới vào dự án giữa chừng thì tính năng suất và chi phí onboarding thế nào?", "a": "Em không dùng năng suất trung bình của người đã quen hệ thống cho người mới. Thực tế em tính hiệu suất tháng đầu thấp hơn (vd 50–70%, tham khảo) nếu domain hoặc hệ thống lạ, cộng thời gian mentor của senior (thường mất 10–20% quỹ thời gian, tham khảo) và effort đọc tài liệu tiếng Nhật. Sau 2–4 tuần em đo output thật để hiệu chỉnh kế hoạch; nếu lệch ảnh hưởng mốc thì báo khách sớm, không đợi đến hạn.", "t": ""}, {"n": 408, "c": 5, "g": "5.1", "q": "Phân biệt effort, duration và cost trong một bản estimate?", "a": "Effort (`工数` kousuu – công số) là lượng công sức tính bằng 人時 (ninji – người-giờ), 人日 hoặc 人月; duration là thời gian lịch từ lúc bắt đầu đến lúc xong, phụ thuộc số người, phụ thuộc giữa các task và lịch nghỉ; cost = effort × đơn giá theo vai trò + chi phí khác (license, môi trường, đi lại onsite). Một estimate tốt trình bày cả ba và nêu giả định nối chúng, ví dụ \"8 người chạy song song từ giai đoạn thiết kế chi tiết\".", "t": ""}, {"n": 409, "c": 5, "g": "5.1", "q": "Vì sao estimate nên tách theo vai trò (PM, BrSE, dev, QA, comtor) thay vì gộp một đơn giá?", "a": "Vì đơn giá từng vai trò khác nhau, và khách Nhật thường muốn thấy `体制` (taisei – cơ cấu nhân sự dự án) để đánh giá tính hợp lý. Tách vai trò giúp ① khách thấy ai làm gì, ② khi đàm phán có thể chỉnh tỷ lệ (vd giảm comtor nếu khách đọc được tiếng Anh) thay vì cắt đều mọi thứ, ③ nội bộ kiểm soát margin theo vai trò. Dự án nhỏ có thể báo blended rate, nhưng bảng tách vẫn giữ ở nội bộ.", "t": ""}, {"n": 410, "c": 5, "g": "5.1", "q": "\"The Mythical Man-Month\" còn đúng với team dùng AI coding assistant không?", "a": "Công cụ AI có thể giảm effort ở phần code và test lặp lại, nhưng không xóa chi phí giao tiếp, làm rõ yêu cầu, review và tích hợp — chính là phần Brooks nói tới. Em chỉ đưa mức giảm vào estimate khi có số đo nội bộ trên loại task tương tự (trước/sau khi dùng), và ghi nó thành giả định có thể hiệu chỉnh. Với khách tài chính/bảo hiểm, còn phải nêu rõ chính sách dùng AI, quy trình review code sinh ra và việc có được phép đưa tài liệu khách vào công cụ hay không.", "t": "Đừng hứa \"AI giảm 30–50% chi phí\" khi chưa có số đo của chính team — khách sẽ đòi giảm giá ngay trong hợp đồng."}, {"n": 411, "c": 5, "g": "5.2", "q": "Bạn dùng những phương pháp estimate nào và khi nào dùng cái nào?", "a": "① Analogous khi giai đoạn sớm, chỉ có mô tả cấp cao và có dự án cũ tương tự; ② parametric (FP, use case point, đơn vị màn hình × năng suất) khi đã có danh sách chức năng; ③ WBS bottom-up khi yêu cầu đủ rõ để lập kế hoạch chi tiết; ④ 3-point/PERT cho task bất định cao; ⑤ expert judgment hoặc Wideband Delphi cho phần mới lạ. Thực tế em dùng ít nhất 2 cách độc lập; lệch nhau > 20% (tham khảo) thì tìm nguyên nhân trước khi nộp.", "t": "Câu \"em triangulate bằng 2 phương pháp độc lập rồi giải thích chênh lệch\" cho thấy độ senior hơn nhiều so với kể tên phương pháp."}, {"n": 412, "c": 5, "g": "5.2", "q": "Làm WBS bottom-up estimate thế nào cho đúng?", "a": "Chia việc đến work package khoảng 8–80 giờ (quy tắc tham khảo), mỗi gói có đầu ra rõ: tài liệu, màn hình, batch, test spec. Người sẽ làm hoặc người có kinh nghiệm estimate từng gói, sau đó em cộng các việc hay bị quên: review và sửa sau review, họp, Q&A, dựng môi trường, chuẩn bị dữ liệu test, tài liệu bàn giao. Cuối cùng đối chiếu tổng với kết quả top-down — bottom-up thường thiếu vì bỏ sót các việc \"keo dán\" giữa các gói.", "t": ""}, {"n": 413, "c": 5, "g": "5.2", "q": "Analogous estimate có rủi ro gì, giảm thế nào?", "a": "Rủi ro là \"giống bề ngoài, khác bản chất\": cùng là hệ thống bảo hiểm nhưng khác số tích hợp, khác yêu cầu phi chức năng, khác độ chín của team. Em giảm bằng cách so theo yếu tố định lượng (số màn hình, batch, interface, bảng dữ liệu), điều chỉnh hệ số cho phần khác biệt và ghi rõ dự án tham chiếu. Analogous chỉ dùng cho `概算` (gaisan – ước tính sơ bộ), không dùng làm con số cam kết của hợp đồng `請負` (ukeoi – hợp đồng trọn gói theo kết quả).", "t": ""}, {"n": 414, "c": 5, "g": "5.2", "q": "Function Point là gì? Các thành phần chính theo IFPUG?", "a": "FP đo quy mô phần mềm theo chức năng người dùng nhìn thấy, không phụ thuộc ngôn ngữ lập trình. Theo IFPUG có 5 loại: data function gồm ILF (dữ liệu hệ thống tự quản lý) và EIF (dữ liệu tham chiếu từ hệ thống khác); transaction function gồm EI (nhập), EO (xuất có xử lý/tính toán), EQ (truy vấn). Mỗi loại xếp độ phức tạp thấp/trung bình/cao theo số DET, RET, FTR rồi nhân trọng số ra unadjusted FP; effort = FP × năng suất (giờ/FP) lấy từ dữ liệu lịch sử.", "t": ""}, {"n": 415, "c": 5, "g": "5.2", "q": "Ở Nhật FP được dùng thế nào? Đếm nhanh ra sao khi chưa có thiết kế?", "a": "Nhiều khách Nhật, nhất là khối tài chính và khu vực công, dùng FP để đánh giá quy mô và kiểm tra tính hợp lý của báo giá vendor; IPA cũng công bố dữ liệu thống kê năng suất theo FP để ngành tham khảo. Khi chưa có thiết kế, có thể đếm ước lượng kiểu NESMA (chủ yếu dựa vào số data function), sai số lớn hơn nhưng nhanh. Em dùng FP ước lượng cho báo giá sơ bộ, rồi đếm lại chi tiết sau khi có thiết kế cơ bản để ra số cam kết.", "t": "Với khách tài chính/bảo hiểm, chủ động hỏi \"御社では FP で規模を評価されていますか\" (quý công ty có đánh giá quy mô bằng FP không) và chuẩn bị sẵn bảng đếm FP."}, {"n": 416, "c": 5, "g": "5.2", "q": "3-point estimate và PERT tính thế nào? Cho ví dụ.", "a": "Lấy 3 giá trị: lạc quan O, khả dĩ nhất M, bi quan P; PERT: E = (O + 4M + P)/6, độ lệch chuẩn σ ≈ (P − O)/6. Ví dụ task tích hợp API ngân hàng: O = 5, M = 8, P = 17 ngày → E = 9 ngày, σ = 2 ngày; muốn độ tin cậy khoảng 84% thì lấy E + 1σ = 11 ngày. Giá trị lớn nhất của 3-point là lộ ra độ bất định: task nào P/O lớn là ứng viên cho POC hoặc cần ghi giả định.", "t": ""}, {"n": 417, "c": 5, "g": "5.2", "q": "Expert judgment khác Wideband Delphi thế nào? Khi nào dùng Delphi?", "a": "Expert judgment là 1 hoặc vài chuyên gia đưa số — nhanh nhưng dễ dính bias của người nói to nhất. Wideband Delphi: nhiều người estimate độc lập, ẩn danh, thảo luận các giả định khác nhau rồi estimate lại 2–3 vòng đến khi hội tụ. Em dùng Delphi cho phần mới lạ, rủi ro cao hoặc bid lớn; giá trị chính là lộ ra giả định ngầm khác nhau, ví dụ người A hiểu có migration dữ liệu còn người B thì không.", "t": ""}, {"n": 418, "c": 5, "g": "5.2", "q": "Use Case Point là gì, có hợp với dự án outsourcing Nhật không?", "a": "UCP tính quy mô từ số actor và use case theo độ phức tạp (UUCP), nhân hệ số kỹ thuật TCF và hệ số môi trường ECF; Karner gợi ý khoảng 20 giờ/UCP (tham khảo, phải hiệu chỉnh). Hợp khi yêu cầu viết dạng use case; nhưng tài liệu khách Nhật thường mô tả theo màn hình, `帳票` (chouhyou – biểu mẫu/báo cáo in), batch, interface, nên em hay quy về đơn vị đó hoặc FP thay vì UCP.", "t": ""}, {"n": 419, "c": 5, "g": "5.2", "q": "Parametric estimate theo \"đơn vị chức năng × năng suất\" làm thế nào?", "a": "Phân loại từng đơn vị theo độ khó (vd màn hình S/M/L theo số item, độ phức tạp logic, số bảng truy cập), gán effort chuẩn mỗi loại từ dữ liệu lịch sử, đếm số lượng rồi nhân. Ví dụ phần thiết kế chi tiết đến unit test: 20 màn hình M × 6人日 + 10 batch L × 8人日. Ưu điểm: nhanh, minh bạch, khách dễ kiểm và dễ tính `追加見積` (tsuika mitsumori – báo giá bổ sung) khi thêm màn hình. Điều kiện: định nghĩa S/M/L phải viết ra và thống nhất với khách.", "t": ""}, {"n": 420, "c": 5, "g": "5.2", "q": "COCOMO II có dùng được trong thực tế không?", "a": "COCOMO II (Boehm) tính effort = A × Size^E × các hệ số điều chỉnh; điểm hay là thể hiện tính phi tuyến: quy mô gấp đôi thì effort hơn gấp đôi do chi phí phối hợp. Nhưng hệ số mặc định phải hiệu chỉnh bằng dữ liệu nội bộ, nếu không sai số rất lớn. Em dùng nó để kiểm chéo cho dự án lớn và để giải thích với khách vì sao gộp hai hệ thống thành một dự án không thể báo giá bằng tổng hai báo giá lẻ, chứ không dùng làm số chính.", "t": ""}, {"n": 421, "c": 5, "g": "5.2", "q": "Làm sao xây dữ liệu lịch sử để estimate ngày càng chính xác?", "a": "Sau mỗi dự án hoặc milestone, em ghi actual effort theo đúng cấu trúc của estimate: công đoạn, đơn vị chức năng (màn hình/batch/FP), độ khó, công nghệ, domain, thành phần team, kèm % lệch và nguyên nhân. Dữ liệu chỉ có giá trị khi cùng định nghĩa đơn vị và timesheet ghi đúng mã task. Sau 3–5 dự án đã có năng suất chuẩn theo loại để làm parametric và bảo vệ estimate bằng số thật thay vì cảm tính.", "t": "Nói được \"em lưu cả % lệch và nguyên nhân\" cho thấy bạn có vòng học, không estimate xong là quên."}, {"n": 422, "c": 5, "g": "5.2", "q": "Yêu cầu phi chức năng estimate thế nào để không bị bỏ sót?", "a": "`非機能要件` (hi-kinou youken – yêu cầu phi chức năng) hay bị quên vì không hiện thành màn hình. Em dùng checklist — có thể tham khảo `非機能要求グレード` (hi-kinou youkyuu gureedo – bộ phân cấp yêu cầu phi chức năng) của IPA — gồm hiệu năng, availability, bảo mật, backup, vận hành; mỗi mục ghi mức yêu cầu và việc phải làm (tuning, load test, monitoring). Mục nào khách chưa chốt thì ghi vào `前提条件` (zentei jouken – điều kiện tiền đề) với giả định cụ thể, vd \"phản hồi ≤ 3 giây với 100 user đồng thời\".", "t": ""}, {"n": 423, "c": 5, "g": "5.3", "q": "Tỷ lệ effort tham khảo giữa các 工程 trong dự án waterfall kiểu Nhật là bao nhiêu?", "a": "Tỷ lệ em dùng để kiểm tra tính hợp lý (tham khảo, tùy dự án): 要件定義 ~10–15%, `基本設計` (kihon sekkei – thiết kế cơ bản) ~15%, `詳細設計` (shousai sekkei – thiết kế chi tiết) ~10–15%, `製造・単体テスト` (seizou/tantai tesuto – lập trình và unit test) ~25–35%, `結合テスト` (ketsugou tesuto – test tích hợp) ~15%, `総合テスト` (sougou tesuto – test hệ thống) ~10–15%. Đây là bộ lọc: nếu bottom-up ra phần test chỉ 10% tổng thì gần như chắc đang thiếu. Dự án migration, package hay AI có tỷ lệ khác hẳn.", "t": "Luôn nói kèm \"tham khảo, tùy loại dự án\" — đọc tỷ lệ như chân lý là bẫy interviewer hay giăng."}, {"n": 424, "c": 5, "g": "5.3", "q": "Offshore thường nhận những 工程 nào, và estimate phần ranh giới với khách ra sao?", "a": "Mô hình phổ biến: khách hoặc onsite làm 要件定義 và 基本設計, offshore nhận 詳細設計 đến 結合テスト, còn 総合テスト và `受入テスト` (ukeire tesuto – test nghiệm thu của khách) có khi khách làm hoặc làm chung. Ranh giới là nơi estimate hay hụt: đọc hiểu 基本設計 tiếng Nhật, Q&A, sửa theo thay đổi thiết kế, hỗ trợ khách test. Em ghi rõ vendor làm từ công đoạn nào đến công đoạn nào, đầu vào bắt buộc là gì, và effort hỗ trợ công đoạn khách làm tính thành dòng riêng.", "t": ""}, {"n": 425, "c": 5, "g": "5.3", "q": "Overhead PM, QA, BrSE, comtor thường chiếm bao nhiêu và bạn tính thế nào?", "a": "Tham khảo, tùy quy mô: PM khoảng 10–15% effort phát triển, QA độc lập 10–20%, BrSE 10–20% với dự án nhiều tài liệu tiếng Nhật, comtor tính theo khối lượng dịch thực tế. Em không cộng % máy móc: dự án nhỏ vẫn cần tối thiểu khoảng 0.5 PM, dự án lớn thì tỷ lệ giảm dần. Em tính bottom-up từ số cuộc họp, số trang tài liệu phải dịch, số Q&A dự kiến mỗi tuần, rồi so với % tham khảo để kiểm.", "t": ""}, {"n": 426, "c": 5, "g": "5.3", "q": "Effort cho tài liệu tiếng Nhật và dịch thuật tính thế nào?", "a": "Em tách 3 loại: ① đọc hiểu tài liệu khách (spec, biên bản) — dịch sang tiếng Việt hoặc BrSE giải thích; ② viết deliverable bằng tiếng Nhật như `設計書` (sekkeisho – tài liệu thiết kế), `テスト仕様書` (tesuto shiyousho – đặc tả test), báo cáo; ③ dịch qua lại hằng ngày: mail, `QA表` (QA-hyou – bảng hỏi đáp), biên bản họp. Mỗi loại estimate theo số trang × năng suất của team, cộng vòng review ngôn ngữ. Dịch máy cho nháp nhanh nhưng vẫn phải tính effort hiệu đính, vì thuật ngữ tài chính/bảo hiểm dễ sai nghĩa.", "t": ""}, {"n": 427, "c": 5, "g": "5.3", "q": "Có nên tính effort cho Q&A với khách không? Tính thế nào?", "a": "Có, vì Q&A là khoản tiêu tốn lớn ở offshore: viết câu hỏi tiếng Nhật, chờ trả lời, xử lý những câu trả lời làm đổi thiết kế. Em estimate theo số câu hỏi dự kiến (dựa trên độ chín của spec và tỷ lệ câu hỏi/màn hình ở dự án cũ) × thời gian xử lý mỗi câu, và ghi giả định thời hạn trả lời của khách (vd ≤ 2 ngày làm việc) vào 前提条件. Khách trả lời chậm hơn thì đó là căn cứ để điều chỉnh lịch.", "t": ""}, {"n": 428, "c": 5, "g": "5.3", "q": "Những chi phí ngoài nhân công nào hay bị quên khi estimate?", "a": "License phần mềm và công cụ, môi trường cloud cho dev/test/staging, thiết bị test thật, đường truyền hoặc VPN riêng theo yêu cầu bảo mật của khách tài chính, chi phí onsite (vé máy bay, visa, khách sạn, phụ cấp), đánh giá bảo mật bởi bên thứ ba, dịch thuật thuê ngoài. Em có checklist chi phí ngoài nhân công và ghi rõ khoản nào vendor chịu, khoản nào là `支給` (shikyuu – khách cung cấp) để tránh tranh cãi khi chạy dự án.", "t": ""}, {"n": 429, "c": 5, "g": "5.3", "q": "Giai đoạn bảo trì vận hành được estimate thế nào?", "a": "`保守運用` (hoshu un'you – bảo trì vận hành) không estimate theo chức năng mà theo khối lượng dịch vụ: số ticket/tháng dự kiến, khung giờ phản hồi (giờ hành chính JST hay 24/7), SLA, số người trực tối thiểu để phủ ca. Em dùng dữ liệu sự cố quá khứ nếu khách có, đặt mức nền (vd X人月/tháng cho tối đa Y ticket) và đơn giá cho phần vượt. Phải ghi rõ bảo trì có bao gồm cải tiến nhỏ hay không, để không biến thành phát triển miễn phí.", "t": ""}, {"n": 430, "c": 5, "g": "5.3", "q": "Effort 結合テスト và 総合テスト hay bị underestimate — làm sao estimate sát hơn?", "a": "Em estimate test theo số test case dự kiến chứ không chỉ theo %: số case/đơn vị chức năng × thời gian thiết kế case, thực thi, lấy `エビデンス` (ebidensu – bằng chứng test, thường là screenshot từng bước), cộng 1–2 vòng retest sau khi sửa bug. Khách Nhật thường yêu cầu evidence chi tiết nên effort lấy evidence có thể rất đáng kể — phải hỏi format trước khi báo giá. Thêm effort chuẩn bị dữ liệu test và môi trường tích hợp với hệ thống ngoài.", "t": "Hỏi sớm \"エビデンスの粒度はどの程度必要でしょうか\" (cần evidence chi tiết đến mức nào) — chụp từng bước hay chỉ log kết quả có thể làm effort test chênh nhau rất xa."}, {"n": 431, "c": 5, "g": "5.3", "q": "Dự án có nhiều interface với hệ thống cũ của khách thì phân bổ effort khác gì?", "a": "Tích hợp kéo effort về phía phân tích và 結合テスト: phải đọc tài liệu interface cũ (thường thiếu hoặc lỗi thời), làm stub/mock, xin lịch dùng môi trường test của hệ thống đối tác, và xử lý dữ liệu không đúng như spec. Em tăng tỷ trọng phân tích và test tích hợp, đếm interface theo độ khó (định dạng file, online hay batch, số hệ thống liên quan) và ghi 前提条件 về môi trường kết nối do khách chuẩn bị và lịch đối tác hỗ trợ.", "t": ""}, {"n": 432, "c": 5, "g": "5.4", "q": "Contingency reserve và management reserve khác nhau thế nào? Nên đặt bao nhiêu?", "a": "Contingency reserve dành cho rủi ro đã nhận diện (known unknowns), nằm trong baseline do PM quản lý; management reserve cho rủi ro chưa biết (unknown unknowns), cấp trên giữ, không nằm trong baseline. Mức tham khảo: 10–15% khi yêu cầu tương đối rõ, 20–30% khi yêu cầu mơ hồ hoặc công nghệ mới. Nhưng em ưu tiên tính contingency từ danh sách rủi ro (xác suất × tác động) hơn là cộng một % chung cho cả dự án.", "t": ""}, {"n": 433, "c": 5, "g": "5.4", "q": "Có nên để buffer lộ ra trong báo giá gửi khách Nhật không?", "a": "Em không ghi dòng \"buffer 15%\" vì khách rất dễ yêu cầu cắt ngay. Thay vào đó, em gắn contingency vào từng hạng mục có rủi ro cụ thể (vd thêm effort cho interface chưa có tài liệu) và giải thích bằng chính rủi ro đó; rủi ro ngoài kiểm soát của vendor thì chuyển thành 前提条件. Tức là minh bạch về rủi ro, nhưng không trình bày như một khoản \"dự phòng\" vô danh có thể bị gạch.", "t": "Bẫy: giấu buffer bằng cách thổi phồng đều mọi task — khách so effort/màn hình hay effort/FP sẽ thấy bất thường ngay; hãy gắn buffer vào rủi ro có tên."}, {"n": 434, "c": 5, "g": "5.4", "q": "前提条件 là gì và vì sao nó là công cụ quan trọng nhất để bảo vệ estimate?", "a": "前提条件 là các giả định mà con số estimate dựa vào: phạm vi, đầu vào khách cung cấp, thời hạn phản hồi, môi trường, công nghệ, số vòng review, ngôn ngữ tài liệu. Khi giả định thay đổi, estimate được phép thay đổi theo — đây là căn cứ hợp đồng để đưa ra 追加見積. Estimate không có 前提条件 rõ thì mọi rủi ro mặc định thuộc về vendor, đặc biệt với hợp đồng 請負.", "t": ""}, {"n": 435, "c": 5, "g": "5.4", "q": "Cho ví dụ các 前提条件 điển hình bạn ghi trong báo giá dự án web cho ngân hàng.", "a": "① Phạm vi theo danh sách chức năng đính kèm (bản ngày X); ② 基本設計書 do khách cung cấp và đã chốt trước khi bắt đầu 詳細設計; ③ Q&A được trả lời trong ≤ 2 ngày làm việc; ④ môi trường test và dữ liệu test khách cung cấp trước ngày Y; ⑤ trình duyệt/thiết bị hỗ trợ theo danh sách cụ thể; ⑥ deliverable tiếng Nhật theo template khách, review tối đa 2 vòng; ⑦ không bao gồm migration dữ liệu và load test quy mô production.", "t": "Mỗi 前提条件 phải kiểm chứng được (có ngày, số, phiên bản tài liệu) — \"khách hợp tác tích cực\" là giả định vô dụng."}, {"n": 436, "c": 5, "g": "5.4", "q": "対象外 nên ghi những gì?", "a": "`対象外` (taishougai – ngoài phạm vi) liệt kê rõ những việc khách dễ mặc định là \"có trong giá\": migration dữ liệu, test hiệu năng/bảo mật bởi bên thứ ba, 総合テスト hoặc UAT, đào tạo người dùng, vận hành sau go-live, sửa lỗi của hệ thống hiện có, hỗ trợ ngoài giờ, mua license/hạ tầng. Em viết thành danh sách cụ thể, không chỉ \"ngoài những gì ghi trên\"; mục quan trọng thì thêm câu \"nếu cần sẽ báo giá riêng\" để mở sẵn đường cho 追加見積.", "t": ""}, {"n": 437, "c": 5, "g": "5.4", "q": "概算見積 và 詳細見積 khác nhau thế nào? Trình bày 概算 ra sao để khách không coi là con số cam kết?", "a": "`概算見積` (gaisan mitsumori – báo giá sơ bộ) làm khi yêu cầu còn ở mức ý tưởng hoặc RFI, sai số lớn, khách dùng để xin ngân sách; `詳細見積` (shousai mitsumori – báo giá chi tiết) làm khi đã có 要件定義/基本設計, dùng để ký hợp đồng. Với 概算, em ghi range (vd 40–60人月), độ chính xác, căn cứ, hạn hiệu lực và câu \"本見積は概算であり、要件確定後に再見積いたします\" (đây là báo giá sơ bộ, sẽ báo giá lại sau khi chốt yêu cầu).", "t": "Khách Nhật thường dùng 概算 để xin `予算` (yosan – ngân sách) nội bộ; đưa số quá thấp để \"lấy lòng\" sẽ tự khóa mình vào ngân sách đó."}, {"n": 438, "c": 5, "g": "5.4", "q": "多段階見積 là gì và vì sao nên đề xuất cho khách?", "a": "`多段階見積` (tadankai mitsumori – báo giá nhiều giai đoạn) là chia dự án thành các giai đoạn, mỗi giai đoạn báo giá và ký riêng khi đã đủ thông tin, thay vì báo một giá cho toàn bộ từ lúc yêu cầu còn mơ hồ. Mẫu hợp đồng tham khảo do METI/IPA công bố cũng khuyến nghị cách tiếp cận theo giai đoạn. Lợi ích: estimate từng bước chính xác hơn, rủi ro chia công bằng hơn, khách có điểm quyết định dừng hay đi tiếp, và vendor không phải độn buffer lớn.", "t": ""}, {"n": 439, "c": 5, "g": "5.4", "q": "Rủi ro nào nên chuyển thành điều khoản thay vì cộng buffer?", "a": "Rủi ro nằm ngoài kiểm soát của vendor: khách chậm cung cấp đầu vào, thay đổi spec, hệ thống ngoài chưa sẵn sàng, thay đổi luật/quy định, biến động tỷ giá với hợp đồng dài. Cộng buffer cho những thứ này vừa làm giá kém cạnh tranh, vừa không đủ nếu rủi ro xảy ra lớn. Em đưa chúng vào 前提条件 kèm cơ chế `変更管理` (henkou kanri – quản lý thay đổi): khi xảy ra thì phân tích ảnh hưởng và báo giá bổ sung. Buffer chỉ dành cho rủi ro nội bộ như năng suất, kỹ thuật, nhân sự.", "t": ""}, {"n": 440, "c": 5, "g": "5.4", "q": "Estimate ra range 80–110人月 — khi nộp giá thì chọn điểm nào?", "a": "Tùy loại hợp đồng và mức rủi ro chấp nhận: với 請負, em đề xuất mức có xác suất hoàn thành cao (vd P80, tham khảo) vì vendor gánh phần vượt; với `準委任` (jun-inin – hợp đồng theo công sức) có thể trình bày range, lập kế hoạch theo điểm giữa và cập nhật định kỳ. Giá cuối cùng là quyết định kinh doanh của sales/BOD (khách chiến lược có thể chấp nhận margin thấp), nhưng PM phải ghi rõ xác suất và rủi ro của điểm đã chọn vào hồ sơ duyệt giá nội bộ.", "t": "Tách bạch \"estimate\" (PM nói sự thật) và \"price\" (quyết định kinh doanh) — trộn hai thứ này là dấu hiệu thiếu độ chín."}, {"n": 441, "c": 5, "g": "5.4", "q": "Hạn hiệu lực của báo giá có ý nghĩa gì với dự án Nhật?", "a": "`有効期限` (yuukou kigen – thời hạn hiệu lực), thường 30–90 ngày (tham khảo), bảo vệ vendor khỏi việc khách ký sau nhiều tháng khi đơn giá, tỷ giá, nhân sự đã đổi. Khách Nhật có quy trình `稟議` (ringi – trình duyệt nội bộ nhiều cấp) khá dài, nên em hỏi lịch duyệt dự kiến để đặt hạn hợp lý và ghi thêm \"nếu bắt đầu sau ngày X thì cần xác nhận lại nhân sự và lịch\". Hết hạn thì báo giá lại hoặc xác nhận bằng văn bản là giá vẫn giữ.", "t": ""}, {"n": 442, "c": 5, "g": "5.4", "q": "Rủi ro key person và rủi ro nhân sự phản ánh vào estimate thế nào?", "a": "Em xác định các vị trí khó thay: BrSE giỏi tiếng Nhật và hiểu domain, tech lead công nghệ hiếm. Với các vị trí này, em tính effort chồng lấn để bàn giao (shadow) và chi phí đào tạo người dự phòng vào contingency; dự án dài thì cộng thêm giả định tỷ lệ nghỉ việc và thời gian tuyển thay thế. Đồng thời proposal phải thể hiện cơ chế backup (vị trí phó cho PM/BrSE) — đây là câu khách Nhật rất hay hỏi khi review đề xuất.", "t": ""}, {"n": 443, "c": 5, "g": "5.5", "q": "Sales hoặc khách yêu cầu giảm estimate 30% để kịp chào giá. Bạn làm gì?", "a": "Em không cắt effort trên giấy mà đưa ra các phương án đổi lấy: ① giảm phạm vi (bỏ hoặc hoãn chức năng ưu tiên thấp), ② đổi điều kiện (khách tự làm 総合テスト, dùng template có sẵn, giảm số vòng review tài liệu), ③ đổi loại hợp đồng cho phần bất định sang 準委任, ④ giãn lịch để dùng team nhỏ hơn. Mỗi phương án có con số mới và rủi ro kèm theo. Nếu công ty vẫn quyết giảm giá vì chiến lược, em đề nghị ghi nhận đó là chiết khấu kinh doanh, không phải estimate sai.", "t": "Câu chốt: \"Giảm giá thì được, giảm effort thì phải giảm việc\" — và lưu lại bằng văn bản ai duyệt khoản giảm."}, {"n": 444, "c": 5, "g": "5.5", "q": "Cone of uncertainty là gì, bạn dùng nó để nói chuyện với khách thế nào?", "a": "Mô hình (Boehm, được McConnell phổ biến) cho thấy sai số estimate ở giai đoạn ý tưởng rất lớn — khoảng 0.25x–4x — và thu hẹp dần khi yêu cầu, thiết kế được chốt (khoảng 0.67x–1.5x khi yêu cầu hoàn tất, theo McConnell). Em dùng nó để giải thích vì sao 概算 phải là range và vì sao nên đi 多段階見積: muốn con số chắc thì phải đầu tư làm rõ yêu cầu trước. Lưu ý: cone chỉ thu hẹp khi dự án thật sự ra quyết định, không tự thu hẹp theo thời gian.", "t": ""}, {"n": 445, "c": 5, "g": "5.5", "q": "Dev estimate quá thấp (lạc quan) hoặc quá cao (độn) — làm sao phát hiện và xử lý?", "a": "Phát hiện bằng cách so với dữ liệu lịch sử cùng loại, so hai người estimate độc lập, và hỏi \"số này đã gồm review, unit test, sửa bug, tài liệu chưa?\" — estimate thấp thường thiếu đúng các việc này. Estimate cao thì hỏi rủi ro nào khiến cao, tách rủi ro đó ra xử lý riêng (spike, POC, giả định) thay vì giữ nguyên phần độn. Em không ép dev giảm số; em làm rõ phạm vi và giả định rồi để họ estimate lại.", "t": ""}, {"n": 446, "c": 5, "g": "5.5", "q": "Estimate, target và commitment khác nhau thế nào?", "a": "Theo cách phân biệt của McConnell: estimate là dự đoán dựa trên dữ liệu và có xác suất; target là mong muốn kinh doanh (khách muốn go-live tháng 4); commitment là lời hứa giao một phạm vi vào một ngày với chất lượng xác định. Lỗi phổ biến là coi target như estimate. Khi khách đưa deadline cứng, em estimate độc lập trước, rồi trình bày khoảng cách và cách đóng khoảng cách (phạm vi, nguồn lực, release theo đợt) để hai bên cùng chọn commitment.", "t": ""}, {"n": 447, "c": 5, "g": "5.5", "q": "Khách nói \"vendor khác báo thấp hơn bạn 25%\". Bạn phản hồi thế nào?", "a": "Em không vội giảm mà đề nghị so trên cùng phạm vi: vendor kia có cùng 対象外, cùng 前提条件, cùng công đoạn, cùng mức test và tài liệu không — chênh lệch thường nằm ở đây. Em chuẩn bị bảng \"chúng tôi đã bao gồm X, Y, Z\" và rủi ro nếu bỏ những mục đó. Nếu so xong vẫn chênh thật, em đề xuất phương án tối ưu (giảm phạm vi, đổi cơ cấu nhân sự) thay vì giảm đơn phương.", "t": "Khách Nhật tin vendor giải thích được 根拠 hơn vendor giảm giá ngay — giảm ngay khiến họ nghi estimate ban đầu bị độn."}, {"n": 448, "c": 5, "g": "5.5", "q": "Dùng dữ liệu lịch sử để bảo vệ estimate thế nào cho thuyết phục?", "a": "Em trình bày ngắn và so sánh được: \"dự án tương tự cho khách bảo hiểm B (35 màn hình, 12 batch) có actual 48人月; dự án này 40 màn hình và thêm 2 interface nên estimate 52–58人月\". Dữ liệu phải cùng định nghĩa đơn vị và nêu rõ các điểm khác biệt đã điều chỉnh. Nếu chưa có dữ liệu nội bộ, có thể dẫn số liệu thống kê ngành công khai (vd của IPA) làm đối chiếu, nhưng nói rõ chỉ là tham khảo.", "t": ""}, {"n": 449, "c": 5, "g": "5.5", "q": "Bị yêu cầu estimate gấp trong 1 ngày — làm sao vẫn an toàn?", "a": "Em trả lời bằng 概算 có range và ghi rõ độ chính xác, dùng analogous + parametric nhanh, kèm danh sách giả định và câu hỏi mở. Trong mail nộp em ghi \"estimate trong 1 ngày, độ tin cậy thấp, sẽ cập nhật sau khi có thông tin A, B, C vào ngày X\". Không đưa một con số tròn không kèm điều kiện, vì con số đầu tiên sẽ thành \"mỏ neo\" trong đầu khách suốt dự án.", "t": ""}, {"n": 450, "c": 5, "g": "5.5", "q": "Những bias nào hay làm estimate sai và bạn chống thế nào?", "a": "① Anchoring — bị neo bởi con số sales hoặc khách nói trước; chống bằng cách estimate trước khi nghe ngân sách. ② Planning fallacy — lạc quan, quên rủi ro; chống bằng 3-point và dữ liệu lịch sử. ③ Bias người có thâm niên — người nói to nhất quyết định; chống bằng Delphi ẩn danh. ④ Bỏ sót việc phụ (họp, review, môi trường); chống bằng checklist. Em biến các điểm này thành checklist estimate cố định cho cả team.", "t": ""}, {"n": 451, "c": 5, "g": "5.5", "q": "Estimate của bạn bị cấp trên sửa giảm trước khi gửi khách mà không hỏi bạn. Xử lý?", "a": "Em gặp riêng cấp trên, trình bày phần bị cắt tương ứng với việc gì và rủi ro cụ thể (vd thiếu effort 結合テスト → bug sau go-live). Đề xuất hai hướng: giữ giá đã giảm nhưng chỉnh phạm vi/前提条件 trong báo giá cho khớp, hoặc ghi nhận khoản giảm là chiết khấu và lập kế hoạch xử lý rủi ro. Quyết định cuối cùng được ghi lại bằng mail. Mục tiêu là cấp trên quyết định khi có đủ thông tin, không phải thắng tranh luận.", "t": ""}, {"n": 452, "c": 5, "g": "5.5", "q": "Khách Nhật yêu cầu giải thích căn cứ báo giá đến từng 人日. Bạn chuẩn bị gì?", "a": "Em chuẩn bị bảng `見積根拠` (mitsumori konkyo – căn cứ báo giá): danh sách chức năng với phân loại độ khó, effort chuẩn mỗi loại, phân bổ theo công đoạn, overhead theo vai trò, cùng 前提条件 và 対象外. Bảng viết bằng tiếng Nhật, thuật ngữ khớp tài liệu của khách. Mức chi tiết đủ để khách kiểm tra tính hợp lý nhưng không lộ cơ cấu lương nội bộ; câu nào chưa trả lời được thì ghi lại và hồi đáp bằng văn bản sau.", "t": "Khách hỏi chi tiết là tín hiệu tốt — họ đang cần tài liệu để thuyết phục nội bộ qua 稟議; hãy giúp họ, đừng phòng thủ."}, {"n": 453, "c": 5, "g": "5.6", "q": "Cấu trúc một 提案書 chuẩn cho khách Nhật gồm những phần nào?", "a": "`提案書` (teiansho – hồ sơ đề xuất) em dùng khung: `背景・課題` (haikei/kadai – bối cảnh, vấn đề) → `提案概要` (teian gaiyou – tóm tắt đề xuất) → `対応範囲` (taiou han'i – phạm vi) → `実現方式` (jitsugen houshiki – cách thực hiện, kiến trúc) → `体制図` (taisei-zu – sơ đồ tổ chức) → スケジュール → `品質管理` (hinshitsu kanri – quản lý chất lượng) → 見積 và 前提条件 → `実績` (jisseki – dự án đã làm). Thứ tự đi từ vấn đề của khách đến giải pháp, không mở đầu bằng phần giới thiệu công ty dài.", "t": "Mở bằng 背景・課題 viết đúng ngôn ngữ của khách chứng minh bạn đã hiểu họ — nhiều vendor mở bằng 10 slide giới thiệu công ty."}, {"n": 454, "c": 5, "g": "5.6", "q": "Viết phần 背景・課題 thế nào cho thuyết phục?", "a": "Em lấy nội dung từ RFP và buổi `ヒアリング` (hiaringu – buổi phỏng vấn lấy thông tin khách), diễn đạt lại theo 3 lớp: hiện trạng (hệ thống cũ, quy trình), vấn đề cụ thể có số nếu khách đã cung cấp (thời gian xử lý hồ sơ, chi phí vận hành), và mục tiêu khách muốn đạt. Dùng đúng thuật ngữ khách dùng, không suy diễn quá mức. Mỗi 課題 phải nối được tới một phần giải pháp phía sau — nếu không, hoặc 課題 đó thừa, hoặc đề xuất đang thiếu.", "t": ""}, {"n": 455, "c": 5, "g": "5.6", "q": "Nguyên tắc \"1 slide 1 message\" áp dụng thế nào trong 提案書 tiếng Nhật?", "a": "Mỗi slide có một câu thông điệp (メッセージライン – message line) ở đầu trang nói kết luận, phần thân là bằng chứng hoặc hình minh họa cho câu đó. Câu thông điệp ngắn 1–2 dòng, thống nhất văn phong, thường dùng `体言止め` (taigen-dome – kết câu bằng danh từ) cho gọn. Em kiểm tra bằng cách chỉ đọc liên tiếp các メッセージライン: nếu đọc xong đã hiểu toàn bộ đề xuất như một câu chuyện thì cấu trúc đạt.", "t": ""}, {"n": 456, "c": 5, "g": "5.6", "q": "Lỗi ngôn ngữ nào hay gặp khi team VN làm proposal tiếng Nhật?", "a": "① `表記ゆれ` (hyouki yure – cách viết không thống nhất) như サーバー/サーバ, ログイン/サインイン; ② dịch máy sai nghĩa thuật ngữ nghiệp vụ tài chính/bảo hiểm; ③ dùng font chữ Hán kiểu Trung Quốc thay vì font tiếng Nhật; ④ kính ngữ lẫn lộn, câu quá dài; ⑤ trộn thể です・ます và である trong cùng tài liệu. Em dùng `用語集` (yougoshuu – bảng thuật ngữ) chung, template font chuẩn, và bắt buộc người tiếng Nhật trình độ cao review trước khi gửi.", "t": "Font chữ Hán kiểu Trung Quốc là lỗi người Nhật nhận ra ngay và bị coi là \"thiếu chuyên nghiệp\" — kiểm tra font trước mọi lần gửi."}, {"n": 457, "c": 5, "g": "5.6", "q": "体制図 trong proposal cần thể hiện những gì?", "a": "Sơ đồ các bên (khách, onsite, offshore), vai trò, người chịu trách nhiệm từng phần, kênh liên lạc và mức phân bổ (vd PM 1.0, BrSE 1.0 onsite + 1.0 offshore). Khách Nhật cần thấy rõ `窓口` (madoguchi – đầu mối liên lạc), người có quyền quyết định phía vendor, đường escalation và người backup cho vị trí chủ chốt. Nếu khách yêu cầu, kèm tóm tắt kinh nghiệm của các vị trí chủ chốt (số năm, domain, trình độ tiếng Nhật).", "t": ""}, {"n": 458, "c": 5, "g": "5.6", "q": "Phần スケジュール trong proposal nên trình bày thế nào?", "a": "Em vẽ tổng quan theo 工程 và các mốc chính (マイルストーン – milestone): bắt đầu, chốt 基本設計, các đợt giao, 受入テスト, go-live, kèm các điểm khách phải tham gia như review, cung cấp dữ liệu, 検収. Mức chi tiết theo tuần hoặc tháng, không xuống task. Ghi rõ lịch nghỉ lễ đã tính và giả định lịch (ngày bắt đầu phụ thuộc ngày ký). Đánh dấu mốc phụ thuộc khách để sau này có căn cứ khi đầu vào bị trễ.", "t": ""}, {"n": 459, "c": 5, "g": "5.6", "q": "Phần 品質管理 trong proposal viết gì để khách Nhật tin?", "a": "Không viết chung chung \"chúng tôi coi trọng chất lượng\", mà nêu cách kiểm soát cụ thể: review cho từng loại deliverable, tiêu chí kết thúc mỗi công đoạn, chỉ số sẽ theo dõi và báo cáo định kỳ, chứng nhận liên quan nếu công ty có. Kèm mẫu báo cáo chất lượng hoặc mẫu evidence test để khách hình dung. Proposal chỉ cần cho thấy cơ chế kiểm soát; ngưỡng chi tiết sẽ nằm trong kế hoạch chất lượng sau khi ký hợp đồng.", "t": ""}, {"n": 460, "c": 5, "g": "5.6", "q": "Trình bày 実績 thế nào khi bị ràng buộc NDA?", "a": "Em ẩn danh khách theo dạng \"大手保険会社様\" (công ty bảo hiểm lớn) hoặc theo ngành và quy mô, chỉ nêu thông tin đã được phép: lĩnh vực, loại hệ thống, công nghệ, quy mô (人月, thời gian), vai trò của vendor, kết quả. Chọn 3–5 実績 gần nhất với bài toán của khách, không liệt kê tất cả. Nếu NDA cấm cả việc nêu ngành, em hỏi bộ phận pháp chế trước khi đưa vào.", "t": ""}, {"n": 461, "c": 5, "g": "5.6", "q": "見積書 tiếng Nhật có format thế nào?", "a": "`見積書` (mitsumorisho – bảng báo giá chính thức) thường gồm: tên khách kèm 御中 (onchuu – kính gửi tổ chức), tiêu đề, số báo giá, ngày phát hành, 有効期限, bảng hạng mục – số lượng – đơn vị (人月) – `単価` (tanka – đơn giá) – thành tiền, tổng phụ, thuế, tổng cộng, `納期` (nouki – hạn giao), `支払条件` (shiharai jouken – điều kiện thanh toán), `備考` (bikou – ghi chú, dẫn tới 前提条件). Cách tính thuế phụ thuộc pháp nhân ký hợp đồng — hỏi kế toán/pháp chế, không tự đặt.", "t": "Số tiền trên 見積書 và trong 提案書 phải khớp từng yên — lệch một dòng là mất uy tín ngay tại buổi review."}, {"n": 462, "c": 5, "g": "5.6", "q": "Nếu PM chưa giỏi tiếng Nhật thì tổ chức làm proposal tiếng Nhật thế nào?", "a": "Em viết khung và nội dung lõi (giải pháp, estimate, rủi ro) bằng tiếng Việt/Anh trên template slide tiếng Nhật đã chuẩn hóa, BrSE chuyển sang tiếng Nhật, sau đó người có tiếng Nhật tốt nhất (đồng nghiệp người Nhật hoặc onsite) review văn phong. Lịch làm proposal phải chừa 1–2 ngày cho vòng dịch và review. Em tự kiểm bản cuối về số liệu, tên chức năng và câu thông điệp — PM chịu trách nhiệm nội dung dù không tự dịch.", "t": ""}, {"n": 463, "c": 5, "g": "5.6", "q": "Proposal tốt khác proposal trung bình ở điểm nào?", "a": "Proposal trung bình nói \"chúng tôi làm được\"; proposal tốt chứng minh \"chúng tôi hiểu vấn đề của anh và đã nghĩ trước rủi ro\". Cụ thể: ① phản ánh đúng 課題 riêng của khách, ② có phương án lựa chọn (tối thiểu / khuyến nghị / mở rộng) để khách dễ quyết, ③ nêu rủi ro và cách xử lý thay vì giấu, ④ con số có căn cứ, ⑤ thân ngắn, chi tiết dồn sang phụ lục. Khách Nhật đánh giá sự cẩn thận và nhất quán cao hơn sự hào nhoáng.", "t": "Đưa 3 phương án kiểu `松竹梅` (shou-chiku-bai – 3 mức cao/vừa/thấp) giúp người phụ trách bên khách trình 稟議 dễ hơn và tránh bị so giá trần trụi."}, {"n": 464, "c": 5, "g": "5.7", "q": "RFI và RFP khác nhau thế nào, vendor nên phản hồi ra sao?", "a": "RFI (`情報提供依頼書` jouhou teikyou iraisho – yêu cầu cung cấp thông tin) khách dùng để tìm hiểu vendor, giải pháp và khoảng giá sơ bộ; RFP (`提案依頼書` teian iraisho – yêu cầu đề xuất) là yêu cầu chính thức có phạm vi, tiêu chí đánh giá, hạn nộp. Với RFI, em trả lời đủ để vào vòng sau, gợi ý cách tiếp cận (vd chia giai đoạn) và đưa giá dạng range. Với RFP, trả lời đúng từng mục, đúng format, đúng hạn — thiếu mục là bị trừ điểm hoặc loại.", "t": ""}, {"n": 465, "c": 5, "g": "5.7", "q": "Đọc RFP xong, bạn phân tích gì để quyết định Go/No-Go?", "a": "Em chấm nhanh 6 điểm: ① độ khớp năng lực (domain, công nghệ, ngôn ngữ), ② độ rõ yêu cầu so với loại hợp đồng (請負 mà spec mơ hồ là cờ đỏ), ③ ngân sách và lịch có khả thi, ④ khả năng thắng (quan hệ, số đối thủ, vendor đương nhiệm), ⑤ giá trị chiến lược (khách mới, ngành mới), ⑥ nguồn lực làm proposal. Kết quả trình sales/BOD bằng 1 trang có khuyến nghị. No-Go đúng lúc tiết kiệm hơn thắng một dự án lỗ.", "t": "Interviewer rất thích ứng viên dám nói \"có những RFP nên từ chối\" và nêu được tiêu chí cụ thể."}, {"n": 466, "c": 5, "g": "5.7", "q": "Giai đoạn Q&A trước khi nộp proposal nên tận dụng thế nào?", "a": "Đây là cơ hội chính để giảm bất định và cho khách thấy mình hiểu sâu. Em gom câu hỏi theo nhóm (phạm vi, phi chức năng, môi trường, hợp đồng, lịch), viết tiếng Nhật ngắn, mỗi câu kèm giả định đề xuất: \"〜と想定していますが、よろしいでしょうか\" (chúng tôi giả định là…, như vậy có được không). Câu nào khách chưa trả lời kịp thì đưa giả định đó vào 前提条件. Lưu ý trả lời Q&A thường được chia sẻ cho mọi vendor, nên không hỏi câu làm lộ chiến lược của mình.", "t": "Câu hỏi kèm giả định giúp khách trả lời nhanh \"はい\", và câu trả lời đó trở thành căn cứ hợp đồng."}, {"n": 467, "c": 5, "g": "5.7", "q": "Trong コンペ nhiều vendor, làm sao proposal nổi bật mà không phá giá?", "a": "`コンペ` (konpe – đấu thầu cạnh tranh) thường chấm nhiều tiêu chí, giá chỉ là một phần. Em tập trung ① hiểu 課題 sâu hơn đối thủ nhờ hearing, ② giảm rủi ro cho khách: POC, kế hoạch chuyển giao, backup nhân sự, ③ 実績 cùng ngành, ④ phương án giá linh hoạt (chia giai đoạn, nhiều mức). Nếu được, em hỏi trước `評価基準` (hyouka kijun – tiêu chí đánh giá) và phân bổ dung lượng proposal theo trọng số của từng tiêu chí.", "t": ""}, {"n": 468, "c": 5, "g": "5.7", "q": "Chuẩn bị buổi プレゼン proposal với khách Nhật thế nào?", "a": "`プレゼン` (purezen – buổi thuyết trình) em chuẩn bị: ① kịch bản theo đúng thời lượng khách cho, chừa ít nhất 1/3 cho Q&A; ② phân vai trước: người trình bày tiếng Nhật chính, PM trả lời phần kế hoạch và kỹ thuật; ③ tập dượt ít nhất 2 lần, có người đóng vai khách hỏi khó; ④ danh sách câu hỏi dự đoán kèm câu trả lời ngắn; ⑤ gửi tài liệu trước nếu khách yêu cầu. Đúng giờ và đúng thời lượng — vượt giờ là điểm trừ lớn.", "t": ""}, {"n": 469, "c": 5, "g": "5.7", "q": "Trong プレゼン, khách hỏi một câu bạn chưa thể trả lời chắc (vd \"giảm 20% được không?\"). Bạn phản hồi thế nào?", "a": "Em không cam kết tại chỗ. Em ghi nhận câu hỏi, nêu hướng sẽ xem xét và hẹn thời hạn: \"持ち帰って検討し、◯日までにご回答いたします\" (xin mang về xem xét và trả lời trước ngày ◯). Sau buổi, em cùng sales phân tích phương án (giảm phạm vi, đổi điều kiện) rồi trả lời bằng văn bản đúng hạn. Cam kết miệng trong プレゼン thường được khách ghi vào biên bản và trở thành điều kiện.", "t": "\"持ち帰って検討\" rất tự nhiên với người Nhật — nhưng trễ hạn trả lời đã hẹn còn mất điểm hơn cả việc từ chối."}, {"n": 470, "c": 5, "g": "5.7", "q": "Khi nào nên đề xuất POC trước khi báo giá phát triển, và POC nên miễn phí hay tính phí?", "a": "Đề xuất POC (`概念実証` gainen jisshou – kiểm chứng khái niệm) khi có rủi ro kỹ thuật lớn chưa kiểm chứng: công nghệ mới, AI/OCR trên dữ liệu thật của khách, hiệu năng với khối lượng lớn, tích hợp hệ thống cũ khó. POC phải có mục tiêu đo được, thời hạn ngắn, tiêu chí thành công/thất bại ghi trước. Chỉ miễn phí khi phạm vi rất nhỏ và là khoản đầu tư bán hàng đã duyệt; còn lại em đề xuất POC tính phí theo 準委任 — nghiêm túc hơn và tránh \"POC không hồi kết\".", "t": ""}, {"n": 471, "c": 5, "g": "5.7", "q": "Thua コンペ — bạn làm gì tiếp theo?", "a": "Em xin khách phản hồi `失注理由` (shicchuu riyuu – lý do không trúng thầu) một cách lịch sự: giá, giải pháp, 体制 hay 実績. Sau đó tổ chức review nội bộ ngắn: estimate có cao bất thường không, proposal thiếu gì, Q&A đã hỏi đủ chưa, rồi cập nhật template và dữ liệu estimate. Em vẫn giữ liên lạc với khách, vì dự án của vendor khác có thể gặp vấn đề và khách quay lại ở giai đoạn sau hoặc dự án khác.", "t": ""}, {"n": 472, "c": 5, "g": "5.8", "q": "請負契約 và 準委任契約 khác nhau thế nào?", "a": "請負 cam kết hoàn thành `成果物` (seikabutsu – sản phẩm bàn giao): vendor có nghĩa vụ hoàn thành theo spec, chi phí vượt do vendor gánh, thanh toán sau 検収. 準委任 cam kết thực hiện công việc với `善管注意義務` (zenkan chuui gimu – nghĩa vụ chú ý của người quản lý cẩn trọng), không bắt buộc hoàn thành kết quả, thanh toán theo công sức/thời gian. 請負 hợp với phạm vi đã rõ; 準委任 hợp với 要件定義, hỗ trợ test, bảo trì và việc bất định cao.", "t": "Trả lời bằng \"bên nào chịu rủi ro gì\" (rủi ro hoàn thành, rủi ro vượt chi phí) thay vì đọc định nghĩa."}, {"n": 473, "c": 5, "g": "5.8", "q": "準委任 có hai loại 履行割合型 và 成果完成型 — khác nhau thế nào?", "a": "Luật Dân sự Nhật sửa đổi (hiệu lực từ 1/4/2020) phân biệt rõ hai cách trả thù lao trong 準委任: `履行割合型` (rikou wariai-gata – trả theo phần công việc đã thực hiện) và `成果完成型` (seika kansei-gata – trả khi có kết quả). Ở loại thứ hai, tiền gắn với kết quả nhưng vendor vẫn không mang nghĩa vụ hoàn thành như 請負. Vì loại này dễ bị nhầm với 請負, em đọc kỹ điều khoản thanh toán và nghĩa vụ để biết chính xác mình đang gánh rủi ro nào.", "t": ""}, {"n": 474, "c": 5, "g": "5.8", "q": "派遣 là gì và vì sao phát triển offshore không phải là 派遣?", "a": "`派遣` (haken – phái cử lao động) là cho khách \"mượn\" người, khách trực tiếp `指揮命令` (shiki meirei – chỉ huy, ra lệnh) người lao động; ở Nhật, kinh doanh phái cử phải có giấy phép theo luật phái cử lao động. Offshore development ký 請負 hoặc 準委任: vendor tự phân công, chỉ đạo và quản lý nhân sự của mình tại VN, khách chỉ giao yêu cầu và nhận kết quả qua đầu mối (PM/BrSE). Vì vậy quyền chỉ huy phải luôn nằm ở vendor — trong vận hành thực tế, không chỉ trên giấy.", "t": ""}, {"n": 475, "c": 5, "g": "5.8", "q": "偽装請負 là gì? Dấu hiệu nguy cơ trong dự án offshore/onsite?", "a": "`偽装請負` (gisou ukeoi – hợp đồng ukeoi trá hình) là hợp đồng ghi 請負/準委任 nhưng thực tế khách chỉ huy trực tiếp từng nhân sự như 派遣 — vi phạm quy định lao động của Nhật. Dấu hiệu: khách giao task thẳng cho từng dev, quản lý giờ vào/ra, đánh giá cá nhân, chỉ định đổi người cụ thể, BrSE onsite làm theo lệnh trưởng nhóm của khách. Em phòng bằng cách: mọi yêu cầu đi qua 窓口 của vendor, vendor tự phân task và quản lý giờ, vai trò ghi rõ trong 体制図.", "t": "Nêu được \"quyền 指揮命令 phải nằm ở vendor\" là ghi điểm phần hiểu biết pháp lý — nhiều PM kỹ thuật bỏ qua điểm này."}, {"n": 476, "c": 5, "g": "5.8", "q": "ラボ型開発 là gì, phù hợp khi nào và có rủi ro gì?", "a": "`ラボ型開発` (rabo-gata kaihatsu – mô hình lab/ODC) là khách đặt một team cố định trong thời gian dài (thường ≥ 6 tháng, tham khảo), trả theo 人月, thường ký 準委任. Hợp khi khách có lượng việc liên tục, yêu cầu thay đổi thường xuyên và muốn giữ tri thức trong team. Rủi ro: thiếu việc gây lãng phí cho khách, khách chỉ đạo trực tiếp dễ thành 偽装請負, thành viên chán nếu việc lặp lại. PM cần backlog rõ, báo cáo output định kỳ và lộ trình phát triển cho từng thành viên.", "t": ""}, {"n": 477, "c": 5, "g": "5.8", "q": "SES là gì, khác ラボ型 thế nào?", "a": "SES (System Engineering Service) là dạng 準委任 phổ biến ở Nhật: cung cấp kỹ sư (thường làm tại site khách) theo đơn giá 人月 kèm `精算幅` (seisan haba – khoảng giờ quyết toán, vd 140–180h/tháng, tham khảo): làm dưới mức thì trừ tiền, vượt mức thì tính thêm. ラボ型 là một team offshore do vendor quản lý và chịu trách nhiệm tổ chức; SES thường là từng kỹ sư riêng lẻ. Cả hai đều phải tránh để khách chỉ huy trực tiếp.", "t": ""}, {"n": 478, "c": 5, "g": "5.8", "q": "検収 là gì? Bạn quản lý rủi ro 検収 thế nào?", "a": "検収 là bước khách kiểm tra deliverable và xác nhận chính thức bằng `検収書` (kenshuusho – biên bản nghiệm thu), thường là điều kiện xuất hóa đơn với 請負. Rủi ro: khách kéo dài, tiêu chí không rõ, đòi sửa ngoài spec rồi mới ký. Em ghi vào hợp đồng: tiêu chí 検収 cụ thể (kết quả 受入テスト theo test spec đã duyệt), thời hạn 検収 (vd 10–14 ngày làm việc, tham khảo), và điều khoản `みなし検収` (minashi kenshuu – nghiệm thu mặc nhiên) nếu khách không phản hồi trong hạn.", "t": "Bẫy: bắt đầu giai đoạn sau khi giai đoạn trước chưa 検収 — yêu cầu sửa của khách sẽ dồn sang và không ai trả tiền cho phần đó."}, {"n": 479, "c": 5, "g": "5.8", "q": "契約不適合責任 khác 瑕疵担保責任 trước đây thế nào?", "a": "Luật Dân sự Nhật sửa đổi (hiệu lực 1/4/2020) thay `瑕疵担保責任` (kashi tanpo sekinin – trách nhiệm bảo hành khuyết tật) bằng `契約不適合責任` (keiyaku futekigou sekinin – trách nhiệm khi không phù hợp hợp đồng). Bên đặt hàng có thể yêu cầu `追完` (tsuikan – sửa/bổ sung cho đúng), giảm giá, bồi thường, hủy hợp đồng. Với 請負, hạn thông báo 1 năm tính từ khi bên đặt hàng *biết* lỗi thay vì từ lúc giao, nên trách nhiệm có thể kéo dài — vendor cần thỏa thuận thời hạn cụ thể, vd 1 năm từ 検収.", "t": ""}, {"n": 480, "c": 5, "g": "5.8", "q": "Khi review điều khoản 契約不適合責任 trong hợp đồng 請負, PM cần chú ý gì?", "a": "① Thời hạn chịu trách nhiệm tính từ mốc nào (từ 検収 là rõ nhất) và kéo dài bao lâu; ② \"không phù hợp\" phải được đối chiếu với spec đã duyệt, không phải mong muốn mới của khách; ③ giới hạn mức bồi thường (thường đề xuất không vượt giá trị hợp đồng cá biệt, tham khảo) và loại trừ thiệt hại gián tiếp; ④ effort sửa lỗi trong thời gian bảo hành đã có trong estimate chưa. PM không thay pháp chế, nhưng phải đưa ra rủi ro vận hành để pháp chế đàm phán.", "t": ""}, {"n": 481, "c": 5, "g": "5.8", "q": "Mô hình 基本契約 + 個別契約 hoạt động thế nào?", "a": "`基本契約` (kihon keiyaku – hợp đồng khung) quy định điều khoản chung dài hạn: bảo mật, sở hữu trí tuệ, trách nhiệm, thanh toán, giải quyết tranh chấp. Mỗi dự án hoặc giai đoạn ký `個別契約` (kobetsu keiyaku – hợp đồng cá biệt) hoặc cặp `注文書・注文請書` (chuumonsho/chuumon ukesho – đơn đặt hàng và xác nhận nhận đặt hàng) ghi phạm vi, giá, thời hạn, loại hợp đồng. Lợi ích là không phải đàm phán lại từ đầu mỗi lần; PM cần nắm điều khoản nào của 個別契約 được ưu tiên hơn 基本契約.", "t": ""}, {"n": 482, "c": 5, "g": "5.8", "q": "Quyền sở hữu trí tuệ trong hợp đồng phát triển với khách Nhật — PM cần lưu ý gì?", "a": "Khách thường yêu cầu chuyển `著作権` (chosakuken – quyền tác giả) của deliverable khi 検収 hoặc thanh toán. Lưu ý: ① vendor nên giữ quyền với thư viện, framework, công cụ đã có từ trước (`汎用部分` han'you bubun – phần dùng chung) để tái sử dụng; ② kiểm license OSS và code do công cụ AI sinh ra, có danh sách OSS đính kèm; ③ điều khoản không thực thi quyền nhân thân tác giả thường có trong hợp đồng. PM đảm bảo team không mang code của khách này sang dự án khách khác.", "t": ""}, {"n": 483, "c": 5, "g": "5.8", "q": "NDA với khách Nhật ảnh hưởng tới cách vận hành team thế nào?", "a": "NDA (`秘密保持契約` himitsu hoji keiyaku – hợp đồng bảo mật) quy định thông tin mật, ai được tiếp cận, cách lưu giữ, hủy khi kết thúc và thời hạn bảo mật kéo dài sau hợp đồng. Khách tài chính/bảo hiểm có thể thêm: khu làm việc riêng, cấm thiết bị cá nhân, quy định xử lý dữ liệu cá nhân thật, hạn chế dùng dịch vụ dịch máy/AI công cộng với tài liệu khách. PM chuyển NDA thành quy định vận hành cụ thể, cho thành viên ký cam kết và kiểm tra định kỳ.", "t": "Hỏi rõ trước khi dùng dịch máy/AI cho tài liệu khách — dán spec vào dịch vụ công cộng có thể là vi phạm NDA."}, {"n": 484, "c": 5, "g": "5.8", "q": "Điều kiện thanh toán của 請負 và 準委任 khác nhau thế nào, PM cần quan tâm gì?", "a": "準委任 thường thanh toán hằng tháng theo 人月 hoặc giờ thực tế trong 精算幅, căn cứ `作業報告書` (sagyou houkokusho – báo cáo công việc). 請負 thanh toán sau 検収, có thể chia đợt theo milestone (`分割検収` bunkatsu kenshuu – nghiệm thu từng phần) hoặc có tạm ứng. Ở Nhật hay gặp điều kiện \"月末締め翌月末払い\" (chốt cuối tháng, trả cuối tháng sau). PM phải bảo đảm mốc giao/検収 khớp kế hoạch dòng tiền của công ty và báo sớm khi mốc có nguy cơ trễ.", "t": ""}, {"n": 485, "c": 5, "g": "5.9", "q": "Bạn xây đơn giá 人月 như thế nào (không cần số cụ thể)?", "a": "Đơn giá = chi phí thực của 1人月 chia cho tỷ lệ billable, cộng rủi ro và margin. Chi phí gồm lương, bảo hiểm, phúc lợi, thưởng; văn phòng, thiết bị, license; chi phí gián tiếp (HR, admin, sales); đào tạo (vd tiếng Nhật); và thời gian bench. Chia cho utilization dự kiến, cộng dự phòng tỷ giá và margin mục tiêu do công ty đặt. Đơn giá khác nhau theo vai trò và cấp bậc; BrSE, PM cao hơn dev.", "t": "Nhắc tới \"utilization\" và \"bench cost\" cho thấy bạn hiểu kinh tế của outsourcing, không chỉ quản lý task."}, {"n": 486, "c": 5, "g": "5.9", "q": "Khách đề nghị discount vì cam kết khối lượng lớn hoặc dài hạn. Bạn đánh giá thế nào?", "a": "Discount theo volume hợp lý khi nó thật sự giảm chi phí cho vendor: ít bench, nhân sự ổn định, giảm chi phí bán hàng. Em đề xuất discount theo bậc, gắn điều kiện cụ thể (vd ≥ X人月/tháng trong ≥ 12 tháng, tham khảo) và có điều khoản xem lại nếu khối lượng thực tế thấp hơn cam kết. Tránh discount vô điều kiện đổi lấy lời hứa miệng kiểu \"sau này sẽ có nhiều dự án\".", "t": ""}, {"n": 487, "c": 5, "g": "5.9", "q": "Khách ép giảm đơn giá vì đồng yên yếu. Bạn đàm phán thế nào?", "a": "Em thừa nhận áp lực của khách nhưng không chỉ có lựa chọn giảm giá: ① đổi cơ cấu nhân sự (tăng tỷ lệ offshore, giao việc đúng cấp độ), ② tăng năng suất bằng tự động hóa, tái sử dụng và chia sẻ lợi ích với khách, ③ cam kết dài hạn đổi lấy giá tốt hơn, ④ với hợp đồng dài, thêm điều khoản điều chỉnh giá theo tỷ giá trong biên độ thỏa thuận. Mọi phương án đều được tính lại margin trước khi đưa ra và không xuống dưới margin sàn của công ty.", "t": "Cho thấy bạn hiểu yên yếu là áp lực của cả hai bên (doanh thu quy đổi của vendor cũng giảm) — đề xuất chia sẻ rủi ro thay vì đối đầu."}, {"n": 488, "c": 5, "g": "5.9", "q": "仕様変更 phát sinh trong dự án 請負 — quy trình 追加見積 bạn làm thế nào?", "a": "① Xác nhận đây là `仕様変更` (shiyou henkou – thay đổi đặc tả) bằng cách so với baseline tài liệu đã chốt; ② phân tích ảnh hưởng: effort, lịch, chất lượng, chức năng liên quan; ③ gửi phân tích ảnh hưởng kèm 追加見積 bằng tiếng Nhật; ④ chỉ bắt tay làm khi khách đồng ý bằng văn bản hoặc biên bản họp có xác nhận. Thay đổi nhỏ có thể gom theo đợt hoặc trừ vào quỹ thay đổi thỏa thuận trước trong hợp đồng.", "t": ""}, {"n": 489, "c": 5, "g": "5.9", "q": "Khách nói \"đây là bug, không phải 仕様変更\". Làm sao phân định?", "a": "Căn cứ là tài liệu thiết kế đã duyệt và biên bản Q&A: hành vi lệch so với tài liệu là bug, vendor sửa miễn phí; hành vi đúng tài liệu nhưng khách muốn khác là 仕様変更. Vùng xám là chỗ tài liệu không nói rõ — em xem hợp đồng quy định bên nào chịu trách nhiệm làm rõ, rồi xử lý theo hướng chia sẻ: nếu nhỏ thì sửa trước để giữ quan hệ, nhưng ghi lại. Bài học là chốt phạm vi càng rõ ở thiết kế thì càng ít tranh cãi.", "t": "Đừng tranh cãi từng ticket nhỏ — ghi lại các phần đã làm thêm và dùng nó làm căn cứ khi đàm phán thay đổi lớn hơn."}, {"n": 490, "c": 5, "g": "5.9", "q": "Khách muốn chuyển sang 準委任 \"để rẻ hơn\" nhưng vẫn yêu cầu vendor cam kết deadline. Bạn trả lời thế nào?", "a": "Em nói rõ bản chất: 準委任 không có nghĩa vụ hoàn thành, nên không thể vừa trả theo công sức vừa để vendor gánh rủi ro hoàn thành như 請負. Em đề xuất: 準委任 với mục tiêu và kế hoạch rõ, báo cáo tiến độ minh bạch, cơ chế điều chỉnh phạm vi khi chậm; hoặc giữ 請負 cho phần đã rõ, 準委任 cho phần bất định. Nếu khách vẫn cần cam kết cứng, giá phải phản ánh rủi ro đó. Quan trọng nhất là văn bản hợp đồng khớp với cách vận hành thật.", "t": ""}, {"n": 491, "c": 5, "g": "5.9", "q": "Margin dự kiến và margin thực tế của dự án — PM kiểm soát thế nào?", "a": "Em theo dõi margin từ lúc báo giá đến khi chạy: mỗi tháng dự báo margin cuối dự án = doanh thu dự kiến − (chi phí đã phát sinh + chi phí còn lại). Đòn bẩy chính của PM: giữ đúng phạm vi (không làm miễn phí), cơ cấu nhân sự đúng cấp, giảm làm lại, đưa 追加見積 kịp thời. Khi dự báo margin xuống dưới ngưỡng cảnh báo công ty đặt, em báo cấp trên ngay kèm phương án, không đợi đến cuối dự án mới lộ.", "t": ""}, {"n": 492, "c": 5, "g": "5.9", "q": "Báo giá trọn gói và báo giá theo đơn giá × số lượng — khi nào dùng cách nào?", "a": "`一括請負` (ikkatsu ukeoi – trọn gói một giá) hợp khi phạm vi rõ và khách muốn chắc ngân sách; vendor có thể đạt margin tốt nếu làm hiệu quả nhưng gánh rủi ro vượt. Đơn giá × số lượng (theo 人月 hoặc theo màn hình/chức năng) hợp khi phạm vi còn thay đổi; khách dễ thêm bớt, vendor ít rủi ro hơn nhưng margin không vượt kỳ vọng. Mô hình lai hay dùng: trọn gói cho phần lõi + bảng đơn giá theo đơn vị cho phần phát sinh, ghi sẵn trong hợp đồng.", "t": ""}, {"n": 493, "c": 5, "g": "5.10", "q": "Estimate dự án migration hệ thống cũ (vd COBOL hoặc VB sang web) thế nào?", "a": "Bắt đầu bằng `棚卸し` (tanaoroshi – kiểm kê tài sản): số chương trình, LOC, màn hình, 帳票, batch, bảng/file dữ liệu, interface, và tỷ lệ tài liệu còn đúng thực tế. Chia theo cách xử lý: chuyển bằng tool, viết lại, loại bỏ. Test thường chiếm tỷ trọng lớn vì phải `現新比較` (genshin hikaku – so sánh kết quả hệ thống cũ và mới) trên dữ liệu thật. Em đề xuất giai đoạn đánh giá hiện trạng theo 準委任 trước, vì hệ thống cũ luôn có \"chức năng ẩn\" không ai còn nhớ.", "t": "Bẫy: báo giá migration chỉ theo LOC × tỷ lệ chuyển đổi — chi phí thật nằm ở test so sánh và dữ liệu."}, {"n": 494, "c": 5, "g": "5.10", "q": "Estimate dự án AI (vd OCR hồ sơ, chatbot cho khách bảo hiểm) khác dự án truyền thống ở đâu?", "a": "Kết quả phụ thuộc dữ liệu và độ chính xác không biết trước, nên không thể cam kết \"độ chính xác 95%\" như một chức năng 請負. Em chia: ① PoC đánh giá dữ liệu theo 準委任, có timebox; ② phần hệ thống bao quanh mô hình (màn hình, workflow, tích hợp) estimate như phần mềm thường; ③ cải thiện độ chính xác lặp lại theo 準委任. Chỉ số độ chính xác ghi là `努力目標` (doryoku mokuhyou – mục tiêu nỗ lực), không phải điều kiện 検収; estimate cả chi phí API/hạ tầng và đánh giá định kỳ.", "t": "Câu chốt: \"phần phần mềm có thể 請負, độ chính xác của mô hình thì không\"."}, {"n": 495, "c": 5, "g": "5.10", "q": "Khách muốn báo giá 請負 nhưng chưa có spec, chỉ có vài trang ý tưởng. Bạn xử lý thế nào?", "a": "Em không từ chối thẳng mà đưa hai lựa chọn: ① làm 要件定義 trước theo 準委任 (vài tuần, phí rõ), sau đó báo giá 請負 chính xác; ② nếu khách cần con số ngay, đưa 概算 range kèm 前提条件 rất chi tiết và danh sách chức năng do vendor định nghĩa làm baseline, ghi điều kiện \"báo giá lại sau 要件定義 nếu phạm vi thay đổi quá X%\". Tuyệt đối không ký 請負 trọn gói chỉ dựa trên ý tưởng khi danh sách chức năng chưa được khách xác nhận.", "t": ""}, {"n": 496, "c": 5, "g": "5.10", "q": "Dự án đang chạy 準委任 ổn, khách muốn chuyển giai đoạn tiếp sang 請負. Bạn đánh giá gì trước khi đồng ý?", "a": "Em kiểm tra: ① spec giai đoạn tới đã ổn định chưa (tỷ lệ thay đổi gần đây), ② đã có năng suất thực đo được trên chính hệ thống này chưa, ③ trách nhiệm phía khách (review, quyết định, môi trường) đã rõ chưa, ④ ranh giới bảo hành với phần code làm theo 準委任 trước đó. Đủ điều kiện thì estimate từ năng suất thực + contingency cho phần rủi ro chuyển sang vendor, đồng thời đổi cách vận hành: baseline phạm vi, change control chặt hơn.", "t": "Bẫy: đã ký 請負 mà vẫn làm việc \"kiểu 準委任\" (khách đổi gì làm nấy) — đó là con đường ngắn nhất tới dự án lỗ."}, {"n": 497, "c": 5, "g": "5.10", "q": "Dự án 請負 đang lỗ vì chính bạn estimate sai (không phải do khách thay đổi). Bạn xử lý thế nào?", "a": "① Xác nhận fact: lỗ bao nhiêu, sai ở hạng mục nào, dự báo chi phí đến hết; ② báo cấp trên ngay theo `報連相` (hou-ren-sou – báo cáo, liên lạc, bàn bạc), không giấu; ③ khoanh vùng: tối ưu nguồn lực, ưu tiên mốc quan trọng, rà lại phần nào thật ra là 仕様変更 chưa được 追加見積; ④ không giảm chất lượng cam kết với khách vì lỗi estimate thuộc về vendor; sau dự án làm `再発防止` (saihatsu boushi – phòng ngừa tái diễn) cho quy trình estimate và `横展開` (yokotenkai – nhân rộng bài học) sang team khác.", "t": "Interviewer muốn nghe: bạn nhận trách nhiệm, không đổ cho khách, và sửa quy trình estimate chứ không chỉ \"tăng ca bù\"."}, {"n": 498, "c": 5, "g": "5.10", "q": "Sales đã báo giá cho khách trước khi PM estimate, con số thấp hơn nhiều so với effort thật. Bạn làm gì?", "a": "Em estimate độc lập, trình bày khoảng chênh cho sales và cấp trên kèm rủi ro cụ thể, rồi cùng tìm cách chỉnh trước khi ký: thu hẹp phạm vi trong báo giá cho khớp số, bổ sung 前提条件 và 対象外, đề xuất chia giai đoạn. Nếu hợp đồng đã ký, tập trung kiểm soát phạm vi thật chặt và chuẩn bị 追加見積 cho mọi thay đổi. Sau đó em đề xuất quy tắc: không phát hành báo giá chính thức khi chưa có PM hoặc tech lead review estimate.", "t": ""}, {"n": 499, "c": 5, "g": "5.10", "q": "Chi nhánh/team mới ở Đà Nẵng nhận dự án đầu tiên — estimate có rủi ro gì và bạn làm thế nào?", "a": "Rủi ro: chưa có dữ liệu năng suất của chính team, thiếu người nắm domain và tiếng Nhật, quy trình chưa ổn định. Em ① dùng dữ liệu của team đã chín ở nơi khác nhưng áp hệ số ramp-up, ② đặt senior/BrSE có kinh nghiệm làm nòng cốt giai đoạn đầu, ③ ưu tiên dự án đầu có phạm vi vừa phải, ký 準委任 hoặc chạy pilot, ④ đo năng suất thực sau 1–2 tháng để hiệu chỉnh các estimate sau. Chi phí ramp-up ghi rõ là đầu tư nội bộ hay tính vào giá.", "t": "Với vị trí có lợi thế \"build-up chi nhánh Đà Nẵng\", nêu được cách biến dự án đầu thành nguồn dữ liệu estimate cho cả chi nhánh sẽ rất ghi điểm."}, {"n": 500, "c": 5, "g": "5.10", "q": "Nếu chỉ chọn một nguyên tắc quan trọng nhất về estimate và hợp đồng với khách Nhật, bạn chọn gì?", "a": "Em chọn: \"mọi con số phải đi kèm căn cứ và điều kiện\". Estimate không có 前提条件 thì rủi ro mặc định về vendor; hợp đồng không khớp vận hành thực tế (請負 mà làm như 準委任, 準委任 mà khách chỉ huy như 派遣) thì sớm muộn thành tranh chấp. Với khách Nhật, căn cứ minh bạch còn giúp họ duyệt nội bộ nhanh hơn — nên đây vừa là cách vendor tự bảo vệ, vừa là cách phục vụ khách.", "t": "Câu tổng kết nên nối được ba mảng: estimate có căn cứ – proposal rõ ràng – hợp đồng khớp cách vận hành."}, {"n": 501, "c": 6, "g": "6.1", "q": "Với khách Nhật, 品質 (hinshitsu – chất lượng) có nghĩa gì rộng hơn \"phần mềm ít bug\"?", "a": "Với khách Nhật, chất lượng gắn với **niềm tin (信頼 – shinrai)**: sản phẩm chạy đúng, tài liệu khớp code, mọi thay đổi có lý do, và khi có lỗi thì giải thích được vì sao xảy ra, đã chặn tái phát thế nào. Một bug nhỏ kèm báo cáo rõ ràng vẫn giữ được niềm tin; một bug nhỏ bị giấu hoặc giải thích mơ hồ có thể làm mất hợp đồng tiếp theo. Vì vậy PM quản lý đồng thời **chất lượng sản phẩm**, **chất lượng quy trình** và **chất lượng giải trình**.", "t": "Trả lời bằng ba lớp \"sản phẩm – quy trình – giải trình\" cho interviewer thấy bạn hiểu khách Nhật chứ không chỉ thuộc định nghĩa."}, {"n": 502, "c": 6, "g": "6.1", "q": "Vì sao khách Nhật kỳ vọng gần \"zero defect\", và PM nên hiểu kỳ vọng đó thế nào cho thực tế?", "a": "\"Zero defect\" thực chất là **không để lỗi lọt sang phía khách** (流出 – ryuushutsu – lỗi lọt ra ngoài), không phải dự án không có bug. Bug tìm và sửa trong nội bộ là bằng chứng quy trình hoạt động; bug khách tìm thấy ở 受入テスト (ukeire tesuto – kiểm thử nghiệm thu) hay production mới bị coi là thất bại. PM cần thỏa thuận từ đầu mục tiêu bug lọt theo mức độ, ví dụ 0 lỗi nghiêm trọng, lỗi nhẹ dưới ngưỡng đã thống nhất (tham khảo), và cách đo.", "t": "Đừng hứa \"zero bug\" tuyệt đối; nói \"zero bug nghiêm trọng lọt ra\" kèm cơ chế đo vừa đúng tinh thần vừa khả thi."}, {"n": 503, "c": 6, "g": "6.1", "q": "品質計画書 (hinshitsu keikakusho – kế hoạch chất lượng) của một dự án offshore gồm những nội dung chính nào?", "a": "Gồm: ① mục tiêu chất lượng định lượng (mật độ review, mật độ test, mật độ bug, số bug lọt ra khách); ② quality gate cho từng 工程 (koutei – công đoạn) với tiêu chí vào/ra; ③ loại review và người review cho từng 成果物 (seikabutsu – sản phẩm bàn giao); ④ chiến lược test và mức evidence; ⑤ quy trình quản lý bug, thay đổi, cấu hình; ⑥ báo cáo chất lượng gửi khách và tần suất. Kế hoạch được khách duyệt trước khi vào thiết kế, làm \"luật chơi\" chung cho hai bên.", "t": ""}, {"n": 504, "c": 6, "g": "6.1", "q": "Quality gate theo 工程 vận hành thế nào trong một dự án waterfall cho khách Nhật?", "a": "Cuối mỗi công đoạn (yêu cầu, thiết kế, lập trình, từng mức test) có một buổi 工程完了判定 (koutei kanryou hantei – đánh giá hoàn thành công đoạn): deliverable đủ, review xong, chỉ số trong ngưỡng, các 指摘 (shiteki – điểm bị chỉ ra) đã đóng. Không đạt thì không sang công đoạn sau, hoặc sang có điều kiện kèm danh sách tồn đọng và hạn đóng. PM chủ trì, có người QA độc lập tham gia, biên bản gửi khách khi hợp đồng yêu cầu.", "t": ""}, {"n": 505, "c": 6, "g": "6.1", "q": "手戻り (temodori – làm lại) được đo thế nào để trở thành một chỉ số chất lượng nội bộ?", "a": "Em đo **tỉ lệ effort 手戻り** = giờ công sửa lại sản phẩm của công đoạn trước / tổng giờ công, ghi bằng mã task riêng trong timesheet hoặc ticket. Tách theo công đoạn gây ra và nguyên nhân (hiểu sai spec, lỗi thiết kế, khách đổi yêu cầu) để biết chi phí đang \"rò\" ở đâu. Tỉ lệ này tăng ở một module là cảnh báo sớm hơn cả mật độ bug, và cũng là dữ liệu khi đàm phán phần 手戻り do khách đổi yêu cầu.", "t": "Tách được \"手戻り do mình\" và \"手戻り do khách đổi yêu cầu\" cho thấy bạn vừa quản chất lượng vừa giữ được chi phí."}, {"n": 506, "c": 6, "g": "6.1", "q": "Câu \"品質は工程で作り込む\" (hinshitsu wa koutei de tsukurikomu – chất lượng được tạo ra trong từng công đoạn) áp dụng vào phần mềm thế nào?", "a": "Nghĩa là chất lượng không đến từ việc test thật nhiều ở cuối, mà được \"xây\" ở từng bước: yêu cầu rõ, thiết kế được review, code theo chuẩn có self-check, unit test đủ quan điểm. Cụ thể em gắn mỗi công đoạn với checklist, review bắt buộc và tiêu chí ra; test cuối để xác nhận chứ không phải để \"vớt\" lỗi. Khi test hệ thống phát hiện nhiều lỗi thiết kế, đó là tín hiệu quy trình thượng nguồn hỏng, phải sửa quy trình chứ không chỉ sửa bug.", "t": ""}, {"n": 507, "c": 6, "g": "6.1", "q": "Khách Nhật khác khách Âu/Mỹ thế nào trong cách nhìn chất lượng, và PM điều chỉnh ra sao?", "a": "Khái quát (không phải khách nào cũng vậy): khách Nhật thường coi trọng **hoàn chỉnh trước khi giao**, tài liệu chi tiết, quy trình giải trình được; khách Âu/Mỹ thường chấp nhận giao sớm rồi sửa nhanh qua nhiều vòng, ưu tiên tốc độ và giá trị kinh doanh. Với khách Nhật, em tăng review nội bộ, evidence và báo cáo định kỳ; với khách Âu/Mỹ, em tập trung demo, test tự động và thời gian phản hồi lỗi. Quan trọng nhất là hỏi rõ tiêu chí nghiệm thu của từng khách thay vì áp khuôn.", "t": "Luôn thêm ý \"tùy từng khách\" để không bị đánh giá là định kiến văn hóa."}, {"n": 508, "c": 6, "g": "6.1", "q": "安心感 (anshinkan – cảm giác an tâm) của khách liên quan gì đến quản lý chất lượng?", "a": "Khách Nhật đánh giá vendor không chỉ qua sản phẩm mà qua việc họ có **an tâm** khi giao việc không: biết trước rủi ro, nhận báo cáo đúng hạn, không bị bất ngờ. PM tạo an tâm bằng chỉ số chất lượng minh bạch hằng tuần, báo tin xấu sớm (ví dụ mật độ bug vượt ngưỡng là báo ngay kèm phân tích), và giữ đúng cả những lời hứa nhỏ. Vendor ít lỗi nhưng hay im lặng thường bị đánh giá thấp hơn vendor có lỗi nhưng chủ động minh bạch.", "t": ""}, {"n": 509, "c": 6, "g": "6.1", "q": "QCD (Quality – Cost – Delivery) là gì và chữ Q thường đứng ở đâu trong ưu tiên của khách Nhật?", "a": "QCD là ba trục khách Nhật dùng để đánh giá vendor. Ở nhiều dự án tài chính, bảo hiểm, Q thường được đặt ngang hoặc trên D: trễ vài ngày còn đàm phán được, nhưng lỗi lọt ra production làm khách mất uy tín với khách hàng cuối thì rất khó cứu. Tuy vậy PM không mặc định \"Q luôn thắng\"; em hỏi khách thứ tự ưu tiên cho từng giai đoạn, ghi vào kế hoạch, và khi phải đánh đổi thì trình phương án có số liệu để khách quyết.", "t": ""}, {"n": 510, "c": 6, "g": "6.1", "q": "Khi mới nhận một dự án đang chạy, làm sao đánh giá nhanh \"sức khỏe chất lượng\" trong một tuần?", "a": "Em xem năm thứ: ① 品質計画書 có tồn tại và còn được theo dõi không; ② xu hướng 指摘 review và bug theo tuần so với mục tiêu; ③ số bug mở, tuổi bug, tỉ lệ reopen; ④ các bug khách phát hiện gần đây và báo cáo nguyên nhân; ⑤ trao đổi ngắn với BrSE (Bridge SE – kỹ sư cầu nối), tester, onsite về điều khách phàn nàn. Kết quả gom thành một trang đỏ–vàng–xanh kèm 3 hành động ưu tiên để báo cấp trên và onsite.", "t": "Luôn hỏi \"khách đã phàn nàn gì trong 3 tháng qua\" — đó là chỉ số chất lượng thật nhất và không nằm trong dashboard."}, {"n": 511, "c": 6, "g": "6.2", "q": "Liệt kê các 成果物 chính theo công đoạn V-model và ai thường tạo, ai duyệt trong mô hình offshore.", "a": "Yêu cầu: 要件定義書 (youken teigisho – tài liệu định nghĩa yêu cầu), khách hoặc onsite tạo. Thiết kế: 基本設計書 (kihon sekkeisho – thiết kế cơ bản) thường onsite/BrSE tạo, khách duyệt; 詳細設計書 (shousai sekkeisho – thiết kế chi tiết) team offshore tạo, leader/BrSE duyệt. Lập trình: ソースコード kèm kết quả review code. Mỗi mức test: テスト仕様書 (tesuto shiyousho – test spec) và テスト結果報告書 (tesuto kekka houkokusho – báo cáo kết quả test) kèm evidence. Bàn giao: 運用手順書 (unyou tejunsho – hướng dẫn vận hành), release note. Phân vai cụ thể ghi trong 品質計画書.", "t": ""}, {"n": 512, "c": 6, "g": "6.2", "q": "基本設計書 và 詳細設計書 khác nhau thế nào về người đọc và mức chi tiết?", "a": "基本設計書 (còn gọi 外部設計 – gaibu sekkei – thiết kế ngoài) mô tả hệ thống nhìn từ phía người dùng: màn hình, item, chức năng, báo cáo, interface ngoài, data model logic; khách đọc và duyệt. 詳細設計書 (内部設計 – naibu sekkei – thiết kế trong) mô tả bên trong: module, class, xử lý từng bước, SQL, xử lý lỗi; chủ yếu cho dev, đủ chi tiết để người khác code ra cùng kết quả. Ở offshore, phần chi tiết thường do team Việt Nam viết và được review chéo trước khi code.", "t": ""}, {"n": 513, "c": 6, "g": "6.2", "q": "Khách Nhật mong đợi tài liệu chi tiết đến mức nào, và làm sao biết đã \"đủ\"?", "a": "Thường rất cao: 詳細設計書 có thể mô tả đến từng item màn hình, điều kiện validate, message ID, nhánh xử lý. Cách biết \"đủ\": ① lấy tài liệu khách đã chấp nhận ở dự án trước làm chuẩn; ② làm mẫu cho 1 chức năng đầu, gửi khách review sớm để chốt mức chi tiết; ③ dùng tiêu chí \"người khác đọc có code và test được mà không phải hỏi\". Sau khi chốt, đưa mẫu vào template và checklist cho cả team.", "t": "\"Làm mẫu 1 chức năng cho khách duyệt trước khi nhân rộng\" là điểm cộng lớn vì nó chặn 手戻り hàng loạt."}, {"n": 514, "c": 6, "g": "6.2", "q": "テスト仕様書 chuẩn kiểu Nhật cần có những cột thông tin nào?", "a": "Thường gồm: ID case, chức năng/màn hình, テスト観点 (tesuto kanten – quan điểm test), điều kiện tiền đề, dữ liệu test, thao tác, kết quả mong đợi, kết quả thực tế, ngày test, người test, người xác nhận, link evidence, ID bug nếu fail. Phần đầu file có phạm vi, môi trường, danh sách quan điểm và thống kê số case. Kết quả mong đợi phải cụ thể đến giá trị hoặc message, không viết chung chung.", "t": "Kết quả mong đợi kiểu \"正常に表示される\" (seijou ni hyouji sareru – hiển thị bình thường) là lỗi bị khách Nhật chỉ ra nhiều nhất."}, {"n": 515, "c": 6, "g": "6.2", "q": "テスト仕様書 và テスト結果報告書 khác nhau ở điểm nào?", "a": "テスト仕様書 trả lời \"sẽ test gì, thế nào, kỳ vọng gì\" và được review **trước** khi test. テスト結果報告書 trả lời \"đã test được gì, kết quả ra sao, đủ để sang bước sau chưa\" và được viết **sau** mỗi mức test: số case đạt/không đạt, bug phát hiện, phần chưa test được và lý do, kèm kết luận của người phụ trách test. Báo cáo kết quả là đầu vào cho quyết định chuyển công đoạn và cho báo cáo chất lượng gửi khách.", "t": ""}, {"n": 516, "c": 6, "g": "6.2", "q": "運用手順書 cần được chuẩn bị và kiểm tra thế nào trước bàn giao?", "a": "運用手順書 mô tả cách khởi động/dừng hệ thống, chạy batch, backup/restore, xử lý khi lỗi, đầu mối liên hệ khi sự cố, kèm lệnh và màn hình cụ thể. Em yêu cầu viết sớm, song song với test hệ thống, và **chạy thử đúng theo tài liệu** bởi người không viết ra nó, có evidence từng bước. Lỗi tài liệu vận hành thường chỉ lộ ra khi đã đi vào vận hành, nên đây là deliverable hay bị xem nhẹ nhưng rủi ro cao.", "t": ""}, {"n": 517, "c": 6, "g": "6.2", "q": "Quản lý version tài liệu cho khách Nhật thế nào cho đúng chuẩn?", "a": "Mỗi tài liệu có bìa ghi số phiên bản, ngày, người tạo, người duyệt và bảng 改訂履歴 (kaitei rireki – lịch sử sửa đổi) gồm version, ngày, nội dung sửa, vị trí sửa, người sửa. Phần thay đổi được đánh dấu (chữ đỏ hoặc gạch chân) để người review chỉ cần xem phần khác biệt. File lưu trên repo hoặc kho tài liệu chung với quy tắc đặt tên thống nhất, chỉ một bản chính thức, bản cũ được lưu trữ chứ không ghi đè.", "t": "Khách để ý 改訂履歴 trống hoặc chỉ ghi \"修正\" (shuusei – sửa); ghi rõ \"sửa mục 3.2 theo Q&A số 15\" tạo ấn tượng chuyên nghiệp."}, {"n": 518, "c": 6, "g": "6.2", "q": "Tài liệu thiết kế dạng Excel 方眼紙 (hougan-shi – Excel kẻ ô vuông) có ưu nhược điểm gì và PM xử lý ra sao?", "a": "Ưu: khách Nhật quen dùng, dễ trình bày layout màn hình, dễ in và đóng dấu. Nhược: khó so sánh phiên bản, khó merge khi nhiều người sửa, khó tìm kiếm, dễ lệch giữa các sheet. Em xử lý bằng cách phân owner theo file, khóa sheet template, dùng công cụ so sánh Excel trước mỗi lần gửi và ghi đủ 改訂履歴. Nếu khách cởi mở, có thể dùng wiki/Markdown cho tài liệu nội bộ, còn deliverable chính thức vẫn giữ đúng định dạng khách yêu cầu.", "t": ""}, {"n": 519, "c": 6, "g": "6.2", "q": "Làm sao giữ tài liệu và code luôn nhất quán, nhất là khi có thay đổi giữa chừng?", "a": "Em áp quy tắc **\"tài liệu trước, code sau\"**: mọi thay đổi phải cập nhật thiết kế và 改訂履歴 rồi mới sửa code, trong cùng một ticket. Có ma trận truy vết yêu cầu ↔ thiết kế ↔ code ↔ test case, checklist review code có mục \"đã khớp thiết kế chưa\", và trước mỗi lần bàn giao lấy mẫu đối chiếu tài liệu với code. Lệch tài liệu–code được ghi nhận như một bug, có phân loại, để team không coi nhẹ.", "t": ""}, {"n": 520, "c": 6, "g": "6.2", "q": "Luồng 作成 → 確認 → 承認 (sakusei – kakunin – shounin: tạo, kiểm tra, phê duyệt) trên tài liệu có ý nghĩa gì với PM?", "a": "Đó là chuỗi trách nhiệm: người tạo chịu trách nhiệm nội dung, người kiểm tra (thường leader/BrSE) xác nhận đã review theo checklist, người phê duyệt (PM hoặc khách) chịu trách nhiệm cho phép phát hành. Ô ký duyệt không phải hình thức: khi có lỗi, khách sẽ hỏi \"ai đã 確認, theo tiêu chí nào\". Vì vậy PM chỉ 承認 khi có レビュー記録票 (rebyuu kirokuhyou – biên bản review) đi kèm.", "t": "Không bao giờ ký duyệt \"cho kịp\" khi chưa có biên bản review — đó là bẫy trách nhiệm kinh điển."}, {"n": 521, "c": 6, "g": "6.3", "q": "Các loại review thường gặp trong dự án cho khách Nhật là gì, mỗi loại dùng khi nào?", "a": "① セルフレビュー (self review) theo checklist trước khi giao; ② ピアレビュー (peer review) giữa đồng nghiệp cùng cấp, bắt lỗi logic và vi phạm chuẩn; ③ review của 有識者 (yuushikisha – người có chuyên môn) cho phần khó hoặc rủi ro cao; ④ 顧客レビュー (kokyaku rebyuu – review của khách) cho deliverable chính thức. Về hình thức có ウォークスルー (walkthrough – tác giả dẫn dắt giải thích) và インスペクション (inspection – review chính thức có vai trò, checklist, số đo). Nguyên tắc: lỗi phải bị bắt ở tầng thấp nhất trước khi đến tay khách.", "t": ""}, {"n": 522, "c": 6, "g": "6.3", "q": "設計レビュー (sekkei rebyuu – review thiết kế) nên tập trung vào những điểm nào?", "a": "Tập trung vào: ① đúng và đủ so với yêu cầu, truy vết được; ② nhất quán giữa các màn hình/module, với data model và interface; ③ xử lý ngoại lệ, lỗi, giá trị biên; ④ yêu cầu phi chức năng như hiệu năng, bảo mật, log; ⑤ khả năng test được. Lỗi chính tả, format là phụ, nên để self-check xử lý trước. Mỗi buổi review giới hạn phạm vi (ví dụ khoảng 30–40 trang – tham khảo) để giữ độ sâu.", "t": ""}, {"n": 523, "c": 6, "g": "6.3", "q": "コードレビュー (koodo rebyuu – review code) trong dự án offshore cho khách Nhật nên tổ chức thế nào?", "a": "Ba tầng: công cụ tự động (lint, static analysis, coding convention) chặn lỗi hình thức trước; peer review qua pull request theo checklist (logic, xử lý lỗi, bảo mật, hiệu năng, khớp thiết kế); leader review phần rủi ro cao. Mỗi 指摘 được ghi lại có phân loại chứ không chỉ comment rồi quên, để cuối giai đoạn tính được mật độ và xu hướng. Pull request quá lớn (ví dụ trên 400 dòng – tham khảo) bị yêu cầu tách để review có chất lượng.", "t": ""}, {"n": 524, "c": 6, "g": "6.3", "q": "レビュー記録票 cần ghi những gì?", "a": "Gồm: tên tài liệu/module và version, ngày, thời lượng review, người tham gia, phạm vi (số trang hoặc LOC), danh sách 指摘 (vị trí, nội dung, phân loại, mức độ, người sửa, ngày sửa, người xác nhận đã sửa) và kết luận (đạt hoặc review lại). Từ đó tính được 指摘密度 (shiteki mitsudo – mật độ chỉ ra) và レビュー工数密度 (rebyuu kousuu mitsudo – giờ review trên quy mô). Biên bản này là evidence chất lượng thượng nguồn khi khách audit hoặc khi phân tích lỗi về sau.", "t": ""}, {"n": 525, "c": 6, "g": "6.3", "q": "指摘 thường được phân loại thế nào và vì sao phải phân loại?", "a": "Theo nội dung: 誤り (ayamari – sai), 漏れ (more – thiếu), 曖昧 (aimai – mơ hồ), 不整合 (fuseigou – không nhất quán), 表記 (hyouki – cách viết, chính tả), 改善提案 (kaizen teian – đề xuất cải tiến); theo mức độ: lớn, vừa, nhỏ. Phân loại để biết **lỗi bản chất nằm ở đâu**: nhiều 漏れ → hiểu yêu cầu chưa đủ; nhiều 不整合 → thiếu thiết kế chung; toàn 表記 → review chưa đủ sâu. Không phân loại thì chỉ có con số đếm, không rút ra hành động.", "t": "Khi kể \"review ra 200 指摘\", hãy nói ngay tỉ lệ 指摘 bản chất (logic, thiếu sót) — interviewer đánh giá cao tư duy phân tích đó."}, {"n": 526, "c": 6, "g": "6.3", "q": "指摘密度 được tính thế nào và dùng để làm gì?", "a": "指摘密度 = số 指摘 / quy mô được review, ví dụ 指摘 trên mỗi trang thiết kế hoặc trên mỗi KLOC code. Khi so với baseline của tổ chức hoặc dự án tương tự, nó cho biết review đã \"đào\" đủ sâu chưa và tài liệu có ổn không. Phải đọc kèm レビュー工数密度: mật độ chỉ ra thấp và giờ review cũng thấp thì nghi review hời hợt; giờ review đủ mà mật độ thấp thì nhiều khả năng tài liệu tốt.", "t": ""}, {"n": 527, "c": 6, "g": "6.3", "q": "Ngưỡng tham khảo cho 指摘密度 lấy từ đâu, và xử lý thế nào khi lệch trên hoặc dưới?", "a": "Ngưỡng nên lấy từ **baseline nội bộ** của công ty hoặc dự án tương tự; nếu chưa có, em đặt tạm một khoảng (ví dụ thiết kế khoảng 0,5–1,5 指摘/trang – tham khảo) rồi hiệu chỉnh sau 1–2 module. Lệch trên: tài liệu còn non, có thể 差し戻し (sashimodoshi – trả lại) cho tác giả làm lại trước khi review tiếp. Lệch dưới: kiểm tra giờ review, năng lực người review, cân nhắc cho người khác review bổ sung. Điều quan trọng là **giải thích** được mọi điểm lệch.", "t": "Đừng đọc một con số \"chuẩn ngành\"; nói rõ là baseline nội bộ và cách hiệu chỉnh sẽ an toàn và thuyết phục hơn."}, {"n": 528, "c": 6, "g": "6.3", "q": "Một buổi review kết thúc với 0 指摘. PM nên vui hay lo?", "a": "Nên nghi ngờ trước. 0 指摘 có thể vì tài liệu thật sự tốt, nhưng thường gặp hơn là review hời hợt, người review thiếu kiến thức nghiệp vụ, thời gian quá ngắn hoặc ngại \"chê\" đồng nghiệp. Em kiểm tra giờ review và checklist đã dùng, rồi cho một người khác review lấy mẫu một phần; nếu mẫu đó tìm ra lỗi bản chất thì cả buổi review phải làm lại. Với khách Nhật, báo cáo \"0 指摘\" không kèm giải thích thường bị hỏi ngược.", "t": ""}, {"n": 529, "c": 6, "g": "6.3", "q": "Làm sao để review không thành buổi \"bắt lỗi người\" khiến dev ngại đưa tài liệu ra review?", "a": "Nguyên tắc: **review sản phẩm, không review người**. 指摘 viết theo sự kiện (\"mục 3.2 thiếu xử lý khi số tiền âm\"), không viết nhận xét (\"viết ẩu\"); số 指摘 không dùng trực tiếp để chấm điểm cá nhân. Em khuyến khích review sớm từng phần nhỏ thay vì một lần cuối, ghi nhận người tìm ra lỗi quan trọng, và leader, PM cũng đưa tài liệu của chính mình ra review. Khi mật độ 指摘 của ai đó cao, ta bàn cách hỗ trợ chứ không phạt.", "t": ""}, {"n": 530, "c": 6, "g": "6.3", "q": "Khách trả về tài liệu với rất nhiều 指摘 từ 顧客レビュー. PM xử lý thế nào?", "a": "① Xác nhận fact: tổng số, phân loại, bao nhiêu lỗi bản chất, bao nhiêu do yêu cầu đổi. ② Lập kế hoạch sửa có ngày và báo khách theo 報連相 (hou-ren-sou – báo cáo, liên lạc, bàn bạc). ③ Tìm vì sao review nội bộ để lọt: so 指摘 của khách với biên bản review nội bộ, xác định quan điểm còn thiếu. ④ Bổ sung quan điểm đó vào checklist, 横展開 (yokotenkai – nhân rộng kiểm tra) sang tài liệu chưa gửi, và gửi khách phân tích cùng bản sửa.", "t": "Khách đánh giá cao việc bạn tự phân tích \"vì sao nội bộ để lọt\" hơn là chỉ sửa đúng những điểm khách chỉ ra."}, {"n": 531, "c": 6, "g": "6.4", "q": "Mỗi mức 単体/結合/総合/受入テスト nhằm bắt loại lỗi nào, và PM theo dõi chỉ số gì ở từng mức?", "a": "単体テスト (tantai tesuto – unit test) bắt lỗi logic trong module: theo dõi coverage C0/C1 (statement/branch). 結合テスト (ketsugou tesuto – integration test) bắt lỗi giao tiếp giữa module, dữ liệu, hệ thống ngoài: theo dõi mật độ test và bug theo interface. 総合テスト (sougou tesuto – system test) bắt lỗi so với yêu cầu và phi chức năng: theo dõi độ phủ yêu cầu, đường cong hội tụ. 受入テスト do khách làm: chỉ số chính là số bug khách tìm thấy. Mức sau toàn lỗi lẽ ra mức trước phải bắt là dấu hiệu mức trước yếu.", "t": ""}, {"n": 532, "c": 6, "g": "6.4", "q": "テスト観点 là gì và vì sao khách Nhật hay hỏi \"観点は網羅されていますか\"?", "a": "テスト観点 là các góc nhìn cần kiểm tra cho một chức năng: giá trị biên, giá trị bất thường, quyền hạn, xử lý đồng thời, ngày đặc biệt (cuối tháng, năm nhuận), message lỗi. Câu 観点は網羅されていますか (kanten wa moura sarete imasu ka – quan điểm đã bao phủ hết chưa) cho thấy khách đánh giá test qua **độ phủ quan điểm** chứ không chỉ số case. Em duy trì danh sách quan điểm chuẩn theo loại chức năng, review nó trước khi viết case, và bổ sung mỗi khi có bug lọt do thiếu quan điểm.", "t": "Nêu được 1–2 quan điểm đặc thù nghiệp vụ (làm tròn số tiền, ngày nghỉ lễ Nhật) cho thấy bạn hiểu domain tài chính, bảo hiểm."}, {"n": 533, "c": 6, "g": "6.4", "q": "テスト密度 (tesuto mitsudo – mật độ test) là gì và tính thế nào?", "a": "テスト密度 = số test case / quy mô, thường là case/KLOC (theo dòng code) hoặc case/FP (theo function point). Nó cho biết test đã đủ \"dày\" so với độ lớn sản phẩm chưa, khi so với baseline cùng loại hệ thống và cùng mức test. Lưu ý KLOC phụ thuộc ngôn ngữ và cách đếm (có tính comment, code tự sinh hay không), nên phải thống nhất cách đếm trong 品質計画書 trước khi so sánh giữa các module hay dự án.", "t": ""}, {"n": 534, "c": 6, "g": "6.4", "q": "バグ密度 (bagu mitsudo – mật độ bug) đọc thế nào cho đúng?", "a": "バグ密度 = số bug phát hiện / quy mô (bug/KLOC hoặc bug/FP), tính riêng cho từng mức test. Phải đọc **cùng** テスト密度: bug thấp có thể do sản phẩm tốt hoặc do test chưa đủ; bug cao có thể do code kém hoặc do test rất kỹ. Em đặt khoảng mục tiêu trên–dưới theo baseline, và module nào nằm ngoài khoảng đều phải có phân tích định tính, không chỉ báo con số.", "t": ""}, {"n": 535, "c": 6, "g": "6.4", "q": "Phân tích hai trục テスト密度 × バグ密度 giúp gì khi đánh giá chất lượng từng module?", "a": "Đặt mỗi module lên ma trận 2×2: ① test đủ, bug trong ngưỡng → tương đối ổn; ② test đủ, bug cao → chất lượng build kém, cần review lại thiết kế/code và test bổ sung; ③ test thiếu, bug thấp → chưa đủ căn cứ đánh giá, phải bổ sung test; ④ test thiếu, bug cao → rủi ro cao nhất, ưu tiên xử lý. Ma trận giúp PM phân bổ effort test và giải thích cho khách vì sao module nào cần thêm thời gian.", "t": "Vẽ ma trận 2×2 này lên bảng trong buổi phỏng vấn là cách nhanh nhất chứng minh bạn quản chất lượng bằng dữ liệu."}, {"n": 536, "c": 6, "g": "6.4", "q": "信頼度成長曲線 (shinraido seichou kyokusen – đường cong tăng trưởng độ tin cậy) đọc thế nào?", "a": "Trục ngang là thời gian hoặc số case đã chạy, trục dọc là số bug tích lũy. Đường lý tưởng có dạng chữ S (thường mô hình hóa bằng đường Gompertz hoặc logistic): đầu tăng nhanh, sau chậm dần và **đi ngang** (収束 – shuusoku – hội tụ) khi gần hết test. Nếu đến cuối vẫn dốc lên gần như tuyến tính, sản phẩm chưa ổn định, chưa nên release. Em cập nhật theo ngày và so với đường dự báo để thấy lệch sớm thay vì đợi cuối kỳ.", "t": ""}, {"n": 537, "c": 6, "g": "6.4", "q": "Đường cong đi ngang rất sớm khi mới chạy khoảng 40% số case. Đó là tín hiệu tốt hay xấu?", "a": "Phải nghi ngờ trước. Có thể chất lượng tốt, nhưng thường gặp hơn: đang chạy các case dễ trước, tester bị chặn môi trường nên ít case thực chất, bug đã thấy nhưng chưa ghi phiếu, hoặc case thiếu quan điểm. Em kiểm tra tốc độ chạy case, phân bổ case theo quan điểm và module, hỏi tester về bug \"chưa kịp ghi\". Chỉ khi các yếu tố này bình thường mới kết luận chất lượng tốt.", "t": ""}, {"n": 538, "c": 6, "g": "6.4", "q": "Đường cong có các \"bậc thang\" tăng vọt giữa chừng nói lên điều gì?", "a": "Bậc thang thường xuất hiện khi một module mới được đưa vào test, môi trường hoặc dữ liệu thay đổi, hoặc có bản build chứa thay đổi lớn hay bản sửa gây デグレ (degure – lỗi hồi quy). Em đối chiếu thời điểm bậc thang với lịch build và nhật ký thay đổi để xác định nguyên nhân. Nếu do デグレ, phải mở rộng phạm vi test hồi quy hoặc tự động hóa cho vùng đó; nếu do module mới, nên vẽ đường riêng theo module để đọc đúng.", "t": ""}, {"n": 539, "c": 6, "g": "6.4", "q": "エビデンス (ebidensu – bằng chứng test) gồm những gì và vì sao khách Nhật coi trọng?", "a": "Evidence là chứng cứ cho thấy case đã chạy và cho kết quả như đã ghi: screenshot, log, kết quả SQL trước/sau, file output, kết quả so sánh. Với khách Nhật, \"đã test\" mà không có evidence coi như chưa test; evidence còn dùng khi có sự cố sau release để chứng minh phạm vi đã kiểm tra. Mỗi evidence gắn ID case, ngày, người test và được lưu theo cấu trúc thư mục, quy tắc đặt tên thống nhất.", "t": ""}, {"n": 540, "c": 6, "g": "6.4", "q": "Làm sao cân bằng chi phí làm evidence với tiến độ?", "a": "Thỏa thuận **mức evidence** với khách ngay trong 品質計画書: ví dụ màn hình chỉ cần screenshot kết quả cuối, batch cần log và dữ liệu trước/sau, case hồi quy tự động dùng report của tool thay screenshot. Dùng công cụ chụp/ghi tự động, template đặt tên file, và tính effort evidence vào ước lượng test dựa trên số đo thực tế của dự án trước. Tránh để cuối kỳ mới \"bổ sung evidence\", vì vừa tốn công vừa dễ thành làm giả.", "t": "Nói rõ \"evidence tạo bù sau khi test xong là rủi ro về tính trung thực\" cho thấy bạn hiểu điểm khách Nhật nhạy cảm nhất."}, {"n": 541, "c": 6, "g": "6.4", "q": "Làm evidence cho khách tài chính, bảo hiểm cần lưu ý gì về dữ liệu?", "a": "Evidence thường chứa dữ liệu màn hình, nên phải dùng dữ liệu test giả lập, không dùng dữ liệu khách hàng thật; nếu bắt buộc dùng dữ liệu thật và được khách cho phép thì phải che (masking) thông tin cá nhân như tên, số tài khoản, số hợp đồng. Evidence lưu ở vùng có phân quyền, không gửi qua kênh cá nhân, và xóa theo quy định khi kết thúc dự án. Vi phạm ở điểm này là sự cố bảo mật, không còn là chuyện chất lượng.", "t": ""}, {"n": 542, "c": 6, "g": "6.4", "q": "Tiêu chí bắt đầu (開始基準 – kaishi kijun) và kết thúc (完了基準 – kanryou kijun) của một mức test nên đặt thế nào?", "a": "Bắt đầu: mức test trước đã đạt, test spec đã review và duyệt, môi trường và dữ liệu sẵn sàng, bản build qua smoke test; thiếu điều kiện thì không bắt đầu để tránh test \"nửa
