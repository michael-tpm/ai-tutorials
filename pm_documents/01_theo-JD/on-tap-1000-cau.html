nội bộ đạt → giao → khách validate → nghiệm thu.", "t": ""}, {"n": 127, "c": 2, "g": "2.3", "q": "Khách đưa yêu cầu mơ hồ như \"màn hình dễ dùng, xử lý nhanh\". Bạn biến chúng thành yêu cầu kiểm chứng được thế nào?", "a": "Đặt câu hỏi để chuyển thành tiêu chí đo được: \"nhanh\" → ví dụ \"tìm kiếm trả kết quả dưới 3 giây với 100.000 bản ghi, 50 user đồng thời\"; \"dễ dùng\" → số bước tối đa cho thao tác chính, tuân thủ guideline UI của khách. Mỗi yêu cầu phi chức năng ghi vào 要件定義書 kèm cách đo và môi trường đo. Khách chưa chốt được thì em ghi thành giả định có số cụ thể để khách xác nhận hoặc sửa.", "t": ""}, {"n": 128, "c": 2, "g": "2.3", "q": "Product scope và project scope khác nhau thế nào? Cho ví dụ.", "a": "Product scope là đặc tính, chức năng của sản phẩm (vd hệ thống quản lý hợp đồng cho khách bảo hiểm B gồm 30 màn hình, 5 batch), đo theo yêu cầu. Project scope là toàn bộ công việc để tạo ra sản phẩm đó (thiết kế, code, test, chuyển đổi dữ liệu, đào tạo, quản lý dự án), đo theo kế hoạch dự án. Nhiều tranh chấp xảy ra vì khách mặc định data migration, đào tạo user nằm trong project scope dù proposal không ghi.", "t": ""}, {"n": 129, "c": 2, "g": "2.4", "q": "Các bước xây dựng schedule từ WBS là gì? Sai lầm hay gặp?", "a": "Define activities từ work package → sequence (phụ thuộc, lead/lag) → estimate durations theo effort và nguồn lực thật → develop schedule (CPM, cân bằng nguồn lực, buffer) → baseline → control. Sai lầm hay gặp: lấy effort chia số người ra duration, bỏ qua % allocation, quên ngày lễ của cả hai nước (Tết, Golden Week, Obon) và thời gian khách review tài liệu.", "t": "Nhắc lịch lễ hai nước và thời gian review của khách là chi tiết \"người làm thật\" mà interviewer đánh giá cao."}, {"n": 130, "c": 2, "g": "2.4", "q": "Giải thích bốn loại quan hệ phụ thuộc FS, SS, FF, SF và lead/lag bằng ví dụ phần mềm.", "a": "FS (finish-to-start): xong thiết kế API mới code tích hợp — loại phổ biến nhất. SS: bắt đầu viết test case sau khi bắt đầu thiết kế chi tiết vài ngày (SS + lag). FF: tài liệu hướng dẫn chỉ xong khi code xong. SF hiếm: hệ thống cũ chỉ được tắt khi hệ thống mới bắt đầu chạy. Lead cho việc sau bắt đầu sớm hơn (vd FS − 3 ngày); lag là thời gian chờ bắt buộc (vd chờ khách review 5 ngày).", "t": ""}, {"n": 131, "c": 2, "g": "2.4", "q": "Mini bài toán CPM: A(3 ngày) → B(2) → E(2) → D(2) và A → C(6) → D. Tìm critical path, total float và free float của B và E.", "a": "Hai đường: A-B-E-D = 3+2+2+2 = 9 ngày; A-C-D = 3+6+2 = 11 ngày → critical path A-C-D, dự án 11 ngày. Forward pass: B (ES 3, EF 5), E (ES 5, EF 7), D bắt đầu sớm nhất ngày 9; backward pass: E (LS 7, LF 9), B (LS 5, LF 7). Total float B = E = 2 ngày; free float B = 0 (E bắt đầu ngay khi B xong), free float E = 9 − 7 = 2.", "t": "Ý cần nói ra: B có total float 2 nhưng free float 0 — B trễ không làm trễ dự án nhưng ăn vào float của E."}, {"n": 132, "c": 2, "g": "2.4", "q": "Float âm nghĩa là gì? Và float nên \"thuộc về\" ai — có nên công khai float của từng task cho team?", "a": "Float âm xuất hiện khi mốc ràng buộc (vd go-live cố định) sớm hơn ngày kết thúc tính được: kế hoạch hiện tại **không khả thi**, phải crash, fast-track, giảm phạm vi hoặc đàm phán lại mốc. Về float, em coi đó là tài sản của dự án do PM quản lý, không chia sẵn cho từng người, vì theo luật Parkinson và \"student syndrome\", việc có float thường được làm muộn và tiêu hết float. Team vẫn thấy critical path, nhưng tiến độ đo theo ngày cam kết của từng task.", "t": ""}, {"n": 133, "c": 2, "g": "2.4", "q": "Critical path có thể thay đổi trong dự án không? Bạn theo dõi nó thế nào?", "a": "Có: khi việc ngoài critical path trễ quá float, khi crash làm đường khác dài hơn, hoặc khi thêm CR. Dự án cũng có thể có nhiều critical path song song, rủi ro cao hơn vì trễ đường nào cũng trễ dự án. Em cập nhật schedule hằng tuần, theo dõi thêm các đường near-critical (float ≤ 2–3 ngày, tham khảo) như thể chúng là critical path.", "t": ""}, {"n": 134, "c": 2, "g": "2.4", "q": "Crashing và fast-tracking khác nhau thế nào? Rủi ro của mỗi cách trong dự án phần mềm?", "a": "Crashing: thêm nguồn lực (người, OT) vào việc trên critical path để rút ngắn → **tăng chi phí**; rủi ro là thêm người vào dự án đang trễ có thể làm chậm hơn (luật Brooks) do onboarding và giao tiếp. Fast-tracking: làm song song các việc vốn tuần tự (vd code khi thiết kế chưa chốt hết) → **tăng rủi ro làm lại**. Chọn cách nào tùy: việc có chia nhỏ được không, người thêm vào có domain không, đầu vào đã chắc đến đâu.", "t": "Nhắc luật Brooks và điều kiện \"chỉ crash khi việc tách được và người thêm vào có sẵn context\" cho thấy hiểu bản chất, không chỉ thuộc định nghĩa."}, {"n": 135, "c": 2, "g": "2.4", "q": "Mini bài toán crashing: hai việc trên critical path — X: normal 10 ngày/50 triệu, crash 7 ngày/65 triệu; Y: normal 8 ngày/40 triệu, crash 6 ngày/54 triệu. Cần rút 2 ngày, crash việc nào?", "a": "Chi phí crash mỗi ngày: X = (65 − 50)/(10 − 7) = 5 triệu/ngày; Y = (54 − 40)/(8 − 6) = 7 triệu/ngày. Chọn X: rút 2 ngày tốn thêm khoảng 10 triệu (giả định chi phí tuyến tính). Nguyên tắc: chỉ crash việc trên critical path, chọn việc có chi phí/ngày thấp nhất, rút từng ngày và tính lại critical path sau mỗi bước vì đường khác có thể trở thành critical.", "t": "Câu hỏi chéo hay gặp: \"crash việc ngoài critical path có rút ngắn dự án không?\" — không, chỉ tốn thêm tiền."}, {"n": 136, "c": 2, "g": "2.4", "q": "PERT ba điểm: O = 4, M = 6, P = 14 ngày. Tính expected duration, độ lệch chuẩn và giải thích ý nghĩa.", "a": "Beta/PERT: E = (O + 4M + P)/6 = (4 + 24 + 14)/6 = 7 ngày; σ = (P − O)/6 = 10/6 ≈ 1,67 ngày. Khoảng ±1σ (≈ 68%) là 5,3–8,7 ngày, ±2σ (≈ 95%) là 3,7–10,3 ngày; nếu dùng phân phối tam giác: (4 + 6 + 14)/3 = 8 ngày. Ý nghĩa: estimate là một khoảng, nên em cam kết với khách theo mức tin cậy (vd 85–90%), không theo giá trị most likely.", "t": "Chỉ ra rằng P lệch xa (14 so với 6) kéo E lên trên M — và vì sao estimate phần mềm thường lệch về phía trễ — là điểm cộng."}, {"n": 137, "c": 2, "g": "2.4", "q": "Critical chain method khác CPM ở điểm nào?", "a": "CPM tính theo phụ thuộc công việc, ngầm giả định nguồn lực không giới hạn; critical chain tính cả **ràng buộc nguồn lực** (vd chỉ có 1 tech lead review). Critical chain cắt phần đệm an toàn trong từng task (estimate ở mức ~50% tin cậy), gom thành **project buffer** cuối chuỗi và **feeding buffer** tại chỗ nhánh phụ nhập vào chuỗi chính. PM theo dõi tốc độ tiêu buffer so với % hoàn thành (fever chart): buffer tiêu nhanh hơn tiến độ thì hành động.", "t": ""}, {"n": 138, "c": 2, "g": "2.4", "q": "Resource leveling và resource smoothing khác nhau thế nào?", "a": "Leveling điều chỉnh lịch để không ai bị phân bổ quá công suất, **có thể làm đổi critical path và kéo dài ngày kết thúc**. Smoothing chỉ dời việc **trong phạm vi float**, không đổi ngày kết thúc, nên có thể không xử lý hết quá tải. Ví dụ: tech lead vừa review code vừa thiết kế module mới, tải 150% → smoothing dời việc còn float; nếu không đủ, leveling dời thiết kế 1 tuần (dự án trễ) hoặc phải thêm người review.", "t": ""}, {"n": 139, "c": 2, "g": "2.4", "q": "Milestone là gì? Bạn đặt milestone thế nào cho dự án outsourcing với khách Nhật?", "a": "Milestone là mốc không có duration, đánh dấu sự kiện quan trọng (xong pha, giao hàng, nghiệm thu). Em đặt milestone gắn với **deliverable kiểm chứng được** và lịch nghiệm thu/thanh toán: chốt 要件定義, duyệt thiết kế, code complete, xong integration test, bắt đầu UAT, go-live. Milestone đưa vào báo cáo tuần dạng kế hoạch–thực tế, và báo khách ngay khi dự báo lệch mốc đã cam kết, vd lệch > 1 ngày (tham khảo).", "t": ""}, {"n": 140, "c": 2, "g": "2.5", "q": "Quản lý chi phí của PM outsourcing gồm những gì?", "a": "Plan cost management → estimate costs → determine budget (cost baseline) → control costs. Trong outsourcing, chi phí chủ yếu là 工数 nhân sự (theo 人月 (ningetsu – man-month) và đơn giá nội bộ từng level), cộng chi phí onsite, license, hạ tầng, đi lại. PM làm 予実管理 (yojitsu kanri – quản lý kế hoạch so với thực tế) hằng tuần: so effort thực tế với kế hoạch theo từng work package để thấy sớm phần nào đang \"đốt\" ngân sách.", "t": ""}, {"n": 141, "c": 2, "g": "2.5", "q": "Cost baseline, contingency reserve và management reserve khác nhau thế nào?", "a": "Cost baseline = tổng estimate các work package + **contingency reserve** (dự phòng cho rủi ro đã nhận diện — known-unknowns), phân bổ theo thời gian, PM dùng theo risk plan. **Management reserve** dành cho unknown-unknowns, **không nằm trong cost baseline** nhưng nằm trong tổng ngân sách (project budget = cost baseline + MR); dùng phải được sponsor/lãnh đạo duyệt, khi dùng thì cost baseline được cập nhật. EVM đo theo cost baseline, không tính MR.", "t": "Bẫy kinh điển trong đề PMP: MR không thuộc cost baseline và PM không được tự ý dùng."}, {"n": 142, "c": 2, "g": "2.5", "q": "Giải thích PV, EV, AC bằng ngôn ngữ đơn giản cho người không làm PM.", "a": "PV (planned value): **lẽ ra** đến hôm nay phải làm xong bao nhiêu việc, quy theo ngân sách kế hoạch. EV (earned value): **thực tế** đã làm xong bao nhiêu việc, cũng quy theo ngân sách kế hoạch. AC (actual cost): **thực tế** đã tiêu bao nhiêu. So EV với PV biết nhanh hay chậm; so EV với AC biết tiết kiệm hay lố. EV là chìa khóa vì nó đo giá trị đã tạo ra, không phải số tiền đã tiêu.", "t": ""}, {"n": 143, "c": 2, "g": "2.5", "q": "Nêu công thức CV, SV, CPI, SPI và cách đọc dấu/giá trị.", "a": "CV = EV − AC, SV = EV − PV: âm là xấu (lố chi phí/chậm tiến độ), dương là tốt. CPI = EV/AC, SPI = EV/PV: < 1 là xấu, > 1 là tốt; vd CPI 0,8 nghĩa là mỗi 1 đồng bỏ ra chỉ tạo được 0,8 đồng giá trị. Mẹo nhớ: luôn bắt đầu bằng EV; \"C\" (cost) đi với AC, \"S\" (schedule) đi với PV.", "t": ""}, {"n": 144, "c": 2, "g": "2.5", "q": "Mini bài toán: BAC = 100.000 USD, kế hoạch 10 tuần chia đều. Cuối tuần 4 hoàn thành 35% công việc, đã chi 42.000 USD. Tính PV, EV, AC, CV, SV, CPI, SPI.", "a": "PV = 40% × 100.000 = 40.000; EV = 35% × 100.000 = 35.000; AC = 42.000. CV = 35.000 − 42.000 = −7.000; SV = 35.000 − 40.000 = −5.000. CPI = 35/42 ≈ 0,83; SPI = 35/40 = 0,875. Kết luận: dự án vừa **lố chi phí** vừa **chậm tiến độ**; mỗi 1 USD bỏ ra chỉ tạo ra khoảng 0,83 USD giá trị.", "t": ""}, {"n": 145, "c": 2, "g": "2.5", "q": "Tiếp bài Q144: tính EAC, ETC, VAC với giả định hiệu suất chi phí hiện tại tiếp diễn.", "a": "EAC = BAC/CPI = 100.000/(35/42) = 120.000; ETC = EAC − AC = 120.000 − 42.000 = 78.000; VAC = BAC − EAC = −20.000. Nghĩa là nếu không thay đổi gì, dự án sẽ vượt 20% ngân sách. Khi báo cáo, em đưa kèm nguyên nhân (vd estimate module X thiếu, rework do yêu cầu đổi) và phương án kéo CPI lên, thay vì chỉ báo con số.", "t": ""}, {"n": 146, "c": 2, "g": "2.5", "q": "Có những công thức EAC nào và khi nào dùng từng công thức?", "a": "① EAC = AC + bottom-up ETC: khi estimate ban đầu sai căn bản, phải ước lại phần còn lại. ② EAC = AC + (BAC − EV): khi độ lệch là **bất thường**, phần còn lại sẽ chạy đúng kế hoạch. ③ EAC = BAC/CPI: khi hiệu suất chi phí hiện tại sẽ **tiếp diễn**. ④ EAC = AC + (BAC − EV)/(CPI × SPI): khi cả chi phí lẫn tiến độ cùng tác động (vd phải đuổi deadline cố định). Với số Q144: ② = 107.000, ③ = 120.000, ④ ≈ 131.100 USD.", "t": "Trình bày một dải EAC (lạc quan–bi quan) cho sponsor thay vì một con số duy nhất giúp ra quyết định tốt hơn và thể hiện tư duy senior."}, {"n": 147, "c": 2, "g": "2.5", "q": "TCPI là gì? Tính TCPI cho bài Q144 và diễn giải.", "a": "TCPI (to-complete performance index) là hiệu suất chi phí **cần đạt** cho phần việc còn lại để về đích đúng mục tiêu: TCPI = (BAC − EV)/(BAC − AC) nếu giữ BAC, hoặc (BAC − EV)/(EAC − AC) nếu theo EAC mới. Bài Q144: (100.000 − 35.000)/(100.000 − 42.000) = 65/58 ≈ 1,12. CPI hiện tại chỉ 0,83 mà phải nhảy lên 1,12 là rất khó; kinh nghiệm tham khảo: TCPI cao hơn CPI quá ~0,1 thì coi BAC không còn khả thi và trình EAC mới.", "t": ""}, {"n": 148, "c": 2, "g": "2.5", "q": "Mini bài toán theo 人月: BAC = 50 MM. Sau 3 tháng: PV = 30 MM, EV = 24 MM, AC = 32 MM. Đánh giá và đề xuất.", "a": "CPI = 24/32 = 0,75; SPI = 24/30 = 0,8; EAC = 50/0,75 ≈ 66,7 MM (vượt ~16,7 MM); TCPI = (50 − 24)/(50 − 32) = 26/18 ≈ 1,44 — gần như không thể đạt. Đề xuất: ① phân tích nguyên nhân (estimate thiếu, rework, năng suất người mới); ② phần thay đổi chưa tính tiền thì đưa vào CR với khách; ③ trình lãnh đạo EAC mới và phương án giảm lỗ (đổi cơ cấu team, dừng gold plating); ④ ghi bài học để hiệu chỉnh hệ số estimate cho dự án sau.", "t": ""}, {"n": 149, "c": 2, "g": "2.5", "q": "Đo EV cho task phần mềm thế nào để tránh \"hội chứng 90%\"?", "a": "\"Hội chứng 90%\" là task báo 90% rất lâu vì % do người làm tự ước. Em dùng quy tắc đo khách quan: 0/100 (chỉ ghi nhận khi xong hẳn, cho task ngắn hơn một chu kỳ báo cáo), 50/50 hoặc 20/80 (ghi một phần khi bắt đầu, phần còn lại khi xong), hoặc weighted milestone (thiết kế 20% – code 50% – review/test 30%). Ví dụ: A 10 MM đã xong, B 20 MM đang làm (50/50), C 10 MM chưa bắt đầu → EV = 10 + 10 = 20 MM.", "t": ""}, {"n": 150, "c": 2, "g": "2.5", "q": "CPI > 1 nhưng SPI < 1 nói lên điều gì? Và trường hợp ngược lại?", "a": "CPI > 1, SPI < 1: tiêu ít hơn giá trị làm được nhưng chậm hơn kế hoạch — thường do **nguồn lực chưa vào đủ** như kế hoạch; còn dư địa chi phí để bổ sung người. CPI < 1, SPI > 1: nhanh nhưng tốn — thường do **OT, đổ thêm người** để kịp; cần xem có bền vững không và OT có ăn vào margin không. Luôn soi thêm chất lượng: chỉ số đẹp mà bug tăng là tín hiệu giả.", "t": "Câu này kiểm tra khả năng đọc chỉ số kết hợp — nêu giả thuyết nguyên nhân kèm cách kiểm chứng là đủ ghi điểm."}, {"n": 151, "c": 2, "g": "2.5", "q": "Hạn chế của SPI ở giai đoạn cuối dự án là gì?", "a": "Khi dự án xong, EV = BAC = tổng PV nên SPI luôn tiến về 1 (SV về 0) dù thực tế dự án trễ nhiều tuần. Ngoài ra SPI đo theo giá trị, không theo critical path: làm nhiều việc không quan trọng vẫn có SPI đẹp trong khi critical path đang trễ. Khắc phục: theo dõi song song critical path và milestone, có thể dùng Earned Schedule để đo tiến độ theo đơn vị thời gian.", "t": ""}, {"n": 152, "c": 2, "g": "2.5", "q": "Với dự án Fixed Price cho khách Nhật, EVM còn ý nghĩa gì khi khách không quan tâm chi phí nội bộ của mình?", "a": "Với FP, khách trả giá cố định nên chi phí vượt là **lỗ của chính công ty mình**; EVM nội bộ là công cụ bảo vệ margin. Em theo dõi 原価 (genka – chi phí gốc) theo effort thực tế × đơn giá nội bộ, dùng CPI để dự báo lợi nhuận, SPI và milestone để báo khách. Báo cáo cho khách chỉ gồm tiến độ, chất lượng; báo cáo nội bộ thêm EAC, margin dự kiến và các CR chưa thu tiền.", "t": ""}, {"n": 153, "c": 2, "g": "2.5", "q": "Cost baseline phân bổ theo thời gian có dạng \"S-curve\". Bạn dùng S-curve để làm gì?", "a": "S-curve là đường PV lũy kế theo thời gian, thường dốc nhất ở giữa dự án khi nhân sự đông nhất. Vẽ chung PV, EV, AC trên một biểu đồ là cách 見える化 (mieruka – trực quan hóa) xu hướng: EV dưới PV là chậm, AC trên EV là lố. Em dùng nó trong báo cáo nội bộ hằng tháng và review dự án với lãnh đạo; nó cũng giúp lập kế hoạch dòng tiền và kế hoạch điều phối nhân sự.", "t": ""}, {"n": 154, "c": 2, "g": "2.6", "q": "Risk khác issue thế nào? Cho ví dụ cùng một chủ đề.", "a": "Risk là sự kiện **chưa xảy ra, không chắc chắn**, tác động tích cực hoặc tiêu cực; issue là sự việc **đã xảy ra**, phải xử lý. Ví dụ: \"Tech lead có thể nghỉ việc giữa dự án\" là risk (theo dõi trong risk register, có kế hoạch giảm thiểu); \"Tech lead đã nộp đơn nghỉ\" là issue (vào 課題管理表 (kadai kanrihyou – bảng quản lý vấn đề), có người xử lý và hạn xử lý). Risk xảy ra thì chuyển thành issue và kích hoạt kế hoạch ứng phó đã chuẩn bị.", "t": ""}, {"n": 155, "c": 2, "g": "2.6", "q": "Risk register gồm những cột gì?", "a": "Tối thiểu: ID, mô tả theo cấu trúc **nguyên nhân – sự kiện – tác động** (\"Do khách chưa chốt API của ngân hàng A, tích hợp có thể trễ, dẫn tới UAT trễ 2 tuần\"), category, probability, impact, điểm ưu tiên, trigger, chiến lược ứng phó, hành động cụ thể + hạn, risk owner, trạng thái, residual risk. Em review register hằng tuần trong họp nội bộ và đưa top rủi ro vào 進捗報告 (shinchoku houkoku – báo cáo tiến độ) gửi khách.", "t": "Viết rủi ro theo mẫu \"nguyên nhân – sự kiện – tác động\" giúp phân biệt với lo lắng chung chung kiểu \"rủi ro về tiến độ\"."}, {"n": 156, "c": 2, "g": "2.6", "q": "Đánh giá rủi ro định tính và định lượng khác nhau thế nào? Khi nào cần định lượng?", "a": "Định tính: chấm probability × impact theo thang (vd 1–5) trên ma trận để xếp ưu tiên — nhanh, dùng cho mọi dự án. Định lượng: quy ra số tiền/ngày cụ thể bằng EMV, decision tree, mô phỏng Monte Carlo cho tiến độ — dùng cho dự án lớn, FP rủi ro cao hoặc khi phải quyết định dự phòng bao nhiêu. Thực tế em đánh giá định tính toàn bộ, định lượng cho top 5–10 rủi ro chạm tới hợp đồng hoặc milestone.", "t": ""}, {"n": 157, "c": 2, "g": "2.6", "q": "Tính EMV: rủi ro A xác suất 30%, tác động −50 triệu; rủi ro B xác suất 10%, tác động −200 triệu; cơ hội C xác suất 20%, tác động +40 triệu. Dùng kết quả thế nào?", "a": "EMV = xác suất × tác động: A = −15 triệu, B = −20 triệu, C = +8 triệu; tổng = −27 triệu. Con số này là cơ sở đặt contingency reserve cho các rủi ro đã nhận diện (khoảng 27 triệu, cộng biên an toàn tùy chính sách). B xác suất thấp nhưng EMV lớn nhất — đáng đầu tư giảm thiểu nếu chi phí giảm thiểu nhỏ hơn phần EMV giảm được.", "t": ""}, {"n": 158, "c": 2, "g": "2.6", "q": "Decision tree: tự phát triển module (200 triệu, 40% khả năng phát sinh thêm 100 triệu) hay mua package (230 triệu, 10% khả năng tốn thêm 50 triệu tùy biến)?", "a": "Tự làm: 200 + 0,4 × 100 = 240 triệu. Mua: 230 + 0,1 × 50 = 235 triệu. Theo EMV, mua rẻ hơn 5 triệu, nhưng chênh lệch nhỏ nên phải xét thêm yếu tố phi tiền tệ: phụ thuộc nhà cung cấp, license dài hạn, mức tùy biến, yêu cầu bảo mật của khách tài chính. Decision tree giúp định lượng, không thay thế phán đoán.", "t": ""}, {"n": 159, "c": 2, "g": "2.6", "q": "Năm chiến lược ứng phó rủi ro tiêu cực là gì? Cho ví dụ trong dự án phần mềm.", "a": "**Avoid**: loại bỏ nguyên nhân, vd không dùng thư viện chưa ổn định. **Transfer**: chuyển tác động cho bên thứ ba, vd thuê nhà cung cấp hạ tầng có cam kết SLA và điều khoản bồi thường. **Mitigate**: giảm xác suất/tác động, vd làm PoC tích hợp sớm, cho 2 người cùng nắm module chủ chốt. **Accept**: chấp nhận chủ động (có contingency) hoặc bị động. **Escalate**: rủi ro vượt thẩm quyền/phạm vi dự án thì chuyển lên cấp phù hợp, vd chính sách nhân sự toàn công ty.", "t": ""}, {"n": 160, "c": 2, "g": "2.6", "q": "Chiến lược cho cơ hội (positive risk): exploit, enhance, share khác nhau thế nào?", "a": "**Exploit**: làm cho cơ hội chắc chắn xảy ra, vd giao người giỏi nhất để xong sớm và nhận thưởng giao sớm. **Enhance**: tăng xác suất/tác động, vd tái sử dụng framework nội bộ để giảm effort. **Share**: chia cơ hội với bên nắm bắt tốt hơn, vd liên kết với đối tác cloud. Ngoài ra còn escalate và accept. Trong outsourcing, cơ hội hay bị bỏ quên trong register; em luôn ghi vài dòng như mở rộng phạm vi giai đoạn sau, tái sử dụng component.", "t": "Có cơ hội trong risk register cho thấy tư duy tạo giá trị và doanh thu — đúng điều công ty outsourcing cần ở Senior PM."}, {"n": 161, "c": 2, "g": "2.6", "q": "Trigger và risk owner là gì? Vì sao risk owner không nên luôn là PM?", "a": "Trigger là dấu hiệu cảnh báo rủi ro sắp hoặc đã xảy ra, vd \"khách trả lời Q&A trễ quá 3 ngày\" là trigger của rủi ro trễ thiết kế. Risk owner theo dõi trigger và thực thi kế hoạch ứng phó. PM chịu trách nhiệm cả quy trình, nhưng owner nên là người gần nguồn rủi ro nhất: rủi ro kỹ thuật → tech lead, rủi ro môi trường phía khách → onsite/BrSE, rủi ro nhân sự → line manager. Như vậy phản ứng nhanh hơn và PM không thành điểm nghẽn.", "t": ""}, {"n": 162, "c": 2, "g": "2.6", "q": "Secondary risk và residual risk khác nhau thế nào?", "a": "Residual risk là phần rủi ro **còn lại** sau khi đã ứng phó (vd làm PoC rồi vẫn còn khả năng API của khách thay đổi) — cần contingency hoặc chấp nhận. Secondary risk là rủi ro **mới sinh ra** từ chính biện pháp ứng phó (vd thêm 3 người mới để giảm rủi ro trễ → phát sinh rủi ro chất lượng vì người mới chưa nắm nghiệp vụ). Cả hai đều phải ghi vào register, không coi rủi ro \"đã xử lý\" là hết.", "t": ""}, {"n": 163, "c": 2, "g": "2.6", "q": "Contingency plan, fallback plan và workaround khác nhau thế nào?", "a": "Contingency plan là kế hoạch **chuẩn bị trước**, kích hoạt khi trigger xảy ra; fallback plan là phương án **dự phòng thứ hai** khi contingency không hiệu quả. Workaround là cách xử lý **không có kế hoạch trước**, cho rủi ro chưa nhận diện hoặc đã chấp nhận bị động. Ví dụ go-live: contingency = rollback theo kịch bản đã diễn tập; fallback = chạy song song hệ thống cũ thêm 1 tuần; workaround = nhập liệu tay tạm thời cho một batch lỗi không lường trước.", "t": ""}, {"n": 164, "c": 2, "g": "2.6", "q": "Làm sao nhận diện rủi ro hiệu quả ở đầu dự án outsourcing cho khách tài chính Nhật?", "a": "Kết hợp: ① checklist từ lessons learned dự án cũ (khách mới, công nghệ mới, team mới, yêu cầu chưa chốt, phụ thuộc bên thứ ba); ② workshop với tech lead, BrSE, QA; ③ phân tích giả định và ràng buộc trong proposal — giả định nào có thể sai thì thành rủi ro; ④ hỏi khách rủi ro phía họ (lịch release hệ thống lõi, quy định bảo mật, audit). Với khách tài chính, chú ý thêm bảo mật dữ liệu, phê duyệt nhiều tầng và môi trường test bị giới hạn truy cập.", "t": "Nói được \"giả định sai chính là rủi ro\" (assumption analysis) là cầu nối đẹp giữa proposal và quản lý rủi ro."}, {"n": 165, "c": 2, "g": "2.7", "q": "Bạn nhận diện và phân tích stakeholder thế nào? Power/interest grid dùng ra sao?", "a": "Nguồn đầu tiên là 体制図 (taiseizu – sơ đồ tổ chức dự án) của hai bên; liệt kê cả phía khách (sponsor, IT, người dùng nghiệp vụ, bảo mật/audit), phía mình (lãnh đạo, line manager, onsite, team, QA) và bên thứ ba. Xếp vào lưới: power cao–interest cao → **manage closely**; power cao–interest thấp → **keep satisfied**; power thấp–interest cao → **keep informed**; thấp–thấp → **monitor**. Kết quả là stakeholder register có chiến lược riêng cho từng nhóm.", "t": ""}, {"n": 166, "c": 2, "g": "2.7", "q": "Stakeholder engagement assessment matrix là gì?", "a": "Ma trận so sánh mức tham gia **hiện tại (C)** và **mong muốn (D)** của từng stakeholder theo 5 mức: unaware, resistant, neutral, supportive, leading. Khoảng cách C–D chỉ ra hành động cần làm: vd trưởng phòng nghiệp vụ của khách đang resistant vì sợ hệ thống mới tăng việc, mong muốn supportive → demo sớm, mời review màn hình, chỉ ra lợi ích cụ thể cho bộ phận họ. Em cập nhật ma trận ở mỗi milestone.", "t": ""}, {"n": 167, "c": 2, "g": "2.7", "q": "RACI là gì? Lỗi phổ biến khi lập RACI?", "a": "RACI xác định cho mỗi hoạt động/deliverable: Responsible (người làm), Accountable (chịu trách nhiệm cuối, duyệt), Consulted (được hỏi ý kiến), Informed (được thông báo). Lỗi phổ biến: nhiều A cho một việc (rốt cuộc không ai chịu trách nhiệm), không có R, quá nhiều C làm chậm quyết định, lập xong không ai dùng. Ví dụ tài liệu 要件定義書: R = BrSE/BA, A = PM, C = người dùng nghiệp vụ của khách, I = team dev.", "t": "Quy tắc hay bị hỏi lại: mỗi việc có đúng một A."}, {"n": 168, "c": 2, "g": "2.7", "q": "Số kênh giao tiếp tính thế nào? Team đang 10 người, thêm 5 người thì tăng bao nhiêu kênh?", "a": "Công thức n(n − 1)/2. 10 người: 10 × 9/2 = 45 kênh; 15 người: 15 × 14/2 = 105 kênh; tăng 60 kênh. Ý nghĩa thực tế: số kênh tăng gần theo bình phương, nên team lớn phải chia nhóm nhỏ có lead, chuẩn hóa ai báo ai qua công cụ gì, và hạn chế họp toàn đội. Đây cũng là lý do thêm người không làm năng suất tăng tuyến tính.", "t": "Đề PMP hay hỏi \"tăng thêm bao nhiêu kênh\" — phải lấy hai kết quả trừ nhau, đừng dừng ở một con số."}, {"n": 169, "c": 2, "g": "2.7", "q": "Communication management plan gồm những gì?", "a": "Trả lời: ai cần thông tin gì, khi nào, qua kênh nào, định dạng và ngôn ngữ nào, ai gửi, mức chi tiết. Ví dụ: báo cáo tuần bằng tiếng Nhật gửi khách thứ Sáu; họp định kỳ 30 phút/tuần có 議事録 (gijiroku – biên bản họp) gửi trong 24 giờ; báo cáo tháng nội bộ cho lãnh đạo; quy tắc escalation theo mức nghiêm trọng (vd sự cố nghiêm trọng báo khách trong 1 giờ — tham khảo). Plan gắn với stakeholder register để mỗi nhóm nhận đúng mức thông tin.", "t": ""}, {"n": 170, "c": 2, "g": "2.7", "q": "Push, pull và interactive communication khác nhau thế nào? Khi nào dùng từng loại?", "a": "Interactive (họp, gọi) hiệu quả nhất cho vấn đề phức tạp, cần quyết định hoặc nhạy cảm như thông báo trễ tiến độ. Push (email, báo cáo gửi đi) cho thông tin cần đến đúng người nhưng không cần phản hồi ngay. Pull (wiki, dashboard, công cụ quản lý ticket) cho thông tin nhiều người tự tra cứu khi cần. Với khách Nhật, tin xấu nên báo bằng interactive trước, rồi gửi email xác nhận bằng văn bản để lưu vết.", "t": ""}, {"n": 171, "c": 2, "g": "2.7", "q": "Một status report tốt gửi khách gồm những gì?", "a": "Trạng thái tổng (xanh/vàng/đỏ có tiêu chí rõ), tiến độ theo milestone và % hoàn thành có cơ sở đo, chỉ số chất lượng (số bug, mật độ bug), top rủi ro và issue cần khách hỗ trợ kèm hạn trả lời, CR, kế hoạch tuần tới. Nguyên tắc: kết luận trước, chi tiết sau; số liệu thay tính từ; luôn có mục \"cần khách quyết định gì\". Báo cáo đỏ không bao giờ là bất ngờ — khách đã được báo miệng trước.", "t": "Định nghĩa tiêu chí màu (vd vàng: dự báo trễ milestone ≤ 3 ngày, còn kiểm soát được; đỏ: trễ hơn hoặc cần khách quyết định) để tránh báo cáo \"dưa hấu\" — ngoài xanh trong đỏ."}, {"n": 172, "c": 2, "g": "2.7", "q": "Làm thế nào quản lý stakeholder quyền lực cao nhưng ít quan tâm (nhóm keep satisfied)?", "a": "Họ ít đọc báo cáo chi tiết nhưng có thể can thiệp bất ngờ, vd giám đốc khối của khách dừng dự án ngay tại buổi review. Cách làm: gửi tóm tắt 1 trang theo tháng/milestone, tập trung vào lợi ích và quyết định cần họ; mời vào các buổi demo quan trọng; qua sponsor trao đổi trước các quyết định lớn theo kiểu 根回し (nemawashi – vận động, thống nhất trước) thay vì đưa thẳng vào cuộc họp lớn. Mục tiêu: họ không bao giờ bị bất ngờ.", "t": ""}, {"n": 173, "c": 2, "g": "2.7", "q": "Một stakeholder phía khách liên tục phản đối thiết kế đã được duyệt. Bạn tiếp cận thế nào?", "a": "① Tìm nguyên nhân thật qua trao đổi riêng (sợ mất quyền, bị bỏ qua lúc lấy yêu cầu, hay có nhu cầu nghiệp vụ chưa được hiểu); ② cập nhật engagement matrix và trao đổi với sponsor; ③ điểm nào hợp lý thì đưa vào CR có đánh giá tác động, điểm nào không thì để sponsor phía khách quyết định dựa trên dữ liệu; ④ phòng ngừa: mời họ vào review sớm ở các pha sau. PM không tranh luận đúng sai với khách mà tạo cơ chế để khách tự quyết.", "t": ""}, {"n": 174, "c": 2, "g": "2.7", "q": "Dự án có onsite ở Nhật và offshore ở Đà Nẵng: bạn tổ chức luồng giao tiếp ra sao?", "a": "Thiết kế luồng một cửa: khách ↔ onsite/BrSE ↔ PM/team offshore, kèm quy tắc khi nào được trao đổi trực tiếp (vd dev giải thích kỹ thuật thì cc BrSE). Có một nơi duy nhất lưu Q&A表 (Q&A hyou – bảng hỏi đáp), quyết định và tài liệu; họp ngắn onsite–offshore hằng ngày, tận dụng chênh lệch 2 giờ (Nhật sớm hơn Việt Nam). PM theo dõi số Q&A quá hạn và thời gian trả lời trung bình để phát hiện nghẽn.", "t": ""}, {"n": 175, "c": 2, "g": "2.8", "q": "So sánh hợp đồng Fixed Price (FP) và Time & Material (T&M) từ góc độ rủi ro.", "a": "FP: giá cố định cho phạm vi xác định — rủi ro chi phí **nằm ở bên cung cấp**, khách dễ dự toán; hợp khi yêu cầu rõ và ổn định. T&M: khách trả theo effort thực tế × đơn giá — rủi ro chi phí **nằm ở bên mua**, linh hoạt khi yêu cầu chưa rõ. Với vendor, FP có thể lãi cao nếu estimate tốt nhưng lỗ nặng nếu phạm vi trôi; T&M margin ổn định hơn nhưng khách đòi minh bạch effort và năng suất.", "t": ""}, {"n": 176, "c": 2, "g": "2.8", "q": "Hợp đồng cost-reimbursable (CPFF, CPIF, CPAF) là gì? Có gặp trong outsourcing phần mềm không?", "a": "Bên mua trả chi phí thực tế hợp lệ cộng phí: CPFF (cost plus fixed fee) — phí cố định; CPIF (cost plus incentive fee) — phí thưởng theo mục tiêu, phần tiết kiệm/vượt chia theo tỷ lệ; CPAF (cost plus award fee) — thưởng theo đánh giá của bên mua. Dạng thuần túy hiếm gặp trong outsourcing phần mềm thương mại, nhưng tinh thần \"chia sẻ rủi ro, thưởng theo mục tiêu\" xuất hiện trong T&M có trần hoặc thưởng khi giao sớm, đạt chất lượng.", "t": ""}, {"n": 177, "c": 2, "g": "2.8", "q": "Hợp đồng FPIF (fixed price incentive fee) tính thế nào? Cho mini ví dụ.", "a": "FPIF có target cost, target profit, tỷ lệ chia (share ratio) và ceiling price. Ví dụ: target cost 100, target profit 10, share 80/20 (bên mua/bên bán), ceiling 120. Actual cost 90: tiết kiệm 10, bên bán hưởng 20% = 2 → profit 12, giá 102. Actual cost 110: vượt 10, bên bán chịu 2 → profit 8, giá 118 (dưới ceiling). Chi phí đẩy giá vượt ceiling thì bên bán tự chịu toàn bộ phần vượt.", "t": ""}, {"n": 178, "c": 2, "g": "2.8", "q": "Make-or-buy analysis là gì? Ngoài chi phí, bạn cân nhắc những yếu tố nào?", "a": "Make-or-buy quyết định tự làm hay mua/thuê ngoài một phần dự án (module, dịch vụ, nhân sự). Ngoài tổng chi phí sở hữu, em xét: năng lực cốt lõi (phần tạo lợi thế thì giữ), thời gian, kiểm soát chất lượng và IP, bảo mật dữ liệu, tải nguồn lực hiện có, rủi ro phụ thuộc. Hợp đồng với khách Nhật thường yêu cầu xin phép trước khi 再委託 (saiitaku – giao lại cho bên thứ ba), nên phải xử lý điều này trước khi chọn \"buy\".", "t": ""}, {"n": 179, "c": 2, "g": "2.8", "q": "Quy trình procurement gồm những bước chính nào, và vì sao PM phía vendor cũng cần hiểu?", "a": "Plan procurement (mua gì, loại hợp đồng, tiêu chí chọn) → conduct procurement (gửi RFI/RFQ/RFP, chấm đề xuất theo tiêu chí có trọng số, đàm phán, ký) → control procurement (theo dõi hiệu suất nhà cung cấp, thanh toán theo nghiệm thu, xử lý claim, đóng hợp đồng). PM ở công ty outsourcing thường đứng ở phía \"được mua\": hiểu quy trình này giúp viết proposal bám tiêu chí chấm và đoán trước những gì khách sẽ kiểm soát.", "t": ""}, {"n": 180, "c": 2, "g": "2.8", "q": "RFI, RFQ, RFP khác nhau thế nào? Khi nhận RFP, bạn đọc gì đầu tiên?", "a": "RFI: hỏi thông tin năng lực để sàng lọc; RFQ: xin báo giá khi yêu cầu đã rõ, chủ yếu so giá; RFP: xin đề xuất giải pháp kèm giá cho bài toán phức tạp. Khi nhận RFP, tiếng Nhật là 提案依頼書 (teian iraisho – thư yêu cầu đề xuất), em đọc trước tiêu chí đánh giá và trọng số, phạm vi, ràng buộc (deadline, công nghệ, bảo mật), hình thức hợp đồng, rồi lập danh sách câu hỏi làm rõ gửi khách trong hạn hỏi đáp.", "t": "Nhiều proposal thua vì trình bày theo ý mình thay vì bám tiêu chí chấm của RFP — nói ra điều này cho thấy kinh nghiệm presales."}, {"n": 181, "c": 2, "g": "2.8", "q": "Khi nào nên chọn T&M có trần (not-to-exceed) hoặc mô hình lai thay vì FP thuần?", "a": "Khi yêu cầu chưa rõ hoàn toàn nhưng khách cần kiểm soát ngân sách: T&M có trần cho phép linh hoạt mà khách vẫn có giới hạn chi. Mô hình lai phổ biến: giai đoạn đầu (làm rõ yêu cầu, PoC) theo T&M, khi yêu cầu đã chốt thì chuyển phần phát triển sang FP. Cách này giảm rủi ro estimate sai cho vendor và giảm rủi ro \"trả tiền không giới hạn\" cho khách.", "t": ""}, {"n": 182, "c": 2, "g": "2.8", "q": "Bạn quản lý một đối tác phụ (subcontractor) cung cấp nhân sự hoặc module cho dự án như thế nào?", "a": "Hợp đồng với đối tác phải phản ánh cam kết với khách theo kiểu back-to-back: phạm vi, tiêu chuẩn chất lượng, bảo mật, NDA, mốc giao. Khi thực hiện: đưa đối tác vào cùng quy trình (coding convention, review, báo cáo tuần), đo bằng chỉ số rõ (đúng hạn, mật độ bug, tỷ lệ review không đạt), nghiệm thu từng phần trước khi tích hợp. Với khách, mình vẫn chịu trách nhiệm cuối cùng — không thể nói \"lỗi do đối tác\".", "t": "Từ khóa \"back-to-back\" và \"trách nhiệm cuối cùng vẫn là của mình\" thể hiện đúng tinh thần chịu trách nhiệm cao nhất mà JD yêu cầu."}, {"n": 183, "c": 2, "g": "2.9", "q": "Các hoạt động chính khi đóng dự án (hoặc đóng một pha) là gì?", "a": "① Xác nhận nghiệm thu chính thức tất cả deliverable (biên bản 検収 có chữ ký); ② bàn giao tài liệu, source, tài khoản, kiến thức cho khách/team vận hành; ③ đóng hợp đồng: đối chiếu CR, thanh toán, nghĩa vụ bảo hành; ④ giải phóng nguồn lực kèm đánh giá thành viên; ⑤ lessons learned và 完了報告書 (kanryou houkokusho – báo cáo hoàn thành); ⑥ lưu trữ hồ sơ. Dự án bị hủy giữa chừng cũng phải đóng theo quy trình này.", "t": "Nhắc \"dự án hủy cũng phải đóng chính thức\" — đề PMP hay bẫy đúng điểm này."}, {"n": 184, "c": 2, "g": "2.9", "q": "Lessons learned nên thu thập khi nào và làm sao để chúng thực sự được dùng lại?", "a": "Thu thập **suốt dự án** (cuối mỗi pha/milestone, ngay sau sự cố), không đợi cuối dự án khi người đã quên hoặc đã rời đi. Mỗi bài học ghi theo dạng: bối cảnh – chuyện gì xảy ra – nguyên nhân gốc – hành động đề xuất – áp dụng cho ai. Để dùng lại: đưa vào kho lessons learned của tổ chức, cập nhật checklist rủi ro, hệ số estimate, template và 横展開 (yokotenkai – nhân rộng sang dự án khác); khi mở dự án mới, bắt buộc đọc bài học của dự án tương tự.", "t": ""}, {"n": 185, "c": 2, "g": "2.9", "q": "Ngoài tam giác sắt (phạm vi–thời gian–chi phí), bạn đo thành công dự án bằng gì?", "a": "Thêm: chất lượng (mật độ bug sau release, số sự cố production trong thời gian bảo hành), sự hài lòng của khách (khảo sát, khách có gia hạn hoặc mở rộng hợp đồng không), margin thực tế so với kế hoạch, sức khỏe team (nghỉ việc, OT, mức hài lòng) và lợi ích kinh doanh khách đạt được khi dùng hệ thống. Dự án đúng hạn, đúng ngân sách nhưng khách không ký tiếp hoặc team kiệt sức thì chưa thể gọi là thành công.", "t": "Câu trả lời senior nhấn vào \"khách ký tiếp hợp đồng\" — chỉ số kinh doanh mà công ty outsourcing thực sự quan tâm."}, {"n": 186, "c": 2, "g": "2.9", "q": "Benefits realization là gì? PM phía vendor có trách nhiệm gì với lợi ích sau dự án?", "a": "Benefits realization là đảm bảo lợi ích kinh doanh dự kiến trong business case (vd minh họa: giảm 30% thời gian xử lý hồ sơ bảo hiểm) thực sự đạt được, thường đo sau khi dự án đóng. Trách nhiệm chính thuộc sponsor/khách, nhưng PM vendor nên hiểu mục tiêu kinh doanh từ đầu để ưu tiên đúng, đề xuất chỉ số đo, và sau go-live hỏi lại khách về kết quả. Đây cũng là cơ sở tự nhiên để đề xuất giai đoạn tiếp theo.", "t": ""}, {"n": 187, "c": 2, "g": "2.9", "q": "Business case và benefits management plan khác project charter thế nào?", "a": "Business case trả lời \"**vì sao** đáng đầu tư\": vấn đề, các phương án, chi phí–lợi ích, rủi ro; benefits management plan mô tả **lợi ích nào, đo thế nào, khi nào, ai chịu trách nhiệm**. Hai tài liệu này thường có trước dự án và là đầu vào của charter; charter thì chính thức khởi động dự án và trao quyền cho PM. Khi bối cảnh đổi khiến business case không còn hợp lý, dự án nên được xem xét dừng.", "t": ""}, {"n": 188, "c": 2, "g": "2.9", "q": "NPV, IRR, payback period dùng thế nào khi chọn dự án? Nếu chúng mâu thuẫn thì sao?", "a": "NPV: giá trị hiện tại ròng của dòng tiền — dương mới đáng làm, càng lớn càng tốt. IRR: lãi suất làm NPV = 0 — càng cao càng tốt. Payback: thời gian hoàn vốn — càng ngắn càng ít rủi ro. Khi mâu thuẫn, ưu tiên NPV vì phản ánh trực tiếp giá trị tạo thêm. Hai khái niệm đi kèm: opportunity cost là giá trị của phương án tốt nhất bị bỏ qua; sunk cost (chi phí đã bỏ ra) không được dùng để quyết định.", "t": "Bẫy kinh điển: lấy sunk cost biện minh tiếp tục dự án (\"đã tốn 2 tỷ rồi\") — PM chỉ nhìn chi phí và lợi ích phía trước."}, {"n": 189, "c": 2, "g": "2.9", "q": "Bạn tổ chức buổi lessons learned cuối dự án với khách Nhật thế nào để không thành buổi đổ lỗi?", "a": "Chuẩn bị dữ liệu trước (timeline sự kiện, chỉ số tiến độ, bug, CR) để thảo luận theo fact; đặt quy tắc \"bàn về quy trình, không bàn về cá nhân\"; dùng khung KPT (Keep–Problem–Try) quen thuộc ở Nhật. Làm nội bộ trước để team nói thẳng, sau đó làm với khách dưới dạng 振り返り (furikaeri – nhìn lại) có danh sách hành động cụ thể cho giai đoạn sau. Sự cố lớn thì gửi kèm biện pháp 再発防止 (saihatsu boushi – phòng ngừa tái phát).", "t": ""}, {"n": 190, "c": 2, "g": "2.9", "q": "Dự án bị dừng giữa chừng vì khách cắt ngân sách. PM cần làm gì?", "a": "① Xin xác nhận quyết định dừng và ngày hiệu lực bằng văn bản; ② dừng phát sinh chi phí mới, chốt trạng thái thực tế: deliverable nào xong, cái nào dở dang ở mức nào; ③ thống nhất với khách phần được nghiệm thu, thanh toán theo hợp đồng, bàn giao tài liệu và source; ④ bố trí lại nhân sự với line manager, làm lessons learned nội bộ. Giữ quan hệ tốt, vì khách cắt ngân sách năm nay có thể quay lại năm sau.", "t": ""}, {"n": 191, "c": 2, "g": "2.10", "q": "PRINCE2 có 7 principles nào? Nguyên tắc nào bạn thấy hữu ích nhất trong outsourcing?", "a": "Continued business justification, learn from experience, defined roles and responsibilities, manage by stages, manage by exception, focus on products, tailor to suit the project. Hữu ích nhất với em là **manage by stages** (chia giai đoạn, cuối mỗi giai đoạn quyết định có đi tiếp không) và **focus on products** (định nghĩa sản phẩm và tiêu chí chất lượng trước khi làm), vì khớp với cách khách Nhật nghiệm thu theo pha và theo tài liệu.", "t": ""}, {"n": 192, "c": 2, "g": "2.10", "q": "Kể tên 7 themes và 7 processes của PRINCE2.", "a": "Themes (theo bản 2017; bản cập nhật sau đổi tên gọi một số mục): Business Case, Organization, Quality, Plans, Risk, Change, Progress. Processes: Starting up a Project, Directing a Project, Initiating a Project, Controlling a Stage, Managing Product Delivery, Managing a Stage Boundary, Closing a Project. Themes là các khía cạnh phải quản lý liên tục; processes mô tả ai làm gì theo trình tự, từ trước khi khởi động đến khi đóng dự án.", "t": ""}, {"n": 193, "c": 2, "g": "2.10", "q": "Management by exception và tolerances trong PRINCE2 vận hành thế nào?", "a": "Project Board đặt tolerance (dung sai cho phép) cho PM theo các khía cạnh time, cost, scope, quality, risk, benefits — vd stage này ±10% chi phí, ±1 tuần (tham khảo). Trong dung sai, PM tự quyết và chỉ báo cáo định kỳ (Highlight Report); khi **dự báo** vượt dung sai, PM lập Exception Report trình Board, Board quyết định chấp nhận, yêu cầu Exception Plan hay dừng dự án. Cơ chế này giúp lãnh đạo không phải quản lý vi mô mà vẫn kiểm soát được.", "t": "Chữ quan trọng là \"dự báo vượt\" — escalate khi thấy xu hướng, không đợi vượt rồi mới báo."}, {"n": 194, "c": 2, "g": "2.10", "q": "Tổ chức dự án PRINCE2 gồm những vai trò nào? Ánh xạ sang dự án outsourcing với khách Nhật ra sao?", "a": "Project Board gồm Executive (chịu trách nhiệm business case, quyết định cuối), Senior User (đại diện người dùng), Senior Supplier (đại diện bên cung cấp); bên dưới là Project Manager, Team Manager, Project Assurance, Project Support. Ánh xạ tham khảo: Executive = sponsor phía khách; Senior User = trưởng bộ phận nghiệp vụ của khách; Senior Supplier = lãnh đạo delivery phía vendor; Team Manager = team leader offshore; Assurance = QA độc lập hoặc PMO.", "t": ""}, {"n": 195, "c": 2, "g": "2.10", "q": "PRINCE2 khác PMBOK ở điểm cơ bản nào? Có dùng chung được không?", "a": "PMBOK là **bộ hướng dẫn kiến thức**: mô tả cần quản lý gì và kỹ thuật nào (EVM, CPM, quản lý stakeholder), không áp đặt vai trò cụ thể. PRINCE2 là **phương pháp có quy định** rõ vai trò, quy trình, tài liệu quản lý và cơ chế stage/tolerance. Dùng chung rất tốt: PRINCE2 cho khung quản trị (ai quyết, khi nào), PMBOK cho kỹ thuật (lập lịch, chi phí, rủi ro) — em thường lấy stage gate + tolerance của PRINCE2 và EVM/CPM của PMBOK.", "t": ""}, {"n": 196, "c": 2, "g": "2.10", "q": "Câu kiểu đề PMP: Một thành viên báo rằng khách nhờ thêm một tính năng nhỏ và bạn ấy đã làm xong. PM nên làm gì đầu tiên?", "a": "Không phạt thành viên, cũng chưa đưa thẳng lên CCB; trước hết **đánh giá tác động** của thay đổi đã làm (phạm vi, tiến độ, chất lượng, hợp đồng). Sau đó đưa vào change control để được duyệt hoặc gỡ ra, cập nhật tài liệu và nhắc lại quy trình với team. Logic đề PMP: phát hiện thay đổi → phân tích tác động → quy trình chính thức → cập nhật kế hoạch → truyền thông.", "t": "Trong đề PMP, đáp án \"phân tích tác động trước\" gần như luôn thắng các đáp án hành động ngay khi chưa có thông tin."}, {"n": 197, "c": 2, "g": "2.10", "q": "Câu kiểu đề PMP: Giữa dự án, một rủi ro chưa có trong register đã xảy ra. PM làm gì trước tiên?", "a": "Rủi ro chưa nhận diện mà đã xảy ra thì là issue: PM áp dụng **workaround** để khống chế tác động, ghi vào issue log, sau đó phân tích nguyên nhân, cập nhật risk register (rủi ro tương tự có thể còn) và xem lại cách nhận diện rủi ro. Tác động vượt thẩm quyền thì escalate. Khác với rủi ro đã nhận diện: khi đó bước đầu tiên là kích hoạt kế hoạch ứng phó đã chuẩn bị.", "t": ""}, {"n": 198, "c": 2, "g": "2.10", "q": "Câu kiểu đề PMP: Giữa dự án, khách cử một trưởng phòng mới làm người duyệt nghiệm thu. PM nên làm gì trước tiên?", "a": "Trước tiên **cập nhật stakeholder register** và phân tích người này: quyền hạn, kỳ vọng, mức quan tâm, yêu cầu riêng. Sau đó gặp trực tiếp để giới thiệu dự án, xác nhận lại tiêu chí nghiệm thu và các quyết định đã chốt, rồi cập nhật communication plan. Đừng mặc định người mới chấp nhận mọi thỏa thuận cũ — khả năng họ mở lại yêu cầu đã chốt phải đưa vào risk register.", "t": "Trong đề PMP, stakeholder mới xuất hiện → đáp án thường là \"cập nhật stakeholder register và phân tích\" trước mọi hành động khác."}, {"n": 199, "c": 2, "g": "2.10", "q": "Câu kiểu đề PMP: Sponsor yêu cầu rút ngắn 2 tuần nhưng không tăng ngân sách, không giảm phạm vi. PM xử lý thế nào?", "a": "Xét fast-tracking trên critical path trước (không tốn thêm tiền nhưng tăng rủi ro làm lại) và phân bổ lại nguồn lực trong team, rồi trình sponsor phân tích: rút được bao nhiêu ngày, kèm rủi ro gì. Nếu không đủ 2 tuần, đưa các phương án trade-off: crash với chi phí X, hoãn phạm vi Y sang release sau, hoặc chấp nhận rủi ro Z. PM không tự ý cắt test hay nhận bừa — sponsor quyết định dựa trên dữ liệu, mọi lựa chọn được ghi lại.", "t": "Đề PMP ưu tiên \"phân tích và đưa phương án cho sponsor\", không phải \"từ chối\" hay \"đồng ý rồi bắt team OT\"."}, {"n": 200, "c": 2, "g": "2.10", "q": "PMP, PRINCE2, PMI-ACP, PSM/CSM khác nhau thế nào và có giá trị gì với Senior PM outsourcing?", "a": "PMP (PMI) bao quát quản lý dự án cả predictive, agile và hybrid; PRINCE2 là phương pháp quản trị theo stage, phổ biến ở Anh và châu Âu; PMI-ACP tập trung vào agile; PSM (Scrum.org) và CSM (Scrum Alliance) chuyên về vai trò Scrum Master. Giá trị thực tế: tạo ngôn ngữ chung với khách và đồng nghiệp, tăng độ tin cậy trong proposal, nhưng không thay được kinh nghiệm xử lý tình huống thật. Lộ trình hợp lý: PMP làm nền, thêm PSM hoặc PMI-ACP nếu làm nhiều dự án agile.", "t": "JD ghi ưu tiên các chứng chỉ này và công ty hỗ trợ thi PMP — nếu chưa có, hãy nêu kế hoạch học và thi cụ thể thay vì né câu hỏi."}, {"n": 201, "c": 3, "g": "3.1", "q": "Hãy mô tả chuỗi 工程 của một dự án waterfall kiểu Nhật từ đầu đến cuối.", "a": "Chuỗi 工程 (koutei – công đoạn) chuẩn: 要件定義 (youken teigi – định nghĩa yêu cầu) → 基本設計 (kihon sekkei – thiết kế cơ bản) → 詳細設計 (shousai sekkei – thiết kế chi tiết) → 製造 (seizou – lập trình) → 単体テスト (tantai tesuto – unit test) → 結合テスト (ketsugou tesuto – integration test) → 総合テスト (sougou tesuto – system test) → 受入テスト (ukeire tesuto – acceptance test). Mỗi 工程 kết thúc bằng review và phê duyệt 成果物 (seikabutsu – sản phẩm bàn giao) rồi mới sang bước sau. Tên gọi tùy công ty nên em chốt bảng 工程 với khách ngay kickoff.", "t": ""}, {"n": 202, "c": 3, "g": "3.1", "q": "V-model ánh xạ các 工程 thiết kế với các mức test như thế nào?", "a": "Nhánh trái là thiết kế, nhánh phải là test kiểm chứng tương ứng: 要件定義 ↔ 受入テスト, 基本設計 ↔ 総合テスト, 詳細設計 ↔ 結合テスト, 製造 ↔ 単体テスト. Ý nghĩa thực tế: test case mức nào viết dựa trên tài liệu thiết kế mức đó, và test viewpoint nên lập ngay khi thiết kế xong chứ không đợi code. Một số công ty ghép khác (vd 基本設計 ↔ 結合テスト), nên em xác nhận mapping trong kế hoạch test từ đầu.", "t": "Bẫy: nói \"unit test viết từ tài liệu yêu cầu\" là sai tầng — interviewer quen V-model sẽ bắt ngay."}, {"n": 203, "c": 3, "g": "3.1", "q": "上流工程 và 下流工程 khác nhau thế nào, offshore Việt Nam thường nhận phần nào?", "a": "`上流工程` (jouryuu koutei – công đoạn thượng nguồn) gồm 要件定義, 基本設計: xác định \"làm gì\", cần hiểu nghiệp vụ và làm trực tiếp với khách. `下流工程` (karyuu koutei – hạ nguồn) gồm 詳細設計 → 製造 → test: \"làm thế nào\". Offshore truyền thống nhận từ 詳細設計 đến 結合テスト, onsite và BrSE (Bridge System Engineer – kỹ sư cầu nối) giữ 基本設計. Muốn lên thượng nguồn để tăng giá trị, Senior PM cần lộ trình năng lực: domain, tiếng Nhật, BrSE.", "t": "Nói được \"muốn nhận 上流 thì phải chứng minh bằng chất lượng 下流 trước\" thể hiện tư duy chiến lược."}, {"n": 204, "c": 3, "g": "3.1", "q": "手戻り là gì và vì sao trong waterfall nó đắt?", "a": "`手戻り` (temodori – làm lại do lỗi từ công đoạn trước) xảy ra khi lỗi yêu cầu/thiết kế đến lúc test mới lộ ra, buộc quay lại sửa tài liệu, code, test case rồi test lại. Phát hiện càng muộn càng đắt vì phải đi ngược qua nhiều 工程 và nhiều 成果物 đã phê duyệt. Cách giảm: review chéo tài liệu, Q&A sớm với khách, prototype màn hình quan trọng và exit criteria rõ cho mỗi 工程.", "t": ""}, {"n": 205, "c": 3, "g": "3.1", "q": "Khi nào waterfall vẫn là lựa chọn đúng?", "a": "Waterfall hợp khi ① yêu cầu ổn định, có quy định rõ (hệ thống lõi ngân hàng, bảo hiểm, kế toán), ② chi phí sai cao và cần audit trail tài liệu, ③ hợp đồng 請負 (ukeoi – khoán theo kết quả) giá cố định với phạm vi chốt, ④ tích hợp nhiều hệ thống cần lịch test liên kết cố định, ⑤ thay thế hệ thống cũ với spec \"như hiện trạng\". Tiêu chí em dùng: độ bất định yêu cầu thấp và chi phí thay đổi muộn cao → waterfall; ngược lại → agile hoặc hybrid.", "t": "Đừng chê waterfall — nhiều khách tài chính Nhật vẫn chạy waterfall; trả lời \"chọn theo bối cảnh, có tiêu chí\" chín chắn hơn."}, {"n": 206, "c": 3, "g": "3.1", "q": "Exit criteria của một 工程 thường gồm những gì?", "a": "Tối thiểu: ① 成果物 hoàn thành theo danh sách đã thống nhất, ② review xong và mọi 指摘 (shiteki – điểm bị chỉ ra khi review) đã đóng hoặc có kế hoạch xử lý, ③ Q&A với khách không còn câu mở ảnh hưởng 工程 sau, ④ chỉ số chất lượng đạt ngưỡng thỏa thuận, ⑤ khách phê duyệt. Em đặt checklist này thành gate trong kế hoạch, không \"trượt\" sang 工程 sau khi chưa đạt, trừ khi rủi ro được chấp nhận bằng văn bản.", "t": ""}, {"n": 207, "c": 3, "g": "3.1", "q": "Waterfall có thể chạy chồng lấn các 工程 không? Rủi ro gì?", "a": "Có, thường gọi là overlapping: bắt đầu 詳細設計 module A khi 基本設計 module B chưa xong, hoặc chia phase theo module. Lợi ích là rút ngắn lịch; rủi ro là thay đổi thượng nguồn lan xuống và 手戻り nhân lên. Em chỉ cho chồng lấn khi phần thượng nguồn của chính module đó đã được phê duyệt, ghi giả định vào risk register và giữ khoảng 5–10% effort dự phòng cho 手戻り (tham khảo).", "t": ""}, {"n": 208, "c": 3, "g": "3.1", "q": "Trong waterfall, làm sao phát hiện sớm lỗi yêu cầu trước khi code?", "a": "① Prototype/mock màn hình và luồng chính ngay trong 基本設計 để khách \"thấy\" thay vì chỉ đọc tài liệu, ② walkthrough tài liệu với khách theo checklist, ③ viết test viewpoint của 総合テスト song song 基本設計 — không viết được test nghĩa là yêu cầu chưa rõ, ④ làm spike kỹ thuật cho phần rủi ro như tích hợp, hiệu năng. Đây là cách đưa vòng phản hồi ngắn vào waterfall mà không phá cấu trúc 工程.", "t": ""}, {"n": 209, "c": 3, "g": "3.1", "q": "Waterfall và V-model khác nhau thế nào? Có phải hai mô hình riêng?", "a": "V-model là biến thể của waterfall, nhấn mạnh mỗi mức thiết kế có một mức test kiểm chứng tương ứng. Waterfall thuần chỉ nói thứ tự tuần tự; V-model nói thêm \"test được lập kế hoạch từ lúc thiết kế\" và phân biệt verification với validation. Ở dự án Nhật, khi khách nói ウォーターフォール (waterfall) gần như luôn ngầm hiểu theo V-model với đủ 単体, 結合, 総合, 受入.", "t": ""}, {"n": 210, "c": 3, "g": "3.1", "q": "Offshore làm đến 結合テスト, khách tự làm 総合テスト nhưng lại tính bug lọt cho offshore. PM xử lý ranh giới trách nhiệm thế nào?", "a": "① Chốt bằng văn bản phạm vi từng 工程 và định nghĩa \"bug lọt\"; ② thống nhất tiêu chí bàn giao 結合テスト (số case, độ phủ viewpoint, bug còn mở) mà khách đồng ý; ③ khi bug phát sinh ở 総合テスト, phân loại nguồn gốc — lỗi spec/thiết kế phía khách hay lỗi chế tạo offshore — chứ không nhận hết; ④ với bug của mình: phân tích nguyên nhân, 再発防止 (saihatsu boushi – phòng ngừa tái phát) và 横展開 (yokotenkai – áp dụng sang chỗ tương tự).", "t": "Nhận nhanh và rõ phần lỗi của mình — khách Nhật đánh giá thái độ này cao hơn việc tranh luận đúng sai."}, {"n": 211, "c": 3, "g": "3.2", "q": "Scrum có những thành phần nào theo Scrum Guide 2020?", "a": "Cấu trúc \"3-5-3\": ① 3 accountabilities: Product Owner, Scrum Master, Developers; ② 5 events: Sprint (chứa các event khác), Sprint Planning, Daily Scrum, Sprint Review, Sprint Retrospective; ③ 3 artifacts kèm commitment: Product Backlog → Product Goal, Sprint Backlog → Sprint Goal, Increment → Definition of Done. Nền tảng là empiricism (transparency, inspection, adaptation) và lean thinking.", "t": "Dùng đúng từ \"accountabilities\", \"Developers\" (không phải \"roles\", \"Development Team\") cho thấy bạn cập nhật bản 2020."}, {"n": 212, "c": 3, "g": "3.2", "q": "Ba commitment Product Goal, Sprint Goal, DoD có tác dụng gì?", "a": "Mỗi commitment cho artifact một thước đo tiến độ: Product Goal là mục tiêu dài hạn mà Product Backlog hướng tới; Sprint Goal là lý do tồn tại của sprint, giúp team linh hoạt đổi item mà vẫn giữ cam kết; DoD định nghĩa khi nào item đủ chất lượng để thành Increment. Ở dự án outsource em hay gặp sprint thiếu Sprint Goal — sprint thành \"danh sách ticket\" và khách chỉ đếm số ticket xong.", "t": ""}, {"n": 213, "c": 3, "g": "3.2", "q": "Timebox của các event Scrum là bao nhiêu?", "a": "Với sprint 1 tháng: Sprint ≤ 1 tháng, Sprint Planning tối đa 8 giờ, Daily Scrum 15 phút, Sprint Review tối đa 4 giờ, Sprint Retrospective tối đa 3 giờ; sprint ngắn hơn thì các event thường ngắn hơn. Refinement không phải event; Scrum Guide bản cũ gợi ý không quá 10% capacity. Với khách Nhật, em đặt lịch review cố định cùng thứ, cùng giờ để khách dễ xếp lịch nội bộ.", "t": "Bẫy PSM: \"refinement là event\" — sai, đó là hoạt động liên tục."}, {"n": 214, "c": 3, "g": "3.2", "q": "Sprint Planning trả lời những câu hỏi nào?", "a": "Ba chủ đề: ① Why – sprint này mang lại giá trị gì, team cùng PO chốt Sprint Goal; ② What – chọn item từ Product Backlog đủ để đạt goal, dựa trên capacity và hiệu suất quá khứ; ③ How – Developers tách item thành việc nhỏ, thường ≤ 1 ngày. Output là Sprint Backlog gồm Sprint Goal, item đã chọn và kế hoạch thực hiện. Ở offshore, em yêu cầu PO hoặc proxy PO có mặt ít nhất phần Why–What.", "t": ""}, {"n": 215, "c": 3, "g": "3.2", "q": "Daily Scrum đúng nghĩa khác gì một buổi báo cáo tiến độ?", "a": "Daily Scrum là buổi Developers tự inspect tiến độ hướng tới Sprint Goal và điều chỉnh kế hoạch cho 24 giờ tới, không phải báo cáo cho PM hay khách. Scrum Guide 2020 bỏ bắt buộc 3 câu hỏi; team tự chọn cấu trúc, miễn 15 phút và xoay quanh goal. Dấu hiệu sai: mọi người nhìn PM khi nói, hoặc thảo luận kỹ thuật kéo dài — em tách phần đó ra buổi ngắn ngay sau daily.", "t": ""}, {"n": 216, "c": 3, "g": "3.2", "q": "Sprint Review có phải buổi khách nghiệm thu không?", "a": "Không. Sprint Review là buổi làm việc để inspect Increment và điều chỉnh Product Backlog cùng stakeholder, không phải gate phê duyệt; release có thể diễn ra bất cứ lúc nào trong sprint. Tuy vậy với khách Nhật, em vẫn ghi 議事録 (gijiroku – biên bản họp): feedback, item được chấp nhận theo DoD/AC, item quay về backlog — làm bằng chứng tiến độ cho 検収 (kenshuu – nghiệm thu) theo hợp đồng khi cần.", "t": ""}, {"n": 217, "c": 3, "g": "3.2", "q": "Ai có quyền hủy sprint và khi nào nên hủy?", "a": "Chỉ Product Owner có quyền hủy sprint, khi Sprint Goal trở nên lỗi thời — vd khách đổi chiến lược hay dừng tính năng. Hủy sprint tốn kém: item đã Done được review, phần còn lại quay về Product Backlog và lên kế hoạch lại. Thực tế em ưu tiên cùng PO đàm phán lại phạm vi trong sprint, giữ Sprint Goal nếu còn ý nghĩa; hủy là lựa chọn cuối.", "t": "Bẫy PSM: Scrum Master hoặc stakeholder \"hủy sprint\" — sai, chỉ PO có quyền này."}, {"n": 218, "c": 3, "g": "3.2", "q": "Definition of Ready (DoR) có trong Scrum Guide không? Có nên dùng?", "a": "DoR không có trong Scrum Guide, đó là practice bổ sung. Nó hữu ích ở outsourcing vì chênh lệch ngôn ngữ: item chỉ vào sprint khi có user story rõ, AC đo được, mockup/API spec, dependency đã xử lý, Q&A với khách đã đóng và đã estimate. Rủi ro: DoR quá cứng biến thành mini-waterfall và chặn dòng chảy; em giữ DoR 5–7 mục, PO có thể nhận item chưa đủ nếu ghi rõ giả định.", "t": ""}, {"n": 219, "c": 3, "g": "3.2", "q": "DoD nên có gì trong dự án outsource cho khách Nhật?", "a": "DoD là tiêu chuẩn chất lượng áp cho mọi item: code review xong, unit test pass và đạt coverage thỏa thuận, không còn bug mức cao, test đủ theo AC, merge vào nhánh chính và deploy được lên staging, tài liệu liên quan đã cập nhật. Với khách Nhật, em thêm mục \"đã cập nhật 設計書 (sekkeisho – tài liệu thiết kế) tiếng Nhật\" nếu hợp đồng yêu cầu, vì đây là thứ hay bị bỏ quên nhất.", "t": "Phân biệt rõ DoD (chung cho mọi item) với AC (riêng từng story) — câu PSM rất hay gặp."}, {"n": 220, "c": 3, "g": "3.2", "q": "Product Backlog refinement diễn ra thế nào khi PO ở Nhật, team ở Đà Nẵng?", "a": "Em làm 2 lớp: ① BA/BrSE phía offshore chuẩn bị trước — tách story, viết AC, liệt kê câu hỏi tiếng Nhật trong bảng Q&A; ② buổi refinement online 45–60 phút mỗi tuần với PO để chốt câu hỏi và ưu tiên, team estimate ngay sau đó. Mục tiêu là luôn có backlog \"ready\" cho 1–2 sprint tới. Câu hỏi chưa được trả lời quá 2 ngày làm việc thì em escalate vì sẽ chặn sprint sau.", "t": ""}, {"n": 221, "c": 3, "g": "3.2", "q": "Scrum Team nên có bao nhiêu người? Team offshore 15 người có nên là một Scrum Team?", "a": "Scrum Guide 2020 khuyến nghị Scrum Team thường từ 10 người trở xuống. Với 15 người, Daily khó giữ 15 phút và kênh giao tiếp tăng mạnh; em tách 2 team theo feature/domain (không tách theo FE/BE), dùng chung một Product Backlog và một PO, đồng bộ qua refinement chung và Scrum of Scrums. Mỗi team phải đủ kỹ năng để tự làm ra Increment.", "t": ""}, {"n": 222, "c": 3, "g": "3.2", "q": "Scrum Guide 2020 thay đổi gì so với bản trước mà PM nên biết?", "a": "Những điểm chính: ① bỏ \"Development Team\", chỉ còn Developers trong một Scrum Team; ② thêm Product Goal; ③ mỗi artifact có commitment; ④ dùng \"accountabilities\" thay \"roles\", \"self-managing\" thay \"self-organizing\"; ⑤ bỏ 3 câu hỏi Daily, Sprint Planning thêm chủ đề Why; ⑥ Scrum Master là \"true leaders who serve\" thay \"servant leader\"; ⑦ ngôn ngữ bớt IT, dùng được ngoài phần mềm. Câu hỏi bẫy khi thi PSM hay xoáy vào ①②⑤.", "t": ""}, {"n": 223, "c": 3, "g": "3.3", "q": "Scrum không có vai trò PM. Vậy Senior PM ở công ty outsourcing làm gì khi dự án chạy Scrum?", "a": "Scrum Team không có PM, nhưng hợp đồng outsource vẫn cần người chịu trách nhiệm thương mại: ngân sách, hợp đồng, nhân sự, rủi ro cấp dự án, báo cáo cho khách và ban lãnh đạo. Em đứng ngoài Scrum Team ở tầng delivery: bảo vệ team khỏi yêu cầu ngoài luồng, quản lý capacity, quản lý thay đổi hợp đồng, đảm bảo SM và proxy PO làm được việc. Dự án nhỏ em có thể kiêm SM nhưng phải tách bạch lúc nào đang ở vai SM.", "t": "Đừng nói \"PM chính là Scrum Master\" — interviewer muốn thấy bạn hiểu khác biệt nhưng vẫn thực dụng."}, {"n": 224, "c": 3, "g": "3.3", "q": "Khách Nhật làm PO được không? Thực tế thường gặp vấn đề gì?", "a": "Được, và là lý tưởng vì khách nắm nghiệp vụ và ưu tiên. Vấn đề hay gặp: ① PO là người kiêm nhiệm, ít thời gian; ② quyết định cần 稟議 (ringi – trình duyệt nội bộ) nên chậm; ③ rào cản ngôn ngữ; ④ PO quen viết spec chi tiết hơn là sắp ưu tiên theo giá trị. Cách làm: lịch refinement/review cố định, SLA trả lời Q&A, proxy PO phía offshore chuẩn bị backlog, và thống nhất quyết định nào PO tự chốt, quyết định nào phải trình cấp trên.", "t": ""}, {"n": 225, "c": 3, "g": "3.3", "q": "Proxy PO phía offshore là gì, rủi ro và cách kiểm soát?", "a": "Proxy PO là người phía offshore (thường BrSE hoặc BA) đại diện PO hằng ngày: làm rõ yêu cầu, viết story/AC, trả lời câu hỏi của team trong phạm vi được ủy quyền. Rủi ro: tự quyết thay khách, đoán nghiệp vụ, thành điểm nghẽn. Kiểm soát: ① ma trận ủy quyền bằng văn bản (được quyết gì, phải hỏi gì), ② mọi quyết định ghi log để khách xem lại hằng tuần, ③ ưu tiên và chấp nhận cuối cùng vẫn thuộc PO thật.", "t": "Câu \"proxy PO không sở hữu ưu tiên, chỉ sở hữu sự rõ ràng của yêu cầu\" rất đáng nói."}, {"n": 226, "c": 3, "g": "3.3", "q": "BrSE có nên kiêm proxy PO hay Scrum Master không?", "a": "BrSE kiêm proxy PO là hợp lý vì đã nắm nghiệp vụ, ngôn ngữ và là đầu mối với khách; nhưng phải giới hạn tải để không thành nút thắt, vd một BrSE phục vụ tốt khoảng một team 5–8 người (tham khảo). BrSE kiêm Scrum Master thì em hạn chế vì xung đột vai: BrSE đại diện yêu cầu, SM bảo vệ quy trình và team; khi áp lực, BrSE thường nghiêng về khách. Bắt buộc kiêm thì em nói rõ ở kickoff và theo dõi qua retro.", "t": ""}, {"n": 227, "c": 3, "g": "3.3", "q": "Scrum Master khác PM truyền thống ở điểm cốt lõi nào?", "a": "PM truyền thống lập kế hoạch, giao việc và điều phối; Scrum Master không giao việc mà phục vụ: coaching team tự quản, gỡ impediment, giúp PO quản backlog hiệu quả, giúp tổ chức hiểu và áp dụng Scrum. Thước đo của SM là team tự vận hành tốt hơn, không phải SM bận hơn. Khi chuyển từ PM sang SM, điều khó nhất là im lặng để team tự ra quyết định trong daily thay vì chỉ đạo.", "t": ""}, {"n": 228, "c": 3, "g": "3.3", "q": "Mô hình ラボ型 và mô hình 請負 phân vai PO/SM/PM khác nhau ra sao?", "a": "`ラボ型開発` (rabo-gata kaihatsu – team chuyên trách thuê theo tháng): khách thường giữ PO, offshore cung cấp team và SM, PM offshore lo capacity, chất lượng, nhân sự; phạm vi linh hoạt nên Scrum chạy tự nhiên. 請負 theo dự án: offshore chịu trách nhiệm kết quả nên PM offshore phải nắm chặt phạm vi, thay đổi và nghiệm thu; PO phía khách vẫn sắp ưu tiên nhưng trong khung phạm vi hợp đồng. Điều khoản hợp đồng chi tiết thuộc phần hợp đồng, ở đây chỉ là phân vai.", "t": ""}, {"n": 229, "c": 3, "g": "3.3", "q": "Khách dự Sprint Review nhưng không bao giờ tham gia refinement. Bạn làm gì?", "a": "① Xác nhận nguyên nhân: thiếu thời gian, chưa hiểu mục đích, hay nghĩ đó là việc của vendor; ② đề xuất định dạng nhẹ: 30 phút, gửi trước câu hỏi tiếng Nhật, PO chỉ chốt ưu tiên và trả lời câu đóng/mở; ③ cho khách thấy chi phí của việc vắng mặt bằng dữ liệu (số item bị chặn, số 手戻り sau review); ④ nếu vẫn không được, thỏa thuận proxy PO chuẩn bị và khách duyệt bất đồng bộ trong 2 ngày làm việc.", "t": "Số liệu của chính dự án (\"3 item bị đẩy sang sprint sau vì chưa có trả lời\") thuyết phục khách Nhật hơn lý thuyết agile."}, {"n": 230, "c": 3, "g": "3.3", "q": "Ai chịu trách nhiệm chất lượng trong Scrum Team — SM, PM hay QA?", "a": "Theo Scrum, Developers chịu trách nhiệm chất lượng Increment theo DoD, cả team cùng sở hữu; QA là một kỹ năng trong team chứ không phải trạm kiểm cuối dây chuyền. Về hợp đồng, PM phía offshore vẫn chịu trách nhiệm cuối cùng với khách về chất lượng bàn giao. Em kết hợp hai lớp: team sở hữu chất lượng hằng ngày qua DoD, PM sở hữu quy trình QA và chỉ số chất lượng ở cấp dự án.", "t": ""}, {"n": 231, "c": 3, "g": "3.3", "q": "Senior PM phụ trách 3 dự án Scrum cùng lúc thì nên tham gia event nào?", "a": "Em không dự mọi event của 3 team. Ưu tiên: ① Sprint Review — thấy kết quả thật và gặp khách; ② phần Why–What của Sprint Planning khi có rủi ro phạm vi; ③ đọc kết quả và action retro thay vì ngồi dự, để team nói thật. Daily để SM lo; em theo dõi qua board, burndown và chỉ can thiệp khi chỉ báo lệch ngưỡng, vd Sprint Goal có nguy cơ trượt từ giữa sprint. Thời gian còn lại dành cho khách, nhân sự và rủi ro cấp dự án.", "t": ""}, {"n": 232, "c": 3, "g": "3.4", "q": "Kanban khác Scrum ở những điểm chính nào?", "a": "Kanban không có sprint, vai trò hay event bắt buộc; nó tập trung vào dòng chảy liên tục: trực quan hóa workflow, giới hạn WIP, quản lý và cải tiến flow bằng số liệu. Scrum cam kết theo sprint với Sprint Goal; Kanban kéo việc mới khi có chỗ trống. Scrum hay đo velocity, Kanban đo WIP, cycle time, throughput, work item age. Hai cách kết hợp được, vd Scrum dùng board có WIP limit.", "t": ""}, {"n": 233, "c": 3, "g": "3.4", "q": "WIP limit là gì và đặt bao nhiêu là hợp lý?", "a": "WIP limit là số việc tối đa được nằm trong một cột/trạng thái cùng lúc; chạm giới hạn thì phải hoàn thành việc đang dở trước khi kéo việc mới (\"stop starting, start finishing\"). Điểm khởi đầu tham khảo: bằng hoặc ít hơn số người làm cột đó, rồi điều chỉnh theo dữ liệu — vd nghẽn ở review thì hạ WIP cột dev. Mục đích là làm lộ bottleneck và giảm chuyển đổi ngữ cảnh.", "t": "Nói \"WIP limit làm lộ vấn đề chứ không tự giải quyết vấn đề\" cho thấy bạn hiểu bản chất."}, {"n": 234, "c": 3, "g": "3.4", "q": "Phân biệt lead time và cycle time.", "a": "Lead time: từ khi yêu cầu được tạo hoặc cam kết đến khi giao cho khách — là thời gian khách cảm nhận. Cycle time: từ khi bắt đầu làm đến khi xong — phản ánh hiệu năng nội bộ team. Hai số chênh lớn nghĩa là việc nằm chờ lâu trong hàng đợi. Điểm bắt đầu/kết thúc phải thống nhất trước khi đo, nhất là với ticket 障害 (shougai – sự cố) có cam kết SLA với khách.", "t": ""}, {"n": 235, "c": 3, "g": "3.4", "q": "Định luật Little nói gì và PM dùng nó thế nào?", "a": "Little's Law (với hệ ổn định): cycle time trung bình = WIP trung bình / throughput trung bình. Ví dụ team có 20 việc dở, mỗi tuần xong 10 việc → mỗi việc trung bình mất khoảng 2 tuần. Muốn giảm cycle time mà không thêm người thì phải giảm WIP. Em dùng nó để giải thích với khách vì sao liên tục chèn việc gấp vào hàng làm mọi việc khác chậm lại.", "t": "Minh họa bằng con số đơn giản giúp khách chưa quen agile hiểu ngay — đừng chỉ đọc công thức."}, {"n": 236, "c": 3, "g": "3.4", "q": "Cumulative Flow Diagram (CFD) đọc như thế nào?", "a": "CFD xếp chồng số lượng việc theo từng trạng thái theo thời gian. Khoảng cách dọc giữa các dải ≈ WIP tại thời điểm đó; khoảng cách ngang ≈ thời gian việc đi qua các trạng thái; độ dốc dải Done ≈ throughput. Dấu hiệu xấu: một dải phình to (bottleneck ở trạng thái đó), dải Done đi ngang (không giao được gì), tất cả dải cùng đi ngang (team bị chặn).", "t": ""}, {"n": 237, "c": 3, "g": "3.4", "q": "Khi nào nên chọn Kanban thay Scrum trong dự án Nhật?", "a": "Kanban hợp với 保守運用 (hoshu unyou – bảo trì, vận hành): việc đến không đoán trước (sự cố, yêu cầu nhỏ, câu hỏi), ưu tiên đổi hằng ngày, có SLA phản hồi. Scrum hợp với phát triển tính năng mới cần mục tiêu theo chu kỳ. Nhiều team em chọn kết hợp: Scrum cho phát triển, cộng một làn expedite kiểu Kanban riêng cho 障害 với WIP 1–2 để không phá sprint.", "t": ""}, {"n": 238, "c": 3, "g": "3.4", "q": "Thiết kế classes of service cho team 保守 của khách sản xuất C như thế nào?", "a": "Em chia 3–4 lớp theo chi phí của sự chậm trễ: ① Expedite – sự cố ảnh hưởng dây chuyền sản xuất, vượt hàng chờ, WIP 1; ② Fixed date – thay đổi theo hạn pháp lý/kế toán, ưu tiên theo hạn; ③ Standard – cải tiến thông thường, vào trước làm trước; ④ Intangible – nợ kỹ thuật, nâng version thư viện, giữ tỉ lệ cố định khoảng 10–20% capacity (tham khảo). Mỗi lớp có SLA phản hồi/xử lý thống nhất với khách và đo hằng tháng.", "t": "Nhắc \"phân bổ cố định cho intangible\" cho thấy bạn nghĩ đến sức khỏe hệ thống dài hạn, không chỉ chạy theo ticket."}, {"n": 239, "c": 3, "g": "3.4", "q": "Throughput và work item age dùng để dự báo như thế nào?", "a": "Throughput (số việc xong mỗi tuần) cho phép dự báo \"khi nào xong N việc\" theo xác suất thay vì một ngày cứng, vd lấy dữ liệu 8–12 tuần gần nhất chạy Monte Carlo ra \"85% khả năng xong trước ngày X\". Work item age (việc đang làm đã bao lâu) là chỉ báo sớm: việc nào có tuổi vượt mốc cycle time phân vị 85% trong lịch sử thì SM/PM xem ngay. Dự báo kèm xác suất rất hợp với khách cần minh bạch.", "t": ""}, {"n": 240, "c": 3, "g": "3.4", "q": "Team chuyển sang Kanban, khách lo lắng vì \"không còn deadline\". Bạn xử lý sao?", "a": "① Xác nhận lo lắng cụ thể: khách cần ngày cho release hay cho báo cáo nội bộ; ② bổ sung nhịp: replenishment hằng tuần để khách chọn ưu tiên, demo 2 tuần/lần, báo cáo tháng; ③ cam kết bằng SLA theo class of service và dự báo xác suất từ throughput; ④ việc có hạn cố định đưa vào lớp fixed date. Kanban không bỏ cam kết — nó chuyển cam kết từ \"danh sách việc\" sang \"mức dịch vụ đo được\".", "t": ""}, {"n": 241, "c": 3, "g": "3.5", "q": "Story point là gì và vì sao không nên quy đổi thẳng ra giờ?", "a": "Story point là đơn vị tương đối đo độ lớn của item — gộp khối lượng, độ phức tạp và độ không chắc chắn — so với một story chuẩn của team. Quy đổi cứng \"1 point = 8 giờ\" làm mất lợi ích ước lượng tương đối và sinh áp lực \"thực tế vượt giờ\". Nhưng khách Nhật thường cần 人月 (ningetsu – người-tháng) cho ngân sách; em quy đổi ở cấp release bằng số sprint × chi phí team, không quy đổi từng story.", "t": "Chuẩn bị sẵn cách nói chuyện point ↔ 人月 với khách — đây là câu hỏi thực tế, không chỉ lý thuyết."}, {"n": 242, "c": 3, "g": "3.5", "q": "Planning poker diễn ra thế nào và hay sai ở đâu?", "a": "Mỗi người chọn lá bài theo dãy kiểu Fibonacci (1, 2, 3, 5, 8, 13…), lật cùng lúc; người chọn cao nhất và thấp nhất giải thích, rồi chọn lại đến khi hội tụ. Mục tiêu là làm lộ những cách hiểu khác nhau, không phải ra con số. Lỗi hay gặp: lead/BrSE nói số trước gây neo (anchoring), PM ép số, item quá lớn (≥ 13) không tách, thành viên trẻ ngại phản biện — em để người ít kinh nghiệm giải thích trước.", "t": ""}, {"n": 243, "c": 3, "g": "3.5", "q": "Velocity dùng để làm gì và không được dùng để làm gì?", "a": "Velocity là tổng point Done mỗi sprint, dùng để ① team tự lên kế hoạch sprint, ② PO dự báo release theo khoảng, vd trung bình 3–5 sprint gần nhất kèm min/max. Không dùng để so sánh giữa các team (point mỗi team một thang), đánh giá năng suất cá nhân hay làm KPI ép tăng. Velocity bị biến thành KPI sẽ dẫn đến lạm phát point — số tăng nhưng giá trị giao không đổi.", "t": "Nhắc định luật Goodhart (chỉ số thành mục tiêu thì mất giá trị đo) là điểm cộng ở câu này."}, {"n": 244, "c": 3, "g": "3.5", "q": "Ban lãnh đạo muốn so sánh velocity giữa 3 team offshore để đánh giá. Bạn phản hồi thế nào?", "a": "Em giải thích velocity là thước đo nội bộ: point của team A không cùng đơn vị với team B, so sánh sẽ kéo theo lạm phát point và hành vi đối phó. Em đề xuất bộ chỉ số so sánh được: ① tỉ lệ đạt Sprint Goal, ② lead time cho cùng loại việc, ③ chất lượng — bug lọt sau release, 手戻り, ④ mức hài lòng khách qua khảo sát định kỳ. Lãnh đạo cần quản lý; việc của PM là đưa đúng thước đo, không chỉ nói \"không\".", "t": ""}, {"n": 245, "c": 3, "g": "3.5", "q": "Burndown và burnup khác nhau thế nào? Khi nào nên dùng burnup?", "a": "Burndown cho thấy công việc còn lại giảm dần về 0; đơn giản nhưng khi phạm vi tăng, đường đi ngang và khó biết là team chậm hay việc tăng. Burnup có hai đường: tổng phạm vi và phần đã xong — thấy rõ scope creep. Với khách hay thêm yêu cầu, em dùng burnup cấp release để thảo luận đánh đổi: \"phạm vi tăng 20%, ngày dự báo lùi 2 sprint; muốn giữ ngày thì bỏ item nào?\".", "t": "Burnup là công cụ đàm phán phạm vi rất mạnh — kể một lần bạn đã dùng nó với khách."}, {"n": 246, "c": 3, "g": "3.5", "q": "Predictability (độ tin cậy dự báo) đo như thế nào?", "a": "Cách đơn giản: tỉ lệ point hoặc item Done so với cam kết đầu sprint, và tỉ lệ sprint đạt Sprint Goal. Ngưỡng tham khảo em dùng: ổn định 80–100% là tốt; dưới 70% liên tục là kế hoạch quá lạc quan hoặc bị gián đoạn nhiều; thường xuyên trên 100% là team đang để dự phòng quá dày. Điều quan trọng là xu hướng ổn định, vì khách Nhật đánh giá vendor qua độ tin cậy của lời hứa hơn là tốc độ.", "t": ""}, {"n": 247, "c": 3, "g": "3.5", "q": "Khách yêu cầu \"tăng velocity 20% từ sprint tới\". Bạn trả lời thế nào?", "a": "① Hỏi lại mục tiêu thật: giao tính năng X sớm hơn hay giảm chi phí; ② giải thích velocity tăng theo mệnh lệnh thường chỉ là đổi cách ước lượng hoặc hy sinh chất lượng, sau đó quay lại thành 手戻り; ③ đưa phương án thật: thu hẹp phạm vi theo ưu tiên, gỡ trở ngại (chờ Q&A, môi trường test), thêm người kèm thời gian ramp-up, hoặc tách release; ④ cùng khách theo dõi lead time và tỉ lệ đạt goal thay cho velocity.", "t": ""}, {"n": 248, "c": 3, "g": "3.5", "q": "#NoEstimates là gì? Có áp dụng được cho dự án Nhật không?", "a": "Cách tiếp cận #NoEstimates giảm hoặc bỏ ước lượng từng item, thay bằng tách item về kích thước tương đương rồi đếm số item và dùng throughput để dự báo. Ưu điểm: tiết kiệm thời gian, ít tranh cãi. Với khách Nhật cần 見積 (mitsumori – báo giá/ước lượng) cho ngân sách và 稟議, em không bỏ ước lượng ở cấp hợp đồng; bên trong team có thể dùng đếm item cho 保守 hoặc khi item đã đều cỡ.", "t": ""}, {"n": 249, "c": 3, "g": "3.5", "q": "Làm sao dự báo release khi chưa có velocity (team mới)?", "a": "① Ước velocity ban đầu từ capacity: số người × ngày khả dụng × hệ số tập trung khoảng 60–70% (tham khảo), rồi thử lên kế hoạch sprint đầu xem team nhận được bao nhiêu point; ② tham chiếu dữ liệu team tương tự nếu có; ③ báo khách dự báo dạng khoảng rộng và cam kết thu hẹp sau 3 sprint khi có velocity thật. Em ghi rõ giả định trong kế hoạch để con số đầu tiên không bị coi là lời hứa.", "t": "\"Cone of uncertainty — cam kết thu hẹp khoảng dự báo sau 3 sprint\" vừa trung thực vừa giữ được niềm tin khách."}, {"n": 250, "c": 3, "g": "3.5", "q": "Có nên gán story point cho bug và việc kỹ thuật không?", "a": "Có hai trường phái: ① gán point cho mọi việc để velocity phản ánh tổng capacity; ② không gán cho bug để velocity chỉ phản ánh giá trị mới — bug làm velocity giảm chính là tín hiệu chất lượng. Em chọn theo mục đích dự báo: bug phát sinh đều thì không gán point và dành khoảng 10–15% capacity (tham khảo); việc lớn do khách đổi yêu cầu thì estimate như story để minh bạch chi phí. Quan trọng là nhất quán trong một team.", "t": ""}, {"n": 251, "c": 3, "g": "3.5", "q": "Báo cáo agile hằng tuần cho khách Nhật nên có gì?", "a": "Một trang, tiếng Nhật: ① Sprint Goal và trạng thái 達成 (tassei – đạt)/未達 (mitatsu – chưa đạt) kèm lý do, ② burnup release với ngày dự báo dạng khoảng, ③ chất lượng: bug mới/đóng, bug lọt sau release, ④ rủi ro và việc cần khách quyết, có hạn trả lời, ⑤ thay đổi phạm vi trong tuần. Tránh đưa velocity thô vì khách dễ hiểu thành năng suất. Màu xanh/vàng/đỏ có tiêu chí rõ, vd đỏ khi ngày dự báo lệch quá 1 sprint (tham khảo).", "t": ""}, {"n": 252, "c": 3, "g": "3.6", "q": "Water-Scrum-Fall là gì? Tốt hay xấu?", "a": "Đây là mô hình rất phổ biến: phần đầu kiểu waterfall (要件定義, ngân sách, phê duyệt), phần giữa phát triển theo sprint, phần cuối kiểu waterfall (総合テスト, 受入テスト, release lớn). Nó không xấu nếu có chủ đích, vì hợp với tổ chức cần ngân sách năm và kiểm soát release. Nó xấu khi phần giữa không có feedback của khách và test dồn cuối — chỉ là waterfall đổi tên. Câu em dùng để kiểm: khách có thấy phần mềm chạy được trước 総合テスト không?", "t": "Nói thẳng \"phần lớn dự án Nhật thực tế là hybrid\" cho thấy bạn hiểu thực tiễn, không lý tưởng hóa agile."}, {"n": 253, "c": 3, "g": "3.6", "q": "Làm agile trong hợp đồng 請負 giá cố định như thế nào?", "a": "請負 cố định phạm vi, giá và 納期 (nouki – hạn giao hàng), mâu thuẫn với phạm vi linh hoạt của agile. Cách làm: ① cố định giá và ngày, linh hoạt phạm vi trong khung ưu tiên MoSCoW, Must chiếm khoảng ≤ 60% effort (tham khảo); ② cơ chế đổi item cùng kích thước không tính phát sinh; ③ chia hợp đồng theo release/phase nhỏ; ④ vẫn chạy sprint nội bộ để minh bạch tiến độ dù hợp đồng tính theo 成果物. Điều khoản chi tiết thuộc phần hợp đồng.", "t": ""}, {"n": 254, "c": 3, "g": "3.6", "q": "Khách muốn agile nhưng cần ngân sách và 納期 cố định. Bạn đề xuất mô hình nào?", "a": "Em đề xuất \"cố định thời gian và chi phí, linh hoạt phạm vi\": ① workshop đầu dựng product backlog thô và estimate theo khoảng; ② ngân sách = số sprint × chi phí team, ngày release cố định; ③ nhóm Must được cam kết, Should/Could làm theo khả năng; ④ review 2 tuần/lần để khách đánh đổi phạm vi dựa trên burnup; ⑤ điểm hiệu chỉnh sau 2–3 sprint đầu để cả hai cập nhật dự báo. Khách giữ được ngân sách, team giữ được chất lượng.", "t": ""}, {"n": 255, "c": 3, "g": "3.6", "q": "Hợp đồng 準委任 khác 請負 thế nào khi chạy agile?", "a": "準委任契約 (jun-inin keiyaku – hợp đồng ủy thác, trả theo công sức) không buộc hoàn thành một 成果物 cố định nên hợp tự nhiên với agile và ラボ型; mẫu hợp đồng phát triển agile do IPA Nhật công bố cũng theo hướng 準委任. Rủi ro là khách trả theo tháng nhưng kỳ vọng kết quả như khoán. Em làm rõ bằng văn bản: vendor chịu trách nhiệm thực thi đúng quy trình và chất lượng theo DoD, còn ưu tiên và phạm vi do PO phía khách quyết.", "t": ""}, {"n": 256, "c": 3, "g": "3.6", "q": "Chia release trong dự án hybrid như thế nào để giảm rủi ro?", "a": "① Release 1 là khung xương chạy end-to-end cho luồng nghiệp vụ chính, vd tra cứu hợp đồng của khách bảo hiểm B; ② mỗi release 2–3 tháng, có 総合テスト rút gọn và 受入テスト riêng thay vì dồn cuối; ③ phần rủi ro kỹ thuật (tích hợp hệ thống cũ, hiệu năng) đưa vào release sớm; ④ mỗi release là một mốc nghiệm thu nhỏ. Cách này biến dự án 12 tháng thành 4–5 lần \"tập dượt\" nghiệm thu.", "t": ""}, {"n": 257, "c": 3, "g": "3.6", "q": "Trong hybrid, tài liệu 基本設計 nên viết trước toàn bộ hay theo sprint?", "a": "Em chia hai lớp: ① viết trước phần khung ổn định — kiến trúc, mô hình dữ liệu cốt lõi, danh sách màn hình/chức năng, interface với hệ thống ngoài — vì nhiều team và hệ thống phụ thuộc vào nó; ② chi tiết màn hình/logic viết theo kiểu just-in-time, đi trước phát triển 1 sprint, cập nhật sau review. Thỏa thuận với khách: tài liệu được chốt phiên bản theo release, không phải chốt trước khi code.", "t": "\"Tài liệu just-in-time, đi trước dev 1 sprint\" là câu trả lời cân bằng mà khách Nhật chấp nhận được."}, {"n": 258, "c": 3, "g": "3.6", "q": "Đưa 総合テスト và 受入テスト kiểu Nhật vào nhịp sprint như thế nào?", "a": "① Trong sprint: DoD gồm unit test, integration test và test theo AC trên staging; ② cuối mỗi release: một giai đoạn 総合テスト ngắn cho regression, hiệu năng, liên kết hệ thống — Scrum thuần coi \"hardening sprint\" là dấu hiệu DoD chưa đủ, nên em coi đây là tạm thời và thu ngắn dần bằng automation regression; ③ 受入テスト do khách làm theo release, offshore hỗ trợ dữ liệu và kịch bản. Độ dài giai đoạn hardening là chỉ số em theo dõi qua từng release.", "t": ""}, {"n": 259, "c": 3, "g": "3.6", "q": "Quản lý thay đổi trong hybrid khác waterfall thế nào?", "a": "Waterfall: mọi thay đổi sau phê duyệt đi qua 変更管理 (henkou kanri – quản lý thay đổi) chính thức, đánh giá ảnh hưởng, có thể tính phát sinh. Hybrid chia 2 loại: ① thay đổi trong backlog chưa bắt đầu — PO tự sắp xếp, đổi item cùng kích thước, không cần CR; ② thay đổi vượt khung — thêm epic, đổi kiến trúc, đổi ngày release, sửa thứ đã nghiệm thu — đi CR chính thức. Ngưỡng phân loại thống nhất từ kickoff để không tranh cãi từng lần.", "t": ""}, {"n": 260, "c": 3, "g": "3.6", "q": "Khách liên tục đổi ưu tiên giữa sprint trong hợp đồng giá cố định. Bạn xử lý thế nào?", "a": "① Đo fact: bao nhiêu lần đổi, ảnh hưởng bao nhiêu point và ngày; ② ngay lập tức bảo vệ Sprint Goal — việc mới vào backlog sprint sau, trừ việc khẩn thì đổi item cùng kích thước và ghi lại; ③ báo khách theo 報連相 (hourensou – báo cáo, liên lạc, thảo luận) kèm burnup cho thấy ngày dự báo dịch chuyển; ④ giải pháp gốc: rút sprint xuống 1 tuần nếu ưu tiên thật sự biến động, hoặc mở làn Kanban riêng cho việc khẩn có WIP giới hạn.", "t": "Đề xuất rút ngắn sprint thay vì cấm khách đổi ý — cho thấy bạn thích ứng chứ không cứng nhắc."}, {"n": 261, "c": 3, "g": "3.6", "q": "Hybrid dễ \"lấy cái tệ của cả hai\". Đó là gì và tránh thế nào?", "a": "Rủi ro: ① tài liệu dày như waterfall nhưng phạm vi trôi như agile thiếu kiểm soát; ② sprint không ra Increment chạy được, test dồn cuối; ③ khách vừa đòi CR chính thức vừa muốn đổi ý tự do; ④ team vừa làm báo cáo waterfall vừa dự đủ event Scrum, quá tải họp. Cách tránh: viết một \"operating model\" 1 trang ngay kickoff — phần nào cố định, phần nào linh hoạt, ai quyết, tài liệu nào bắt buộc — và xem lại sau release đầu.", "t": ""}, {"n": 262, "c": 3, "g": "3.6", "q": "Dự án ngân hàng A bắt buộc waterfall ở core, nhưng app mobile muốn agile. Bạn phối hợp hai track thế nào?", "a": "① Thiết kế sớm interface (API contract) giữa core và mobile, chốt theo version, có mock/stub để mobile chạy sprint không phải chờ core; ② lịch tích hợp cố định theo milestone của core, mobile lập kế hoạch release bám các mốc đó; ③ một bảng rủi ro/dependency chung, họp đồng bộ hằng tuần giữa hai lead; ④ 結合テスト và 総合テスト liên kết chạy chung theo lịch waterfall. Nguyên tắc: track nhanh không phụ thuộc trực tiếp vào track chậm, chỉ qua contract.", "t": "Từ khóa \"tách phụ thuộc qua contract + mock\" là điều interviewer có nền kỹ thuật muốn nghe."}, {"n": 263, "c": 3, "g": "3.7", "q": "Vì sao khách Nhật truyền thống thường e ngại agile?", "a": "Thường vì: ① văn hóa tài liệu và 合意形成 (goui keisei – tạo đồng thuận), mọi thứ cần duyệt trước; ② ngân sách và 稟議 theo năm, cần con số cố định; ③ hiểu \"agile = không kế hoạch, không tài liệu\"; ④ trách nhiệm chất lượng phải rõ theo hợp đồng; ⑤ từng gặp vendor \"agile\" giao sản phẩm thiếu ổn định. Hiểu đúng từng nỗi lo thì mới thuyết phục được: trả lời mỗi nỗi lo bằng một cơ chế kiểm soát cụ thể.", "t": ""}, {"n": 264, "c": 3, "g": "3.7", "q": "Bạn thuyết phục khách bảo hiểm B vốn quen waterfall chuyển sang agile như thế nào?", "a": "Em không bán chữ \"agile\" mà bán kết quả: ① bắt đầu bằng pilot nhỏ, rủi ro thấp (1 module, 2–3 tháng); ② giữ những gì khách cần — ngân sách cố định, báo cáo tiến độ, tài liệu bàn giao — và cho thấy phần thêm vào: demo phần mềm chạy được mỗi 2 tuần, phát hiện hiểu sai sớm; ③ đo trước/sau: số 手戻り, thời gian phản hồi thay đổi; ④ mở rộng khi có số liệu. Dùng từ 反復型開発 (hanpuku-gata kaihatsu – phát triển lặp) đôi khi dễ được chấp nhận hơn.", "t": "Pilot nhỏ + số liệu của chính khách là cách thuyết phục bền vững nhất với tổ chức Nhật."}, {"n": 265, "c": 3, "g": "3.7", "q": "Sprint Review với khách Nhật nên tổ chức thế nào để hiệu quả?", "a": "① Gửi trước 1–2 ngày bằng tiếng Nhật: agenda, Sprint Goal, item sẽ demo, điểm cần khách quyết; ② demo trên staging với dữ liệu gần thật, theo kịch bản nghiệp vụ chứ không theo từng ticket; ③ hỏi câu cụ thể (\"thứ tự thao tác này đúng với bộ phận nghiệp vụ chưa?\") vì khách Nhật ít phản đối trực tiếp tại họp; ④ gửi 議事録 trong 24 giờ, liệt kê feedback → item backlog để khách xác nhận.", "t": "Khách im lặng trong review không có nghĩa là đồng ý — luôn chừa kênh phản hồi sau họp."}, {"n": 266, "c": 3, "g": "3.7", "q": "Khách hiếm khi góp ý tại Sprint Review, sau đó lại gửi email rất nhiều feedback. Làm sao thu feedback sớm hơn?", "a": "① Cho khách xem sớm, không đợi review: link staging và video ngắn cho item xong giữa sprint; ② trong review, hỏi dạng có/không hoặc chọn A/B thay vì \"có ý kiến gì không?\"; ③ mời người dùng nghiệp vụ thật, không chỉ bộ phận IT của khách; ④ dùng bảng feedback tiếng Nhật có hạn 2–3 ngày; ⑤ coi feedback sau họp là bình thường do 合意形成 nội bộ của khách, chừa sẵn capacity xử lý thay vì phàn nàn.", "t": ""}, {"n": 267, "c": 3, "g": "3.7", "q": "Trình bày Sprint Review bằng tiếng Nhật cần lưu ý gì về ngôn ngữ?", "a": "① Nói kết luận trước theo kiểu 結論から (ketsuron kara – bắt đầu từ kết luận); ② nói rõ item nào 完了 (kanryou – hoàn thành) theo DoD, item nào 未完了 (mikanryou – chưa xong) kèm lý do và kế hoạch, không dùng \"gần xong\"; ③ dùng thuật ngữ nghiệp vụ của khách thay vì thuật ngữ Scrum; ④ không hứa miệng tại họp — nói 持ち帰って検討します (mochikaette kentou shimasu – xin mang về xem xét) rồi trả lời bằng văn bản; ⑤ BrSE chuẩn bị script và glossary trước cho người demo.", "t": ""}, {"n": 268, "c": 3, "g": "3.7", "q": "Khách yêu cầu tài liệu thiết kế đầy đủ như waterfall dù dự án chạy Scrum. Bạn phản ứng thế nào?", "a": "① Hỏi mục đích thật của tài liệu: phục vụ 保守 sau này, audit nội bộ hay 稟議; ② đề xuất tài liệu \"đủ và sống\": giữ tài liệu có giá trị lâu dài (kiến trúc, dữ liệu, API, đặc tả màn hình), cập nhật theo sprint và đưa vào DoD; bỏ tài liệu trung gian chỉ để duyệt; ③ ước lượng effort tài liệu minh bạch trong backlog; ④ thống nhất mẫu tài liệu từ đầu.
