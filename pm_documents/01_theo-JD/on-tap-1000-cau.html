 vời\" rồi phải chạy lại. Kết thúc: 消化率 (shoukaritsu – tỉ lệ case đã thực hiện) 100% có evidence, mật độ test/bug trong khoảng hoặc có giải thích, không còn bug nghiêm trọng mở, các bug đã sửa đã test hồi quy. Cả hai được thống nhất với khách trước khi test, không đặt lại lúc cuối.", "t": ""}, {"n": 543, "c": 6, "g": "6.5", "q": "不具合管理票 (fuguai kanrihyou – bảng quản lý lỗi) cần có những trường nào?", "a": "Tối thiểu: ID, ngày 起票 (kihyou – tạo phiếu), người tạo, chức năng, môi trường, hiện tượng, bước tái hiện, kết quả mong đợi, mức nghiêm trọng, độ ưu tiên, 摘出工程 (tekishutsu koutei – công đoạn phát hiện), 作り込み工程 (tsukurikomi koutei – công đoạn gây ra lỗi), phân loại nguyên nhân, nội dung sửa, phạm vi ảnh hưởng, người sửa, người xác nhận, trạng thái, ngày đóng. Các trường phân tích phải bắt buộc khi đóng phiếu, nếu không cuối kỳ sẽ không làm được báo cáo chất lượng.", "t": ""}, {"n": 544, "c": 6, "g": "6.5", "q": "Phân biệt severity và priority bằng ví dụ.", "a": "Severity (重要度 – juuyoudo) là mức ảnh hưởng của lỗi đến hệ thống và nghiệp vụ; priority (優先度 – yuusendo) là thứ tự cần sửa. Ví dụ: sai logo trên màn hình đăng nhập có severity thấp nhưng priority cao nếu ngày mai demo cho ban lãnh đạo khách; lỗi tính sai ở một sản phẩm chưa mở bán có severity cao nhưng có thể xếp sau lỗi đang chặn cả nhóm test. Severity do người phát hiện đề xuất theo định nghĩa chung; priority do PM/leader cùng khách quyết.", "t": ""}, {"n": 545, "c": 6, "g": "6.5", "q": "Nên định nghĩa các mức severity thế nào để tránh tranh cãi với khách?", "a": "Viết định nghĩa có ví dụ cụ thể và thống nhất trong 品質計画書, ví dụ: S1 – dừng hệ thống, mất hoặc sai dữ liệu, tính sai tiền, lỗ hổng bảo mật; S2 – chức năng chính không dùng được nhưng có cách làm thay; S3 – lỗi chức năng phụ, hiển thị sai nhưng không sai dữ liệu; S4 – chính tả, layout nhỏ. Kèm thời hạn phản hồi và sửa cho từng mức. Khi bất đồng, đối chiếu định nghĩa và ví dụ chứ không thương lượng theo cảm giác.", "t": ""}, {"n": 546, "c": 6, "g": "6.5", "q": "Phân loại nguyên nhân bug theo 仕様漏れ, 設計ミス, 実装ミス, テスト漏れ có ý nghĩa gì?", "a": "仕様漏れ (shiyou more – thiếu sót spec): yêu cầu chưa được định nghĩa; 設計ミス (sekkei misu – lỗi thiết kế); 実装ミス (jissou misu – lỗi code); テスト漏れ (tesuto more – test bỏ sót). Phân loại cho biết **phải sửa quy trình ở đâu**: 仕様漏れ nhiều → cải thiện Q&A và review yêu cầu; 実装ミス nhiều → coding checklist, unit test; テスト漏れ nhiều → bổ sung quan điểm test. Nên thêm loại \"nguyên nhân phía khách\" (spec khách đổi hoặc sai) để phân định minh bạch.", "t": "Luôn tách loại \"nguyên nhân phía khách\" — vừa công bằng vừa là dữ liệu quan trọng khi đàm phán phát sinh."}, {"n": 547, "c": 6, "g": "6.5", "q": "摘出工程 và 作り込み工程 khác nhau thế nào, phân tích chúng để làm gì?", "a": "作り込み工程 là công đoạn tạo ra lỗi (ví dụ thiết kế chi tiết), 摘出工程 là công đoạn phát hiện lỗi (ví dụ test hệ thống). Lập ma trận hai chiều này cho thấy lỗi đã \"trôi\" qua bao nhiêu công đoạn: lỗi thiết kế đến test hệ thống mới thấy nghĩa là review thiết kế, unit test và test tích hợp đều 見逃し (minogashi – bỏ sót). Mục tiêu là tăng tỉ lệ phát hiện ngay tại công đoạn gây ra lỗi, và biết cần tăng cường kiểm tra ở công đoạn nào.", "t": ""}, {"n": 548, "c": 6, "g": "6.5", "q": "工程内摘出率 (kouteinai tekishutsuritsu – tỉ lệ phát hiện trong công đoạn) là gì và PM dùng nó thế nào?", "a": "工程内摘出率 = số lỗi phát hiện ngay trong công đoạn gây ra / tổng số lỗi do công đoạn đó gây ra (tính đến thời điểm phân tích). Tỉ lệ thấp ở thiết kế nghĩa là review thiết kế yếu và chi phí 手戻り sẽ dồn về sau. Em theo dõi chỉ số này theo từng công đoạn, đặt mục tiêu tăng dần qua các release, và dùng nó làm căn cứ khi xin thêm effort review thượng nguồn.", "t": ""}, {"n": 549, "c": 6, "g": "6.5", "q": "Tỉ lệ reopen bug cao (ví dụ trên 10% – tham khảo) cho thấy gì và xử lý thế nào?", "a": "Reopen cao cho thấy sửa chưa triệt để: dev sửa triệu chứng chứ không sửa nguyên nhân, thiếu 影響調査 (eikyou chousa – điều tra phạm vi ảnh hưởng), không tự test lại trước khi chuyển trạng thái, hoặc phiếu bug mô tả không rõ. Em yêu cầu mỗi bản sửa ghi nguyên nhân, phạm vi ảnh hưởng, case đã tự test lại; leader review bản sửa của bug nghiêm trọng; và phân tích các phiếu reopen theo module, theo loại lỗi để tìm điểm yếu cụ thể.", "t": ""}, {"n": 550, "c": 6, "g": "6.5", "q": "Vòng đời một bug từ lúc phát hiện đến khi đóng nên thế nào?", "a": "起票 → phân loại và gán (PM/leader đặt priority, chỉ định người) → phân tích nguyên nhân và 影響調査 → sửa kèm unit test → review bản sửa → tester 再テスト (sai tesuto – test lại) và test hồi quy vùng ảnh hưởng → đóng, điền đủ trường phân tích. Bug liên quan cách hiểu spec phải qua Q&A với khách trước khi sửa. Mỗi trạng thái có thời hạn theo severity; bug quá hạn hiện đỏ trong báo cáo tuần.", "t": ""}, {"n": 551, "c": 6, "g": "6.5", "q": "Bug do khách phát hiện trong 受入テスト cần xử lý khác bug nội bộ thế nào?", "a": "Đây là **lỗi lọt ra**, nên xử lý ưu tiên và minh bạch hơn: ① xác nhận hiện tượng, tái hiện, kiểm tra có phải khác biệt cách hiểu spec không; ② phản hồi khách sớm (ví dụ trong ngày – tham khảo) kèm kế hoạch sửa; ③ báo tiến độ theo 報連相 đến khi đóng; ④ với lỗi nghiêm trọng, phân tích cả nguyên nhân phát sinh lẫn nguyên nhân lọt và 横展開. Thống kê riêng số bug khách tìm thấy, vì đó là chỉ số khách dùng để chấm vendor.", "t": "Trả lời khách \"chúng tôi đang xác nhận, sẽ báo lại trước X giờ\" luôn tốt hơn im lặng hoặc vội phủ nhận."}, {"n": 552, "c": 6, "g": "6.5", "q": "Khi số bug mở tăng nhanh hơn tốc độ sửa, PM xử lý thế nào?", "a": "① Xem dữ liệu: bug mới tập trung ở module hay nguyên nhân nào, bao nhiêu là trùng hoặc không phải bug. ② Ưu tiên sửa theo severity và theo bug chặn test; tạm dừng test vùng quá nhiều lỗi, trả về dev kiểm tra lại nội bộ thay vì tiếp tục ghi phiếu; tăng người sửa có thời hạn. ③ Báo khách xu hướng kèm dự báo ngày hội tụ. ④ Nếu gốc là chất lượng build kém, làm lại review và unit test cho module đó trước khi test tiếp.", "t": ""}, {"n": 553, "c": 6, "g": "6.6", "q": "なぜなぜ分析 (naze naze bunseki – phân tích \"vì sao\" lặp lại, 5 Whys) làm đúng cách như thế nào?", "a": "Bắt đầu từ **hiện tượng cụ thể** đã xác nhận; mỗi tầng hỏi \"vì sao\" dựa trên sự kiện kiểm chứng được, không dựa trên phỏng đoán. Dừng khi chạm tới nguyên nhân thuộc **cơ chế, quy trình** mà ta kiểm soát và sửa được, không nhất thiết đúng 5 lần; mỗi tầng có thể rẽ nhiều nhánh. Kiểm tra lại bằng cách đọc ngược từ dưới lên với \"vì vậy…\" xem chuỗi có logic không. Nên làm theo nhóm, có người trong cuộc và người ngoài để tránh tự bào chữa.", "t": "Bước \"đọc ngược bằng 'vì vậy' để kiểm logic\" ít ứng viên nhắc tới, rất ghi điểm với interviewer người Nhật."}, {"n": 554, "c": 6, "g": "6.6", "q": "Vì sao \"do dev không cẩn thận\" không được chấp nhận làm nguyên nhân gốc?", "a": "Vì nguyên nhân kiểu 注意不足 (chuui busoku – thiếu chú ý) hay 確認不足 (kakunin busoku – kiểm tra chưa đủ) chỉ dẫn đến biện pháp \"sẽ chú ý hơn\", không đo được, không nhân rộng được. Cần hỏi tiếp: vì sao quy trình cho phép một người sơ suất mà lỗi vẫn lọt — checklist thiếu mục, review thiếu quan điểm đó, không có test tự động? Báo cáo có biện pháp kiểu 気をつけます (ki wo tsukemasu – sẽ cẩn thận) gần như chắc chắn bị khách trả lại.", "t": ""}, {"n": 555, "c": 6, "g": "6.6", "q": "発生原因 (hassei gen'in – nguyên nhân phát sinh) và 流出原因 (ryuushutsu gen'in – nguyên nhân lọt) khác nhau thế nào?", "a": "発生原因 trả lời \"vì sao lỗi được tạo ra\", ví dụ thiết kế không xét tháng 2 năm nhuận. 流出原因 trả lời \"vì sao lỗi không bị chặn mà lọt ra\", ví dụ test spec thiếu quan điểm ngày đặc biệt, checklist review thiết kế không có mục về ngày. Báo cáo cho khách Nhật phải phân tích **cả hai nhánh**, mỗi nhánh có biện pháp phòng ngừa riêng. Thiếu nhánh 流出 là lỗi phổ biến nhất trong báo cáo của vendor offshore.", "t": "Câu này gần như chắc chắn được hỏi khi phỏng vấn PM thị trường Nhật — nhớ cặp 発生/流出."}, {"n": 556, "c": 6, "g": "6.6", "q": "再発防止策 (saihatsu boushisaku – biện pháp chống tái phát) thế nào thì được coi là tốt?", "a": "Tốt khi: ① trỏ thẳng tới nguyên nhân gốc đã xác định; ② là **cơ chế** (仕組み – shikumi) chứ không phải lời hứa: thêm mục checklist, quan điểm review, test tự động, ràng buộc trong công cụ, ポカヨケ (poka-yoke – cơ chế chống thao tác sai); ③ có người chịu trách nhiệm và ngày áp dụng; ④ có cách kiểm chứng hiệu quả, ví dụ 1–2 sprint không tái phát lỗi cùng loại. Biện pháp quá nặng như thêm ba tầng duyệt cũng là biện pháp xấu, vì team sẽ tìm cách bỏ qua.", "t": ""}, {"n": 557, "c": 6, "g": "6.6", "q": "横展開 là gì và làm thế nào cho thực chất?", "a": "横展開 là sau khi tìm ra một lỗi và nguyên nhân, **kiểm tra những chỗ tương tự xem có cùng vấn đề không** và áp biện pháp sang đó: module khác dùng cùng logic, màn hình cùng pattern, dự án khác cùng team hoặc cùng framework. Thực chất nghĩa là có danh sách đối tượng cụ thể, cách tìm (tìm theo pattern code, rà thiết kế), kết quả từng đối tượng và evidence. Báo cáo cho khách nêu rõ \"đã kiểm tra N chỗ, phát hiện M chỗ, đã sửa xong\".", "t": ""}, {"n": 558, "c": 6, "g": "6.6", "q": "暫定対応 (zantei taiou – xử lý tạm thời) và 恒久対応 (koukyuu taiou – xử lý triệt để) khác nhau thế nào?", "a": "暫定対応 là chặn thiệt hại ngay, ví dụ batch tính phí sai thì tạm dừng batch, chạy tay có kiểm tra chéo và sửa dữ liệu sai. 恒久対応 là xử lý tận gốc: sửa logic, test hồi quy, release bản vá, kèm 再発防止策. Hai bước có lịch riêng và đều báo khách; không để 暫定対応 kéo dài thành \"vĩnh viễn\", vì nó thường dựa vào thao tác tay và dễ sai ở lần sau.", "t": "Khi kể tình huống, nói rõ \"暫定 trong X giờ, 恒久 trong Y ngày\" — khách Nhật đánh giá tốc độ chặn thiệt hại trước, độ triệt để sau."}, {"n": 559, "c": 6, "g": "6.6", "q": "三現主義 (sangen shugi – nguyên tắc \"ba thực\") áp dụng khi phân tích lỗi phần mềm thế nào?", "a": "Ba thực gồm 現場 (genba – hiện trường), 現物 (genbutsu – hiện vật), 現実 (genjitsu – thực tế). Trong phần mềm: xem trực tiếp log, dữ liệu, môi trường nơi lỗi xảy ra; tái hiện lỗi trên đúng phiên bản build; kết luận dựa trên sự kiện đã xác minh chứ không dựa trên báo cáo gián tiếp hay trí nhớ. Em yêu cầu dev tái hiện được lỗi và đưa log trước khi đề xuất nguyên nhân; điều chưa tái hiện được ghi rõ là giả thuyết trong báo cáo.", "t": ""}, {"n": 560, "c": 6, "g": "6.6", "q": "Tổ chức buổi phân tích nguyên nhân thế nào để không biến thành truy tìm người có lỗi?", "a": "Thống nhất ngay đầu buổi: mục tiêu là sửa **cơ chế**, không ai bị phạt vì lỗi được báo trung thực. Dựng timeline sự kiện theo bước và vai trò (\"bước review ngày X không có quan điểm Y\") thay vì tên người. PM điều phối bằng câu hỏi \"quy trình nào đã cho phép điều này\" và tự nhận phần trách nhiệm quản lý nếu có. Báo cáo gửi khách nói về vai trò và quy trình, không nêu tên cá nhân.", "t": ""}, {"n": 561, "c": 6, "g": "6.6", "q": "Sau khi đưa ra 再発防止策, PM theo dõi hiệu quả thế nào?", "a": "Đưa từng biện pháp vào danh sách theo dõi có owner, ngày áp dụng và chỉ số kiểm chứng, ví dụ \"0 bug loại làm tròn tiền ở test tích hợp các module sau\", \"100% pull request có mục checklist X\". Review danh sách trong họp chất lượng hằng tuần hoặc mỗi sprint; sau 1–2 chu kỳ, biện pháp không hiệu quả thì sửa, biện pháp tốn công mà không bắt được lỗi thì đề xuất bỏ. Báo kết quả cho khách để khép vòng.", "t": ""}, {"n": 562, "c": 6, "g": "6.6", "q": "Khách yêu cầu làm なぜなぜ分析 cho cả một bug hiển thị nhỏ. Có nên làm đầy đủ không?", "a": "Em tôn trọng yêu cầu nhưng điều chỉnh độ sâu theo mức độ: bug nhỏ làm bản ngắn một trang gồm hiện tượng, 発生/流出 tóm tắt, biện pháp, 横展開. Nếu có nhiều bug nhỏ cùng loại, em gộp phân tích theo **nhóm nguyên nhân** (ví dụ 15 lỗi hiển thị cùng do thiếu checklist UI) thay vì từng phiếu, vừa đỡ công vừa ra biện pháp có tác dụng hơn. Đồng thời thỏa thuận với khách từ mức severity nào thì bắt buộc phân tích đầy đủ.", "t": ""}, {"n": 563, "c": 6, "g": "6.7", "q": "品質報告書 (hinshitsu houkokusho – báo cáo chất lượng) gửi khách thường có cấu trúc thế nào?", "a": "Thường gồm: ① tóm tắt và kết luận đánh giá ở đầu; ② phạm vi và quy mô (KLOC/FP, số chức năng); ③ phần **định lượng** (定量 – teiryou): mật độ review, test, bug so với mục tiêu, đường cong hội tụ; ④ phần **định tính** (定性 – teisei): bug theo nguyên nhân, module, công đoạn gây lỗi; ⑤ bug còn mở và cách xử lý; ⑥ rủi ro và hành động tiếp theo. Định lượng chỉ ra \"lệch ở đâu\", định tính giải thích \"vì sao và đã xử lý chưa\".", "t": ""}, {"n": 564, "c": 6, "g": "6.7", "q": "Vì sao báo cáo chất lượng chỉ có số liệu mà thiếu phân tích định tính thường bị khách Nhật trả lại?", "a": "Vì con số tự nó không nói chất lượng tốt hay xấu: cùng một mật độ bug có thể là tốt ở module này, xấu ở module khác. Khách cần nghe vendor **đánh giá** (評価 – hyouka), ví dụ: \"module X vượt ngưỡng do 実装ミス tập trung ở xử lý ngày, đã bổ sung 30 case, đường cong đã hội tụ, nên đánh giá đạt\". Thiếu phần này, khách phải tự phân tích, và họ sẽ coi như vendor chưa làm xong việc.", "t": ""}, {"n": 565, "c": 6, "g": "6.7", "q": "障害報告書 (shougai houkokusho – báo cáo sự cố) cần những mục gì?", "a": "Chuẩn thường gặp: tiêu đề và mức độ; 発生日時 (hassei nichiji – thời điểm phát sinh) và thời điểm phát hiện; 影響範囲 (eikyou han'i – phạm vi ảnh hưởng: người dùng, dữ liệu, giao dịch, thời gian); hiện tượng; 原因 (gen'in – nguyên nhân, gồm phát sinh và lọt); 暫定対応; 恒久対応 và lịch; 再発防止策; 横展開; timeline chi tiết. Mở đầu bằng lời xin lỗi ngắn và hiện trạng (đã khôi phục hay chưa) để lãnh đạo khách nắm ngay.", "t": ""}, {"n": 566, "c": 6, "g": "6.7", "q": "Khi có sự cố production, báo cáo nên chia thành mấy lần và tốc độ ra sao?", "a": "Thường chia ba: 第一報 (dai-ippou – báo cáo đầu tiên) gửi rất sớm, kể cả khi chưa rõ nguyên nhân, nêu hiện tượng, ảnh hưởng đã biết, việc đang làm và giờ báo tiếp; 続報 (zokuhou – báo cáo tiếp theo) cập nhật đúng mốc đã hẹn; 最終報 (saishuuhou – báo cáo cuối) là 障害報告書 hoàn chỉnh. Mốc cụ thể (ví dụ 第一報 trong 30–60 phút – tham khảo) theo thỏa thuận với khách. Tốc độ của 第一報 quan trọng hơn độ hoàn chỉnh.", "t": "Nói \"em không chờ có nguyên nhân mới báo\" — đó đúng là điều khách Nhật muốn nghe nhất ở PM."}, {"n": 567, "c": 6, "g": "6.7", "q": "Mô tả 影響範囲 trong báo cáo sự cố thế nào để khách tin?", "a": "Phải **định lượng và có căn cứ**: bao nhiêu bản ghi, giao dịch, người dùng bị ảnh hưởng, trong khoảng thời gian nào, chức năng nào; xác định bằng cách nào (câu truy vấn, log đã kiểm tra). Tách rõ ba nhóm \"đã xác nhận có ảnh hưởng\", \"đã xác nhận không ảnh hưởng\", \"đang điều tra\". Tránh viết \"ảnh hưởng nhỏ\" hay \"có lẽ không ảnh hưởng\" khi chưa kiểm tra; khách tài chính cần con số để báo tiếp cho cấp trên hoặc cơ quan quản lý của họ.", "t": ""}, {"n": 568, "c": 6, "g": "6.7", "q": "出荷判定 (shukka hantei – đánh giá cho phép xuất xưởng) hay リリース判定 (ririisu hantei – quyết định release) dựa trên tiêu chí nào?", "a": "Tiêu chí thống nhất trước và nhìn **toàn bộ mức sẵn sàng**, không chỉ test: ① các mức test đạt tiêu chí kết thúc, đường cong hội tụ; ② bug còn mở đều có workaround và được khách đồng ý; ③ deliverable, release note, 運用手順書 đã review; ④ kế hoạch triển khai, rollback, giám sát, người trực sẵn sàng; ⑤ rủi ro còn lại được nêu rõ. Buổi 出荷判定会議 (shukka hantei kaigi – họp quyết định) có PM, QA, onsite/khách; biên bản ghi kết luận: release, release có điều kiện, hoặc chưa release.", "t": ""}, {"n": 569, "c": 6, "g": "6.7", "q": "条件付き出荷 (jouken tsuki shukka – release có điều kiện) là gì và khi nào nên dùng?", "a": "Là release dù còn một số điểm chưa đạt tiêu chí, kèm **điều kiện** được khách đồng ý bằng văn bản: danh sách bug còn mở và workaround, hạn sửa, giới hạn phạm vi sử dụng, giám sát tăng cường sau release. Chỉ nên dùng khi các điểm chưa đạt không ảnh hưởng dữ liệu, tiền, bảo mật, và lợi ích của việc release đúng hạn rõ ràng lớn hơn rủi ro. PM không tự quyết điều kiện thay khách và phải theo dõi đến khi mọi điều kiện được đóng.", "t": "Nhấn mạnh \"khách đồng ý bằng văn bản\" — release có điều kiện chỉ thỏa thuận miệng là rủi ro trách nhiệm."}, {"n": 570, "c": 6, "g": "6.7", "q": "Báo cáo chất lượng hằng tuần khác báo cáo cuối công đoạn thế nào?", "a": "Báo cáo tuần ngắn (1–2 trang), tập trung **xu hướng và cảnh báo sớm**: tiến độ chạy case, bug mới/đóng/còn mở, đường cong, các điểm vượt ngưỡng và hành động. Báo cáo cuối công đoạn đầy đủ phân tích định lượng, định tính, kết luận đánh giá chất lượng và là căn cứ để chuyển công đoạn hoặc release. Báo cáo tuần làm tốt thì báo cáo cuối không có \"bất ngờ\": khách không nên đọc thấy một vấn đề lần đầu ở báo cáo cuối.", "t": ""}, {"n": 571, "c": 6, "g": "6.7", "q": "Trình bày chỉ số xấu trong báo cáo thế nào để không làm khách mất niềm tin?", "a": "Theo nhịp **sự thật → nguyên nhân → hành động → dự báo**. Ví dụ: \"Mật độ bug module thanh toán vượt mục tiêu 40%; nguyên nhân tập trung ở 実装ミス khi làm tròn số tiền; đã review lại toàn bộ hàm tính tiền và bổ sung 25 case; dự kiến hội tụ ngày X, sẽ báo lại.\" Không giấu, không làm đẹp số, không dùng từ mơ hồ. Khách Nhật mất niềm tin vì bị bất ngờ, không phải vì một chỉ số xấu được báo sớm kèm kế hoạch.", "t": ""}, {"n": 572, "c": 6, "g": "6.7", "q": "Ai viết và ai duyệt báo cáo chất lượng trước khi gửi khách?", "a": "Số liệu do QA hoặc test lead tổng hợp trực tiếp từ công cụ quản lý bug và test (không nhập tay để tránh sai lệch); phân tích định tính do leader từng module viết; PM viết phần đánh giá, kết luận và chịu trách nhiệm cuối cùng. Bản tiếng Nhật được BrSE kiểm tra thuật ngữ trước khi PM duyệt; dự án lớn có thể qua bộ phận QA độc lập của công ty nếu có. Gửi onsite xem trước để họ không bị bất ngờ khi khách hỏi.", "t": ""}, {"n": 573, "c": 6, "g": "6.8", "q": "ISO 9001 giúp gì cho một công ty outsourcing làm với khách Nhật?", "a": "ISO 9001 là chuẩn về hệ thống quản lý chất lượng (QMS): quy trình được định nghĩa, có hồ sơ, có 内部監査 (naibu kansa – đánh giá nội bộ), 是正処置 (zesei shochi – hành động khắc phục) và cải tiến liên tục. Với khách Nhật, nó là tín hiệu ban đầu rằng vendor có quy trình, thường được hỏi khi đánh giá nhà cung cấp. Nhưng chứng chỉ không thay được chất lượng thực tế; PM cần biết quy trình dự án đáp ứng QMS ở điểm nào để trả lời khi khách audit.", "t": "Đừng khẳng định công ty đang có chứng chỉ nào khi chưa xác minh; nói \"nếu công ty áp dụng ISO 9001 thì em sẽ…\" là an toàn."}, {"n": 574, "c": 6, "g": "6.8", "q": "ISO 27001 (ISMS) ảnh hưởng thế nào đến cách vận hành dự án cho khách tài chính, bảo hiểm?", "a": "ISO 27001 là chuẩn hệ thống quản lý an toàn thông tin (ISMS – Information Security Management System). Trong dự án, nó thể hiện qua: phân quyền truy cập theo nhu cầu, cấp và thu hồi tài khoản khi người vào/ra dự án, kiểm soát thiết bị và USB, không đưa dữ liệu khách ra ngoài vùng cho phép, đào tạo bảo mật định kỳ, quy trình báo sự cố bảo mật. Khách tài chính thường có checklist bảo mật riêng hoặc audit; PM phải có hồ sơ chứng minh từng mục.", "t": ""}, {"n": 575, "c": 6, "g": "6.8", "q": "CMMI là gì và các mức trưởng thành nói lên điều gì với PM?", "a": "CMMI là mô hình đánh giá mức trưởng thành quy trình, gồm 5 mức: 1 Initial (phụ thuộc cá nhân), 2 Managed (dự án có kế hoạch, theo dõi), 3 Defined (quy trình chuẩn cấp tổ chức), 4 Quantitatively Managed (quản lý bằng số liệu thống kê), 5 Optimizing (cải tiến liên tục dựa trên dữ liệu). Với PM, câu hỏi thực tế là dự án có dùng quy trình chuẩn của tổ chức và có baseline để so sánh không; bộ chỉ số mật độ kiểu Nhật là nền tảng để tiến tới quản lý định lượng.", "t": ""}, {"n": 576, "c": 6, "g": "6.8", "q": "Áp dụng PDCA vào quản lý chất lượng dự án cụ thể ra sao?", "a": "Plan: đặt mục tiêu chất lượng và kế hoạch review/test trong 品質計画書. Do: thực hiện, ghi nhận 指摘, bug, số liệu. Check: so số liệu với mục tiêu theo tuần hoặc công đoạn, phân tích nguyên nhân các điểm lệch. Act: điều chỉnh checklist, quan điểm test, phân công, và đưa bài học vào kế hoạch giai đoạn sau. Chữ \"A\" hay bị bỏ nhất: nhiều dự án đo rất nhiều nhưng không thay đổi gì, nên em luôn kết thúc họp chất lượng bằng danh sách hành động có owner.", "t": ""}, {"n": 577, "c": 6, "g": "6.8", "q": "改善 (kaizen – cải tiến liên tục) khác gì một dự án cải tiến lớn?", "a": "Kaizen là cải tiến **nhỏ, liên tục, do chính người làm đề xuất**: rút ngắn một bước build, thêm một mục checklist, tự động hóa một bước tạo evidence. Nó không cần ngân sách lớn và hiệu quả tích lũy theo thời gian. Em duy trì bằng cách mỗi retrospective chọn 1–2 cải tiến cụ thể, đo trước/sau, chia sẻ kết quả và ghi nhận người đề xuất. Khách Nhật thường trông đợi 改善提案 từ vendor, nên đây cũng là điểm cộng trong quan hệ khách hàng.", "t": ""}, {"n": 578, "c": 6, "g": "6.8", "q": "5S áp dụng vào môi trường phát triển phần mềm như thế nào?", "a": "5S gồm 整理 (seiri – sàng lọc), 整頓 (seiton – sắp xếp), 清掃 (seisou – sạch sẽ), 清潔 (seiketsu – săn sóc, duy trì), 躾 (shitsuke – kỷ luật, sẵn sàng). Trong phần mềm: xóa branch, file, code chết không dùng; cấu trúc thư mục tài liệu và evidence thống nhất; dọn warning và TODO quá hạn; chuẩn hóa thành quy tắc, template; duy trì bằng kiểm tra định kỳ cho thành thói quen. Lợi ích thực tế là tìm tài liệu nhanh và giảm nhầm phiên bản khi bàn giao.", "t": ""}, {"n": 579, "c": 6, "g": "6.8", "q": "Kể tên QC七つ道具 và công cụ nào hữu ích nhất cho PM phần mềm?", "a": "QC七つ道具 (QC nanatsu dougu – 7 công cụ QC): Pareto (パレート図 – pareeto zu), biểu đồ xương cá (特性要因図 – tokusei youin zu), check sheet, histogram, biểu đồ phân tán (散布図 – sanpu zu), biểu đồ kiểm soát (管理図 – kanri zu) và phân tầng (層別 – soubetsu; có tài liệu thay bằng graph). Với PM phần mềm, hữu ích nhất là **Pareto** để chọn vài nguyên nhân gây phần lớn bug, **xương cá** để phân tích nguyên nhân theo nhóm, và **phân tầng** để chia bug theo module, công đoạn, nguyên nhân.", "t": "Kể một lần thật đã dùng Pareto để chọn 2–3 nguyên nhân ưu tiên sẽ hơn hẳn việc liệt kê đủ 7 công cụ."}, {"n": 580, "c": 6, "g": "6.8", "q": "Làm sao áp dụng quy trình chuẩn (ISO, CMMI) mà không biến dự án thành \"làm giấy tờ\"?", "a": "Nguyên tắc **tailoring**: điều chỉnh quy trình theo quy mô và rủi ro của dự án, có ghi lại và được duyệt, thay vì áp nguyên khối. Mỗi biểu mẫu phải trả lời được \"ai dùng nó để ra quyết định gì\"; không trả lời được thì gộp hoặc bỏ. Số liệu sinh tự động từ công cụ (hệ thống ticket, Git, CI) thay vì nhập tay. Định kỳ hỏi team bước nào tốn công mà không bắt được lỗi để đề xuất bỏ qua kênh cải tiến chính thức.", "t": ""}, {"n": 581, "c": 6, "g": "6.9", "q": "Những nguồn lỗi đặc thù của mô hình offshore Việt Nam – Nhật Bản là gì?", "a": "Phổ biến nhất: ① hiểu sai spec do khác ngôn ngữ, do dịch, hoặc do bối cảnh nghiệp vụ Nhật (thuế, lịch, cách ghi tên và địa chỉ); ② thông tin rơi rớt qua nhiều tầng khách – onsite – BrSE – dev; ③ giả định ngầm khi spec không ghi mà dev ngại hỏi; ④ khác biệt giữa môi trường offshore và môi trường khách; ⑤ tài liệu tiếng Nhật diễn đạt chưa chuẩn. Vì vậy quản lý chất lượng offshore phải đầu tư nhiều vào **xác nhận hiểu đúng** trước khi code.", "t": ""}, {"n": 582, "c": 6, "g": "6.9", "q": "Q&A管理表 (Q&A kanrihyou – bảng quản lý hỏi đáp) giúp kiểm soát chất lượng thế nào?", "a": "Mọi câu hỏi về spec được ghi một nơi: ID, ngày hỏi, tài liệu và mục liên quan, câu hỏi kèm **phương án đề xuất** của team, người trả lời, câu trả lời, ngày, trạng thái, và đã cập nhật vào tài liệu chưa. Nó ngăn dev tự giả định, giữ bằng chứng khi có tranh cãi trách nhiệm, và là nguồn để cập nhật spec. Em theo dõi số câu còn mở và tuổi câu hỏi; câu chặn tiến độ quá hạn (ví dụ quá 2 ngày – tham khảo) được escalate qua onsite.", "t": "Câu hỏi gửi khách luôn kèm phương án (\"A hay B, chúng tôi đề xuất A vì…\") — khách Nhật trả lời nhanh hơn hẳn."}, {"n": 583, "c": 6, "g": "6.9", "q": "Làm sao kiểm tra team offshore đã hiểu đúng spec trước khi code?", "a": "Dùng kỹ thuật **giải thích ngược**: dev trình bày lại spec bằng lời của mình, hoặc viết tóm tắt luồng và các test case chính, cho BrSE/onsite nghe; sai lệch lộ ra ngay. Kết hợp viết test case song song với thiết kế chi tiết để buộc phải hiểu điều kiện biên; điểm mơ hồ đẩy vào Q&A. Với chức năng phức tạp, tổ chức 認識合わせ (ninshiki awase – buổi thống nhất cách hiểu) với khách trên một bộ dữ liệu ví dụ cụ thể.", "t": ""}, {"n": 584, "c": 6, "g": "6.9", "q": "Văn hóa checklist trong offshore nên xây thế nào để không thành \"tick cho có\"?", "a": "Checklist phải **ngắn, cụ thể, sinh ra từ lỗi thật**: mỗi mục trỏ được tới một loại bug đã từng lọt; mục lâu không bắt được gì thì xem xét bỏ. Tách checklist theo loại sản phẩm (màn hình, batch, API, tài liệu) thay vì một danh sách chung dài. Leader kiểm tra lấy mẫu vài mục đã tick; tick mà không làm thì xử lý như lỗi quy trình. Mục nào kiểm được bằng máy thì đưa vào công cụ thay vì để người tick.", "t": "Câu \"checklist là trí nhớ của dự án về các lỗi đã gặp\" giúp bạn giải thích giá trị của nó rất gọn."}, {"n": 585, "c": 6, "g": "6.9", "q": "Self-check trước 納品 (nouhin – bàn giao) gồm những bước gì?", "a": "① Dev self-check theo checklist và chạy lại unit test; ② build từ source sạch theo đúng hướng dẫn, bảo đảm không phụ thuộc máy cá nhân; ③ chạy smoke test và bộ test hồi quy chính; ④ kiểm tra tài liệu khớp code, 改訂履歴 đã cập nhật; ⑤ đối chiếu danh sách deliverable; ⑥ người không trực tiếp làm (QA nội bộ hoặc leader) kiểm tra chéo. Kết quả self-check được ghi lại và gửi kèm khi khách yêu cầu.", "t": ""}, {"n": 586, "c": 6, "g": "6.9", "q": "Vai trò của BrSE trong kiểm soát chất lượng là gì, ngoài việc dịch?", "a": "BrSE là \"cổng chất lượng\" về hiểu biết: kiểm tra spec đã được hiểu đúng, review thiết kế chi tiết và test spec từ góc nhìn của khách, kiểm tra deliverable tiếng Nhật trước khi gửi, phát hiện sớm khác biệt về nghiệp vụ và cách làm. BrSE cũng là người nhận phản hồi của khách, nên cần biến 指摘 của khách thành mục checklist cho team. PM phải chừa effort review cho BrSE trong kế hoạch, không để BrSE chỉ làm phiên dịch.", "t": ""}, {"n": 587, "c": 6, "g": "6.9", "q": "Tài liệu tiếng Nhật hay mắc lỗi gì và kiểm soát thế nào?", "a": "Lỗi thường gặp: 誤字脱字 (goji datsuji – sai chữ, thiếu chữ), 表記ゆれ (hyouki yure – một khái niệm viết nhiều kiểu, ví dụ lẫn katakana/kanji hoặc ký tự full-width/half-width), câu dịch máy cứng hoặc sai nghĩa, kính ngữ không phù hợp. Kiểm soát bằng glossary thuật ngữ thống nhất, quy tắc trình bày (dấu câu, số, ngày), công cụ kiểm tra chính tả và 表記ゆれ, rồi BrSE review trước khi gửi. Dịch máy chỉ dùng làm bản nháp, luôn có người đọc lại.", "t": "Khách dễ suy từ lỗi chính tả ra \"làm ẩu\" ở cả code — sửa lỗi chính tả là việc rẻ nhất mà giữ ấn tượng tốt nhất."}, {"n": 588, "c": 6, "g": "6.9", "q": "Một bộ 納品 package chuẩn gồm những gì?", "a": "Thường gồm: 納品物一覧 (nouhinbutsu ichiran – danh sách sản phẩm bàn giao) có version; source code (tag hoặc commit cụ thể) và hướng dẫn build, deploy; tài liệu thiết kế đã cập nhật; test spec, kết quả test và evidence; báo cáo chất lượng; release note gồm thay đổi, bug đã sửa, lỗi còn tồn đọng kèm workaround; 運用手順書 nếu có. Người thứ hai kiểm tra đủ danh mục trước khi gửi qua kênh truyền file được khách chấp thuận.", "t": ""}, {"n": 589, "c": 6, "g": "6.9", "q": "Làm sao giảm khác biệt giữa môi trường test offshore và môi trường của khách?", "a": "Thống nhất từ đầu danh sách phiên bản (OS, middleware, DB, browser, framework) và ghi vào 品質計画書; dùng container hoặc hạ tầng dạng code để tái tạo môi trường; dùng dữ liệu test có cấu trúc giống thật nhưng đã ẩn danh. Phần không tái tạo được (hệ thống ngoài, mạng nội bộ khách) liệt kê rõ là ngoài phạm vi test offshore và lập kế hoạch test tại môi trường khách cùng onsite. Bug do môi trường được phân loại riêng để cải thiện.", "t": ""}, {"n": 590, "c": 6, "g": "6.9", "q": "Onsite liên tục phàn nàn chất lượng bàn giao của offshore. PM xử lý thế nào?", "a": "① Lấy fact: danh sách lỗi onsite tìm thấy, phân loại theo nguyên nhân và công đoạn. ② Ngắn hạn: thêm một vòng kiểm tra chéo trước bàn giao cho vùng hay lỗi, thống nhất lại định nghĩa \"xong\" với onsite. ③ Báo onsite và khách kế hoạch theo 報連相, không đổ lỗi qua lại. ④ Xử lý gốc: thường là thiếu hiểu spec hoặc thiếu quan điểm test, nên cập nhật checklist, Q&A và 横展開 sang các module đang làm; theo dõi số lỗi onsite tìm thấy theo tuần để chứng minh cải thiện.", "t": ""}, {"n": 591, "c": 6, "g": "6.10", "q": "Mọi chỉ số chất lượng đều trong ngưỡng, nhưng khách vẫn chê chất lượng. Anh/chị xử lý thế nào?", "a": "Chỉ số đo **cái ta chọn đo**, còn khách cảm nhận qua trải nghiệm: lỗi lặp lại, giao diện không như kỳ vọng, phản hồi chậm, tài liệu sai chính tả, sửa lỗi này sinh lỗi khác. Em cùng onsite gặp khách để lấy ví dụ cụ thể, phân loại xem khoảng cách nằm ở kỳ vọng chưa được viết thành yêu cầu hay ở khía cạnh chưa đo. Sau đó bổ sung chỉ số theo góc nhìn khách (bug khách tìm thấy, thời gian phản hồi, 指摘 trong 顧客レビュー) và thống nhất lại tiêu chí.", "t": "Chốt bằng ý \"chất lượng là cái khách cảm nhận, chỉ số chỉ là công cụ\" — đừng bảo vệ con số trước mặt khách."}, {"n": 592, "c": 6, "g": "6.10", "q": "Mật độ bug của dự án thấp bất thường so với baseline. Anh/chị có tự hào không?", "a": "Chưa. Trước tiên kiểm tra các giả thuyết: test thiếu (mật độ test thấp, thiếu quan điểm), tester không ghi phiếu các bug dev sửa ngay, nhiều lỗi bị gộp vào một phiếu, quy mô KLOC bị đội lên do code tự sinh, hoặc chức năng đơn giản hơn dự án baseline. Em lấy mẫu: cho người ngoài team test thăm dò một module, đối chiếu commit \"fix\" với phiếu bug. Chỉ khi loại trừ được các khả năng này mới báo khách \"chất lượng tốt\", kèm giải thích vì sao.", "t": "Câu này kiểm tra bạn có hoài nghi con số đẹp hay không — \"tốt bất thường thì phải kiểm tra\" là hướng trả lời đúng."}, {"n": 593, "c": 6, "g": "6.10", "q": "Khi phải chọn giữa giữ chất lượng và giữ deadline, anh/chị quyết định thế nào?", "a": "Em không tự chọn ngầm. Em lượng hóa các phương án: ① giữ ngày, thu hẹp phạm vi release (tách chức năng chưa đạt sang bản sau); ② giữ ngày, release có điều kiện với các bug không ảnh hưởng dữ liệu, tiền; ③ lùi ngày, giữ đủ phạm vi và chất lượng; ④ tăng nguồn lực, nêu rõ chi phí và rủi ro. Mỗi phương án kèm rủi ro chất lượng cụ thể, rồi trình khách và cấp trên quyết. Điểm không thương lượng là lỗi liên quan tiền, dữ liệu, bảo mật.", "t": ""}, {"n": 594, "c": 6, "g": "6.10", "q": "Giảm effort review/test để cắt chi phí có bao giờ là quyết định đúng không?", "a": "Có, nếu dựa trên dữ liệu và rủi ro: module đơn giản, tái sử dụng với lịch sử ít lỗi, có test tự động tốt thì có thể hạ từ inspection xuống peer review hoặc giảm mức evidence. Nhưng quyết định phải được ghi lại, có đánh giá rủi ro, được khách đồng ý nếu đã cam kết trong 品質計画書, và có chỉ số theo dõi để quay lại khi lỗi tăng. Cắt đồng loạt mọi module chỉ vì thiếu ngân sách thực chất là đẩy chi phí sang 手戻り về sau.", "t": ""}, {"n": 595, "c": 6, "g": "6.10", "q": "Khách đòi \"chất lượng kiểu Nhật\" nhưng muốn làm Agile, ít tài liệu, release hai tuần một lần. Anh/chị dung hòa thế nào?", "a": "Giữ **tinh thần**, đổi **hình thức**: Definition of Done chặt (review, test, evidence tự động), test hồi quy tự động thay cho phần lớn evidence screenshot, tài liệu \"vừa đủ\" nhưng luôn đồng bộ với code, mỗi sprint có báo cáo chất lượng ngắn với chỉ số xu hướng. Thống nhất từ đầu tài liệu nào bắt buộc (interface, vận hành) và tài liệu nào thay bằng code, test. Lỗi nhỏ xử lý qua retrospective; lỗi lọt ra khách vẫn làm 再発防止 đầy đủ.", "t": ""}, {"n": 596, "c": 6, "g": "6.10", "q": "Xây văn hóa chất lượng cho một team mới thành lập, ví dụ ở chi nhánh mới, bắt đầu từ đâu?", "a": "Bắt đầu từ ít mà chắc: ① 3–5 quy tắc không thương lượng (bàn giao phải qua self-check, sửa code phải cập nhật tài liệu, bug phải có phiếu, test phải có evidence); ② template và checklist lấy từ dự án đã thành công; ③ người có kinh nghiệm thị trường Nhật review, kèm cặp các deliverable đầu tiên; ④ chia sẻ 指摘 của khách như bài học chung; ⑤ đo vài chỉ số cốt lõi từ tuần đầu để có baseline. Mục tiêu đầu tiên là **sự nhất quán**.", "t": "Liên hệ kinh nghiệm build-up team mới của chính bạn (nếu có) — JD coi kinh nghiệm setup chi nhánh Đà Nẵng là lợi thế lớn."}, {"n": 597, "c": 6, "g": "6.10", "q": "Team \"làm đẹp\" chỉ số (tách nhỏ phiếu bug, không ghi bug tự sửa, chia nhỏ review) để đạt target. Anh/chị xử lý thế nào?", "a": "Đây là dấu hiệu chỉ số đang bị dùng sai mục đích: khi con số thành target để đánh giá người, người ta sẽ tối ưu con số thay vì chất lượng. Em tách chỉ số chất lượng khỏi đánh giá cá nhân trực tiếp và nói rõ mục đích là tìm điểm yếu của quy trình. Kết hợp kiểm tra chéo (đối chiếu commit \"fix\" với phiếu bug, lấy mẫu review) và đọc nhiều chỉ số cùng lúc để khó \"lách\". Công khai ghi nhận người báo lỗi trung thực, kể cả lỗi của chính mình.", "t": ""}, {"n": 598, "c": 6, "g": "6.10", "q": "Bug nghiêm trọng bắt nguồn từ spec sai của khách, nhưng team cũng không phát hiện khi review. Anh/chị phân định trách nhiệm trong báo cáo thế nào?", "a": "Trình bày theo fact, không né cũng không đổ: nguyên nhân phát sinh là spec (dẫn tài liệu, lịch sử Q&A); nguyên nhân lọt là review và test của team chưa có quan điểm kiểm tra tính hợp lý của spec. Báo cáo nêu cả hai, mỗi bên có biện pháp: team bổ sung quan điểm \"nghi ngờ spec\" vào checklist; đề xuất với khách bước xác nhận spec cho các vùng tương tự. Chi phí sửa do ai chịu thì thảo luận riêng theo hợp đồng, không trộn vào báo cáo kỹ thuật.", "t": "Tách \"phân tích nguyên nhân\" khỏi \"đàm phán chi phí\" là dấu hiệu senior — trộn hai việc làm khách thấy vendor đang tự bào chữa."}, {"n": 599, "c": 6, "g": "6.10", "q": "Làm sao chứng minh với khách rằng đầu tư thêm vào chất lượng (review, test tự động) là đáng tiền?", "a": "Dùng số liệu của chính dự án: chi phí trung bình sửa một bug theo công đoạn phát hiện (giờ công), số bug lọt ra khách trước và sau khi áp dụng, thời gian test hồi quy tiết kiệm mỗi release, số sự cố production. Trình bày dạng \"đầu tư X giờ mỗi tháng, giảm Y giờ 手戻り và Z sự cố\" thay vì nói chung \"chất lượng tốt hơn\". Đề xuất thử có thời hạn trên một module, đo kết quả, rồi mới mở rộng.", "t": ""}, {"n": 600, "c": 6, "g": "6.10", "q": "Nếu chịu trách nhiệm chất lượng cao nhất cho nhiều dự án cùng lúc, anh/chị đo và duy trì chất lượng thế nào?", "a": "Em xây ba lớp: ① **chuẩn chung** — template 品質計画書, định nghĩa chỉ số và severity, checklist dùng chung, mỗi dự án tailoring có duyệt; ② **dữ liệu chung** — dashboard tổng hợp chỉ số từ công cụ, baseline theo loại dự án, cảnh báo khi dự án lệch ngưỡng; ③ **học chung** — lỗi lọt ra khách ở dự án này được 横展開 sang dự án khác, họp chất lượng định kỳ giữa các PM. Chỉ số cuối cùng em bám là số lỗi khách phát hiện và mức hài lòng của khách sau mỗi release.", "t": ""}, {"n": 601, "c": 7, "g": "7.1", "q": "報連相 là gì và vì sao khách Nhật coi trọng nó đến vậy trong dự án outsourcing?", "a": "報連相 (hou-ren-sou) gồm 報告 (houkoku – báo cáo kết quả/tiến độ cho người giao việc), 連絡 (renraku – chia sẻ fact cho người liên quan) và 相談 (soudan – xin ý kiến trước khi tự quyết). Khách Nhật chịu trách nhiệm trước nội bộ nên cần biết sớm để không bị bất ngờ; 報連相 chính là công cụ kiểm soát rủi ro của họ. Với vendor offshore khác ngôn ngữ, lệch 2 giờ, 報連相 tốt là bằng chứng hằng ngày rằng dự án \"đang trong tầm kiểm soát\".", "t": "Phân biệt được 報告–連絡–相談 bằng ví dụ dự án thật sẽ ghi điểm hơn đọc định nghĩa."}, {"n": 602, "c": 7, "g": "7.1", "q": "Tần suất và độ chi tiết của 報連相 với khách nên thiết lập thế nào?", "a": "Em chốt từ kickoff một communication plan: daily report 3–5 dòng (đã xong, đang làm, vướng gì) gửi trước 17:00 giờ Nhật; báo cáo tiến độ tuần trong buổi họp định kỳ; báo ngay trong ngày khi có sự cố, lệch > 1 ngày ở milestone hoặc rủi ro mới mức cao (ngưỡng tham khảo). Độ chi tiết theo người nhận: người phụ trách cần chi tiết task, cấp quản lý chỉ cần kết luận, tín hiệu màu và quyết định cần xin. Sau 2–3 tuần, em hỏi lại khách để chỉnh.", "t": ""}, {"n": 603, "c": 7, "g": "7.1", "q": "\"Không có tin tức là tin xấu\" — vì sao với khách Nhật, vendor im lặng lại nguy hiểm?", "a": "Với khách Nhật, im lặng nghĩa là vendor \"không nắm được\" hoặc \"đang giấu vấn đề\", nên họ bắt đầu hỏi dồn, micro-manage và mất niềm tin dù dự án thực ra ổn. Vì vậy em báo cả khi không có gì mới: 「予定通り進んでおります」 (yotei doori susunde orimasu – đang tiến triển đúng kế hoạch) kèm % hoàn thành. Quy tắc team: mọi câu hỏi của khách có phản hồi trong ngày, ít nhất là 一次回答 (ichiji kaitou – trả lời sơ bộ) \"đã nhận, sẽ trả lời trước 15:00 ngày mai\".", "t": "一次回答 gần như không tốn công nhưng giữ niềm tin cực hiệu quả — nên nêu như một quy tắc của team."}, {"n": 604, "c": 7, "g": "7.1", "q": "中間報告 (chuukan houkoku – báo cáo giữa chừng) là gì, nên làm vào thời điểm nào?", "a": "Là báo cáo trước khi việc hoàn thành để khách kiểm tra hướng đi sớm, tránh làm xong mới phát hiện sai. Em đặt mốc ở khoảng 30–50% khối lượng, hoặc ngay khi có output đầu tiên xem được: màn hình mẫu, bản nháp thiết kế, 10–20% test case. Nội dung gồm đã làm gì, hướng đang đi, điểm cần khách xác nhận, dự báo ngày xong. Với task từ 2 tuần trở lên (tham khảo), bỏ qua 中間報告 thì rủi ro làm lại rất cao.", "t": ""}, {"n": 605, "c": 7, "g": "7.1", "q": "先手 (sente – đi trước một bước) trong giao tiếp với khách nghĩa là gì? Cho ví dụ.", "a": "Là chủ động đưa thông tin, cảnh báo rủi ro và đề xuất trước khi khách phải hỏi. Ví dụ: thấy spec màn hình B mâu thuẫn với batch C, em gửi câu hỏi kèm 2 phương án ngay khi phát hiện thay vì đợi đến lúc code; hoặc 2 tuần trước UAT, em gửi checklist khách cần chuẩn bị (data test, account, người tham gia). Ngược lại là 後手 (gote – bị động chạy theo), khiến khách thấy vendor chỉ \"làm theo bảo\".", "t": ""}, {"n": 606, "c": 7, "g": "7.1", "q": "Khi báo cáo cho người Nhật, cấu trúc nội dung nên thế nào để họ nắm nhanh?", "a": "Em theo 結論から (ketsuron kara – nói kết luận trước): ① trạng thái/kết luận một câu → ② lý do, số liệu → ③ việc cần khách làm hoặc quyết, kèm hạn. Tách rõ 事実 (jijitsu – sự thật) và 意見 (iken – nhận định), dùng con số thay cho \"sắp xong\", \"hơi trễ\". Ví dụ: \"Chức năng X trễ 2 ngày do API phía khách cấp chậm; đề xuất dời mốc test sang 20/11, cần khách duyệt trước 15/11.\"", "t": "\"Sắp xong\" là bẫy kinh điển — người Nhật sẽ hỏi lại ngay \"bao nhiêu %, ngày nào?\"."}, {"n": 607, "c": 7, "g": "7.1", "q": "Tiến độ đang lệch nhưng PM nghĩ có thể đuổi kịp bằng OT — có nên báo khách ngay không?", "a": "Có, nhưng báo theo kiểu 相談 chứ không phải báo động. Khi dự báo lệch ở mốc cam kết (tham khảo: > 1 ngày ở milestone hoặc buffer đã dùng > 50%), em báo kèm kế hoạch phục hồi: OT có giới hạn, bổ sung người, đổi thứ tự việc, và ngày kiểm tra lại. Âm thầm OT rồi vẫn trễ là lỗi kép: vừa trễ vừa giấu. Khách Nhật đánh giá vendor báo sớm cao hơn vendor chỉ \"cố gắng\".", "t": ""}, {"n": 608, "c": 7, "g": "7.1", "q": "Làm sao 確認 (kakunin – xác nhận) để tránh hiểu lầm yêu cầu khi giao tiếp bằng ngôn ngữ thứ hai?", "a": "Em dùng 3 lớp: ① 復唱 (fukushou – nhắc lại bằng lời của mình) ngay trong họp: 「念のため確認させてください。〜という理解でよろしいでしょうか」 (cho phép xác nhận lại: hiểu là… có đúng không ạ); ② ghi thành văn bản (biên bản, bảng Q&A) và xin khách confirm; ③ minh họa bằng ví dụ, mockup, bảng input/output thay vì chỉ mô tả chữ. Điểm nào ảnh hưởng scope, chi phí, lịch thì bắt buộc chốt bằng văn bản.", "t": ""}, {"n": 609, "c": 7, "g": "7.1", "q": "認識合わせ (ninshiki awase – thống nhất cách hiểu) khác gì với việc gửi tài liệu cho khách đọc?", "a": "Gửi tài liệu là một chiều, khách có thể đọc lướt rồi nói \"OK\"; 認識合わせ là hai bên cùng đi qua từng điểm dễ hiểu khác nhau và chốt lại. Em làm ở các điểm chuyển giai đoạn: sau 要件定義 (youken teigi – định nghĩa yêu cầu), trước test, trước release, với danh sách chuẩn bị sẵn 5–10 điểm \"dễ hiểu sai\" kèm ví dụ. Kết quả ghi biên bản; điểm còn khác biệt thành mục Q&A có hạn trả lời.", "t": ""}, {"n": 610, "c": 7, "g": "7.1", "q": "報連相 quá dày có phản tác dụng không? PM cân bằng thế nào?", "a": "Có: khách nhận 10 email/ngày từ nhiều member sẽ bỏ sót tin quan trọng và thấy vendor thiếu tự chủ. Em cân bằng: ① một đầu mối gửi, gom theo lịch cố định; ② việc trong quyền của team thì tự quyết rồi 報告, chỉ 相談 khi ảnh hưởng scope/lịch/chất lượng; ③ tiêu đề có nhãn 【至急】(shikyuu – gấp), 【ご確認依頼】(go-kakunin irai – nhờ xác nhận), 【共有】(kyouyuu – để biết). Định kỳ hỏi khách lượng thông tin đã vừa chưa.", "t": "Senior PM thể hiện 報連相 \"đúng liều\", không phải \"càng nhiều càng tốt\"."}, {"n": 611, "c": 7, "g": "7.1", "q": "Khi nào dùng email, chat, điện thoại hay họp để 報連相 với khách Nhật?", "a": "Em chia kênh theo mức độ và nhu cầu lưu vết: email cho nội dung cần bằng chứng (quyết định, thay đổi, báo cáo chính thức); chat (Teams, Slack, Chatwork… theo khách) cho trao đổi nhanh, nhưng kết luận quan trọng phải tóm vào email hoặc bảng quản lý; điện thoại/họp cho tin xấu, sự cố nghiêm trọng và việc cần bàn nhiều chiều. Nguyên tắc: tin xấu không gửi chỉ bằng chat — gọi trước, email xác nhận sau.", "t": ""}, {"n": 612, "c": 7, "g": "7.2", "q": "根回し (nemawashi – vận động, thống nhất trước) là gì và PM vendor làm 根回し thế nào?", "a": "Là trao đổi riêng với từng người liên quan trước cuộc họp chính thức, để cuộc họp chỉ còn là nơi xác nhận. Trước buổi họp xin đổi scope hay lịch, em gửi tài liệu trước và gọi 15–30 phút với 担当 (tantou – người phụ trách) phía khách để nghe phản ứng, chỉnh phương án, hỏi cấp trên họ đang lo điều gì. Đưa đề xuất \"bất ngờ\" vào họp có quản lý khách thường chỉ nhận về 「持ち帰ります」 (mochikaerimasu – xin mang về xem xét).", "t": "Nói rõ 根回し không phải \"chính trị ngầm\" mà là tôn trọng cách ra quyết định của khách."}, {"n": 613, "c": 7, "g": "7.2", "q": "稟議 (ringi – trình ký tập thể) ảnh hưởng thế nào đến lịch dự án?", "a": "稟議 là đề xuất bằng văn bản (稟議書 – ringisho) đi qua nhiều cấp đóng dấu phê duyệt, nên mọi việc cần ngân sách hay thay đổi lớn (CR, gia hạn, thêm người) đều có lead time từ vài ngày đến vài tuần tùy cấp. PM phải hỏi 担当 \"quy trình duyệt mất bao lâu, qua những ai\" và đưa thời gian đó vào kế hoạch, gửi đề xuất sớm tương ứng. Quên tính 稟議 là lý do phổ biến khiến CR duyệt xong thì đã trễ.", "t": ""}, {"n": 614, "c": 7, "g": "7.2", "q": "Hierarchy phía khách Nhật (部長/課長/担当) — PM giao tiếp với từng cấp ra sao?", "a": "担当 làm việc hằng ngày, cần chi tiết và trả lời nhanh; 課長 (kachou – trưởng phòng/nhóm) quản lý tiến độ, cần tóm tắt rủi ro và việc cần quyết; 部長 (buchou – trưởng bộ phận) quan tâm kết quả kinh doanh, ngân sách, rủi ro lớn, chỉ cần báo cáo 1 trang ở mốc quan trọng. Em giữ kênh chính qua 担当 và luôn để 担当 có mặt khi trao đổi với cấp trên của họ. Gặp 部長 định kỳ (mỗi phase hoặc mỗi quý) cùng lãnh đạo phía mình.", "t": ""}, {"n": 615, "c": 7, "g": "7.2", "q": "窓口 (madoguchi – đầu mối liên lạc) là gì? Vì sao phải thống nhất 窓口 hai bên?", "a": "窓口 là người được giao nhận thông tin chính thức giữa hai bên. Thiếu 窓口 rõ ràng thì mỗi member trả lời khách một kiểu, yêu cầu đi thẳng xuống dev mà không qua kiểm soát scope, quyết định mâu thuẫn nhau. Em chốt trong kickoff: 窓口 chính và dự phòng mỗi bên, kênh nào cho loại việc nào, ai được cam kết lịch/chi phí (chỉ PM). Member vẫn trao đổi kỹ thuật được, nhưng kết luận phải về 窓口 và vào bảng quản lý.", "t": ""}, {"n": 616, "c": 7, "g": "7.2", "q": "Vì sao khách Nhật thường ra quyết định chậm? PM nên phản ứng thế nào?", "a": "Thường do cần 合意形成 (goui keisei – tạo đồng thuận) giữa nhiều bộ phận, văn hóa tránh rủi ro và 稟議 nhiều cấp. PM không nên ép \"phải quyết ngay\", mà: ① cung cấp đủ thông tin để quyết (phương án, ưu nhược, chi phí, rủi ro); ② nói rõ 期限 (kigen – hạn) và tác động nếu quá hạn; ③ đề xuất phương án mặc định; ④ đưa việc chờ quyết định vào kế hoạch như một dependency có owner và ngày.", "t": ""}, {"n": 617, "c": 7, "g": "7.2", "q": "Làm sao để tài liệu của PM giúp 担当 khách dễ trình 稟議 nội bộ?", "a": "Em coi 担当 là người phải \"bán\" đề xuất cho cấp trên của họ, nên viết theo dạng họ dùng lại được: 1 trang tiếng Nhật nêu 背景 (haikei – bối cảnh), 目的 (mokuteki – mục đích), 2–3 phương án so sánh, chi phí, rủi ro nếu không làm, khuyến nghị và lịch. Em hỏi trước mẫu 稟議書 hoặc những điểm sếp họ hay hỏi. Tài liệu tốt giúp 担当 ghi điểm trong nội bộ, và họ trở thành đồng minh của dự án.", "t": "Ý \"giúp 担当 thắng trong nội bộ của họ\" thể hiện tư duy senior rõ nhất ở nhóm câu này."}, {"n": 618, "c": 7, "g": "7.2", "q": "部長 khách yêu cầu trực tiếp PM một việc mà 担当 không biết — xử lý sao?", "a": "Em tiếp nhận lịch sự, không từ chối tại chỗ nhưng cũng không cam kết ngay: 「承知いたしました。担当の〇〇様とも認識を合わせた上で、ご回答いたします」 (shouchi itashimashita… – tôi đã rõ, sẽ thống nhất với anh/chị 〇〇 phụ trách rồi trả lời). Sau đó báo ngay cho 担当 để họ không bị gạt ra ngoài, cùng đánh giá tác động rồi trả lời 部長 qua đúng kênh, có 担当 trong CC. Đi vòng qua 担当 làm họ mất mặt và mất luôn người hỗ trợ hằng ngày quan trọng nhất.", "t": ""}, {"n": 619, "c": 7, "g": "7.2", "q": "Trong họp khách gật đầu đồng ý nhưng sau đó lại đổi ý — vì sao, và phòng ngừa thế nào?", "a": "Thường vì người dự họp không phải người quyết, hoặc bộ phận khác (vận hành, kiểm toán, business) chưa được hỏi; cái gật đầu có thể chỉ là \"tôi đã nghe\". Phòng ngừa: ① xác định 決裁者 (kessaisha – người có quyền phê duyệt) cho từng loại quyết định từ đầu; ② hỏi rõ 「この内容で確定としてよろしいでしょうか」 (chốt nội dung này được chưa ạ) và ghi vào 決定事項 (kettei jikou – điều đã quyết) trong biên bản; ③ hỏi \"còn bộ phận nào cần xác nhận không\" trước khi chốt.", "t": ""}, {"n": 620, "c": 7, "g": "7.2", "q": "Có phải lúc nào cũng nên chờ khách đồng thuận? Khi nào PM nên đẩy khách quyết nhanh hơn?", "a": "Không. Khi chi phí chờ vượt rủi ro quyết sai — ví dụ team 10 người chờ spec, mỗi tuần chờ là 50 man-day bị treo — em làm rõ chi phí đó bằng con số, đưa 暫定案 (zanteian – phương án tạm) để team chạy tiếp phần không phụ thuộc, và xin khách \"quyết định có điều kiện\" có thể đảo ngược. Đẩy nhanh bằng dữ liệu và lựa chọn, không bằng áp lực; nếu vẫn tắc thì escalate qua lãnh đạo hai bên, có 根回し trước.", "t": "\"Biến chi phí chờ thành con số\" là điểm phân biệt senior với mid-level."}, {"n": 621, "c": 7, "g": "7.2", "q": "Các stakeholder phía khách (IT, business, vận hành) có ý kiến mâu thuẫn — PM xử lý ra sao?", "a": "Em không tự chọn bên, vì quyết định nội bộ khách không thuộc quyền vendor. Em: ① gom các yêu cầu mâu thuẫn vào bảng so sánh, nêu tác động của từng phương án; ② đưa về 窓口 hoặc 決裁者 để họ tự 合意形成 nội bộ; ③ ghi thành vấn đề có hạn trong bảng quản lý. Trong lúc chờ, team làm phần không bị ảnh hưởng. Tránh trả lời riêng từng bên kiểu \"vâng ạ\", vì sẽ thành các cam kết chồng chéo.", "t": ""}, {"n": 622, "c": 7, "g": "7.3", "q": "Một buổi 定例会議 (teirei kaigi – họp định kỳ) với khách Nhật nên chuẩn bị và vận hành thế nào?", "a": "Trước 1 ngày làm việc, em gửi agenda và tài liệu (báo cáo tiến độ, Q&A còn mở, vấn đề cần quyết) để khách đọc trước. Họp đúng giờ, thường 30–60 phút, theo thứ tự: tiến độ (tín hiệu màu) → vấn đề, rủi ro → Q&A → quyết định cần xin → việc tuần tới. Cuối họp đọc lại 決定事項 và 宿題 (shukudai – việc mang về, có người phụ trách và hạn). Biên bản gửi trong 24 giờ.", "t": ""}, {"n": 623, "c": 7, "g": "7.3", "q": "議事録 (gijiroku – biên bản họp) chuẩn gồm những gì và vì sao phải xin khách confirm?", "a": "Gồm thời gian, người tham dự, mục tiêu, nội dung chính, 決定事項, 宿題 (việc – người – hạn), vấn đề còn mở, lịch họp tiếp. Em gửi trong 24 giờ, kèm câu 「内容に相違がございましたら、〇日までにご指摘いただけますと幸いです」 (nếu có điểm sai khác, mong anh/chị chỉ ra trước ngày…). Biên bản đã confirm là bằng chứng khi sau này có tranh cãi về scope hay cam kết, nên các điểm liên quan scope, chi phí phải viết rõ, không mơ hồ.", "t": "Biên bản gửi trễ 3 ngày gần như mất giá trị — người Nhật đánh giá vendor qua chính những việc nhỏ này."}, {"n": 624, "c": 7, "g": "7.3", "q": "Biên bản nên do vendor hay khách viết? Nếu khách sửa biên bản theo hướng có lợi cho họ thì sao?", "a": "Em chủ động nhận viết, vì người viết kiểm soát cách ghi nhận. Nếu khách sửa, em đối chiếu với ghi chép hoặc recording (nếu đã xin phép ghi); điểm sửa không đúng thực tế thì không phản bác bằng email lạnh lùng mà gọi 担当 để 認識合わせ, rồi gửi bản thống nhất. Nếu khác biệt về scope/chi phí chưa giải quyết được, ghi thành vấn đề mở và đưa vào họp định kỳ — không để \"im lặng là đồng ý\".", "t": ""}, {"n": 625, "c": 7, "g": "7.3", "q": "QA管理表 (QA kanrihyou – bảng quản lý hỏi đáp) dùng để làm gì và nên có những cột nào?", "a": "Là nơi duy nhất ghi mọi câu hỏi về spec giữa hai bên, tránh hỏi qua chat rồi thất lạc. Cột tối thiểu: số thứ tự, ngày tạo, người hỏi, chức năng/màn hình, câu hỏi kèm phương án đề xuất, người trả lời, câu trả lời, hạn, trạng thái, ảnh hưởng (spec/lịch/chi phí), cần cập nhật tài liệu không. Em review bảng trong mỗi buổi 定例; câu quá hạn thì nêu đích danh tác động lên lịch.", "t": "Mỗi câu hỏi kèm \"phương án em đề xuất\" để khách chỉ cần chọn — tốc độ trả lời nhanh hơn hẳn."}, {"n": 626, "c": 7, "g": "7.3", "q": "課題管理表 (kadai kanrihyou – bảng quản lý vấn đề) khác gì QA管理表?", "a": "QA管理表 xử lý câu hỏi cần làm rõ (thông tin còn thiếu), còn 課題管理表 quản lý vấn đề cần hành động để gỡ: chậm cấp môi trường, mâu thuẫn spec giữa hai hệ thống, thiếu người tham gia UAT… Mỗi 課題 có owner, hạn, ưu tiên, tác động, hành động tiếp theo và trạng thái. Câu Q&A quá hạn mà ảnh hưởng lịch thì em nâng thành 課題 để có owner và được theo dõi ở cấp cao hơn.", "t": ""}, {"n": 627, "c": 7, "g": "7.3", "q": "進捗報告書 (shinchoku houkokusho – báo cáo tiến độ) gửi khách nên trình bày ra sao?", "a": "Trang đầu là tóm tắt cho cấp quản lý: trạng thái tổng thể theo tín hiệu 青/黄/赤 (ao/ki/aka – xanh/vàng/đỏ), kế hoạch so với thực tế ở các mốc, top 3 rủi ro/vấn đề và quyết định cần khách. Phần sau mới là chi tiết: tiến độ theo chức năng, việc tuần này/tuần tới, Q&A và 課題 tồn. Mọi mục 黄/赤 phải kèm nguyên nhân, 対策 (taisaku – biện pháp xử lý) và ngày dự kiến về xanh.", "t": "Người Nhật gọi đèn xanh là 青 (ao) — dùng đúng từ này trong báo cáo cho tự nhiên."}, {"n": 628, "c": 7, "g": "7.3", "q": "見える化 (mieruka – minh bạch hóa, trực quan hóa) trong dự án offshore nghĩa là gì?", "a": "Là làm cho tình trạng thật của dự án hiển thị để ai cũng thấy mà không cần hỏi: tiến độ, backlog, bug, Q&A, rủi ro. Cách làm: dashboard chung trên công cụ khách quen (Backlog, Redmine, Jira…), biểu đồ kế hoạch–thực tế hoặc burn-down, bảng Q&A và 課題 khách xem được bất cứ lúc nào. Với khách Nhật, 見える化 giảm báo cáo thủ công và giảm lo lắng, vì \"không nhìn thấy\" chính là gốc của mất niềm tin.", "t": ""}, {"n": 629, "c": 7, "g": "7.3", "q": "Có nên cho khách xem toàn bộ dashboard nội bộ, kể cả số bug và task trễ?", "a": "Em cho khách xem dữ liệu thật nhưng thiết kế theo lớp: tiến độ, bug theo mức độ, Q&A, 課題 là chung; năng suất từng người, đánh giá nội bộ, chi phí nội bộ thì không. Che số xấu rủi ro hơn nhiều, vì khách phát hiện là mất niềm tin vào toàn bộ báo cáo. Điều quan trọng là số liệu luôn đi kèm diễn giải và 対策, để khách thấy vấn đề \"đang được kiểm soát\" chứ không chỉ thấy số đỏ.", "t": "\"Minh bạch nhưng có thiết kế lớp thông tin\" là câu trả lời cân bằng mà interviewer chờ ở senior."}, {"n": 630, "c": 7, "g": "7.3", "q": "Họp online với khách Nhật cần lưu ý gì để chuyên nghiệp?", "a": "Gửi lời mời qua calendar kèm link và agenda; vào trước 3–5 phút kiểm tra âm thanh, màn hình chia sẻ; tên hiển thị theo quy ước (công ty + họ tên). Khi có BrSE hoặc phiên dịch, nói câu ngắn, chờ dịch xong mới nói tiếp, chia sẻ màn hình tài liệu để giảm hiểu lầm. Chỉ ghi âm khi đã xin phép. Cuối họp tóm tắt quyết định và kết thúc đúng giờ, vì người Nhật thường có lịch họp nối tiếp.", "t": ""}, {"n": 631, "c": 7, "g": "7.3", "q": "Khách hỏi một câu trong họp mà PM chưa chắc câu trả lời — nên xử lý thế nào?", "a": "Không đoán, vì câu trả lời trong họp được coi là cam kết. Em nói 「確認の上、明日中にご回答いたします」 (kakunin no ue, ashita-juu ni go-kaitou itashimasu – xác nhận xong sẽ trả lời trong ngày mai), ghi ngay thành 宿題 có hạn trong biên bản, rồi trả lời đúng hoặc sớm hơn hạn. Nếu đến hạn chưa có kết luận, gửi 中間報告 cho biết đang ở đâu và hạn mới. Trả lời sai rồi đính chính tốn niềm tin hơn nhiều so với hẹn lại.", "t": ""}, {"n": 632, "c": 7, "g": "7.3", "q": "Tài liệu giao tiếp viết bằng tiếng Nhật hay tiếng Anh, và ai chịu trách nhiệm chất lượng nội dung?", "a": "Theo thỏa thuận với khách; phần lớn khách Nhật cần tiếng Nhật cho tài liệu chính thức (báo cáo, biên bản, Q&A). Team viết nội dung, BrSE hoặc comtor dịch và rà soát, nhưng PM chịu trách nhiệm nội dung cam kết: con số, ngày, phạm vi phải được PM đối chiếu bản gốc trước khi gửi. Em duy trì 用語集 (yougoshuu – bảng thuật ngữ) để thống nhất cách dịch, tránh một khái niệm có ba cách gọi.", "t": ""}, {"n": 633, "c": 7, "g": "7.3", "q": "Khách liên tục gửi yêu cầu qua chat, không ghi vào bảng Q&A — PM chuẩn hóa thế nào mà không làm khách khó chịu?", "a": "Em không từ chối kênh chat mà \"chuyển kênh\" thay khách: nhận yêu cầu, trả lời 「承知いたしました。QA管理表No.〇〇として登録いたしました」 (đã rõ, đã ghi thành mục số… trong bảng Q&A) kèm link, cuối ngày gom các mục mới vào email tóm tắt. Trong 定例, em cho khách thấy lợi ích: mục nào cũng có số, hạn, trạng thái, không thất lạc. Sau vài tuần, phần lớn khách tự ghi vào bảng vì thấy tiện hơn.", "t": "Đổi thói quen khách bằng cách làm thay họ trước, đừng bằng quy định."}, {"n": 634, "c": 7, "g": "7.4", "q": "BrSE (Bridge SE) khác comtor (コミュニケーター – phiên dịch IT) và onsite coordinator thế nào?", "a": "BrSE là kỹ sư hiểu cả kỹ thuật lẫn tiếng Nhật: phân tích yêu cầu, làm rõ spec, viết/dịch tài liệu thiết kế, chịu trách nhiệm phần \"hiểu đúng\" giữa khách và team. Comtor chủ yếu phiên dịch họp và biên dịch tài liệu, không chịu trách nhiệm quyết định kỹ thuật. Onsite coordinator (hoặc BrSE onsite) làm tại văn phòng khách, nắm thông tin nhanh và xử lý vấn đề tại chỗ. PM phải phân vai rõ để không ai \"tưởng người kia làm\".", "t": ""}, {"n": 635, "c": 7, "g": "7.4", "q": "PM không giỏi tiếng Nhật thì làm việc với khách và BrSE thế nào để vẫn là người chịu trách nhiệm cao nhất?", "a": "Em tách vai: BrSE lo ngôn ngữ và làm rõ yêu cầu, PM lo quyết định và cam kết (lịch, chi phí, scope, chất lượng). Cụ thể: PM dự mọi buổi họp quan trọng và chuẩn bị nội dung trước với BrSE; email có cam kết phải có bản tóm tắt tiếng Việt/Anh để PM duyệt; phần 決定事項 của biên bản viết song ngữ. Song song, PM học tiếng Nhật đủ đọc tiêu đề, thuật ngữ, nghe được ý chính để không bị \"mù\" thông tin.", "t": "Thành thật về trình độ tiếng Nhật, nhưng nêu kế hoạch học có mục tiêu và mốc thời gian — JD có hỗ trợ đào tạo tiếng Nhật."}, {"n": 636, "c": 7, "g": "7.4", "q": "Rủi ro \"BrSE thành nút cổ chai\" biểu hiện ra sao và phòng ngừa thế nào?", "a": "Biểu hiện: Q&A tồn vì chờ BrSE dịch, BrSE kín lịch họp không còn thời gian review, team không dám hỏi khách trực tiếp, BrSE nghỉ là dự án đứng. Phòng ngừa: ① lập kế hoạch capacity cho BrSE (tham khảo: không để quá 70–80% thời gian cho dịch); ② có BrSE/comtor dự phòng và member chủ chốt đọc được spec tiếng Nhật; ③ Q&A đi qua bảng, không qua tin nhắn riêng với BrSE; ④ công cụ dịch được công ty duyệt cùng 用語集 để member tự đọc tài liệu.", "t": ""}, {"n": 637, "c": 7, "g": "7.4", "q": "BrSE tự ý hứa với khách một deadline mà team không kịp — PM xử lý thế nào?", "a": "① Xác nhận fact: BrSE đã nói gì, khách hiểu thế nào, đã có văn bản chưa. ② Đánh giá nhanh: ưu tiên lại thì có kịp không, kịp được phần nào. ③ Nếu không kịp, PM báo khách ngay trong ngày: xin lỗi, đưa ngày thực tế và phương án giao phần quan trọng trước. ④ Phòng ngừa: quy định chỉ PM xác nhận lịch/chi phí, BrSE trả lời 「確認して回答します」 (sẽ xác nhận rồi trả lời), và chia sẻ bài học cho các dự án khác.", "t": ""}, {"n": 638, "c": 7, "g": "7.4", "q": "Làm sao biết BrSE truyền đạt đúng ý, không \"lọc\" tin xấu hay làm mềm quá mức?", "a": "Em kiểm bằng nhiều nguồn: đọc email gửi đi qua công cụ dịch được phép để đối chiếu ý chính; quan sát phản ứng của khách trong họp; định kỳ hỏi trực tiếp khách 「何かご懸念はございますか」 (nani ka go-kenen wa gozaimasu ka – anh/chị có lo ngại gì không ạ). Tin xấu phải theo mẫu cố định (sự việc, tác động, 対策, ngày) để không còn chỗ làm mềm. Không phải vì nghi ngờ BrSE, mà vì PM chịu trách nhiệm cuối cùng.", "t": ""}, {"n": 639, "c": 7, "g": "7.4", "q": "Khi nào nên đưa BrSE sang onsite, khi nào nên giữ offshore?", "a": "Onsite hợp lý khi giai đoạn 要件定義 và 設計 (sekkei – thiết kế) cần trao đổi nhiều; khách mới cần xây quan hệ; hệ thống khách không truy cập được từ xa (thường gặp ở khách tài chính do quy định bảo mật); hoặc giai đoạn UAT, go-live cần xử lý tại chỗ. Offshore hợp lý khi spec đã ổn định và kênh từ xa vận hành tốt. Em cân chi phí onsite với chi phí hiểu lầm, và luôn có người đối ứng ở offshore để onsite không thành ốc đảo thông tin.", "t": ""}, {"n": 640, "c": 7, "g": "7.4", "q": "Onsite coordinator và PM offshore phối hợp thế nào để khách không nhận hai thông điệp khác nhau?", "a": "Nguyên tắc \"một giọng nói\": sync 15 phút mỗi ngày giữa onsite và PM trước giờ làm của khách; cùng dùng một bảng Q&A/課題; phân quyền rõ onsite được trả lời gì tại chỗ, việc gì phải mang về PM. Tin quan trọng (trễ, sự cố, thay đổi) thì PM và onsite thống nhất nội dung trước rồi mới báo khách. Onsite còn là \"tai\" của PM: ghi nhận không khí và những lo ngại khách chưa nói ra, báo về hằng ngày.", "t": ""}, {"n": 641, "c": 7, "g": "7.4", "q": "Member offshore có nên giao tiếp trực tiếp với khách Nhật, hay mọi thứ qua BrSE?", "a": "Em cho phép có kiểm soát: member chủ chốt được trao đổi kỹ thuật trực tiếp (tiếng Nhật, hoặc tiếng Anh nếu khách đồng ý) để bớt tầng truyền đạt, với điều kiện kết luận ghi vào bảng Q&A, không cam kết lịch/scope, có BrSE hoặc PM trong kênh. Lợi ích là phản hồi nhanh và member trưởng thành; rủi ro là sai ngôn ngữ, cam kết lẻ tẻ. Với khách mới, em giữ qua BrSE 1–2 tháng đầu rồi mở dần khi đã có tin cậy.", "t": ""}, {"n": 642, "c": 7, "g": "7.4", "q": "Dùng dịch máy cho tài liệu của khách Nhật có rủi ro gì?", "a": "Hai rủi ro chính: ① bảo mật — đưa spec, dữ liệu khách lên công cụ dịch công cộng có thể vi phạm NDA, nhất là với khách tài chính, bảo hiểm; chỉ dùng công cụ công ty đã cho phép và đúng quy định của khách; ② sai nghĩa — tiếng Nhật hay lược chủ ngữ, phủ định nằm cuối câu, thuật ngữ nghiệp vụ dễ dịch sai. Em dùng dịch máy để đọc hiểu nội bộ; tài liệu gửi khách phải qua người rà soát và đối chiếu 用語集.", "t": "Nhắc đến NDA và bảo mật khi nói về dịch máy cho thấy hiểu đặc thù khách tài chính Nhật."}, {"n": 643, "c": 7, "g": "7.4", "q": "Đã có BrSE giỏi, vì sao PM vẫn cần học tiếng Nhật?", "a": "Vì nếu mọi thông tin đi qua một người, PM bị phụ thuộc và bỏ lỡ sắc thái: một câu 「ちょっと厳しいですね」 (chotto kibishii desu ne – hơi căng đấy) có thể là cảnh báo nghiêm trọng. Biết tiếng Nhật giúp PM tự kiểm chứng thông tin, nói trực tiếp lời chào, cảm ơn, xin lỗi trong tình huống quan trọng và xây quan hệ với cấp quản lý khách. Mục tiêu thực tế không phải thay BrSE, mà là đủ để kiểm chứng và tạo niềm tin.", "t": ""}, {"n": 644, "c": 7, "g": "7.5", "q": "Keigo gồm những loại nào? PM cần dùng thế nào với khách?", "a": "敬語 (keigo – kính ngữ) gồm 尊敬語 (sonkeigo – tôn kính, nâng hành động của người khác: いらっしゃる, ご覧になる), 謙譲語 (kenjougo – khiêm nhường, hạ hành động của mình: 伺う, 拝見する) và 丁寧語 (teineigo – lịch sự, です/ます). Với khách, dùng 尊敬語 cho khách và 謙譲語 cho phía mình, kể cả khi nhắc đến sếp mình (không thêm さん, xưng 弊社 – heisha – công ty chúng tôi). Người Nhật thường bỏ qua lỗi keigo nhỏ của người nước ngoài; quan trọng là lịch sự nhất quán.", "t": ""}, {"n": 645, "c": 7, "g": "7.5", "q": "Mở đầu và kết thúc email business với khách Nhật thế nào cho chuẩn?", "a": "Mở: tên công ty, bộ phận, họ + 様 (sama – kính ngữ gọi người), rồi 「お世話になっております。〇〇社の〇〇です。」 (osewa ni natte orimasu – cảm ơn sự quan tâm thường ngày). Thân: kết luận trước, đoạn ngắn, đánh số các điểm cần xác nhận, nêu hạn. Kết: 「ご確認のほど、よろしくお願いいたします。」 (go-kakunin no hodo… – kính nhờ anh/chị xác nhận) và chữ ký đầy đủ. Tiêu đề rõ, có nhãn và hạn, ví dụ 【ご確認依頼】要件定義書v1.2(11/20まで).", "t": "Một email một chủ đề — khách Nhật thường chuyển tiếp email cho người khác xử lý theo từng chủ đề."}, {"n": 646, "c": 7, "g": "7.5", "q": "御社, 貴社 và 弊社 khác nhau thế nào?", "a": "御社 (onsha) và 貴社 (kisha) đều là \"quý công ty\": 御社 dùng khi nói, 貴社 dùng khi viết (email, văn bản). 弊社 là \"công ty chúng tôi\" dạng khiêm nhường, dùng cả nói lẫn viết. Trong văn bản, gọi người bên khách bằng họ + 様; với chức danh thì viết 〇〇部長 hoặc 部長の〇〇様, tránh 部長様 vì thường bị coi là thừa kính ngữ. Đây là lỗi nhỏ nhưng lộ ra ngay từ email đầu tiên.", "t": ""}, {"n": 647, "c": 7, "g": "7.5", "q": "Người Nhật thường nói \"không\" bằng những cách nào?", "a": "Họ hiếm khi nói thẳng 「できません」 với đối tác. Tín hiệu hay gặp: 「それはちょっと…」 (sore wa chotto – cái đó thì hơi…), 「難しいですね」 (muzukashii desu ne – khó đấy), 「検討します」 (kentou shimasu – sẽ xem xét), 「考えておきます」 (kangaete okimasu – để tôi suy nghĩ), im lặng lâu hoặc chuyển chủ đề. Trong kinh doanh, 「難しい」 thường gần với \"không\" hơn là \"khó nhưng làm được\". PM nên coi đó là từ chối mềm và hỏi lại điều kiện, thay vì cố thuyết phục ngay.", "t": "Bẫy: hiểu 「難しいです」 là \"khó nhưng vẫn làm\" rồi báo team chuẩn bị triển khai."}, {"n": 648, "c": 7, "g": "7.5", "q": "「検討します」 và 「前向きに検討します」 khác gì nhau, PM nên phản ứng thế nào?", "a": "「検討します」 có thể là xem xét thật hoặc từ chối lịch sự; 「前向きに検討します」 (maemuki ni kentou shimasu – xem xét theo hướng tích cực) cho thấy thiện chí nhưng vẫn chưa phải cam kết. Em hỏi tiếp 「いつ頃ご判断いただけそうでしょうか」 (khoảng khi nào có thể quyết ạ) và 「追加で必要な情報はございますか」 (có cần thêm thông tin gì không ạ). Sau đó ghi vào 課題管理表 với ngày dự kiến, và không lập kế hoạch dựa trên giả định \"khách đã đồng ý\".", "t": ""}, {"n": 649, "c": 7, "g": "7.5", "q": "曖昧 (aimai – mơ hồ) trong yêu cầu của khách Nhật xử lý thế nào?", "a": "Em coi làm rõ là việc của mình, không phải lỗi của khách. Cách làm: ① hỏi câu đóng hoặc đưa lựa chọn A/B thay vì hỏi mở; ② đưa ví dụ, mockup, dữ liệu mẫu để khách \"chỉ vào\" cái đúng; ③ hỏi giới hạn: số lượng, trường hợp ngoại lệ, ai dùng; ④ ghi phần đã chốt vào tài liệu và xin confirm. Những từ như 「いい感じに」 (ii kanji ni – làm sao cho hay), 「よしなに」 (yoshinani – tùy bên anh liệu) là tín hiệu phải hỏi lại ngay.", "t": ""}, {"n": 650, "c": 7, "g": "7.5", "q": "空気を読む (kuuki wo yomu – đọc bầu không khí) có ý nghĩa gì với PM vendor, có nên dựa vào nó?", "a": "Là nhận ra điều không được nói ra: khách bỗng trả lời ngắn, cấp trên khách dự họp bất thường, một rủi ro bị hỏi đi hỏi lại — đều là tín hiệu lo ngại cần hành động sớm. Nhưng không nên chỉ dựa vào nó, vì khác biệt ngôn ngữ và văn hóa khiến đoán sai rất dễ. Em dùng \"đọc không khí\" để phát hiện, rồi xác nhận bằng câu hỏi trực tiếp, lịch sự và chốt bằng văn bản.", "t": "Công thức dễ nhớ: \"đọc để phát hiện, hỏi để xác nhận, viết để chốt\"."}, {"n": 651, "c": 7, "g": "7.5", "q": "本音 (honne – ý thật) và 建前 (tatemae – lời xã giao) ảnh hưởng gì đến việc thu thập phản hồi của khách?", "a": "Trong họp chính thức, khách thường nói 建前: \"không có vấn đề gì\", \"cảm ơn các bạn đã cố gắng\". 本音 hay xuất hiện ở trao đổi 1-1, sau giờ họp hoặc qua người trung gian thân thiết. PM nên tạo kênh nghe 本音: gọi riêng 担当 sau mỗi mốc quan trọng, hỏi cụ thể \"điểm nào cải thiện thì anh/chị làm việc dễ hơn\", khảo sát định kỳ nếu khách đồng ý. Điểm đánh giá thấp bất ngờ cuối phase thường do đã bỏ qua 本音.", "t": ""}, {"n": 652, "c": 7, "g": "7.5", "q": "Khách nói 「はい」 hoặc 「なるほど」 liên tục trong họp — có nghĩa là họ đồng ý?", "a": "Không nhất thiết. 相槌 (aizuchi – tiếng đệm phản hồi) như はい, ええ, なるほど thường chỉ có nghĩa \"tôi đang nghe\", không phải \"tôi đồng ý\". Ngược lại, người Việt im lặng nghe có thể bị khách hiểu là chưa theo kịp. PM nên chốt bằng câu hỏi xác nhận rõ ràng như 「この方針で進めてよろしいでしょうか」 (tiến hành theo hướng này được không ạ), và khi nghe khách nói thì cũng đáp 相槌 để khách thấy được lắng nghe.", "t": ""}, {"n": 653, "c": 7, "g": "7.5", "q": "Nhắc khách trả lời Q&A quá hạn thế nào để không gây áp lực?", "a": "Dùng クッション言葉 (kusshon kotoba – từ đệm làm mềm) và nói tác động thay vì trách: 「お忙しいところ恐れ入りますが、QA管理表No.12について、11/20までにご回答いただけますと幸いです。ご回答が遅れる場合、結合テストの開始が遅れる可能性がございます。」 Nghĩa: xin lỗi làm phiền lúc bận, mong nhận trả lời trước 20/11; nếu chậm, 結合テスト (ketsugou tesuto – test tích hợp) có thể bắt đầu muộn. Kèm phương án đề xuất để khách chỉ cần trả lời \"OK\".", "t": ""}, {"n": 654, "c": 7, "g": "7.5", "q": "「承知しました」, 「了解しました」, 「かしこまりました」 dùng thế nào với khách?", "a": "Với khách và cấp trên, an toàn nhất là 「承知いたしました」 hoặc 「かしこまりました」 (kashikomarimashita – xin vâng, tôi đã rõ; rất trang trọng). 「了解しました」 (ryoukai shimashita – đã hiểu) về nghĩa không sai, nhưng nhiều người Nhật coi là kém trang trọng khi nói với người trên, nên tránh dùng với khách. Trong chat ngắn với khách vẫn ưu tiên 「承知しました」. Những câu đáp nhỏ như vậy tạo ấn tượng chuyên nghiệp rất nhanh.", "t": ""}, {"n": 655, "c": 7, "g": "7.5", "q": "Khi khách Nhật chọn giao tiếp bằng tiếng Anh, PM cần lưu ý gì?", "a": "Dùng câu ngắn, từ đơn giản, tránh idiom, tiếng lóng; tránh câu hỏi phủ định (\"Isn't it ready?\") vì người Nhật trả lời Yes/No theo logic khác. Sau mỗi cuộc gọi, viết lại kết luận bằng văn bản, dùng số và ngày thay vì \"soon\", \"ASAP\". Nhiều người Nhật đọc tiếng Anh tốt hơn nghe, nên gửi tài liệu trước và chia sẻ màn hình khi họp.", "t": "Với \"Isn't it ready?\", câu trả lời \"Yes\" của người Nhật có thể nghĩa là \"đúng vậy, chưa xong\"."}, {"n": 656, "c": 7, "g": "7.6", "q": "Nguyên tắc \"bad news first\" với khách Nhật là gì? Báo tin xấu theo cấu trúc nào?", "a": "Tin xấu báo trước, báo sớm, kèm 対策 — không đợi có giải pháp hoàn hảo mới báo. Cấu trúc em dùng: ① sự việc (事象 – jishou) và thời điểm; ② phạm vi ảnh hưởng (影響範囲 – eikyou han'i); ③ nguyên nhân (đã xác định hay đang điều tra); ④ 暫定対策 (zantei taisaku – biện pháp tạm thời) đã/đang làm; ⑤ 恒久対策 (koukyuu taisaku – biện pháp lâu dài) dự kiến; ⑥ thời điểm báo cáo tiếp theo.", "t": "Chưa rõ nguyên nhân thì nói \"đang điều tra, sẽ báo lại lúc X giờ\", tuyệt đối không phỏng đoán."}, {"n": 657, "c": 7, "g": "7.6", "q": "Sự cố production xảy ra ngoài giờ — 第一報 (daiippou – báo cáo đầu tiên) gửi trong bao lâu và gồm gì?", "a": "Theo SLA trong hợp đồng; nếu chưa quy định, em đặt chuẩn nội bộ khoảng 30–60 phút (tham khảo) từ lúc xác nhận sự cố mức cao, gọi điện cho đầu mối khẩn cấp rồi gửi email. Nội dung ngắn: hiện tượng, thời điểm phát hiện, phạm vi ảnh hưởng đã biết, việc đang làm, giờ báo tiếp (ví dụ mỗi 1–2 giờ). 第一報 cần nhanh hơn cần đầy đủ; 障害報告書 (shougai houkokusho – báo cáo sự cố) chi tiết làm sau.", "t": ""}, {"n": 658, "c": 7, "g": "7.6", "q": "Cấu trúc một lời xin lỗi (お詫び – owabi) chuẩn với khách Nhật gồm những phần nào?", "a": "① Xin lỗi rõ ràng ngay đầu: 「この度は多大なるご迷惑をおかけし、誠に申し訳ございません」 (lần này đã gây phiền hà lớn, thành thật xin lỗi); ② trình bày sự việc khách quan; ③ nguyên nhân, nhận trách nhiệm phía vendor; ④ 対策 đã làm và sẽ làm; ⑤ 再発防止策 (saihatsu boushi saku – biện pháp ngăn tái diễn) cụ thể, có người và ngày; ⑥ xin lỗi lại và mong tiếp tục được hợp tác. Thiếu ④⑤ thì lời xin lỗi bị xem là nói suông.", "t": ""}, {"n": 659, "c": 7, "g": "7.6", "q": "Lỗi thực chất do một member bất cẩn — khi xin lỗi khách có nên nói rõ điều đó?", "a": "Không. Với khách, đó là lỗi của công ty và của PM quản lý: em nói 「弊社の確認不足により」 (do phía chúng tôi kiểm tra chưa đủ), không nêu tên hay đổ cho cá nhân, càng không đổ cho khách. Đổ lỗi member khiến khách nghĩ vendor không kiểm soát được team và thiếu quy trình. Nguyên nhân gốc và bài học xử lý nội bộ; với khách chỉ trình bày lỗ hổng quy trình và 再発防止.", "t": "Nói \"tôi chịu trách nhiệm\" trước, phân tích nguyên nhân sau — đó là điều interviewer muốn nghe."}, {"n": 660, "c": 7, "g": "7.6", "q": "Lỗi một phần do khách (spec sai, duyệt chậm) — khi báo sự cố, PM nói thế nào để không đổ lỗi mà vẫn bảo vệ team?", "a": "Em trình bày theo timeline fact, không phán xét: \"ngày X nhận spec bản Y, ngày Z có thay đổi…\", để sự thật tự nói. Phần lỗi của vendor (ví dụ không phát hiện mâu thuẫn sớm) thì nhận rõ. 再発防止 đề xuất cho cả hai bên dưới dạng \"cùng cải thiện\": chốt spec bằng văn bản, thêm bước 認識合わせ. Tác động chi phí/lịch nếu có thì xử lý qua kênh CR riêng sau khi sự cố ổn định, không trộn vào lời xin lỗi.", "t": ""}, {"n": 661, "c": 7, "g": "7.6", "q": "Khi nào cần xin lỗi trực tiếp (gặp mặt, gọi điện), khi nào chỉ cần email?", "a": "Lỗi nhỏ, không ảnh hưởng nghiệp vụ (sai sót tài liệu, trễ vài giờ có báo trước): email hoặc nói trong 定例. Lỗi ảnh hưởng nghiệp vụ, lịch release, hoặc lặp lại lần hai: gọi điện trước, email xác nhận sau, giải thích trong họp riêng. Sự cố nghiêm trọng (production dừng, dữ liệu sai, rò rỉ thông tin): xin lỗi trực tiếp, có thể đến văn phòng khách, kèm báo cáo bằng văn bản. Nguyên tắc: kênh xin lỗi phải \"nặng\" tương xứng với tác động.", "t": ""}, {"n": 662, "c": 7, "g": "7.6", "q": "Khi nào lãnh đạo công ty vendor cần cùng xin lỗi khách?", "a": "Khi tác động vượt quyền hạn của PM: sự cố gây thiệt hại kinh doanh hoặc ảnh hưởng người dùng cuối của khách, rò rỉ dữ liệu, cùng loại lỗi lặp lại, hoặc khách đã escalate lên 部長/役員 (yakuin – ban điều hành). Lãnh đạo tham gia thể hiện cam kết của tổ chức và bảo đảm nguồn lực cho 再発防止. PM chuẩn bị đủ fact, báo cáo, 対策 để lãnh đạo không phải xin lỗi suông, và chủ động đề xuất việc này thay vì đợi khách yêu cầu.", "t": ""}, {"n": 663, "c": 7, "g": "7.6", "q": "横展開 (yokotenkai – nhân rộng biện pháp sang chỗ tương tự) là gì, vì sao khách Nhật luôn hỏi?", "a": "Sau khi sửa lỗi, khách sẽ hỏi: \"chỗ khác có lỗi tương tự không?\". 横展開 là rà các module, dự án có cùng nguyên nhân hoặc cùng pattern để sửa và áp dụng biện pháp phòng ngừa. Ví dụ: lỗi format ngày ở màn A thì kiểm mọi màn có xử lý ngày và bổ sung vào checklist review. Báo cáo sự cố thiếu 横展開 gần như chắc chắn bị khách trả lại yêu cầu bổ sung.", "t": "Chủ động nêu 横展開 trước khi khách hỏi là cách nhanh nhất lấy lại niềm tin sau sự cố."}, {"n": 664, "c": 7, "g": "7.6", "q": "Xin lỗi quá nhiều có phản tác dụng không? Có lúc nào không nên xin lỗi ngay?", "a": "Có. Xin lỗi liên tục mà không có 対策 làm khách thấy vendor yếu; xin lỗi về nguyên nhân khi chưa rõ fact có thể bị hiểu là nhận trách nhiệm hợp đồng, trong khi lỗi có thể đến từ hệ thống bên thứ ba. Em tách hai việc: xin lỗi vì đã để khách lo lắng (「ご心配をおかけし申し訳ございません」) thì nói ngay; nhận trách nhiệm nguyên nhân thì sau khi xác nhận fact. Vấn đề có rủi ro bồi thường thì trao đổi với lãnh đạo và bộ phận pháp chế trước.", "t": ""}, {"n": 665, "c": 7, "g": "7.6", "q": "Báo cáo \"xanh\" suốt 2 tháng rồi đột ngột chuyển \"đỏ\" — khách Nhật phản ứng thế nào, và tránh ra sao?", "a": "Khách sẽ nghi ngờ toàn bộ báo cáo trước đó (「今まで何を報告していたのか」 – vậy trước giờ đã báo cáo cái gì), thường yêu cầu báo cáo hằng ngày và họp với lãnh đạo vendor. Tránh bằng cách định nghĩa tiêu chí màu đo được ngay từ đầu (tham khảo: 黄 khi lệch > 3 ngày hoặc dùng > 50% buffer) và dám chuyển 黄 sớm. 黄 sớm kèm 対策 là bình thường; nhảy thẳng 青 sang 赤 là dấu hiệu PM che giấu hoặc không đo.", "t": "\"Dự án dưa hấu\" (ngoài xanh trong đỏ) là cụm hay gặp — gọi tên và nói cách phòng sẽ ghi điểm."}, {"n": 666, "c": 7, "g": "7.7", "q": "Khách yêu cầu chức năng ngoài phạm vi ngay trong họp — PM từ chối thế nào mà vẫn giữ quan hệ?", "a": "Không từ chối thẳng tại chỗ; em ghi nhận nhu cầu và nói 「貴重なご要望ありがとうございます。影響を確認の上、対応案をご提示させてください」 (cảm ơn đề xuất, xin phép đánh giá tác động rồi đưa phương án). Trong 1–2 ngày, em gửi lại: căn cứ phạm vi (tài liệu yêu cầu đã chốt), tác động nếu làm, và 2–3 代替案 (daitaian – phương án thay thế). Khách Nhật dễ chấp nhận \"chưa làm được theo cách này nhưng có cách khác\" hơn một chữ \"không\".", "t": ""}, {"n": 667, "c": 7, "g": "7.7", "q": "代替案 nên gồm những loại nào khi từ chối yêu cầu?", "a": "Em thường đưa 3 loại: ① làm như yêu cầu nhưng dưới dạng thay đổi có báo giá và lịch riêng (CR); ② đổi chỗ — làm cái mới, lùi hoặc bỏ một hạng mục ưu tiên thấp hơn có quy mô tương đương; ③ chia giai đoạn — bản đơn giản trước, đầy đủ ở phase sau, hoặc workaround vận hành tạm. Mỗi phương án nêu rõ đánh đổi về lịch, chi phí, chất lượng, rủi ro; em nói khuyến nghị nhưng để khách chọn.", "t": "Để khách \"chọn\" giữa các phương án giữ thể diện cho họ hơn là để họ \"bị từ chối\"."}, {"n": 668, "c": 7, "g": "7.7", "q": "Những mẫu câu tiếng Nhật lịch sự để báo không thể đáp ứng?", "a": "「大変恐縮ですが、今回のスケジュールでは対応いたしかねます」 (rất ngại nhưng với lịch hiện tại chúng tôi khó đáp ứng); đuôi 「〜いたしかねます」 (itashikanemasu – khó có thể làm) là cách từ chối trang trọng; 「あいにく〜」 (ainiku – thật không may) để mở câu. Luôn nối bằng 「その代わりに、〜という方法はいかがでしょうか」 (thay vào đó, cách… thì sao ạ). Tránh 「できません」 trơn và 「無理です」 (muri desu – không thể) với khách vì quá thẳng.", "t": ""}, {"n": 669, "c": 7, "g": "7.7", "q": "Khách đề nghị \"làm thêm chút thôi, coi như サービス (saabisu – làm miễn phí)\" — PM xử lý thế nào?", "a": "Em đánh giá quy mô thật trước khi trả lời. Nếu rất nhỏ và có lợi cho quan hệ thì có thể nhận, nhưng phải 見える化: ghi vào danh sách hỗ trợ miễn phí kèm công sức và nói rõ đây là ngoại lệ. Nếu không nhỏ hoặc lặp lại, đưa về quy trình CR. Bẫy là nhận im lặng nhiều lần: khách coi đó là chuẩn, team quá tải, và đến lúc từ chối thì khách thấy vendor \"đổi thái độ\".", "t": "\"Miễn phí nhưng hiển thị giá trị\" tạo cơ sở cho các lần đàm phán sau."}, {"n": 670, "c": 7, "g": "7.7", "q": "部長 khách đưa ra yêu cầu vô lý trước mặt nhiều người trong họp — PM nên phản ứng thế nào?", "a": "Không phản bác công khai, vì làm 部長 mất mặt trước cấp dưới là sai lầm khó sửa. Em ghi nhận, hỏi làm rõ mục tiêu thật (「〜という目的でよろしいでしょうか」 – mục đích là… có đúng không ạ) và hẹn trả lời sau. Sau họp, em hỏi 担当 để hiểu bối cảnh, chuẩn bị phương án kèm dữ liệu tác động, 根回し với 担当 trước khi trình lại. Nhiều khi mục tiêu thật đạt được bằng cách đơn giản hơn yêu cầu ban đầu.", "t": ""}, {"n": 671, "c": 7, "g": "7.7", "q": "Đàm phán với khách Nhật khác gì đàm phán \"thắng–thua\"? Tìm 落とし所 (otoshidokoro – điểm thỏa hiệp) thế nào?", "a": "Khách Nhật coi trọng quan hệ dài hạn hơn thắng một ván, nên mục tiêu là 落とし所 mà hai bên đều giữ thể diện và giải thích được với nội bộ. Em chuẩn bị trước: mục tiêu, giới hạn tối thiểu, các \"biến\" có thể nhượng (thứ tự giao, phạm vi phase, mức hỗ trợ) và biến không nhượng (chất lượng, an toàn dữ liệu). Nhượng phải có đổi lại, không nhượng một chiều, và mọi thỏa thuận được ghi bằng văn bản.", "t": ""}, {"n": 672, "c": 7, "g": "7.7", "q": "Khách yêu cầu rút ngắn deadline 2 tuần mà không thay đổi gì khác — PM trả lời ra sao?", "a": "Em không nói \"được\" hay \"không\" ngay, mà xin thời gian đánh giá rồi đưa trade-off rõ: ① giữ phạm vi, thêm người — chi phí tăng, rủi ro onboarding; ② giữ đội, giảm phạm vi — liệt kê chức năng lùi sang đợt sau; ③ release từng phần, chức năng quan trọng nhất trước. Đồng thời hỏi lý do thật của việc rút ngắn (sự kiện kinh doanh, 年度末 – nendomatsu – cuối năm tài chính…), vì đó thường là chìa khóa tìm phương án.", "t": ""}, {"n": 673, "c": 7, "g": "7.7", "q": "Khi nào PM phải nói \"không\" dứt khoát với khách Nhật, kể cả có thể làm khách phật ý?", "a": "Khi yêu cầu vi phạm pháp luật, hợp đồng, bảo mật (ví dụ đưa dữ liệu thật của khách tài chính ra môi trường test không được phép), an toàn hệ thống, hoặc buộc team cam kết điều chắc chắn không làm được. Lúc đó em vẫn nói lịch sự nhưng rõ ràng, tránh cách nói mập mờ dễ bị hiểu là \"sẽ xem xét\", nêu lý do và đề xuất cách hợp lệ thay thế. Một lần \"không\" rõ ràng tốt hơn nhiều so với \"vâng\" rồi thất hứa.", "t": "Ví dụ về dữ liệu thật và bảo mật rất thuyết phục với khách tài chính, bảo hiểm."}, {"n": 674, "c": 7, "g": "7.7", "q": "Sau khi từ chối một yêu cầu, làm sao biết quan hệ với khách không bị ảnh hưởng?", "a": "Em theo dõi tín hiệu: tốc độ trả lời email, giọng điệu trong họp, khách có còn chia sẻ kế hoạch sắp tới không. Chủ động gọi 担当 sau 1–2 ngày, hỏi phương án thay thế có phù hợp với nội bộ họ không, cần hỗ trợ gì để giải thích với cấp trên. Đồng thời làm thật tốt phần đã cam kết, để khách thấy việc từ chối là vì chất lượng, không phải vì thiếu thiện chí.", "t": ""}, {"n": 675, "c": 7, "g": "7.8", "q": "年度 (nendo – năm tài chính) của doanh nghiệp Nhật thường bắt đầu khi nào và ảnh hưởng gì đến dự án?", "a": "Cơ quan nhà nước và nhiều doanh nghiệp Nhật dùng năm tài chính từ 1/4 đến 31/3 năm sau, chia thành 上期 (kamiki – nửa đầu, tháng 4–9) và 下期 (shimoki – nửa sau, tháng 10–3). Ngân sách IT thường được lên trong năm tài chính trước, nên dự án mới hay bắt đầu tháng 4 hoặc tháng 10, đề xuất phải đến trước khi khách chốt ngân sách, và cuối năm dồn việc nghiệm thu. Một số công ty dùng năm tài chính khác, nên em luôn hỏi lại từng khách.", "t": ""}, {"n": 676, "c": 7, "g": "7.8", "q": "Vì sao tháng 3 (年度末) thường là giai đoạn căng nhất với khách Nhật?", "a": "Vì khách cần hoàn tất nghiệm thu, dùng ngân sách năm, và nhiều hệ thống, quy định, nghiệp vụ mới áp dụng từ 1/4. Hệ quả: release dồn, thay đổi phút chót, khách bận nên trả lời chậm. Em lập kế hoạch ngược từ tháng 3: chốt spec sớm, đặt code freeze trước vài tuần, chuẩn bị người hỗ trợ UAT, và đẩy các việc không bắt buộc ra khỏi cuối tháng 3.", "t": "Hỏi khách ngay từ kickoff \"có mốc 年度末 nào cố định không?\" — đó thường là deadline thật."}, {"n": 677, "c": 7, "g": "7.8", "q": "Tháng 4 có rủi ro giao tiếp nào PM cần chuẩn bị?", "a": "Tháng 4 là mùa 人事異動 (jinji idou – điều chuyển nhân sự) và nhân viên mới vào ở nhiều công ty Nhật, nên 担当 hoặc quản lý phía khách có thể đổi người. Người mới không biết bối cảnh và các thỏa thuận cũ. Em chuẩn bị: tài liệu tóm tắt cho người mới (lịch sử quyết định, thỏa thuận về scope, Q&A quan trọng), đề xuất buổi chào hỏi và giới thiệu dự án, xác nhận lại 窓口 và 決裁者.", "t": ""}, {"n": 678, "c": 7, "g": "7.8", "q": "Golden Week, お盆 (obon) và 年末年始 (nenmatsu nenshi) ảnh hưởng thế nào đến kế hoạch dự án offshore?", "a": "Golden Week rơi khoảng cuối tháng 4 đầu tháng 5, お盆 (dịp lễ về quê) khoảng giữa tháng 8, 年末年始 (nghỉ cuối năm–đầu năm) khoảng cuối tháng 12 đến đầu tháng 1; ngày nghỉ cụ thể tùy công ty. Trong các dịp này khách gần như không duyệt, không trả lời Q&A, không làm UAT. Em đưa lịch nghỉ của khách vào kế hoạch từ đầu, tránh đặt release hay mốc cần khách duyệt sát kỳ nghỉ, và thống nhất ai trực khi có sự cố.", "t": ""}, {"n": 679, "c": 7, "g": "7.8", "q": "Lịch nghỉ Việt Nam và lịch Nhật lệch nhau — PM xử lý thế nào?", "a": "Tết Nguyên Đán thường rơi vào tháng 1–2, lúc khách Nhật làm việc bình thường và đang chuẩn bị cho 年度末, nên đây là rủi ro lớn nhất. Em gửi lịch nghỉ cho khách từ đầu năm, hoàn thành các mốc quan trọng trước Tết, bố trí trực luân phiên cho bảo trì/sự cố, và xác nhận bằng văn bản phạm vi hỗ trợ trong dịp nghỉ. Nghỉ 30/4–1/5 và 2/9 của Việt Nam không trùng hẳn với ngày nghỉ của khách, cần đối chiếu từng năm.", "t": "Báo lịch nghỉ Tết sớm 2–3 tháng (tham khảo) kèm kế hoạch trực cho thấy PM hiểu rủi ro của khách."}, {"n": 680, "c": 7, "g": "7.8", "q": "Lệch múi giờ VN–JP 2 tiếng ảnh hưởng thế nào đến nhịp làm việc?", "a": "Giờ Nhật nhanh hơn Việt Nam 2 tiếng (Nhật không dùng giờ mùa hè): 9:00 Nhật là 7:00 Việt Nam, và khi team VN làm đến 17:00 thì bên Nhật đã 19:00. Em đặt họp ở khung chung, ví dụ 10:00–12:00 hoặc 15:00–17:00 giờ Nhật (8:00–10:00 hoặc 13:00–15:00 giờ VN); báo cáo ngày gửi trước 15:00 giờ VN để khách đọc trong giờ làm; câu hỏi cần trả lời trong ngày gửi từ buổi sáng.", "t": "Giờ nghỉ trưa Nhật 12:00–13:00 là 10:00–11:00 giờ VN — tránh hẹn họp vào khung đó."}, {"n": 681, "c": 7, "g": "7.8", "q": "Kế hoạch nguồn lực của PM nên điều chỉnh theo nhịp năm của khách Nhật thế nào?", "a": "Em vẽ \"bản đồ nhịp năm\" của khách: tháng 1–3 cao điểm (年度末, nghiệm thu, Tết VN chen giữa), tháng 4 đổi người và dự án mới khởi động, Golden Week, お盆, 年末年始 là các khoảng khách vắng. Từ đó: giữ buffer người cho quý 1 dương lịch, xếp đào tạo và nghỉ phép của team vào lúc khách nghỉ, chuẩn bị nhân sự cho dự án mới từ tháng 2–3 để khởi động được ngay tháng 4.", "t": ""}, {"n": 682, "c": 7, "g": "7.8", "q": "年末年始 có nghi thức giao tiếp nào PM nên biết?", "a": "Cuối năm, email chào 「本年も大変お世話になりました。来年もどうぞよろしくお願いいたします」 (cảm ơn sự giúp đỡ năm nay, mong năm sau tiếp tục hợp tác), kèm lịch nghỉ và đầu mối khẩn cấp. Ngày làm việc đầu năm, gửi lời chúc 「新年あけましておめでとうございます。本年もよろしくお願いいたします」 (chúc mừng năm mới, năm nay mong tiếp tục được giúp đỡ). Một số công ty còn gửi 年賀状 (nengajou – thiệp chúc năm mới), tùy mức độ quan hệ với khách.", "t": ""}, {"n": 683, "c": 7, "g": "7.8", "q": "Có nên release ngay trước kỳ nghỉ dài của Nhật để \"kịp\" deadline?", "a": "Em hạn chế tối đa. Nếu có sự cố sau release, ng
