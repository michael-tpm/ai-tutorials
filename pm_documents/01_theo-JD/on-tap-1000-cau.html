es, sales không hứa phạm vi mà đội không làm được.", "t": ""}, {"n": 949, "c": 10, "g": "10.5", "q": "Khi nào nên đề xuất POC, và làm POC thế nào để chuyển thành dự án?", "a": "Đề xuất khi khách có vấn đề rõ nhưng còn do dự về công nghệ mới hoặc năng lực vendor, ví dụ AI đọc chứng từ, IoT nhà máy. POC tốt cần: ① tiêu chí thành công đo được thống nhất trước (ví dụ độ chính xác ≥ X% trên dữ liệu mẫu của khách); ② thời gian ngắn, tham khảo 2–6 tuần; ③ chi phí thấp hoặc chia sẻ; ④ kết thúc bằng báo cáo và đề xuất bước tiếp có ước tính. Thiếu tiêu chí thành công, POC dễ thành demo miễn phí kéo dài.", "t": "Ghi điểm khi nói \"thống nhất tiêu chí thành công trước khi làm POC\"."}, {"n": 950, "c": 10, "g": "10.5", "q": "Khách chỉ giao task nhỏ và luôn so giá với vendor khác. Làm sao thoát khỏi vị trí \"vendor giá rẻ\"?", "a": "① Hiểu vì sao khách xem mình là vendor: chỉ nhận yêu cầu, không đóng góp ngoài phạm vi. ② Ngay trong task nhỏ, nâng giá trị: phát hiện rủi ro sớm, đề xuất cải tiến, tài liệu tốt hơn mong đợi. ③ Tiếp cận trưởng bộ phận, trình bày định kỳ về chất lượng và đề xuất. ④ Đào sâu domain để chuyển câu chuyện từ giá sang giá trị: rút ngắn thời gian ra thị trường, giảm lỗi vận hành. Mục tiêu là được mời vào **要件定義 (youken teigi – định nghĩa yêu cầu)**.", "t": "Được mời vào upstream (要件定義, 基本設計) là dấu hiệu rõ nhất bạn đã là partner, không còn là vendor."}, {"n": 951, "c": 10, "g": "10.5", "q": "Account đang tốt thì người phụ trách phía khách thay đổi, người mới chưa quen công ty. Anh/chị làm gì?", "a": "① Xác nhận: người mới có vai trò, ưu tiên gì, có ý định xem lại vendor không. ② Chủ động xin buổi **挨拶 (aisatsu – chào hỏi chính thức)** cùng cấp quản lý công ty, trình bày lịch sử hợp tác, thành tích bằng số. ③ Báo cáo nội bộ theo hourensou; hỏi kỳ vọng của người mới, điều chỉnh cách báo cáo theo họ. ④ Phòng ngừa: giữ quan hệ nhiều tầng (người thực hiện, quản lý, bộ phận liên quan) để account không phụ thuộc một người — ghi rủi ro này vào account plan.", "t": ""}, {"n": 952, "c": 10, "g": "10.5", "q": "Account plan cho một khách chiến lược gồm những nội dung gì?", "a": "① Hiểu khách: ngành, chiến lược kinh doanh, kế hoạch IT/DX, chu kỳ ngân sách, cách ra quyết định — kể cả **稟議 (ringi – quy trình trình duyệt nội bộ)** vốn mất nhiều thời gian; ② sơ đồ quan hệ: ai quyết định, ai ảnh hưởng, ai ủng hộ mình; ③ hiện trạng: doanh thu, margin, hài lòng, rủi ro; ④ mục tiêu 1–3 năm và cơ hội cụ thể; ⑤ hành động theo quý có người chịu trách nhiệm. PM, sales và lãnh đạo review hàng quý — không phải tài liệu viết một lần.", "t": ""}, {"n": 953, "c": 10, "g": "10.6", "q": "Phân biệt 勘定系 và 情報系 trong hệ thống ngân hàng Nhật.", "a": "**勘定系 (kanjoukei – hệ thống core banking)** xử lý giao dịch làm thay đổi số dư: tiền gửi, cho vay, chuyển tiền, ngoại hối; đòi hỏi chính xác tuyệt đối, availability rất cao, thay đổi cực kỳ thận trọng. **情報系 (jouhoukei – hệ thống thông tin)** dùng dữ liệu từ 勘定系 cho phân tích, báo cáo, CRM, quản lý rủi ro; linh hoạt hơn, dễ áp dụng công nghệ mới. Ngoài ra có **対外系 (taigaikei – hệ thống kết nối bên ngoài)** như mạng thanh toán liên ngân hàng, ATM.", "t": ""}, {"n": 954, "c": 10, "g": "10.6", "q": "夜間バッチ là gì và vì sao quan trọng trong dự án ngân hàng?", "a": "**夜間バッチ (yakan bacchi – xử lý batch ban đêm)** là các job chạy sau giờ giao dịch: tính lãi, đối soát, cập nhật số dư, tạo báo cáo, chuyển dữ liệu sang 情報系. Nó phải xong trong cửa sổ cố định trước giờ mở cửa hôm sau; chậm hoặc lỗi ảnh hưởng trực tiếp khách hàng của ngân hàng. Khi dự án đụng batch, tôi chú ý thời gian chạy với dữ liệu lớn, thứ tự phụ thuộc giữa các job, khả năng chạy lại và kịch bản xử lý khi job lỗi lúc nửa đêm.", "t": ""}, {"n": 955, "c": 10, "g": "10.6", "q": "Vì sao khách tài chính Nhật rất bảo thủ khi thay đổi hệ thống?", "a": "Vì ① sự cố có cái giá cực lớn — ảnh hưởng hàng loạt giao dịch, uy tín, có thể bị xử lý; ② chịu giám sát của **金融庁 (Kinyuuchou – Cơ quan Dịch vụ Tài chính, FSA)** nên mọi thay đổi phải giải trình được; ③ hệ thống legacy lớn, phụ thuộc nhiều tầng, người hiểu ngày càng ít; ④ ra quyết định cần đồng thuận nhiều cấp. Hệ quả cho PM: kiểm thử dày, tài liệu đầy đủ, phê duyệt nhiều bước — phải tính vào kế hoạch thay vì xem là \"khách chậm\".", "t": ""}, {"n": 956, "c": 10, "g": "10.6", "q": "FISC là gì, PM offshore cần biết ở mức nào?", "a": "**FISC (金融情報システムセンター – Trung tâm Hệ thống Thông tin Tài chính)** ban hành bộ tiêu chuẩn an toàn hệ thống thông tin (thường gọi FISC安全対策基準) mà các tổ chức tài chính Nhật dùng làm chuẩn tham chiếu. PM offshore không cần thuộc chi tiết, nhưng cần biết khách sẽ đánh giá vendor theo các yêu cầu liên quan: quản lý truy cập, thiết bị, dữ liệu, quản lý bên nhận outsourcing. Khi nhận checklist bảo mật, tôi phối hợp bộ phận bảo mật công ty để trả lời có bằng chứng.", "t": "Nói \"biết ở mức nhận biết và biết hỏi đúng người\" — đừng tự nhận là chuyên gia FISC."}, {"n": 957, "c": 10, "g": "10.6", "q": "Yêu cầu availability và bảo mật của hệ thống ngân hàng ảnh hưởng thế nào đến cách PM lập kế hoạch?", "a": "① Kiểm thử chiếm tỉ trọng lớn hơn dự án thường: hiệu năng, failover, batch lỗi, tích hợp với hệ thống liên quan; ② release theo cửa sổ cố định (thường đêm hoặc cuối tuần) với kế hoạch rollback đã diễn tập; ③ dữ liệu thật không ra khỏi môi trường khách — chuẩn bị dữ liệu test giả lập từ sớm; ④ evidence cho từng test case; ⑤ phê duyệt nhiều cấp phía khách, nên đặt buffer riêng cho quy trình phê duyệt chứ không chỉ cho dev.", "t": ""}, {"n": 958, "c": 10, "g": "10.6", "q": "Dự án migration hệ thống ngân hàng có những rủi ro đặc thù nào?", "a": "① **Dữ liệu**: chuyển sai một trường số tiền/lãi là sự cố nghiêm trọng → đối soát tự động trước–sau, chạy thử nhiều lần; ② **nghiệp vụ ẩn** trong code legacy (COBOL…) không có tài liệu → phân tích hiện trạng, phỏng vấn người vận hành; ③ **cutover** trong khung giờ hẹp → rehearsal nhiều lần; ④ có thể phải **chạy song song** cũ–mới để so kết quả; ⑤ **con người**: người hiểu hệ thống cũ sắp nghỉ hưu. Tôi đặt tiêu chí go/no-go cụ thể cho cutover và thống nhất trước với khách.", "t": "Nhắc \"rehearsal cutover nhiều lần + tiêu chí go/no-go\" cho thấy bạn từng làm migration thật."}, {"n": 959, "c": 10, "g": "10.6", "q": "Khi làm việc với dữ liệu khách tài chính ở offshore, nguyên tắc nào không được vi phạm?", "a": "① Không dùng dữ liệu thật của khách hàng ngân hàng ở môi trường dev/test offshore, trừ khi khách cho phép bằng văn bản và dữ liệu đã được mask; ② truy cập theo quyền tối thiểu, có log; ③ không đưa dữ liệu, tài liệu, mã nguồn của khách vào công cụ bên ngoài chưa được duyệt — kể cả công cụ GenAI; ④ báo ngay khi nghi rò rỉ, không tự xử lý ngầm. Tôi phổ biến các quy tắc này khi onboarding và kiểm tra định kỳ.", "t": "Nhắc riêng rủi ro dán code/tài liệu khách vào GenAI — đây là mối lo rất thời sự của khách Nhật."}, {"n": 960, "c": 10, "g": "10.6", "q": "PM offshore nên nắm tối thiểu những nghiệp vụ ngân hàng nào?", "a": "① Tiền gửi không kỳ hạn/có kỳ hạn và cách tính lãi; ② cho vay: giải ngân, lịch trả nợ, quá hạn; ③ chuyển tiền trong nước, ngoại hối ở mức khái niệm; ④ ngày làm việc ngân hàng và ngày lễ Nhật ảnh hưởng xử lý giao dịch; ⑤ đối soát, kế toán kép, KYC/AML ở mức nhận biết. Không cần là chuyên gia, nhưng phải đủ để đọc hiểu tài liệu yêu cầu và đặt câu hỏi Q&A đúng trọng tâm.", "t": ""}, {"n": 961, "c": 10, "g": "10.6", "q": "Phần nào của hệ thống tài chính phù hợp để offshore, phần nào nên giữ onsite hoặc để khách tự làm?", "a": "Phù hợp offshore: 情報系, hệ thống vệ tinh (web/app khách hàng, cổng nội bộ, báo cáo), kiểm thử, migration với dữ liệu đã mask, maintain theo yêu cầu rõ. Nên giữ onsite/phía khách: phần chạm dữ liệu thật nhạy cảm, quyết định nghiệp vụ lõi, vận hành production cần quyền cao, điều phối nhiều vendor. Thực tế thường là mô hình lai: BrSE/onsite phân tích và điều phối, offshore phát triển và test. PM nên đề xuất ranh giới này rõ ngay trong proposal.", "t": "Nói được \"bắt đầu từ 情報系 và hệ thống vệ tinh\" cho thấy hiểu cách khách tài chính mở cửa cho vendor mới."}, {"n": 962, "c": 10, "g": "10.6", "q": "Xu hướng số hóa nào đang tác động đến khách tài chính Nhật mà PM nên biết?", "a": "Ở mức xu hướng: ① dịch chuyển dần từ mainframe/on-premise sang cloud có kiểm soát; ② **オープンAPI (oupun API – API mở)** để hợp tác với fintech; ③ thanh toán không tiền mặt, ngân hàng số trên app; ④ AI cho tự động hóa back-office, chống gian lận; ⑤ hiện đại hóa hệ thống COBOL khi người vận hành già đi. Mỗi xu hướng là cơ hội đề xuất cho offshore, nhưng phải đi kèm năng lực bảo mật và chất lượng tương xứng.", "t": ""}, {"n": 963, "c": 10, "g": "10.7", "q": "生命保険 và 損害保険 khác nhau thế nào, ảnh hưởng gì đến hệ thống?", "a": "**生命保険 (seimei hoken – bảo hiểm nhân thọ)** bảo hiểm sinh mạng/sức khỏe, hợp đồng kéo dài hàng chục năm, nên hệ thống phải quản lý vòng đời rất dài và nhiều thế hệ sản phẩm cùng tồn tại. **損害保険 (songai hoken – bảo hiểm phi nhân thọ)** bảo hiểm tài sản, xe, trách nhiệm, thường ngắn hạn, tái tục hằng năm, khối lượng bồi thường lớn. Ngoài ra có **第三分野 (daisan bunya – nhóm thứ ba)** như bảo hiểm y tế, ung thư. Khác biệt này quyết định thiết kế dữ liệu, batch và kiểm thử.", "t": ""}, {"n": 964, "c": 10, "g": "10.7", "q": "Nêu chuỗi nghiệp vụ lõi của một hệ thống bảo hiểm.", "a": "① Bán/tư vấn qua đại lý, nhân viên, online; ② **引受 (hikiuke – thẩm định nhận bảo hiểm)**; ③ **契約管理 (keiyaku kanri – quản lý hợp đồng)**: phát hành, thay đổi, gia hạn, hủy — phần sau phát hành thường gọi **保全 (hozen – nghiệp vụ duy trì hợp đồng)**; ④ **保険料計算 (hokenryou keisan – tính phí bảo hiểm)** và thu phí; ⑤ **保険金支払 (hokenkin shiharai – chi trả quyền lợi/bồi thường)**; ⑥ kế toán và báo cáo cho cơ quan quản lý. Dự án offshore thường rơi vào ③④ hoặc số hóa kênh bán.", "t": ""}, {"n": 965, "c": 10, "g": "10.7", "q": "Vì sao kiểm thử số liệu trong hệ thống bảo hiểm đặc biệt quan trọng, anh/chị tổ chức thế nào?", "a": "Sai một quy tắc làm tròn hay một bảng tỉ lệ có thể làm sai phí/quyền lợi của rất nhiều hợp đồng, gây thiệt hại tài chính và pháp lý. Tôi tổ chức: ① dữ liệu kỳ vọng do **アクチュアリー (akuchuarii – chuyên gia định phí)** phía khách xác nhận; ② test bảng quyết định với giá trị biên — tuổi, kỳ hạn, ngày hiệu lực, năm nhuận; ③ so tự động kết quả hệ thống mới với cũ trên tập hợp đồng lớn; ④ quy tắc làm tròn, thứ tự tính ghi rõ trong tài liệu yêu cầu.", "t": "Nhắc \"quy tắc làm tròn và giá trị biên ngày tháng\" cho thấy bạn hiểu lỗi tính toán đến từ đâu."}, {"n": 966, "c": 10, "g": "10.7", "q": "Hệ thống bảo hiểm legacy lớn thường gây khó gì khi đội offshore tham gia?", "a": "① Logic sản phẩm tích lũy qua nhiều thế hệ, hợp đồng cũ vẫn hiệu lực nên không thể bỏ code cũ; ② tài liệu thiếu hoặc lệch với code; ③ người hiểu nghiệp vụ ít và bận; ④ sửa một chỗ ảnh hưởng chéo khó lường. Cách làm: mọi thay đổi bắt đầu bằng **影響調査 (eikyou chousa – điều tra phạm vi ảnh hưởng)** kỹ; xây dần tài liệu hiện trạng; tự động hóa test hồi quy cho luồng chính; ghép người offshore với chuyên gia phía khách.", "t": ""}, {"n": 967, "c": 10, "g": "10.7", "q": "Khách bảo hiểm B muốn số hóa kênh bán. Anh/chị tư vấn hướng nào?", "a": "① Hiểu kênh hiện tại — đại lý, nhân viên, bán qua ngân hàng, online — kênh nào là trọng tâm; ② đề xuất từng bước nhỏ: app hỗ trợ nhân viên/đại lý tư vấn (mô phỏng phí, gợi ý sản phẩm), ký hợp đồng điện tử giảm giấy tờ, cổng tự phục vụ cho khách hàng (đổi thông tin, yêu cầu bồi thường online); ③ mỗi bước có chỉ số như thời gian hoàn tất hợp đồng, tỉ lệ hồ sơ lỗi; ④ kết nối với hệ thống lõi qua API, chưa sửa lõi ở bước đầu.", "t": ""}, {"n": 968, "c": 10, "g": "10.7", "q": "Phí bảo hiểm phụ thuộc vào những yếu tố nào, PM cần hiểu đến mức nào?", "a": "Ở mức khái niệm: phí dựa trên tỉ lệ rủi ro (với nhân thọ là tỉ lệ tử vong/bệnh theo tuổi, giới), lãi suất dự định, chi phí vận hành, kỳ hạn, số tiền bảo hiểm và phương thức đóng phí. PM không tự tính, nhưng phải phân biệt được đâu là **tham số cấu hình** (bảng tỉ lệ, hệ số) và đâu là **logic cứng**, để ước lượng đúng mức thay đổi khi khách ra sản phẩm mới và đặt câu hỏi đúng cho actuary.", "t": ""}, {"n": 969, "c": 10, "g": "10.7", "q": "Khi khách bảo hiểm ra sản phẩm mới, đội offshore thường phải làm gì, rủi ro nằm ở đâu?", "a": "Thường phải thêm định nghĩa sản phẩm, quy tắc tính phí/quyền lợi, màn hình, chứng từ in, batch liên quan và kiểm thử toàn chuỗi từ bán đến chi trả. Rủi ro: ngày ra mắt cố định gắn với kế hoạch kinh doanh và thủ tục với cơ quan quản lý nên khó lùi; yêu cầu chốt muộn; ảnh hưởng tới sản phẩm cũ. Tôi đặt mốc chốt yêu cầu sớm, chuẩn bị bộ test hồi quy cho sản phẩm cũ và dành buffer lớn hơn cho giai đoạn kiểm thử nghiệp vụ.", "t": ""}, {"n": 970, "c": 10, "g": "10.7", "q": "帳票 trong dự án bảo hiểm/tài chính Nhật có gì đặc thù?", "a": "**帳票 (chouhyou – chứng từ, biểu mẫu in)** như giấy chứng nhận hợp đồng, thông báo phí, thông báo chi trả phải chính xác đến từng ký tự, vị trí, cách viết số và lịch Nhật **和暦 (wareki – niên hiệu, ví dụ 令和 Reiwa)**. Lỗi nhỏ trên chứng từ gửi khách hàng cuối có thể phải in lại hàng loạt và xin lỗi chính thức. Tôi đưa 帳票 thành hạng mục kiểm thử riêng, so sánh bằng ảnh/PDF với mẫu chuẩn, và xin khách duyệt mẫu từ sớm.", "t": "Biết 和暦 và 帳票 là điểm cộng lớn — nhiều đội offshore vấp lỗi chính ở đây."}, {"n": 971, "c": 10, "g": "10.7", "q": "Những thay đổi thị trường nào khiến khách bảo hiểm Nhật cần đầu tư IT nhiều hơn?", "a": "Ở mức xu hướng: ① dân số già làm nhu cầu dịch chuyển sang sản phẩm y tế, chăm sóc, hưu trí; ② khách hàng trẻ quen thủ tục online, ít muốn gặp trực tiếp; ③ hệ thống legacy và đội vận hành lâu năm sắp nghỉ hưu; ④ thiên tai khiến bảo hiểm phi nhân thọ cần xử lý bồi thường nhanh với khối lượng lớn; ⑤ dữ liệu và AI được dùng vào thẩm định, chi trả. Mỗi điểm là một cơ hội dự án cụ thể mà PM có thể gợi ý cho sales.", "t": ""}, {"n": 972, "c": 10, "g": "10.8", "q": "生産管理 và MES khác nhau thế nào?", "a": "**生産管理 (seisan kanri – quản lý sản xuất)** ở tầng kế hoạch: lập kế hoạch sản xuất, tính nhu cầu vật tư (MRP), tồn kho, đặt hàng, giá thành — thường nằm trong hoặc gắn với ERP. **MES (Manufacturing Execution System)** ở tầng xưởng: điều độ thực tế, theo dõi từng công đoạn, thu dữ liệu máy, truy xuất nguồn gốc, chất lượng tại dây chuyền. Nói gọn: ERP/生産管理 trả lời \"làm gì, bao nhiêu, khi nào\", MES trả lời \"đang làm thế nào, ở đâu\".", "t": ""}, {"n": 973, "c": 10, "g": "10.8", "q": "Với dự án ERP như SAP ở khách sản xuất Nhật, offshore thường đảm nhận phần nào?", "a": "Thường là: ① phát triển add-on/customize, interface kết nối ERP với MES, kho, EDI nhà cung cấp; ② migration dữ liệu khi nâng cấp; ③ test hồi quy và test tích hợp; ④ báo cáo, dashboard. Cấu hình nghiệp vụ lõi và tư vấn quy trình thường do khách hoặc đối tác tư vấn đảm nhận. Nhiều khách đang tính chuyển từ SAP ECC lên S/4HANA vì mốc kết thúc bảo trì chuẩn của ECC cuối năm 2027 — cơ hội nếu công ty có năng lực.", "t": "Đừng nhận \"làm được SAP\" khi đội chưa có kinh nghiệm — đề xuất bắt đầu từ interface, migration, test."}, {"n": 974, "c": 10, "g": "10.8", "q": "トヨタ生産方式 và カイゼン ảnh hưởng thế nào đến cách khách sản xuất Nhật nhìn dự án IT?", "a": "Khách quen **トヨタ生産方式 (Toyota seisan houshiki – Hệ thống sản xuất Toyota, TPS)** với JIT và **自働化 (jidouka – dừng ngay khi có bất thường)**, nên kỳ vọng vendor: ① **見える化 (mieruka – minh bạch hóa)** tiến độ và vấn đề; ② phát hiện bất thường là dừng lại báo ngay, không giấu; ③ **カイゼン (kaizen – cải tiến liên tục)** mỗi kỳ; ④ **なぜなぜ分析 (naze naze bunseki – hỏi \"tại sao\" nhiều lần đến gốc)** khi có lỗi; ⑤ **現地現物 (genchi genbutsu – xem tận nơi, tận vật)**. Tôi dùng chính ngôn ngữ này trong báo cáo.", "t": "Báo cáo lỗi kèm なぜなぜ分析 + 再発防止 là cách \"nói cùng ngôn ngữ\" với khách sản xuất."}, {"n": 975, "c": 10, "g": "10.8", "q": "Dự án IoT/nhà máy thông minh khác dự án phần mềm thuần ở điểm nào?", "a": "① Có thiết bị hiện trường (cảm biến, PLC, gateway), giao thức đa dạng, phải test trên thiết bị thật; ② môi trường nhà máy: mạng hạn chế, quy định an toàn, tuyệt đối không làm dừng dây chuyền; ③ dữ liệu thời gian thực khối lượng lớn; ④ nhiều bên — hãng thiết bị, đơn vị tích hợp, bộ phận sản xuất và IT của khách; ⑤ giá trị đo bằng chỉ số sản xuất. PM cần kế hoạch truy cập hiện trường và lịch làm việc khớp với ca sản xuất.", "t": ""}, {"n": 976, "c": 10, "g": "10.8", "q": "Vì sao nên nói chuyện với khách sản xuất bằng chỉ số như OEE thay vì tính năng phần mềm?", "a": "Người ra quyết định ở nhà máy đo thành công bằng **QCD (Quality, Cost, Delivery)**. **OEE (Overall Equipment Effectiveness)** = tỉ lệ khả dụng × hiệu suất × tỉ lệ chất lượng — ngôn ngữ chung của bộ phận sản xuất. Khi đề xuất hệ thống giám sát, tôi nói \"mục tiêu giảm thời gian dừng máy ngoài kế hoạch ở dây chuyền X\" và đo trước–sau, thay vì \"dashboard realtime đẹp\". Tính năng chỉ là phương tiện; chỉ số sản xuất mới là thứ khách mua.", "t": ""}, {"n": 977, "c": 10, "g": "10.8", "q": "品質管理 trong nhà máy Nhật ảnh hưởng thế nào đến kỳ vọng chất lượng phần mềm?", "a": "Khách sản xuất quen **品質管理 (hinshitsu kanri – quản lý chất lượng)** dựa trên số liệu: kiểm soát quá trình, biểu đồ kiểm soát, phân tích nguyên nhân, tiêu chuẩn rõ cho từng công đoạn. Họ áp cách nghĩ đó lên vendor: muốn thấy chỉ số chất lượng theo từng giai đoạn (review, test), xu hướng lỗi, nguyên nhân gốc, và chất lượng phải được \"làm ra trong quy trình\" chứ không chỉ kiểm ở cuối. Tôi đưa mật độ lỗi theo giai đoạn và phân tích Pareto vào báo cáo định kỳ.", "t": ""}, {"n": 978, "c": 10, "g": "10.8", "q": "Khách sản xuất C muốn dùng AI để kiểm tra ngoại quan sản phẩm. Anh/chị tiếp cận thế nào?", "a": "① Làm rõ bài toán: loại lỗi, tỉ lệ lỗi hiện tại, chi phí kiểm tra thủ công, tốc độ dây chuyền; ② đánh giá dữ liệu: có đủ ảnh lỗi gán nhãn không — lỗi hiếm nên thường thiếu; ③ POC 4–8 tuần (tham khảo) với tiêu chí đo thống nhất trước: tỉ lệ bỏ sót lỗi, tỉ lệ báo nhầm; ④ thiết kế để AI hỗ trợ người kiểm tra trước, chưa thay thế ngay — hợp với tư duy chất lượng của khách. Đo trên dây chuyền thật rồi mới mở rộng.", "t": "Với kiểm tra chất lượng, \"tỉ lệ bỏ sót lỗi\" quan trọng hơn \"độ chính xác chung\" — nói được điều này là điểm cộng."}, {"n": 979, "c": 10, "g": "10.8", "q": "Làm việc với hiện trường nhà máy của khách Nhật cần lưu ý gì?", "a": "**現場 (genba – hiện trường)** có tiếng nói lớn trong doanh nghiệp sản xuất Nhật; hệ thống mà người ở genba không dùng thì thất bại dù phòng IT đã duyệt. Tôi: ① mời đại diện genba tham gia từ giai đoạn yêu cầu, quan sát thao tác thực tế; ② thiết kế cho điều kiện thật — đeo găng, màn hình cảm ứng, tiếng ồn, chữ đơn giản; ③ triển khai thử ở một dây chuyền rồi mới nhân rộng; ④ tuân thủ quy tắc an toàn và lịch sản xuất khi vào nhà máy.", "t": ""}, {"n": 980, "c": 10, "g": "10.8", "q": "Nhiều khách sản xuất Nhật có nhà máy ở Đông Nam Á — đây là cơ hội gì cho vendor Việt Nam?", "a": "Nhà máy của khách ở VN và khu vực cần hệ thống được triển khai, hỗ trợ gần chỗ. Cơ hội: ① hỗ trợ hệ thống cho các nhà máy này — gần về địa lý, có người nói cả tiếng Việt và tiếng Nhật; ② chuẩn hóa hệ thống giữa nhà máy mẹ ở Nhật và các nhà máy con; ③ hỗ trợ đa ngôn ngữ, quy định địa phương. Nếu chi nhánh ĐN chọn mũi nhọn sản xuất, đây là lợi thế nên tận dụng, kèm lưu ý khác biệt quy định, kế toán từng nước.", "t": ""}, {"n": 981, "c": 10, "g": "10.9", "q": "\"2025年の崖\" là gì và tạo ra cơ hội gì cho offshore Việt Nam?", "a": "**2025年の崖 (2025-nen no gake – vách đá năm 2025)** là cảnh báo trong báo cáo DX năm 2018 của **経済産業省 (Keizai Sangyoushou – Bộ Kinh tế, Thương mại và Công nghiệp Nhật, METI)**: nếu doanh nghiệp không xử lý hệ thống legacy phức tạp, lạc hậu, thiếu người duy trì, thiệt hại kinh tế có thể tới khoảng 12 nghìn tỷ yên mỗi năm từ sau 2025. Cơ hội cho offshore: hiện đại hóa, migration, chuyển lên cloud, tài liệu hóa hệ thống cũ, bù nhân lực khi Nhật thiếu kỹ sư.", "t": "Nêu đúng nguồn (METI, 2018) — interviewer đánh giá cao sự chính xác."}, {"n": 982, "c": 10, "g": "10.9", "q": "Thiếu hụt nhân lực IT ở Nhật ảnh hưởng thế nào đến thị trường offshore?", "a": "Tình trạng thiếu kỹ sư IT ở Nhật đã được nhiều báo cáo của chính phủ Nhật (như METI) cảnh báo, do dân số già và nhu cầu số hóa tăng. Tác động: ① khách tìm offshore để có đủ người, không chỉ để giảm chi phí; ② chuộng đội dài hạn ổn định hơn dự án ngắn; ③ sẵn sàng giao upstream nếu vendor đủ năng lực; ④ cạnh tranh giữa các nước offshore gay gắt hơn. Với chi nhánh mới, đây là lý do đầu tư năng lực dài hạn thay vì chỉ cạnh tranh giá.", "t": ""}, {"n": 983, "c": 10, "g": "10.9", "q": "DX ở doanh nghiệp Nhật khác \"số hóa\" đơn thuần thế nào?", "a": "Phân biệt 3 mức: ① **デジタイゼーション (dejitaizeeshon – số hóa dữ liệu)**, ví dụ giấy sang file; ② **デジタライゼーション (dejitaraizeeshon – số hóa quy trình)**, ví dụ tự động hóa luồng phê duyệt; ③ **DX** — đổi mô hình kinh doanh và văn hóa bằng công nghệ. Nhiều doanh nghiệp Nhật còn ở mức ①② và vướng hệ thống cũ, văn hóa con dấu, giấy tờ. Vendor có giá trị khi giúp khách đi từng bước có kết quả đo được, thay vì bán khái niệm DX chung chung.", "t": "Phân biệt 3 mức này cho thấy bạn không dùng \"DX\" như từ khóa marketing."}, {"n": 984, "c": 10, "g": "10.9", "q": "GenAI/AI agent đang thay đổi dự án outsourcing thế nào, PM chuẩn bị gì?", "a": "Thay đổi: năng suất một số việc (code, test, tài liệu) tăng; khách bắt đầu hỏi \"đã dùng AI chưa, giá có giảm không\"; xuất hiện dự án tích hợp AI vào nghiệp vụ. PM chuẩn bị: ① chính sách dùng AI được khách đồng ý — dữ liệu nào được đưa vào công cụ nào; ② đo năng suất thật trước–sau trên dự án pilot; ③ cập nhật quy trình review cho code do AI sinh; ④ xây năng lực làm dự án AI để chuyển từ bán giờ công sang bán giá trị.", "t": "Bẫy: hứa \"AI giảm 30–50% chi phí\" khi chưa đo — khách Nhật sẽ đòi đúng con số đó trong hợp đồng."}, {"n": 985, "c": 10, "g": "10.9", "q": "Việt Nam cạnh tranh thế nào với Ấn Độ, Philippines, Trung Quốc trên thị trường offshore Nhật?", "a": "Nhận định chung: Việt Nam có kỹ sư trẻ, số người học tiếng Nhật đáng kể, văn hóa làm việc khá gần Nhật, quan hệ hai nước tốt, chi phí hợp lý. Ấn Độ mạnh quy mô và tiếng Anh nhưng vướng rào cản tiếng Nhật; Trung Quốc từng là điểm offshore lớn của Nhật, nhưng chi phí tăng và rủi ro địa chính trị khiến khách đa dạng hóa; Philippines mạnh BPO và tiếng Anh. Lợi thế giá của VN sẽ mỏng dần, nên phải cạnh tranh bằng năng lực và chất lượng.", "t": ""}, {"n": 986, "c": 10, "g": "10.9", "q": "Yên yếu ảnh hưởng thế nào đến dự án offshore, công ty và PM nên ứng phó ra sao?", "a": "Hợp đồng với khách Nhật thường tính bằng yên, chi phí ở VN trả bằng VND, nên yên yếu làm doanh thu quy đổi giảm trong khi lương không giảm → margin bị ép. Ứng phó: ① đàm phán điều chỉnh rate theo kỳ có căn cứ năng suất, giá trị; ② tăng năng suất, tối ưu cơ cấu đội; ③ đa dạng thị trường — JD nêu cả Hàn, Singapore; ④ chuyển sang dịch vụ giá trị cao hơn. PM cần hiểu để không hứa giảm giá thêm khi margin đã mỏng.", "t": ""}, {"n": 987, "c": 10, "g": "10.9", "q": "Khách Nhật đang chuyển từ tìm \"giá rẻ\" sang tìm \"năng lực\" — dấu hiệu là gì và vendor phải làm gì?", "a": "Dấu hiệu (nhận định từ thị trường): ① khách hỏi năng lực upstream — 要件定義, 基本設計, tư vấn kiến trúc; ② yêu cầu kỹ năng cloud, bảo mật, AI và chứng chỉ cụ thể; ③ đánh giá vendor theo chất lượng, độ ổn định đội, tiếng Nhật chứ không chỉ đơn giá; ④ muốn hợp tác dài hạn. Vendor phải đầu tư đào tạo, chứng chỉ, domain — JD có hỗ trợ thi Cloud/AWS/PMP và đào tạo tiếng Nhật, và chi nhánh mới nên xây theo hướng này ngay từ đầu.", "t": ""}, {"n": 988, "c": 10, "g": "10.9", "q": "JD nhắc cả khách Hàn và Singapore — làm việc với các thị trường này khác Nhật ở điểm nào?", "a": "Nhận định chung, mỗi khách vẫn khác: khách Hàn thường ưu tiên tốc độ, quyết định nhanh, đổi yêu cầu nhiều — PM phải quản lý thay đổi chặt, phản hồi nhanh. Khách Singapore thường làm bằng tiếng Anh, hợp đồng theo thông lệ quốc tế, nhiều dự án mang tính khu vực. Khách Nhật coi trọng tài liệu, chuẩn bị kỹ, đồng thuận và chất lượng chi tiết. Đa dạng thị trường giúp giảm phụ thuộc một khách, một đồng tiền, nhưng cần đội tách bạch về ngôn ngữ và cách làm.", "t": ""}, {"n": 989, "c": 10, "g": "10.9", "q": "Xu hướng chuyển hệ thống lên cloud ở doanh nghiệp Nhật mang lại cơ hội gì cho chi nhánh?", "a": "Doanh nghiệp Nhật, kể cả ngành tài chính, đang dịch chuyển dần lên cloud theo hướng có kiểm soát. Cơ hội: ① migration và hiện đại hóa ứng dụng; ② vận hành, giám sát, tối ưu chi phí cloud; ③ bảo mật và tuân thủ trên cloud; ④ DevOps, tự động hóa hạ tầng. Chi nhánh có thể xây đội cloud ngay từ đầu, tận dụng chính sách hỗ trợ thi Cloud/AWS trong JD để có chứng chỉ mà khách thường yêu cầu khi chọn vendor.", "t": ""}, {"n": 990, "c": 10, "g": "10.9", "q": "Theo anh/chị, trong 3–5 năm tới vai trò offshore Việt Nam cho thị trường Nhật sẽ thay đổi thế nào?", "a": "Nhận định có lập luận: ① từ \"đội code theo thiết kế\" sang \"đối tác cả vòng đời\" — tham gia upstream và vận hành; ② việc lặp lại được AI làm nhanh hơn, giá trị dịch chuyển sang domain, thiết kế, chất lượng, tích hợp AI; ③ mô hình đội dài hạn tăng vì Nhật thiếu người; ④ cạnh tranh bằng giá yếu dần do chi phí VN tăng và yên biến động. Vendor xây được domain và năng lực upstream sẽ thắng — đó cũng là hướng tôi muốn góp cho chi nhánh Đà Nẵng.", "t": ""}, {"n": 991, "c": 10, "g": "10.10", "q": "Ngoài giao hàng dự án, Senior PM có thể đóng góp gì cho công ty?", "a": "Bốn hướng đo được: ① **process** — cải tiến template, checklist, chia sẻ bài học giữa dự án; ② **pre-sales** — estimate, viết proposal tiếng Nhật, tham gia gặp khách tiềm năng; ③ **đào tạo** — mentor PM/leader kế cận, dạy quy trình Nhật cho fresher; ④ **tài sản** — gom thành phần tái sử dụng, viết case study. Tôi đặt mục tiêu cụ thể cho mỗi kỳ review (công ty review 2 lần/năm), ví dụ \"đào tạo 1 PM dự bị, hỗ trợ 3 proposal\".", "t": ""}, {"n": 992, "c": 10, "g": "10.10", "q": "Tầm nhìn 1–3 năm của anh/chị cho chi nhánh Đà Nẵng là gì?", "a": "Năm 1 — **giao hàng tin cậy**: dự án mồi thành công, process đồng bộ, đội lõi đủ leader, khách quen với \"đội Đà Nẵng\". Năm 2 — **tự chủ**: tự làm pre-sales và estimate cho dự án vừa, có 1–2 mũi nhọn domain/công nghệ, tỉ lệ leader là người ĐN tăng. Năm 3 — **trung tâm năng lực**: được khách chọn đích danh, có giải pháp/tài sản riêng, đóng góp vào định hướng sản phẩm riêng của công ty. Mỗi năm có chỉ số đo và review cùng lãnh đạo.", "t": "Nói tầm nhìn theo năm kèm chỉ số; tránh khẩu hiệu kiểu \"trở thành chi nhánh số 1\"."}, {"n": 993, "c": 10, "g": "10.10", "q": "Làm sao xây sản phẩm riêng/IP từ các dự án outsourcing?", "a": "JD nêu công ty muốn phát triển sản phẩm riêng; lộ trình tôi thấy hợp lý: ① nhận diện phần lặp lại giữa nhiều dự án (phân quyền, xuất 帳票, xử lý chứng từ, khung test tự động); ② tách thành thành phần tái sử dụng **không chứa** mã hay dữ liệu thuộc quyền khách; ③ dùng nội bộ trước để chứng minh giảm effort; ④ đóng gói thành giải pháp bán được. Điều kiện tiên quyết: kiểm tra điều khoản sở hữu trí tuệ trong hợp đồng — phần lớn sản phẩm làm cho khách thuộc về khách.", "t": "Bẫy lớn: dùng code của khách làm sản phẩm riêng — vi phạm hợp đồng và mất niềm tin; luôn nói rõ ranh giới IP."}, {"n": 994, "c": 10, "g": "10.10", "q": "Anh/chị đo thành công của chi nhánh bằng những chỉ số nào?", "a": "Bảng cân bằng 4 nhóm: ① **khách hàng** — mức hài lòng, tỉ lệ gia hạn/mở rộng, số khách chọn ĐN đích danh; ② **tài chính** — doanh thu, gross margin, billable rate, bench; ③ **delivery** — tỉ lệ đúng hạn, defect sau release, 0 sự cố bảo mật; ④ **con người** — attrition, số leader phát triển nội bộ, tỉ lệ có chứng chỉ/tiếng Nhật. Chỉ nhìn doanh thu là nguy hiểm: tăng nhanh mà attrition cao, chất lượng giảm thì năm sau phải trả giá.", "t": ""}, {"n": 995, "c": 10, "g": "10.10", "q": "Nếu được làm Giám đốc chi nhánh Đà Nẵng trong 1 ngày, anh/chị sẽ làm gì?", "a": "Tôi không ra quyết định lớn trong một ngày; tôi dùng nó để nhìn toàn hệ thống: ① buổi sáng xem pipeline, P&L, bench, chất lượng các dự án; ② gặp nhanh từng PM/leader với một câu hỏi \"điều gì đang cản em nhất\"; ③ gọi một khách quan trọng để nghe trực tiếp; ④ cuối ngày chọn **một** việc tác động lớn nhất — ví dụ kế hoạch BrSE dự phòng — giao cho người phụ trách kèm hạn và chỉ số. Một ngày để hiểu và chọn ưu tiên, không phải để thay đổi mọi thứ.", "t": "Câu này kiểm tra khả năng ưu tiên — \"một việc tác động lớn nhất\" ghi điểm hơn một danh sách dài."}, {"n": 996, "c": 10, "g": "10.10", "q": "Khi mục tiêu ngắn hạn (doanh thu quý) xung đột với mục tiêu dài hạn (đào tạo, chất lượng), anh/chị chọn thế nào?", "a": "Tôi không chọn tuyệt đối một bên mà đặt **\"sàn\" cho dài hạn**: không cắt đào tạo dưới mức tối thiểu, không bỏ review/test để kịp doanh thu; phần còn lại tối ưu cho ngắn hạn. Khi buộc phải đánh đổi, tôi lượng hóa: cắt đào tạo quý này tiết kiệm bao nhiêu, quý sau thiếu người cho đơn mới thì mất bao nhiêu — rồi trình lãnh đạo quyết bằng số liệu. Mất niềm tin khách Nhật vì chất lượng là cái giá dài hạn đắt nhất.", "t": ""}, {"n": 997, "c": 10, "g": "10.10", "q": "Làm sao để tỉ lệ thắng proposal của chi nhánh tăng lên theo thời gian?", "a": "Tôi coi pre-sales là một quy trình cải tiến được: ① trước khi viết, đặt câu hỏi để hiểu vấn đề và bối cảnh khách tốt hơn đối thủ; ② thể chế đội nêu người thật, có kinh nghiệm tương tự; ③ nêu thẳng rủi ro và cách kiểm soát — khách Nhật tin vendor thấy rủi ro hơn vendor hứa không có rủi ro; ④ thắng hay thua đều xin feedback, ghi lý do vào một bảng chung. Theo dõi tỉ lệ thắng theo loại khách, domain để biết nên tập trung vào đâu.", "t": "\"Thua cũng xin feedback\" — ít vendor làm, nhưng giúp hiểu tiêu chí thật của khách."}, {"n": 998, "c": 10, "g": "10.10", "q": "Chi nhánh phải chọn giữa nhận một khách mới lớn nhưng rủi ro, hoặc tập trung mở rộng khách cũ. Anh/chị tư vấn thế nào?", "a": "Tôi đánh giá: năng lực hiện có đáp ứng không; rủi ro tập trung — khách cũ đang chiếm bao nhiêu % doanh thu; margin dự kiến; giá trị chiến lược (domain mới, thương hiệu); và chi phí cơ hội — dồn leader giỏi cho khách mới thì ai giữ khách cũ. Thường tôi đề xuất: chất lượng khách cũ là ưu tiên số một, nhận khách mới khi có đội lõi riêng và quy mô khởi đầu vừa phải. Nếu khách cũ đã chiếm tỉ trọng quá lớn, có thêm khách mới chính là giảm rủi ro.", "t": ""}, {"n": 999, "c": 10, "g": "10.10", "q": "Làm sao để chi nhánh Đà Nẵng có tiếng nói trong định hướng chung của công ty, không chỉ là \"nơi nhận việc\"?", "a": "① Có kết quả đo được để nói — chất lượng, margin, khách hài lòng; ② đưa đề xuất có số liệu lên lãnh đạo, ví dụ một mô hình fresher kèm tiếng Nhật hiệu quả có thể nhân rộng toàn công ty; ③ xây năng lực mà site khác chưa có — domain, công nghệ, giải pháp; ④ tham gia các sáng kiến chung: chuẩn hóa process, đào tạo, pre-sales. Tiếng nói đến từ đóng góp được ghi nhận, không phải từ việc đòi quyền.", "t": ""}, {"n": 1000, "c": 10, "g": "10.10", "q": "Nếu công ty muốn Đà Nẵng trở thành delivery center chiến lược, theo anh/chị điều gì quyết định thành bại?", "a": "Theo tôi là **đội lãnh đạo tầng giữa** — PM, tech lead, BrSE. Hạ tầng và quy trình có thể kế thừa từ HQ trong vài tháng, khách có thể được giới thiệu, nhưng chỉ đội leader giỏi và gắn bó với Đà Nẵng mới tạo ra chất lượng ổn định và niềm tin lâu dài của khách Nhật. Vì vậy ưu tiên của tôi là: dự án mồi thành công, xây leader kế cận ngay từ năm đầu, và giữ chuẩn chất lượng không thỏa hiệp — đó cũng là phần tôi muốn đóng góp trực tiếp.", "t": "Kết bằng một luận điểm rõ và nối với vai trò của bạn — để lại ấn tượng chiến lược mà cụ thể."}]};
const KEY = "pm-jp-known-v1", MKEY = "pm-jp-mode-v1";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let known = new Set(store.get(KEY, []));
const state = { ch: 0, grp: null, text: "", mode: store.get(MKEY, "read"), filter: "all", limit: 120, revealed: new Set() };

const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
DATA.items.forEach(it => { it._f = fold(it.q + " " + it.a + " " + it.t + " q" + it.n); });
const chMap = Object.fromEntries(DATA.chapters.map(c => [c.n, c]));
const grpTitle = {}; DATA.chapters.forEach(c => c.groups.forEach(g => grpTitle[g.id] = g.title));

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function md(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
  return h;
}
function hl(html, term) {
  if (!term) return html;
  const t = term.trim(); if (t.length < 2) return html;
  const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return html.split(/(<[^>]+>)/).map(p => p.startsWith("<") ? p : p.replace(re, "<mark>$1</mark>")).join("");
}

function filtered() {
  const t = fold(state.text.trim());
  return DATA.items.filter(it =>
    (!state.ch || it.c === state.ch) &&
    (!state.grp || it.g === state.grp) &&
    (state.filter === "all" || (state.filter === "done") === known.has(it.n)) &&
    (!t || it._f.includes(t)));
}

function card(it) {
  const hide = state.mode === "test" && !state.revealed.has(it.n);
  const term = state.text;
  return `<article class="q" id="q${it.n}">
    <div class="num">Q${it.n}</div>
    <p class="qt">${hl(md(it.q), term)}</p>
    <button class="stamp" data-k="${it.n}" aria-pressed="${known.has(it.n)}" title="Đánh dấu đã thuộc">${known.has(it.n) ? "済" : "✓"}</button>
    ${hide ? `<button class="btn reveal" data-r="${it.n}">Xem đáp án</button>` :
      `<p class="ans">${hl(md(it.a), term)}</p>${it.t ? `<p class="tip">${hl(md(it.t), term)}</p>` : ""}`}
  </article>`;
}

function render() {
  const items = filtered();
  const shown = items.slice(0, state.limit);
  let html = "", lastC = 0, lastG = "";
  for (const it of shown) {
    if (it.c !== lastC) { html += `<h2 class="ch-title">Chương ${it.c} · ${esc(chMap[it.c].title)}</h2>`; lastC = it.c; lastG = ""; }
    if (it.g !== lastG) { html += `<h3 class="grp-title">${esc(it.g)} ${esc(grpTitle[it.g] || "")}</h3>`; lastG = it.g; }
    html += card(it);
  }
  document.getElementById("list").innerHTML = html || `<p class="empty">Không có câu nào khớp. Thử bỏ bớt bộ lọc hoặc gõ từ khóa khác.</p>`;
  document.getElementById("more").hidden = items.length <= state.limit;
  const scope = state.grp ? `nhóm ${state.grp}` : state.ch ? `chương ${state.ch}` : "tất cả chương";
  document.getElementById("status").textContent = `${items.length} câu · ${scope}${state.text ? ` · khớp “${state.text}”` : ""}${items.length > state.limit ? ` · đang hiện ${state.limit}` : ""}`;
  progress();
}

function progress() {
  const n = known.size;
  document.getElementById("pnum").textContent = `${n}/${DATA.items.length}`;
  document.getElementById("pbar").style.width = (n / DATA.items.length * 100) + "%";
  DATA.chapters.forEach(c => {
    const el = document.getElementById("cnt" + c.n);
    if (el) el.textContent = `${DATA.items.filter(i => i.c === c.n && known.has(i.n)).length}/${DATA.items.filter(i => i.c === c.n).length}`;
  });
}

function buildNav() {
  const chips = [`<button class="chip" data-c="0" aria-pressed="true">Tất cả</button>`]
    .concat(DATA.chapters.map(c => `<button class="chip" data-c="${c.n}" aria-pressed="false">${c.n}. ${esc(c.title)}</button>`));
  document.getElementById("chips").innerHTML = chips.join("");
  document.getElementById("index").innerHTML = `<h2>Mục lục</h2>` + DATA.chapters.map(c => `
    <div class="ch"><button data-c="${c.n}"><span>${c.n}. ${esc(c.title)}</span><span id="cnt${c.n}"></span></button>
    <ul>${c.groups.map(g => `<li><button data-g="${g.id}" data-c="${c.n}" aria-pressed="false">${esc(g.id)} ${esc(g.title)}</button></li>`).join("")}</ul></div>`).join("");
}

function syncPressed() {
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.c === state.ch)));
  document.querySelectorAll("nav.index li button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.g === state.grp)));
  ["read", "test"].forEach(m => document.getElementById("m-" + m).setAttribute("aria-pressed", String(state.mode === m)));
  ["all", "todo", "done"].forEach(f => document.getElementById("f-" + f).setAttribute("aria-pressed", String(state.filter === (f === "todo" ? "todo" : f))));
}

function go() { state.limit = 120; syncPressed(); render(); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.classList.contains("chip")) { state.ch = +b.dataset.c; state.grp = null; go(); return; }
  if (b.dataset.g) { state.ch = +b.dataset.c; state.grp = state.grp === b.dataset.g ? null : b.dataset.g; go(); window.scrollTo({ top: 0 }); return; }
  if (b.closest("nav.index") && b.dataset.c) { state.ch = +b.dataset.c; state.grp = null; go(); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.k) {
    const n = +b.dataset.k; known.has(n) ? known.delete(n) : known.add(n); store.set(KEY, [...known]);
    b.setAttribute("aria-pressed", String(known.has(n))); b.textContent = known.has(n) ? "済" : "✓"; progress(); return;
  }
  if (b.dataset.r) { state.revealed.add(+b.dataset.r); const it = DATA.items.find(i => i.n === +b.dataset.r); b.closest("article").outerHTML = card(it); return; }
  if (b.id === "m-read" || b.id === "m-test") { state.mode = b.id === "m-read" ? "read" : "test"; state.revealed.clear(); store.set(MKEY, state.mode); go(); return; }
  if (b.id.startsWith("f-")) { state.filter = b.id.slice(2); go(); return; }
  if (b.id === "more") { state.limit += 200; render(); return; }
  if (b.id === "rand") {
    const pool = filtered(); if (!pool.length) return;
    const it = pool[Math.floor(Math.random() * pool.length)];
    const idx = pool.indexOf(it); if (idx >= state.limit) { state.limit = idx + 20; render(); }
    const el = document.getElementById("q" + it.n);
    if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1800); }
  }
});
let tmr; document.getElementById("q").addEventListener("input", e => { clearTimeout(tmr); tmr = setTimeout(() => { state.text = e.target.value; go(); }, 160); });

buildNav(); syncPressed(); render();
</script>
