<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn phỏng vấn Senior PM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lexend:wght@500;600;700&family=Noto+Sans+JP:wght@400;600&display=swap">
<style>
/* Layout: sổ ôn tập kiểu 帳票 — cột mục lục trái, danh sách phiếu câu hỏi phải; thanh công cụ dính trên */
:root {
  --paper: #f5f7fa;
  --sheet: #ffffff;
  --ink: #18212f;
  --muted: #5b6676;
  --line: #dde3ea;
  --ai: #24508f;          /* 藍 indigo — accent */
  --ai-soft: #e6eef9;
  --shu: #c2412b;         /* 朱 — con dấu "đã thuộc" */
  --shu-soft: #fbe9e5;
  --tip: #f3f0e4;
  --tip-ink: #5a4b17;
  --mark: #fff1a8;
  --font-display: "Lexend", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-jp: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141c; --sheet: #161d28; --ink: #e5e9ef; --muted: #9aa5b5; --line: #273142;
    --ai: #86aee8; --ai-soft: #1c2b42; --shu: #e98068; --shu-soft: #3a211c;
    --tip: #262316; --tip-ink: #e2d39a; --mark: #5b4f12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141c; --sheet: #161d28; --ink: #e5e9ef; --muted: #9aa5b5; --line: #273142;
  --ai: #86aee8; --ai-soft: #1c2b42; --shu: #e98068; --shu-soft: #3a211c;
  --tip: #262316; --tip-ink: #e2d39a; --mark: #5b4f12; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.6 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 64px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
h1 { font: 700 clamp(22px, 3.2vw, 30px)/1.2 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
.progress { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.progress .bar { width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--shu); transition: width .3s; }
.progress b { font: 600 15px var(--font-display); }

.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper);
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-block: 12px;
  border-bottom: 1px solid var(--line);
}
.search { flex: 1 1 260px; min-width: 0; position: relative; }
.search input {
  width: 100%; font: inherit; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--sheet); color: var(--ink);
}
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.seg button { font: 500 13px var(--font-body); padding: 8px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ai); color: var(--sheet); }
.btn { font: 500 13px var(--font-body); padding: 8px 12px; border: 1px solid var(--ai); color: var(--ai); background: var(--sheet); border-radius: 8px; cursor: pointer; }
.btn:hover { background: var(--ai-soft); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px 2px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; font: 500 13px var(--font-body); padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-soft); color: var(--ai); }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; margin-top: 16px; }
nav.index { position: sticky; top: 132px; align-self: start; max-height: calc(100vh - 150px); overflow-y: auto; padding-right: 6px; font-size: 13.5px; }
nav.index h2 { font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
nav.index .ch { margin-bottom: 10px; }
nav.index .ch > button { display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left; font: 600 13.5px var(--font-body); color: var(--ink); background: none; border: 0; padding: 4px 0; cursor: pointer; }
nav.index .ch > button span:last-child { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
nav.index ul { list-style: none; margin: 2px 0 0; padding: 0 0 0 10px; border-left: 1px solid var(--line); }
nav.index li button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 3px 6px; color: var(--muted); font: 13px/1.4 var(--font-body); cursor: pointer; border-radius: 4px; }
nav.index li button:hover, nav.index li button[aria-pressed="true"] { color: var(--ai); background: var(--ai-soft); }

.status { color: var(--muted); font-size: 13px; margin: 0 0 10px; font-variant-numeric: tabular-nums; }
.grp-title { font: 600 13px var(--font-display); color: var(--ai); text-transform: uppercase; letter-spacing: .06em; margin: 26px 0 8px; }
.grp-title:first-child { margin-top: 0; }
.ch-title { font: 700 20px/1.3 var(--font-display); margin: 34px 0 4px; padding-top: 12px; border-top: 2px solid var(--ink); text-wrap: balance; }
.ch-title:first-child { margin-top: 0; }

article.q { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 4px 14px; padding: 14px 16px; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
article.q.flash { box-shadow: 0 0 0 2px var(--ai); }
.num { font: 600 13px var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.qt { font-weight: 600; margin: 0; line-height: 1.5; }
.ans { grid-column: 2 / 4; margin: 6px 0 0; }
.ans code { font: 13px var(--font-jp); background: var(--ai-soft); color: var(--ai); padding: 1px 5px; border-radius: 4px; }
.tip { grid-column: 2 / 4; margin: 8px 0 0; padding: 7px 10px; background: var(--tip); color: var(--tip-ink); border-radius: 4px; font-size: 14px; }
.tip::before { content: "Mẹo"; font: 600 11px var(--font-display); letter-spacing: .06em; text-transform: uppercase; margin-right: 8px; }
.reveal { grid-column: 2 / 4; justify-self: start; margin-top: 8px; }
mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }

.stamp { width: 40px; height: 40px; border-radius: 50%; border: 2px dashed var(--line); background: transparent; color: var(--muted); font: 600 12px var(--font-jp); cursor: pointer; display: grid; place-items: center; }
.stamp:hover { border-color: var(--shu); color: var(--shu); }
.stamp[aria-pressed="true"] { border: 2px solid var(--shu); color: var(--shu); background: var(--shu-soft); transform: rotate(-12deg); font-size: 15px; }

.empty { padding: 40px 0; text-align: center; color: var(--muted); }
.more { display: block; margin: 16px auto 0; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.index { display: none; }
  .progress .bar { width: 100px; }
}
@media (max-width: 520px) {
  article.q { grid-template-columns: minmax(0, 1fr) auto; padding: 12px; }
  .num { grid-column: 1 / 3; }
  .qt { grid-column: 1 / 2; }
  .ans, .tip, .reveal { grid-column: 1 / 3; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Ôn phỏng vấn Senior PM</h1>

    <button class="btn" id="rand">Câu ngẫu nhiên</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Chương"></div>

  <div class="layout">
    <nav class="index" id="index" aria-label="Mục lục"></nav>
    <main>
      <p class="status" id="status"></p>
      <div id="list"></div>
      <button class="btn more" id="more" hidden>Hiện thêm</button>
    </main>
  </div>
</div>

quyết định kiểu Nhật"}, {"id": "7.3", "title": "Họp & tài liệu giao tiếp"}, {"id": "7.4", "title": "Vai trò cầu nối BrSE, comtor, onsite"}, {"id": "7.5", "title": "Ngôn ngữ & ngầm ý"}, {"id": "7.6", "title": "Báo tin xấu & xin lỗi"}, {"id": "7.7", "title": "Nói \"không\" & đàm phán mềm"}, {"id": "7.8", "title": "Lịch & nhịp kinh doanh Nhật"}, {"id": "7.9", "title": "Xây niềm tin & quản trị kỳ vọng"}, {"id": "7.10", "title": "Business etiquette & khác biệt thị trường"}]}, {"n": 8, "title": "Tình huống thực tế dự án với khách Nhật", "groups": [{"id": "8.1", "title": "Trễ tiến độ & 納期 cứng"}, {"id": "8.2", "title": "Sự cố 本番 & 障害"}, {"id": "8.3", "title": "Yêu cầu mơ hồ & thay đổi"}, {"id": "8.4", "title": "Khiếu nại chất lượng & mất niềm tin"}, {"id": "8.5", "title": "Onsite–offshore & cầu nối"}, {"id": "8.6", "title": "Nguồn lực"}, {"id": "8.7", "title": "Chi phí & hợp đồng"}, {"id": "8.8", "title": "Xung đột & stakeholder"}, {"id": "8.9", "title": "Bảo mật & tuân thủ"}, {"id": "8.10", "title": "Tình huống xám, đạo đức & tổng hợp"}]}, {"n": 9, "title": "Quản lý nguồn lực & phát triển đội ngũ", "groups": [{"id": "9.1", "title": "Cơ cấu team offshore cho dự án Nhật"}, {"id": "9.2", "title": "Team building & gắn kết"}, {"id": "9.3", "title": "Tạo động lực & truyền lửa"}, {"id": "9.4", "title": "Mentoring & coaching"}, {"id": "9.5", "title": "Đánh giá hiệu suất (review 2 lần/năm)"}, {"id": "9.6", "title": "Low performer & kỷ luật"}, {"id": "9.7", "title": "Xung đột nội bộ"}, {"id": "9.8", "title": "OT, burnout & sức khỏe team"}, {"id": "9.9", "title": "Retention & quản lý tri thức"}, {"id": "9.10", "title": "Tuyển, onboard cấp dự án & phong cách lãnh đạo"}]}, {"n": 10, "title": "Chiến lược, kinh doanh, domain & phát triển chi nhánh Đà Nẵng", "groups": [{"id": "10.1", "title": "Setup chi nhánh mới tại Đà Nẵng"}, {"id": "10.2", "title": "Tuyển dụng & talent pool Đà Nẵng"}, {"id": "10.3", "title": "Mô hình delivery center & chuyển giao dự án"}, {"id": "10.4", "title": "Kinh tế dự án & chi nhánh"}, {"id": "10.5", "title": "Account management & tăng trưởng"}, {"id": "10.6", "title": "Domain tài chính – ngân hàng Nhật"}, {"id": "10.7", "title": "Domain bảo hiểm"}, {"id": "10.8", "title": "Domain sản xuất"}, {"id": "10.9", "title": "Xu hướng thị trường Nhật & offshore"}, {"id": "10.10", "title": "Tư duy chiến lược của Senior PM"}]}], "items": [{"n": 1, "c": 1, "g": "1.1", "q": "Hãy giới thiệu bản thân trong khoảng 60–90 giây.", "a": "Dùng khung **Hiện tại – Quá khứ – Tương lai**: ① hiện tại: vai trò, domain, quy mô đang quản lý; ② quá khứ: 2 mốc chuyển (dev → lead/BrSE → PM) kèm 1 kết quả đo được; ③ tương lai: vì sao Senior PM tại VTI Đà Nẵng là bước tiếp theo hợp lý. Ví dụ: \"Em có X năm IT, Y năm làm PM offshore cho khách Nhật mảng tài chính, team lớn nhất 25 người…\". Độ dài khi nói khoảng 150–220 chữ là vừa (tham khảo).", "t": "Kết bằng một câu nối sang JD để interviewer tự hỏi tiếp đúng vùng bạn mạnh nhất."}, {"n": 2, "c": 1, "g": "1.1", "q": "Kể ngắn hành trình từ kỹ thuật lên PM của bạn.", "a": "Kể theo mốc có lý do chuyển, không đọc lại CV: ① giai đoạn dev/tester cho em nền estimate và review; ② giai đoạn lead/BrSE là lúc bắt đầu chịu trách nhiệm người và khách; ③ PM là lúc chịu trách nhiệm tiến độ–chất lượng–chi phí. Mỗi mốc nêu 1 thói quen mang theo, ví dụ \"từ thời dev, em luôn bóc WBS đến task ≤ 2 ngày để kiểm estimate của team\". Nhấn rằng em *chủ động chọn* làm PM, không phải \"sếp thiếu người nên đẩy lên\".", "t": ""}, {"n": 3, "c": 1, "g": "1.1", "q": "Dự án nổi bật nhất bạn từng quản lý là gì?", "a": "Chọn dự án gần JD nhất (khách Nhật, domain tài chính/bảo hiểm/sản xuất nếu có) và kể theo STAR rút gọn: bối cảnh (quy mô, mô hình, team), thách thức chính, 2–3 hành động của chính em, kết quả đo được. Ví dụ: \"hệ thống cho ngân hàng A, 18 người, 9 tháng, có chuyển đổi dữ liệu từ hệ thống cũ; em lập kế hoạch chạy thử migration 3 lần trước ngày chuyển đổi, go-live không phát sinh sự cố nghiêm trọng\". Thuộc lòng 3 con số: team, man-month, kết quả.", "t": ""}, {"n": 4, "c": 1, "g": "1.1", "q": "Quy mô team và ngân sách lớn nhất bạn từng chịu trách nhiệm là bao nhiêu?", "a": "Trả lời bằng số và nói rõ phạm vi quyền hạn: team bao nhiêu người (offshore, onsite, BrSE), bao nhiêu man-month (MM), em chỉ theo dõi effort hay chịu cả lãi lỗ dự án. Nếu số tiền là bảo mật, quy ra MM và tỉ lệ: \"khoảng 200 MM, em theo dõi effort hằng tuần, cuối dự án lệch so với kế hoạch dưới 5%\".", "t": "Đừng thổi số; câu hỏi tiếp theo thường là \"team đó chia mấy nhóm, mấy lead\" — trả lời không khớp là mất điểm tin cậy."}, {"n": 5, "c": 1, "g": "1.1", "q": "Bạn đã làm với những mô hình dự án/hợp đồng nào?", "a": "Liệt kê ngắn các mô hình đã trải: ① trọn gói theo 請負 (ukeoi – hợp đồng nhận khoán, cam kết kết quả); ② 準委任 (jun-inin – hợp đồng theo công, cam kết nỗ lực) hoặc T&M; ③ ODC/Labo (team chuyên trách theo tháng). Mỗi loại nói 1 câu về cách quản trị khác nhau: trọn gói giữ chặt phạm vi và change request, Labo tập trung năng suất và giữ người. Mục tiêu là chứng minh em đã \"sống\" trong từng bối cảnh, không cần đọc điều khoản.", "t": ""}, {"n": 6, "c": 1, "g": "1.1", "q": "Domain nào bạn hiểu sâu nhất và điều đó giúp gì cho vai trò PM?", "a": "Nêu 1–2 domain kèm bằng chứng hiểu sâu: nghiệp vụ cụ thể (đối soát giao dịch, thẩm định hợp đồng bảo hiểm, quản lý dây chuyền), thuật ngữ khách dùng, ràng buộc đặc thù như audit, bảo mật, batch cuối ngày. Giá trị cho PM: hỏi đúng câu khi làm 要件定義 (youken teigi – định nghĩa yêu cầu), phát hiện sớm yêu cầu ngầm, estimate sát hơn. Domain chưa khớp JD thì nói cách em học domain mới trong 4–6 tuần đầu.", "t": ""}, {"n": 7, "c": 1, "g": "1.1", "q": "Một tuần làm việc điển hình của bạn ở vai trò hiện tại diễn ra thế nào?", "a": "Mô tả nhịp cố định: đầu tuần chốt kế hoạch tuần và top 5 rủi ro; hằng ngày daily 15 phút và xem issue mới; giữa tuần họp 定例会 (teireikai – họp định kỳ) với khách, gửi báo cáo tiến độ; cuối tuần so effort thực tế với kế hoạch, review chất lượng, 1:1 luân phiên. Nhắc thêm 1 công cụ em tự dựng (dashboard, template báo cáo) để chứng minh vận hành có hệ thống chứ không chỉ chữa cháy.", "t": ""}, {"n": 8, "c": 1, "g": "1.1", "q": "Điều gì khiến bạn xứng đáng với chữ \"Senior\" chứ không phải PM trung cấp?", "a": "Senior khác ở phạm vi ảnh hưởng: ① chịu trách nhiệm kết quả kinh doanh (biên lợi nhuận, khả năng gia hạn), không chỉ tiến độ; ② xử lý tình huống xám chưa có quy trình, như khách đổi chiến lược giữa dự án; ③ phát triển người — đào tạo được lead/PM kế cận; ④ đóng góp cho tổ chức: chuẩn hóa template, chia sẻ bài học sang dự án khác. Chuẩn bị 1 ví dụ cho mỗi ý.", "t": "Đừng định nghĩa Senior bằng số năm; hãy nói bằng mức độ tự chủ và phạm vi bạn tác động."}, {"n": 9, "c": 1, "g": "1.1", "q": "Nếu đồng nghiệp cũ mô tả bạn bằng 3 từ, họ sẽ nói gì?", "a": "Chọn 3 từ khớp vai trò, mỗi từ kèm 1 bằng chứng hành vi. Ví dụ \"rõ ràng – bình tĩnh – giữ lời\": rõ ràng vì mọi task có owner và deadline trên board; bình tĩnh vì khi có lỗi production em khoanh vùng trước rồi mới báo; giữ lời vì cam kết với khách luôn có buffer. Muốn tăng độ tin, thêm 1 nhận xét \"chưa hay\" em từng được góp ý và đang sửa.", "t": ""}, {"n": 10, "c": 1, "g": "1.1", "q": "Bạn đã làm việc trực tiếp với khách Nhật ở mức độ nào?", "a": "Nói rõ mức tiếp xúc thật: làm qua BrSE hay trực tiếp; có chủ trì họp, review, nghiệm thu không; có đi onsite không, bao lâu; đã tự xử lý escalation chưa. Ví dụ: \"em chủ trì họp tuần với khách bảo hiểm B, trực tiếp báo cáo sự cố theo 報連相 (hou-ren-sou – báo cáo, liên lạc, thảo luận)\". Nếu tiếng Nhật còn hạn chế, nêu cách em phối hợp với BrSE để thông tin không bị lệch.", "t": "Câu này phân loại ứng viên rất nhanh: chỉ làm qua BrSE thì nói thật, rồi chứng minh bạn kiểm soát chất lượng giao tiếp thế nào."}, {"n": 11, "c": 1, "g": "1.2", "q": "Vì sao bạn ứng tuyển vào VTI?", "a": "Trả lời bằng 3 lớp khớp JD: ① thị trường: thị trường chính là Nhật, đúng kinh nghiệm của em; ② khách hàng: tập đoàn Nhật trong tài chính, bảo hiểm, sản xuất — môi trường chuẩn chất lượng cao em muốn làm việc; ③ hướng phát triển: công ty có khách Hàn, Singapore và muốn có sản phẩm riêng, cho Senior PM không gian vượt khỏi một dự án. Kết bằng 1 điều cụ thể em sẽ đóng góp.", "t": "Chỉ dùng thông tin từ JD hoặc trang chính thức; nói sai fact về công ty còn tệ hơn không nói."}, {"n": 12, "c": 1, "g": "1.2", "q": "Vì sao bạn muốn làm việc tại Đà Nẵng?", "a": "Nêu lý do bền vững chứ không chỉ cảm tính: ① định hướng gắn bó lâu dài với thành phố (nói ở mức chung, không cần kể chuyện riêng); ② hứng thú xây đội ngũ ở một văn phòng đang phát triển, nơi PM có ảnh hưởng lớn tới cách làm việc; ③ nhân lực IT khu vực có tiềm năng và cần người dẫn dắt có kinh nghiệm khách Nhật. Thông điệp cốt lõi: em sẽ ở lại ít nhất 2–3 năm.", "t": "Nếu từng setup hoặc vận hành chi nhánh mới, nhắc ngay ở đây vì JD ghi rõ đó là lợi thế lớn."}, {"n": 13, "c": 1, "g": "1.2", "q": "Vì sao bạn muốn ở vị trí Senior PM?", "a": "Nói về phạm vi muốn chịu trách nhiệm: dự án lớn nhiều sub-team hoặc nhiều dự án cùng lúc, tham gia 見積もり (mitsumori – estimate) và 提案書 (teiansho – proposal) từ đầu, chịu trách nhiệm cao nhất về tiến độ, chất lượng với onsite và khách. Kèm bằng chứng đã làm một phần: từng viết proposal, từng hỗ trợ PM khác, từng mentor lead. Thông điệp: đây là bước tự nhiên, không phải vì chức danh.", "t": ""}, {"n": 14, "c": 1, "g": "1.2", "q": "Vì sao bạn chọn thị trường Nhật thay vì Âu–Mỹ?", "a": "Nêu lý do có giá trị: ① khách Nhật đòi hỏi chất lượng và quy trình rõ — môi trường rèn kỷ luật PM tốt; ② quan hệ dài hạn, giữ được niềm tin thì dự án nối tiếp; ③ em đã đầu tư tiếng Nhật và hiểu cách làm việc. Thừa nhận cái khó (tài liệu dày, ra quyết định qua nhiều cấp, yêu cầu chi tiết) và giải thích vì sao em coi đó là chuẩn để nâng mình lên. Tránh lý do \"vì dự án Nhật nhiều tiền\".", "t": ""}, {"n": 15, "c": 1, "g": "1.2", "q": "Mục tiêu 3–5 năm tới của bạn là gì?", "a": "Chia 2 mốc đo được và gắn với công ty: ① 1–2 năm: vận hành ổn định 1 dự án hoặc 1 khách lớn, đạt chỉ số đúng hạn và hài lòng khách, đào tạo 1–2 lead/PM kế cận; ② 3–5 năm: phụ trách một nhóm dự án hoặc một mảng khách (Delivery/Program Manager), góp phần mở rộng năng lực văn phòng Đà Nẵng. Thêm mục tiêu năng lực rõ: chứng chỉ PM, tiếng Nhật lên mức nào.", "t": "Không nhắc \"mở công ty riêng\" hay \"sang Nhật làm\" nếu không chắc — interviewer đang ước lượng rủi ro bạn rời đi."}, {"n": 16, "c": 1, "g": "1.2", "q": "Bạn biết gì về VTI và tìm hiểu từ đâu?", "a": "Trình bày phần chắc chắn và nói rõ nguồn: theo JD, VTI là công ty công nghệ Việt Nam khoảng 2000 người, thị trường chính Nhật, khách là tập đoàn tài chính, bảo hiểm, sản xuất, có thêm khách Hàn, Singapore, muốn phát triển sản phẩm riêng, có đào tạo tiếng Nhật và hỗ trợ thi chứng chỉ. Sau đó nêu nhận định của em (\"công ty đầu tư dài hạn vào con người\") và kết bằng \"em muốn hỏi thêm về…\" để biến câu kiểm tra thành trao đổi hai chiều.", "t": ""}, {"n": 17, "c": 1, "g": "1.2", "q": "Điều gì thúc đẩy bạn trong công việc PM hằng ngày?", "a": "Nêu động lực thật kèm ví dụ: nhìn một team rời rạc thành chạy nhịp đều; khách nghiệm thu không có lỗi nghiêm trọng; một thành viên mình kèm được lên lead. Gắn động lực với hành vi đo được: \"vì thế em theo dõi tỉ lệ bug và tốc độ hoàn thành mỗi sprint để thấy team tiến bộ\". Động lực chỉ dựa vào tiền hay chức danh sẽ khiến interviewer nghi ngờ độ gắn bó.", "t": ""}, {"n": 18, "c": 1, "g": "1.2", "q": "Bạn muốn nhận dự án mới từ đầu hay tiếp quản dự án đang chạy?", "a": "Có quan điểm nhưng linh hoạt: dự án mới cho phép đặt nền quy trình, estimate, team; dự án tiếp quản, nhất là đang gặp vấn đề, là nơi Senior PM tạo giá trị rõ nhất. Nêu cách em tiếp quản: 2 tuần đầu \"nghe và đo\" (tiến độ thật, chất lượng thật, quan hệ khách) trước khi thay đổi gì. Kết: \"em ưu tiên nơi công ty đang cần nhất\" — trả lời \"chỉ muốn dự án mới\" dễ bị hiểu là né việc khó.", "t": ""}, {"n": 19, "c": 1, "g": "1.2", "q": "Bạn nghĩ sao về định hướng phát triển sản phẩm riêng của công ty?", "a": "Thể hiện hiểu khác biệt: outsourcing đo bằng tiến độ, chất lượng, hợp đồng; sản phẩm đo bằng người dùng, doanh thu, tốc độ học từ thị trường. Senior PM có thể mang kỷ luật delivery sang team sản phẩm và mang tư duy sản phẩm (ưu tiên theo giá trị, MVP) vào dự án khách. Nói rõ ưu tiên trước mắt là vị trí đang tuyển, sản phẩm là hướng đóng góp thêm — đừng để interviewer nghĩ em coi outsourcing là bước đệm.", "t": ""}, {"n": 20, "c": 1, "g": "1.2", "q": "Cái khó nhất khi làm Senior PM outsourcing cho khách Nhật là gì, và vì sao bạn vẫn chọn?", "a": "Nêu 1–2 cái khó thật: cân bằng kỳ vọng chất lượng rất cao của khách với chi phí, tiến độ của công ty; giữ ngữ cảnh không bị rơi qua nhiều lớp (khách → onsite/BrSE → team). Nói cách em từng thu hẹp khoảng cách đó, ví dụ chuẩn hóa biên bản họp song ngữ và Q&A list có owner, hạn trả lời. Câu này đo độ trưởng thành: thừa nhận khó nhưng không than, và có cách làm.", "t": ""}, {"n": 21, "c": 1, "g": "1.3", "q": "STAR là gì và bạn áp dụng thế nào khi trả lời câu behavioral?", "a": "STAR gồm Situation (bối cảnh) – Task (nhiệm vụ của bạn) – Action (hành động của chính bạn) – Result (kết quả đo được). Phân bổ thời gian khoảng S+T 20%, A 60%, R 20% (tham khảo); câu về thất bại thêm **L – Learning** (bài học). Phần Action dùng \"em/tôi\", không dùng \"chúng tôi\", để thấy vai trò cá nhân. Chuẩn bị sẵn 5–6 câu chuyện có thể xoay cho nhiều câu hỏi.", "t": "Result phải có số: \"bug lọt UAT giảm từ 12 xuống 3\", không phải \"chất lượng tốt hơn\"."}, {"n": 22, "c": 1, "g": "1.3", "q": "Kể về thành công lớn nhất của bạn với vai trò PM.", "a": "Chọn thành công có độ khó cao và vai trò của em rõ. Ví dụ: S – dự án bảo trì cho khách bảo hiểm B, khách phàn nàn vì bug lọt sang UAT nhiều; T – em được giao lấy lại niềm tin trong 1 quý; A – em phân loại nguồn gốc bug, thêm review chéo test case với BrSE, đặt ngưỡng chất lượng bắt buộc trước khi giao; R – sau 3 tháng bug lọt UAT giảm khoảng 60%, khách mở rộng thêm người cho team.", "t": ""}, {"n": 23, "c": 1, "g": "1.3", "q": "Kể về một dự án thất bại hoặc không đạt mục tiêu.", "a": "Chọn thất bại thật nhưng không thảm họa, dành phần lớn thời gian cho bài học. Ví dụ: dự án trọn gói trễ 3 tuần vì em chấp nhận nhiều thay đổi nhỏ bằng lời nói, không qua change request, effort vượt khoảng 20%. Sau đó em đàm phán bù một phần chi phí và lập quy tắc: mọi thay đổi có ticket và estimate được khách đồng ý trước khi làm. Dự án tiếp theo lệch effort dưới 5%.", "t": "Đừng chọn thất bại mà lỗi hoàn toàn của người khác; interviewer chấm phần \"em đã sai ở đâu\"."}, {"n": 24, "c": 1, "g": "1.3", "q": "Kể về một quyết định sai mà bạn từng đưa ra.", "a": "Nhấn vào cách nhận ra sai và sửa nhanh. Ví dụ: em đưa một dev rất giỏi kỹ thuật nhưng ít kinh nghiệm giao tiếp lên làm lead team 6 người; sau 1 tháng team chậm và bắt đầu căng thẳng. Em nhận ra mình chọn theo năng lực kỹ thuật thay vì năng lực dẫn dắt, nên trao đổi thẳng với bạn ấy, chuyển sang vai trò tech lead chuyên sâu, chọn lead khác và đặt tiêu chí chọn lead rõ ràng hơn.", "t": ""}, {"n": 25, "c": 1, "g": "1.3", "q": "Kể về lần bạn tiếp quản và vực dậy một dự án đang gặp nguy.", "a": "Ví dụ: S – em nhận dự án cho khách sản xuất C đang trễ khoảng 3 tuần, team mệt, khách mất kiên nhẫn; T – đưa dự án về một mốc mới khách chấp nhận được; A – tuần đầu đo lại tiến độ theo từng chức năng đã test xong, lập top rủi ro, thay 1 vị trí then chốt bằng người đã làm module tương tự, trình khách kế hoạch mới có số liệu; R – giao đúng mốc đã chốt lại, khách giữ team cho giai đoạn sau.", "t": ""}, {"n": 26, "c": 1, "g": "1.3", "q": "Kể về lần bạn vượt kỳ vọng của khách hàng.", "a": "Vượt kỳ vọng nên là giá trị khách cần nhưng chưa nói ra, không phải làm thêm miễn phí ngoài phạm vi. Ví dụ: khi làm module báo cáo cho khách bảo hiểm B, em thấy khách mất nhiều giờ đối chiếu dữ liệu thủ công mỗi tháng, nên đề xuất một công cụ kiểm tra nhỏ, estimate rõ và để khách quyết; khách duyệt như một change request nhỏ và giảm đáng kể thời gian đối chiếu. Thông điệp: chủ động nhưng vẫn kiểm soát phạm vi và chi phí.", "t": ""}, {"n": 27, "c": 1, "g": "1.3", "q": "Kể về lần lỗi của chính bạn ảnh hưởng đến khách.", "a": "Ví dụ: em gửi báo cáo tiến độ dựa trên số team tự khai, ghi \"90% hoàn thành\", nhưng đến test tích hợp mới lộ ra nhiều phần chưa chạy được, mốc lùi 1 tuần. Em nhận trách nhiệm trước, báo khách ngay số liệu thật và kế hoạch mới; sau đó đổi cách đo: chỉ tính \"xong\" khi qua review và test theo Definition of Done, báo cáo theo chức năng đã kiểm chứng. Bài học: đo bằng bằng chứng, không bằng cảm giác.", "t": ""}, {"n": 28, "c": 1, "g": "1.3", "q": "Bài học lớn nhất bạn rút ra trong sự nghiệp PM là gì?", "a": "Chọn 1 bài học đã thay đổi cách làm lâu dài, kèm câu chuyện ngắn và hành vi hiện tại. Ví dụ: \"tin xấu báo càng sớm càng rẻ\" — có lần em chần chừ 2 tuần mới báo một rủi ro thiếu người, khi xử lý thì tốn gấp nhiều lần; từ đó em có quy tắc: mốc quan trọng có dấu hiệu lệch quá 1 ngày là báo khách kèm phương án (ngưỡng tham khảo). Một bài học áp dụng nhất quán có giá trị hơn liệt kê nhiều bài học.", "t": ""}, {"n": 29, "c": 1, "g": "1.3", "q": "Kể về lần bạn thuyết phục team thay đổi cách làm việc.", "a": "Ví dụ: team quen code xong mới viết test case nên bug dồn cuối sprint. Em không áp đặt mà ① cho team xem số liệu bug theo tuần phát hiện, ② thử 1 sprint với 1 nhóm: viết test case trước, review chéo, ③ so kết quả trong buổi 振り返り (furikaeri – họp nhìn lại). Khi thấy làm lại ít hơn, cả team tự nhận cách mới. Nguyên tắc: thay đổi bằng thử nghiệm nhỏ có đo lường, không bằng mệnh lệnh.", "t": ""}, {"n": 30, "c": 1, "g": "1.3", "q": "Kể về lần bạn phải học rất nhanh một thứ mới để dự án chạy được.", "a": "Ví dụ: em nhận dự án trên nền tảng cloud mà mình chưa làm sâu, khách muốn PM nắm kiến trúc để trao đổi trực tiếp. Em lập kế hoạch 3 tuần: đọc tài liệu chính thức, nhờ tech lead giải thích kiến trúc 2 buổi, tự vẽ lại sơ đồ rồi nhờ team kiểm tra, lập glossary song ngữ. Kết quả: em chủ trì được buổi review kiến trúc với khách. Điểm cần thể hiện: có phương pháp học, không chỉ \"chịu khó\".", "t": ""}, {"n": 31, "c": 1, "g": "1.3", "q": "Ngoài dự án, bạn đã đóng góp gì cho tổ chức?", "a": "Senior PM được kỳ vọng nâng cả đơn vị, nhất là ở văn phòng đang phát triển. Ví dụ: chuẩn hóa template báo cáo tuần và Q&A list cho các dự án Nhật; tổ chức buổi chia sẻ bài học sau dự án; tham gia phỏng vấn, onboard người mới; hỗ trợ estimate cho proposal. Mỗi đóng góp nêu kết quả, như \"template được 4 dự án dùng\". Đây là tinh thần 横展開 (yokotenkai – nhân rộng cách làm tốt sang nơi khác).", "t": ""}, {"n": 32, "c": 1, "g": "1.3", "q": "Interviewer hỏi dồn \"cụ thể bạn đã làm gì, hay đó là công của team?\" — bạn trả lời sao?", "a": "Đây là câu kiểm tra độ thật. Tách rõ 3 phần: việc team làm, quyết định của em, và việc em tự tay làm. Ví dụ: \"team thực hiện test, còn em là người quyết định dừng release đợt 1, trực tiếp đàm phán với khách để tách phạm vi và viết lại kế hoạch\". Đưa chi tiết chỉ người trong cuộc mới biết (con số, tên tài liệu, thời điểm). Ghi công team nhưng không né vai trò của mình.", "t": "Câu chuyện \"mượn\" thường lộ ở lớp hỏi thứ ba; chỉ kể chuyện bạn trả lời được 3 lớp \"vì sao\"."}, {"n": 33, "c": 1, "g": "1.4", "q": "Kể về lần bạn làm việc dưới áp lực lớn nhất.", "a": "Chọn áp lực nhiều lớp (deadline + sự cố + khách căng) và kể cách em giữ bình tĩnh bằng hệ thống: ① liệt kê việc, xếp ưu tiên theo tác động tới khách; ② phân công owner rõ, cập nhật 2 lần/ngày; ③ chủ động báo khách tình hình để giảm câu hỏi dồn; ④ không để team quá tải kéo dài (luân phiên, bù nghỉ). Kết bằng kết quả và điều em làm khác lần sau.", "t": "Đừng khoe \"cả team thức 3 đêm liền\" như thành tích; với Senior, đó là dấu hiệu kế hoạch có vấn đề."}, {"n": 34, "c": 1, "g": "1.4", "q": "Khách đưa ra deadline mà bạn biết team không thể đạt, bạn từng xử lý thế nào?", "a": "Theo nhịp: ① xác nhận fact: estimate lại có căn cứ (WBS, năng suất thực), xác định thiếu bao nhiêu ngày công; ② chuẩn bị 2–3 phương án: giảm phạm vi theo ưu tiên, tăng người (kèm chi phí, rủi ro onboard), giao từng phần; ③ báo khách sớm theo 報連相 với số liệu và phương án, không chỉ nói \"không kịp\"; ④ chốt bằng văn bản, ghi lại giả định estimate để lần sau cảnh báo sớm hơn. Đồng ý cho qua rồi trễ là cách mất niềm tin nhanh nhất.", "t": ""}, {"n": 35, "c": 1, "g": "1.4", "q": "Khi nhiều việc gấp đến cùng lúc, bạn ưu tiên thế nào?", "a": "Dùng tiêu chí rõ: ① tác động tới khách và production trước; ② việc đang chặn người khác trước việc cá nhân; ③ việc có hạn cứng theo hợp đồng trước việc linh hoạt. Công cụ: ma trận khẩn cấp–quan trọng, top 3 việc mỗi sáng. Việc không kịp thì ủy quyền cho lead hoặc báo người liên quan kèm thời điểm mới. Ví dụ: production lỗi đúng hôm nộp proposal — em giao lead khoanh vùng, tự báo khách, rồi mới quay lại proposal.", "t": ""}, {"n": 36, "c": 1, "g": "1.4", "q": "Kể về lần bạn phải quyết định khi thiếu thông tin.", "a": "Khung: ① phân loại quyết định đảo ngược được hay không; ② xác định thông tin tối thiểu cần có và hạn chót phải quyết; ③ quyết với giả định ghi rõ, kèm điểm kiểm tra lại; ④ báo người liên quan đây là quyết định tạm. Ví dụ: spec API phía khách chưa chốt, em cho team code theo bản nháp với lớp adapter tách riêng, ghi giả định vào Q&A list; khi spec chốt chỉ sửa adapter trong 2 ngày.", "t": "Câu ghi điểm: \"quyết định đảo ngược được thì quyết nhanh, không đảo ngược được thì chậm lại để lấy thêm dữ liệu\"."}, {"n": 37, "c": 1, "g": "1.4", "q": "Kể về lần bạn bất đồng với cấp trên.", "a": "Nhịp: ① hiểu mục tiêu của sếp trước khi phản biện; ② đưa dữ liệu và phương án thay thế; ③ trao đổi riêng trước, theo kiểu 根回し (nemawashi – trao đổi trước để thống nhất), không phản bác trước team hay khách; ④ nếu sếp vẫn quyết khác, thực hiện nghiêm túc và ghi lại rủi ro đã cảnh báo. Ví dụ: sếp muốn nhận thêm scope miễn phí để giữ khách; em trình bày effort, rủi ro trễ, đề xuất chỉ nhận phần nhỏ, còn lại thành change request — sếp đồng ý.", "t": ""}, {"n": 38, "c": 1, "g": "1.4", "q": "Kể về lần bạn bất đồng với khách hoặc phải nói \"không\" với khách.", "a": "Không nói \"không\" trần trụi; nói \"được, nếu…\". Ví dụ: khách bảo hiểm B muốn thêm chức năng sát ngày UAT; em xác nhận mục đích nghiệp vụ, estimate tác động, rồi đưa 2 lựa chọn: đưa vào release sau, hoặc làm ngay và dời UAT 1 tuần. Khách chọn release sau. Then chốt: tôn trọng quyền quyết định của khách, nhưng để họ quyết trên số liệu rõ ràng chứ không trên lời hứa.", "t": ""}, {"n": 39, "c": 1, "g": "1.4", "q": "Cấp trên yêu cầu bạn tạm chưa báo một lỗi nghiêm trọng cho khách, bạn làm gì?", "a": "Giữ nguyên tắc nhưng không chống đối: ① xác nhận lý do và mức ảnh hưởng thực tế của lỗi; ② giải thích rủi ro nếu khách tự phát hiện — mất niềm tin lớn hơn bản thân lỗi; ③ đề xuất cách báo có kiểm soát: báo ban đầu trong ngày gồm fact và phạm vi ảnh hưởng, nguyên nhân và đối sách gửi sau; ④ nếu vẫn bị yêu cầu giấu lỗi ảnh hưởng dữ liệu khách, escalate theo kênh chính thức. Với khách Nhật, che giấu lỗi là ranh giới không vượt.", "t": "Interviewer kiểm tra sự chính trực; \"em làm theo sếp\" hay \"em báo khách ngay, kệ sếp\" đều trượt."}, {"n": 40, "c": 1, "g": "1.4", "q": "Kể về lần bạn hòa giải xung đột giữa hai người chủ chốt trong dự án.", "a": "Nhịp ngắn: ① nghe riêng từng người, tách sự việc khỏi cảm xúc; ② tìm mục tiêu chung (mốc giao, chất lượng); ③ họp chung với dữ liệu, chốt quy tắc làm việc (ai quyết gì, review ra sao); ④ theo dõi 2–3 tuần. Ví dụ: tech lead và BrSE tranh cãi vì hiểu spec khác nhau; em lập quy tắc mọi điểm chưa rõ vào Q&A list, BrSE xác nhận với khách trước khi code. Xung đột giảm vì nguyên nhân gốc là quy trình, không phải tính cách.", "t": ""}, {"n": 41, "c": 1, "g": "1.4", "q": "Kể về lần bạn phải báo tin xấu cho khách.", "a": "Nhịp: ① xác nhận fact và mức ảnh hưởng trước khi liên lạc; ② báo sớm, trực tiếp (họp hoặc gọi), không chỉ email; ③ nói kết luận trước, xin lỗi đúng mức về ảnh hưởng, đưa hướng xử lý và mốc cập nhật tiếp theo; ④ sau đó gửi báo cáo nguyên nhân gốc kèm 再発防止 (saihatsu boushi – biện pháp phòng ngừa tái phát). Ví dụ: báo trễ mốc 1 tuần, kèm 2 phương án và thời điểm cập nhật lại.", "t": "Bẫy thường gặp: chờ \"có đủ giải pháp mới báo\" — với khách Nhật, báo fact sớm quan trọng hơn báo trọn vẹn."}, {"n": 42, "c": 1, "g": "1.4", "q": "Onsite hoặc BrSE đổ lỗi chậm tiến độ cho team offshore, bạn xử lý thế nào?", "a": "① Không phản ứng tức thì; thu thập dữ liệu: timeline, Q&A, thời điểm yêu cầu được truyền đạt; ② họp riêng với onsite cùng nhìn số liệu, tập trung \"lỗ hổng ở đâu\" thay vì \"ai sai\"; ③ thống nhất một tiếng nói khi báo khách; ④ vá điểm gãy quy trình, ví dụ yêu cầu phải vào ticket trước khi team bắt tay làm. Mục tiêu: khách thấy một team thống nhất, không phải hai bên đổ lỗi cho nhau.", "t": ""}, {"n": 43, "c": 1, "g": "1.4", "q": "Bạn tự quản lý stress và tránh kiệt sức thế nào khi dự án căng kéo dài?", "a": "Trả lời bằng thói quen cụ thể: ghi mọi việc vào danh sách để đầu óc không phải giữ hết; giới hạn số cuộc họp mỗi ngày; ủy quyền cho lead; giữ 1–2 hoạt động cố định ngoài công việc. Quan trọng hơn: nhận biết dấu hiệu quá tải của chính mình và của team, chủ động điều chỉnh kế hoạch thay vì chịu đựng. Interviewer muốn biết em bền bỉ được lâu dài, không phải chịu đựng vô hạn.", "t": ""}, {"n": 44, "c": 1, "g": "1.5", "q": "Phong cách lãnh đạo của bạn là gì?", "a": "Nêu một phong cách chính và khi nào em đổi: ví dụ servant leadership — gỡ vướng cho team, để team tự quyết phần kỹ thuật; nhưng chuyển sang chỉ đạo trực tiếp khi có sự cố hoặc với thành viên mới, theo tư duy situational leadership (mức chỉ đạo tùy năng lực và độ sẵn sàng của từng người). Kèm 1 hành vi chứng minh: \"lead tự estimate, em chỉ review giả định và rủi ro\". Một phong cách cho mọi tình huống nghe thiếu kinh nghiệm.", "t": ""}, {"n": 45, "c": 1, "g": "1.5", "q": "Điểm mạnh lớn nhất của bạn là gì?", "a": "Chọn 1–2 điểm mạnh khớp JD, mỗi điểm 1 bằng chứng. Ví dụ: ① quản lý rủi ro sớm — em duy trì risk register hằng tuần, từng phát hiện thiếu người cho module khó trước 1 tháng và bổ sung kịp; ② làm việc với khách Nhật — chủ trì họp, báo cáo sự cố, khách giữ team qua nhiều giai đoạn. Điểm mạnh không có bằng chứng chỉ là tự nhận.", "t": ""}, {"n": 46, "c": 1, "g": "1.5", "q": "Điểm yếu lớn nhất của bạn là gì?", "a": "Chọn điểm yếu thật, không chí mạng với vai trò, và đang có kế hoạch cải thiện đo được. Ví dụ: \"em từng ôm việc, tự làm thay vì giao; em đặt quy tắc mỗi tuần giao ít nhất 1 việc quan trọng cho lead và chỉ review đầu ra; sau 6 tháng em nghỉ 1 tuần mà dự án vẫn chạy\". Tránh điểm yếu giả (cầu toàn, làm việc quá chăm) và điểm yếu cốt lõi (giao tiếp kém, không chịu được áp lực).", "t": "Công thức: điểm yếu thật → hậu quả đã gặp → hành động sửa → bằng chứng tiến bộ."}, {"n": 47, "c": 1, "g": "1.5", "q": "Feedback tiêu cực gần nhất bạn nhận được là gì và bạn đã làm gì?", "a": "Kể feedback cụ thể, phản ứng ban đầu và hành động. Ví dụ: một thành viên góp ý trong 1:1 rằng em giao việc gấp, thiếu bối cảnh. Em cảm ơn, hỏi thêm ví dụ, rồi đổi cách giao: mỗi task có mục tiêu, tiêu chí xong, hạn và lý do ưu tiên; trừ sự cố, giao trước ít nhất nửa ngày. Sau đó em hỏi lại team ở buổi nhìn lại kế tiếp để kiểm tra đã cải thiện chưa — thể hiện em chủ động xin feedback, không chỉ nhận.", "t": ""}, {"n": 48, "c": 1, "g": "1.5", "q": "Giá trị nghề nghiệp nào bạn không thỏa hiệp?", "a": "Nêu 2–3 giá trị kèm hành vi: ① trung thực với khách và team — không báo cáo đẹp hơn sự thật; ② giữ lời — không hứa thứ chưa estimate; ③ tôn trọng con người — không phê bình thành viên trước đám đông. Thêm 1 ví dụ giá trị bị thử thách: từng từ chối \"làm đẹp\" số tiến độ trước một buổi họp lớn, thay vào đó báo đúng và kèm kế hoạch bắt kịp. Giá trị phải thấy được qua quyết định, không qua khẩu hiệu.", "t": ""}, {"n": 49, "c": 1, "g": "1.5", "q": "Khi nào bạn trao quyền và khi nào bạn kiểm soát chặt?", "a": "Dựa vào 2 biến: năng lực của người nhận và mức rủi ro của việc. Năng lực cao, rủi ro thấp: giao trọn, chỉ xem kết quả; năng lực còn thấp hoặc rủi ro cao (release production, migration dữ liệu): checkpoint dày, review trước khi đi tiếp. Ví dụ: lead mới được tự estimate module, nhưng 2 sprint đầu em cùng review giả định. Mục tiêu là giảm dần kiểm soát dựa trên bằng chứng.", "t": "Từ \"micro-management\" là bẫy; nói rõ bạn kiểm soát *điểm rủi ro*, không kiểm soát *con người*."}, {"n": 50, "c": 1, "g": "1.5", "q": "Bạn tự đánh giá hiệu quả của mình bằng những chỉ số nào?", "a": "Chia 4 nhóm: ① tiến độ: tỉ lệ mốc đúng hạn; ② chất lượng: bug lọt sang khách, bug production; ③ chi phí: effort thực tế so với kế hoạch; ④ con người và khách: mức hài lòng của khách, tỉ lệ nghỉ việc trong team, số người được phát triển lên vai trò mới. Kèm ngưỡng em tự đặt, ví dụ lệch effort ≤ 10% (tham khảo). Nói được chỉ số của chính mình cho thấy em quản trị bằng số.", "t": ""}, {"n": 51, "c": 1, "g": "1.5", "q": "Bạn tự cải thiện bản thân bằng cách nào?", "a": "Mô tả vòng lặp có nhịp: ① sau mỗi mốc dự án tự 振り返り cá nhân: điều gì giữ, điều gì đổi; ② xin feedback định kỳ từ sếp, team, khách bằng câu hỏi cụ thể như \"điều gì em nên làm khác?\"; ③ mỗi quý chọn 1 kỹ năng để luyện có đo lường, ví dụ thuyết trình bằng tiếng Nhật. Kết quả minh họa: sau 2 quý luyện, em tự chủ trì được buổi review mà không cần BrSE dịch.", "t": ""}, {"n": 52, "c": 1, "g": "1.5", "q": "Kiểu người hoặc kiểu cấp trên nào bạn thấy khó làm việc cùng nhất?", "a": "Trả lời trung tính, nói về hành vi chứ không về tính cách, và nêu cách em thích nghi. Ví dụ: người hay đổi quyết định mà không thông báo — em xử lý bằng cách xác nhận lại quyết định qua một tin nhắn hoặc biên bản ngắn sau mỗi buổi trao đổi. Kết bằng việc em vẫn làm việc hiệu quả được. Không dùng ví dụ kể xấu sếp hay khách cũ cụ thể — interviewer sẽ nghĩ em cũng sẽ nói về họ như vậy.", "t": ""}, {"n": 53, "c": 1, "g": "1.5", "q": "Theo bạn, một dự án thành công là thế nào?", "a": "Vượt khỏi tam giác phạm vi–thời gian–chi phí: ① giao đúng giá trị nghiệp vụ khách cần, đúng mốc đã thỏa thuận, đạt tiêu chí nghiệm thu; ② công ty có lãi theo kế hoạch; ③ khách muốn làm tiếp; ④ team không kiệt sức và có người trưởng thành hơn. Nếu phải đánh đổi, nói rõ thứ tự ưu tiên và lý do, ví dụ chất lượng của module tính toán tài chính không được đánh đổi lấy tiến độ.", "t": ""}, {"n": 54, "c": 1, "g": "1.6", "q": "自己紹介をお願いします (jiko shoukai wo onegai shimasu – Xin hãy giới thiệu bản thân).", "a": "Ý chính: tên → số năm IT/PM → kinh nghiệm với khách Nhật và domain → lời chào kết, khoảng 1 phút, dùng 敬語 (keigo – kính ngữ) dạng khiêm nhường. Câu mẫu: 「〇〇と申します。IT業界で〇年、そのうち〇年はプロジェクトマネージャーとして、日本のお客様向けのオフショア開発に携わってまいりました。本日はどうぞよろしくお願いいたします。」 (Tôi tên là…; có… năm trong ngành IT, trong đó… năm làm PM dự án offshore cho khách Nhật. Hôm nay rất mong được anh/chị chỉ giáo.) Nói chậm, đúng keigo ăn điểm hơn nói nhanh mà sai.", "t": ""}, {"n": 55, "c": 1, "g": "1.6", "q": "志望動機を教えてください (shibou douki wo oshiete kudasai – Hãy cho biết động cơ ứng tuyển).", "a": "Ý chính: 結論から (ketsuron kara – nói kết luận trước) → lý do → đóng góp. Khi nói gọi công ty là 御社 (onsha – quý công ty), khi viết dùng 貴社 (kisha). Câu mẫu: 「御社は日本の金融・保険・製造業のお客様を中心に事業を展開されており、私のオフショア開発の経験を最も活かせると考え、志望いたしました。入社後は、品質と納期を守る体制づくりに貢献したいと考えております。」 (Quý công ty tập trung vào khách Nhật mảng tài chính, bảo hiểm, sản xuất — nơi tôi phát huy tốt nhất kinh nghiệm offshore; tôi muốn góp phần xây cơ chế giữ chất lượng và hạn giao.)", "t": "Nói 貴社 trong phỏng vấn trực tiếp là lỗi người Nhật để ý ngay — nói dùng 御社, viết dùng 貴社."}, {"n": 56, "c": 1, "g": "1.6", "q": "長所と短所を教えてください (chousho to tansho wo oshiete kudasai – Hãy cho biết điểm mạnh và điểm yếu).", "a": "Ý chính: mỗi ý 1 câu + 1 ví dụ; điểm yếu luôn kèm cách đang cải thiện. Câu mẫu: 「長所は、問題が起きた際に事実を確認し、早めに報告・相談できることです。」 (Điểm mạnh là khi có vấn đề, tôi xác nhận sự thật và báo cáo, trao đổi sớm.) 「短所は細部にこだわりすぎるところですが、現在は優先順位と期限を先に決めてから取り組むようにしております。」 (Điểm yếu là quá chú trọng chi tiết; hiện tôi luôn chốt ưu tiên và hạn trước khi bắt tay làm.)", "t": ""}, {"n": 57, "c": 1, "g": "1.6", "q": "日本語のレベルはどのくらいですか (nihongo no reberu wa dono kurai desu ka – Trình độ tiếng Nhật của bạn đến đâu?).", "a": "Ý chính: nêu JLPT nếu có, rồi mô tả năng lực thực tế bằng việc làm được (họp, email, đọc spec) và giới hạn một cách trung thực. Câu mẫu: 「日本語能力試験N〇を取得しております。会議やメールは日本語で対応しておりますが、重要な仕様は必ず文書で確認するようにしております。」 (Tôi có JLPT N…; họp và email bằng tiếng Nhật được, nhưng spec quan trọng tôi luôn xác nhận lại bằng văn bản.)", "t": "Phóng đại trình độ là bẫy tự đặt: interviewer có thể chuyển hẳn sang tiếng Nhật để kiểm tra ngay."}, {"n": 58, "c": 1, "g": "1.6", "q": "なぜ日本市場を選んだのですか (naze nihon shijou wo eranda no desu ka – Vì sao bạn chọn thị trường Nhật?).", "a": "Ý chính: nêu giá trị (chất lượng, quan hệ tin cậy dài hạn, cơ hội rèn kỷ luật), không nêu lý do tiền bạc; trả lời ngắn rồi dừng để interviewer hỏi tiếp. Câu mẫu: 「日本のお客様は品質と長期的な信頼関係を重視されるため、PMとして最も成長できる環境だと考えております。」 (Khách Nhật coi trọng chất lượng và quan hệ tin cậy lâu dài, nên tôi cho rằng đây là môi trường giúp PM trưởng thành nhất.)", "t": ""}, {"n": 59, "c": 1, "g": "1.6", "q": "これまでで一番大変だったプロジェクトについて教えてください (kore made de ichiban taihen datta purojekuto ni tsuite oshiete kudasai – Hãy kể về dự án vất vả nhất).", "a": "Ý chính: STAR ngắn, nhấn hành động của mình và kết quả. Câu mẫu: 「最も大変だったのは、リリースの1か月前に大きな仕様変更が発生したプロジェクトです。お客様と優先順位について相談させていただき、リリースを2回に分けることで、最初の納期を守ることができました。」 (Vất vả nhất là dự án có thay đổi spec lớn 1 tháng trước release; tôi trao đổi thứ tự ưu tiên với khách, chia release làm 2 đợt và giữ được hạn giao đầu tiên.)", "t": ""}, {"n": 60, "c": 1, "g": "1.6", "q": "失敗した経験と、そこから学んだことを教えてください (shippai shita keiken to, soko kara mananda koto wo oshiete kudasai – Hãy kể một thất bại và bài học rút ra).", "a": "Ý chính: nhận trách nhiệm → nguyên nhân → thay đổi đã áp dụng; dùng 「〜ため」「それ以降」 để mạch nhân–quả rõ. Câu mẫu: 「テスト環境の準備を後回しにしたため、結合テストの開始が1週間遅れたことがあります。それ以降、環境準備を計画の初期にマイルストーンとして設定し、毎週確認するようにしております。」 (Tôi từng để việc chuẩn bị môi trường test lại sau, khiến test tích hợp trễ 1 tuần; từ đó tôi đặt việc này thành mốc ngay đầu kế hoạch và kiểm tra hằng tuần.)", "t": ""}, {"n": 61, "c": 1, "g": "1.6", "q": "日本のお客様と仕事をする上で、大切にしていることは何ですか (nihon no okyakusama to shigoto wo suru ue de, taisetsu ni shite iru koto wa nan desu ka – Khi làm việc với khách Nhật, bạn coi trọng điều gì?).", "a": "Ý chính: chọn 1 nguyên tắc và chứng minh bằng hành vi — thường là 報連相 và giữ lời hứa. Câu mẫu: 「悪い情報ほど早くお伝えすることを大切にしております。問題が起きた場合は、まず事実と影響範囲をご報告し、対策は改めてご連絡いたします。」 (Tôi coi trọng việc báo tin xấu càng sớm càng tốt: báo trước sự thật và phạm vi ảnh hưởng, đối sách sẽ liên lạc sau.)", "t": ""}, {"n": 62, "c": 1, "g": "1.6", "q": "5年後のキャリアプランを教えてください (gonen go no kyaria puran wo oshiete kudasai – Kế hoạch nghề nghiệp 5 năm tới của bạn?).", "a": "Ý chính: gắn mục tiêu với công ty và văn phòng Đà Nẵng, không nói kế hoạch rời đi. Câu mẫu: 「5年後には、複数のプロジェクトを統括する立場で、ダナン拠点の成長に貢献したいと考えております。」 (5 năm tới, tôi muốn ở vị trí phụ trách nhiều dự án và góp phần vào sự phát triển của văn phòng Đà Nẵng.) Có thể thêm 1 câu về mục tiêu tiếng Nhật hoặc chứng chỉ để kế hoạch có mốc đo được.", "t": ""}, {"n": 63, "c": 1, "g": "1.6", "q": "入社後、どのように貢献できると思いますか (nyuusha go, dono you ni kouken dekiru to omoimasu ka – Sau khi vào công ty, bạn nghĩ mình đóng góp được gì?).", "a": "Ý chính: chia theo thời gian — ngắn hạn ổn định dự án, trung hạn phát triển người và nâng chất lượng estimate, proposal. Câu mẫu: 「まずは担当プロジェクトの品質と納期を安定させ、その後はメンバーの育成と、見積もり・提案の質の向上に貢献したいと考えております。」 (Trước hết tôi ổn định chất lượng và tiến độ dự án phụ trách, sau đó đóng góp vào đào tạo thành viên và nâng chất lượng estimate, proposal.)", "t": ""}, {"n": 64, "c": 1, "g": "1.6", "q": "最後に何か質問はありますか (saigo ni nanika shitsumon wa arimasu ka – Cuối cùng bạn có câu hỏi gì không?).", "a": "Ý chính: luôn có 1–2 câu hỏi; mở đầu khiêm nhường, kết bằng lời cảm ơn. Câu mẫu: 「はい、ございます。入社後に担当させていただくプロジェクトの現状の課題について、伺ってもよろしいでしょうか。」 (Vâng, tôi có ạ. Tôi có thể hỏi về các vấn đề hiện tại của dự án mình sẽ phụ trách không ạ?) Kết: 「本日はお忙しいところ、お時間をいただき、誠にありがとうございました。」 (Cảm ơn anh/chị đã dành thời gian hôm nay.)", "t": "Trả lời 「特にありません」 (không có gì ạ) dễ bị hiểu là thiếu quan tâm — luôn chuẩn bị sẵn câu hỏi."}, {"n": 65, "c": 1, "g": "1.6", "q": "Không nghe rõ hoặc chưa hiểu câu hỏi tiếng Nhật thì nói thế nào cho lịch sự?", "a": "Đừng đoán rồi trả lời lệch; xin nhắc lại hoặc xác nhận lại ý. Câu mẫu: 「恐れ入りますが、もう一度おっしゃっていただけますでしょうか。」 (Xin lỗi, anh/chị có thể nói lại một lần nữa được không ạ?); 「〜という理解でよろしいでしょうか。」 (Tôi hiểu là…, như vậy có đúng không ạ?); 「少し考える時間をいただけますでしょうか。」 (Cho tôi xin chút thời gian suy nghĩ được không ạ?).", "t": "Xác nhận lại bằng 「〜という理解でよろしいでしょうか」 vừa cứu bạn khi chưa chắc, vừa cho thấy thói quen xác nhận yêu cầu mà khách Nhật đánh giá cao."}, {"n": 66, "c": 1, "g": "1.7", "q": "Bạn đang có chứng chỉ quản lý dự án nào và nó giúp gì trong thực tế?", "a": "Nêu tên chứng chỉ, năm đạt, và quan trọng hơn là 1–2 thứ em áp dụng thật. Ví dụ với PMP: dùng cách quản lý rủi ro và stakeholder có hệ thống để lập risk register, stakeholder map ngay tuần đầu dự án; với PSM: tổ chức các sự kiện Scrum đúng mục đích, không biến daily thành họp báo cáo cho PM. Chứng chỉ là ngôn ngữ chung với khách và công ty, giá trị nằm ở cách dùng.", "t": "Đừng đọc định nghĩa trong sách; interviewer muốn nghe \"em đã dùng nó để làm gì khác đi\"."}, {"n": 67, "c": 1, "g": "1.7", "q": "Bạn chưa có PMP hay chứng chỉ PM nào, bạn trả lời thế nào?", "a": "Thành thật, rồi chứng minh bằng kinh nghiệm và kế hoạch: ① \"em chưa có chứng chỉ, nhưng đã áp dụng các thực hành tương đương\" kèm ví dụ (risk register, change control, báo cáo theo mốc); ② đưa kế hoạch cụ thể: chứng chỉ nào, mốc thi trong 6–12 tháng; ③ nhắc chính sách hỗ trợ thi PMP của công ty như một lý do thêm để gắn bó. Không xin lỗi, cũng không xem nhẹ giá trị của chứng chỉ.", "t": ""}, {"n": 68, "c": 1, "g": "1.7", "q": "Giữa PMP, PMI-ACP, PSM/CSM và PRINCE2, chứng chỉ nào phù hợp nhất với vị trí này?", "a": "Trả lời theo bối cảnh, không xếp hạng tuyệt đối: dự án khách Nhật thường cần kế hoạch, kiểm soát thay đổi và tài liệu chặt — PMP hoặc PRINCE2 cho nền quản trị dự án; nhiều dự án chạy Scrum hoặc hybrid — PSM, CSM hoặc PMI-ACP bổ trợ phần agile. Kết luận: một chứng chỉ nền tảng + một chứng chỉ agile là bộ đôi hợp lý. Chọn theo nhu cầu dự án, không theo độ khó của kỳ thi.", "t": ""}, {"n": 69, "c": 1, "g": "1.7", "q": "Trình độ JLPT hiện tại và kế hoạch nâng tiếng Nhật của bạn?", "a": "Nói rõ level đang có, năng lực dùng thực tế, và kế hoạch đo được: level kế tiếp, thời điểm thi, cách luyện (đọc spec thật, tự viết biên bản họp, luyện keigo qua email). JLPT chủ yếu đo đọc–nghe, nên bổ sung bằng chứng nói: chủ trì họp, thuyết trình. Chưa có JLPT thì nêu cách đang dùng tiếng Nhật trong công việc và lộ trình thi. Nhắc chương trình đào tạo tiếng Nhật của công ty là thứ em muốn tận dụng.", "t": ""}, {"n": 70, "c": 1, "g": "1.7", "q": "Theo bạn, kinh nghiệm hay chứng chỉ quan trọng hơn?", "a": "Câu bẫy, tránh trả lời một chiều. Kinh nghiệm quyết định cách xử lý tình huống thật; chứng chỉ chuẩn hóa ngôn ngữ, giúp làm việc với khách và tổ chức lớn, và là bằng chứng học có hệ thống. Ví dụ: kiến thức quản trị rủi ro bài bản giúp em ít bỏ sót khi lập kế hoạch, còn cách nói chuyện với khách khi rủi ro xảy ra thì đến từ kinh nghiệm. Kết: hai thứ bổ trợ nhau và em đầu tư cả hai.", "t": ""}, {"n": 71, "c": 1, "g": "1.7", "q": "PM có cần học Cloud/AWS không?", "a": "Cần, ở mức đủ để ra quyết định và trao đổi: hiểu kiến trúc cơ bản, mô hình chi phí theo mức sử dụng, phân chia trách nhiệm bảo mật giữa nhà cung cấp và khách (shared responsibility), rủi ro về môi trường và quyền truy cập. Lợi ích: estimate sát hơn phần hạ tầng, hỏi đúng câu khi khách muốn chuyển lên cloud. Với PM, chứng chỉ mức nền tảng như AWS Certified Cloud Practitioner là hợp lý; chuyên sâu là việc của kiến trúc sư.", "t": ""}, {"n": 72, "c": 1, "g": "1.7", "q": "Gần đây bạn học được điều gì mới cho công việc?", "a": "Chọn điều mới có ứng dụng thật. Ví dụ: dùng công cụ AI để tóm tắt biên bản họp và soạn nháp email tiếng Nhật, nhưng đặt quy tắc tự rà toàn bộ trước khi gửi và không đưa dữ liệu bảo mật của khách vào công cụ chưa được công ty cho phép. Kết quả: rút ngắn thời gian soạn tài liệu mà vẫn giữ an toàn thông tin. Thể hiện em cập nhật xu hướng nhưng kiểm soát được rủi ro.", "t": "Nhắc bảo mật dữ liệu khách khi nói về AI — với khách tài chính, bảo hiểm, đó là điểm cộng lớn."}, {"n": 73, "c": 1, "g": "1.7", "q": "Kế hoạch học tập 12 tháng tới của bạn là gì?", "a": "Đưa kế hoạch có mốc: ① 6 tháng đầu: hiểu sâu domain của khách đang phụ trách; ② trong năm: thi 1 chứng chỉ (PMP hoặc agile) và nâng 1 level tiếng Nhật; ③ liên tục: đọc case study, tham gia cộng đồng PM, chia sẻ lại cho team. Nối với chính sách công ty: đào tạo tiếng Nhật, hỗ trợ thi Cloud/AWS/PMP — \"em muốn dùng đúng các chương trình này\". Kế hoạch có mốc cho thấy em tự quản lý được sự phát triển của mình.", "t": ""}, {"n": 74, "c": 1, "g": "1.8", "q": "Vì sao bạn nghỉ hoặc muốn rời công ty hiện tại?", "a": "Hướng về phía trước, không chê công ty cũ: \"em đã học được nhiều ở môi trường hiện tại, nhưng muốn chịu trách nhiệm ở quy mô lớn hơn với khách Nhật mảng tài chính, bảo hiểm\" hoặc \"muốn gắn bó lâu dài ở Đà Nẵng\". Nếu có lý do khách quan (dự án kết thúc, tái cấu trúc), nói ngắn, trung tính, rồi chuyển sang điều em đang tìm kiếm.", "t": "Lý do nghỉ và lý do ứng tuyển phải là hai mặt của cùng một câu chuyện; mâu thuẫn là interviewer nhận ra ngay."}, {"n": 75, "c": 1, "g": "1.8", "q": "CV của bạn có nhiều lần chuyển việc ngắn hạn, bạn giải thích thế nào?", "a": "Không phủ nhận; giải thích theo mạch và cho thấy cam kết hiện tại: ① nêu lý do khách quan của từng lần nếu có; ② chỉ ra mỗi lần chuyển đều tăng trách nhiệm; ③ nhấn rằng em luôn ở lại đến khi bàn giao xong dự án — điều khách Nhật rất coi trọng; ④ nêu vì sao lần này em tin sẽ gắn bó (đúng thị trường, đúng địa điểm, đúng vai trò). Lần chuyển nào sai thì thừa nhận và nêu bài học.", "t": ""}, {"n": 76, "c": 1, "g": "1.8", "q": "Trong CV có khoảng trống vài tháng, đó là thời gian gì?", "a": "Nói ngắn, thật, không cần chi tiết riêng tư: nghỉ vì lý do cá nhân, học chứng chỉ, chuyển nơi ở… Sau đó nói em đã giữ nhịp nghề nghiệp ra sao (tự học, làm dự án nhỏ, cập nhật kiến thức) và hiện đã sẵn sàng làm việc toàn thời gian. Interviewer chủ yếu kiểm tra hai điều: em có trung thực không, và có vấn đề nào còn ảnh hưởng đến công việc sắp tới không.", "t": ""}, {"n": 77, "c": 1, "g": "1.8", "q": "Mức lương kỳ vọng của bạn là bao nhiêu?", "a": "Chuẩn bị trước một khoảng dựa trên mặt bằng thị trường cho vị trí và khu vực, cùng tổng thu nhập hiện tại. Cách trả lời: ① nếu phù hợp, hỏi lại khung của vị trí trước; ② đưa một khoảng, với mức thấp là mức em thật sự chấp nhận; ③ nói rõ em nhìn tổng gói: lương, thưởng dự án/doanh thu, review performance 2 lần/năm, đào tạo. Lý do đưa ra là giá trị em mang lại, không phải nhu cầu cá nhân.", "t": "Khoảng quá rộng bị coi là chưa chuẩn bị; chênh 10–15% giữa hai đầu là hợp lý (tham khảo)."}, {"n": 78, "c": 1, "g": "1.8", "q": "Lương hiện tại của bạn là bao nhiêu?", "a": "Câu này thường dùng để neo offer. Có thể lịch sự chuyển trọng tâm: \"em muốn trao đổi dựa trên phạm vi công việc của vị trí này và mặt bằng thị trường; kỳ vọng của em là khoảng…\". Nếu buộc phải nói, nói đúng tổng thu nhập (gồm thưởng, phụ cấp) — không thổi số vì có thể bị kiểm tra khi xác minh. Trung thực nhưng giữ quyền đàm phán theo giá trị vị trí mới.", "t": ""}, {"n": 79, "c": 1, "g": "1.8", "q": "Bạn có sẵn sàng OT hoặc làm cuối tuần không?", "a": "Trả lời cân bằng: sẵn sàng khi có sự cố hoặc mốc quan trọng — đó là trách nhiệm của PM; nhưng OT kéo dài là dấu hiệu kế hoạch có vấn đề và em sẽ xử lý gốc (phạm vi, estimate, nguồn lực). Ví dụ: \"dự án gần nhất, OT chỉ dồn vào 2 tuần trước go-live, các giai đoạn khác em giữ nhịp ổn định\". Thể hiện trách nhiệm mà không hứa hy sinh vô hạn.", "t": "\"Em sẵn sàng OT mọi lúc\" nghe tận tụy, nhưng với Senior lại là tín hiệu không biết lập kế hoạch."}, {"n": 80, "c": 1, "g": "1.8", "q": "Bạn chuyển từ Hà Nội/TP.HCM về Đà Nẵng — có lo thu nhập hoặc cơ hội ít hơn không, và có ở lâu không?", "a": "Interviewer lo 2 điều: em sẽ quay lại thành phố cũ, và kỳ vọng thu nhập không khớp. Trả lời: ① việc chuyển là quyết định dài hạn đã cân nhắc (nói ở mức chung); ② em hiểu mặt bằng mỗi khu vực khác nhau và nhìn tổng gói cùng cơ hội phát triển; ③ điểm cộng: mang cách làm, kinh nghiệm với khách lớn từ thành phố lớn về để góp phần xây đội ở Đà Nẵng.", "t": "Nếu đã có bằng chứng cụ thể (đã chuyển nơi ở, đã ổn định cuộc sống ở Đà Nẵng), nói ngắn một câu — đó là tín hiệu ổn định mạnh nhất."}, {"n": 81, "c": 1, "g": "1.8", "q": "Khi nào bạn có thể bắt đầu làm việc?", "a": "Nói ngày cụ thể dựa trên thời hạn báo trước trong hợp đồng hiện tại cộng thời gian bàn giao: \"em cần khoảng 30–45 ngày để bàn giao dự án cho người kế nhiệm với tài liệu đầy đủ\" (tham khảo, tùy hợp đồng). Nếu linh hoạt được thì nêu phương án. Công ty mới sẽ đánh giá cao việc em không bỏ dở trách nhiệm ở nơi cũ — vì đó cũng là cách em sẽ làm với họ sau này.", "t": ""}, {"n": 82, "c": 1, "g": "1.8", "q": "Bạn có đang phỏng vấn hoặc có offer nơi khác không?", "a": "Trung thực, ngắn, không dùng để gây sức ép: \"em đang trong một vài quy trình khác, nhưng VTI là lựa chọn ưu tiên vì… (đúng thị trường, đúng domain, đúng địa điểm)\". Nếu có offer kèm hạn phản hồi, nói rõ thời điểm cần quyết để công ty sắp xếp. Không bịa offer để ép giá — dễ lộ và mất thiện cảm. Điều interviewer cần nghe là \"vì sao ưu tiên\", không phải có bao nhiêu offer.", "t": ""}, {"n": 83, "c": 1, "g": "1.8", "q": "Với kinh nghiệm của bạn, vì sao không ứng tuyển vị trí cao hơn như Delivery Manager?", "a": "Cho thấy em hiểu lộ trình và tôn trọng việc chứng minh năng lực ở môi trường mới: \"em cần hiểu khách, quy trình và đội ngũ của công ty qua thực tế dự án; Senior PM là vị trí để em tạo kết quả rõ nhất trong 1–2 năm đầu\". Nói kỳ vọng phát triển lên vai trò rộng hơn dựa trên kết quả, gắn với chu kỳ review performance 2 lần/năm. Tránh để lộ suy nghĩ coi vị trí này là \"tạm\".", "t": ""}, {"n": 84, "c": 1, "g": "1.8", "q": "Vì sao chúng tôi nên chọn bạn thay vì ứng viên khác?", "a": "Tóm tắt 3 điểm khớp JD nhất, mỗi điểm có bằng chứng: ① kinh nghiệm PM outsourcing với khách Nhật, có kết quả đo được; ② năng lực estimate, proposal và quản trị rủi ro, thay đổi; ③ yếu tố riêng: gắn bó Đà Nẵng, tiếng Nhật, kinh nghiệm xây team hoặc chi nhánh (nếu có). Không so sánh hay hạ thấp người khác; kết bằng một cam kết cụ thể cho 6 tháng đầu.", "t": "Đây là \"closing pitch\" — luyện trước để nói trọn trong 45–60 giây."}, {"n": 85, "c": 1, "g": "1.9", "q": "Nên hỏi gì về dự án và khách hàng mình sẽ phụ trách?", "a": "Câu mẫu: \"Dự án em dự kiến phụ trách đang ở giai đoạn nào, mô hình hợp đồng ra sao, và thách thức lớn nhất hiện nay là gì?\"; hỏi thêm: \"Phía khách, ai là người ra quyết định cuối và họ quan tâm nhất điều gì?\". Vì sao ghi điểm: cho thấy em nghĩ ngay đến việc nhận dự án; câu trả lời giúp em đánh giá độ khó thật (dự án mới hay đang có vấn đề) và chuẩn bị cho 30 ngày đầu.", "t": ""}, {"n": 86, "c": 1, "g": "1.9", "q": "Nên hỏi gì về kỳ vọng với vị trí?", "a": "Câu mẫu: \"Sau 6 tháng, anh/chị đánh giá Senior PM ở vị trí này thành công dựa trên những chỉ số nào?\". Vì sao ghi điểm: thể hiện tư duy đo lường kết quả; giúp em biết trước tiêu chí sẽ dùng trong kỳ review; nếu interviewer chưa có câu trả lời rõ, đó cũng là thông tin quan trọng để em chủ động đề xuất KPI khi vào làm.", "t": "Ghi lại câu trả lời — nó là nguyên liệu cho kế hoạch 30-60-90 ngày và buổi thống nhất mục tiêu tuần đầu."}, {"n": 87, "c": 1, "g": "1.9", "q": "Nên hỏi gì về tổ chức và đội ngũ tại Đà Nẵng?", "a": "Câu mẫu: \"Team ở Đà Nẵng hiện có cơ cấu dev, QA, BrSE thế nào, và phối hợp với onsite ra sao?\". Vì sao ghi điểm: cho thấy em hiểu Senior PM chịu trách nhiệm cả nguồn lực lẫn vai trò đầu mối với onsite; câu trả lời cho biết em cần xây thêm gì (tuyển, đào tạo BrSE, quy trình) — đặc biệt hữu ích để nêu kinh nghiệm build-up chi nhánh nếu có.", "t": ""}, {"n": 88, "c": 1, "g": "1.9", "q": "Nên hỏi gì về quy trình chất lượng và công cụ?", "a": "Câu mẫu: \"Các dự án hiện theo quy trình chất lượng chung của công ty hay theo yêu cầu riêng của từng khách? Những chỉ số chất lượng nào đang được theo dõi?\". Vì sao ghi điểm: khách tài chính, bảo hiểm Nhật rất chú trọng chất lượng; câu hỏi cho thấy em quan tâm hệ thống chứ không chỉ kinh nghiệm cá nhân, và giúp em biết mức độ chuẩn hóa để định cách làm ngay từ đầu.", "t": ""}, {"n": 89, "c": 1, "g": "1.9", "q": "Nên hỏi gì về đánh giá và lộ trình thăng tiến?", "a": "Câu mẫu: \"Kỳ review performance 2 lần/năm dựa trên tiêu chí nào, và lộ trình từ Senior PM lên vai trò quản lý rộng hơn thường như thế nào?\". Vì sao ghi điểm: thể hiện tham vọng dài hạn gắn với công ty; hỏi về tiêu chí thay vì \"bao lâu được tăng lương\" cho thấy em tập trung vào kết quả.", "t": "Ở vòng chuyên môn, tránh hỏi về lương, thưởng, ngày nghỉ; để dành cho vòng HR hoặc khi đã có offer."}, {"n": 90, "c": 1, "g": "1.9", "q": "Nên hỏi gì về đào tạo và phát triển?", "a": "Câu mẫu: \"Chương trình đào tạo tiếng Nhật và hỗ trợ thi PMP/AWS áp dụng cho Senior PM thế nào — có điều kiện hay cam kết thời gian làm việc sau khi được hỗ trợ không?\". Vì sao ghi điểm: cho thấy em đọc kỹ JD và có kế hoạch học tập; đồng thời làm rõ điều kiện ràng buộc để quyết định chính xác, tránh bất ngờ sau này.", "t": ""}, {"n": 91, "c": 1, "g": "1.9", "q": "Nên hỏi gì về chiến lược công ty?", "a": "Câu mẫu: \"Với định hướng phát triển sản phẩm riêng và các thị trường như Hàn, Singapore, văn phòng Đà Nẵng dự kiến đóng vai trò gì trong vài năm tới?\". Vì sao ghi điểm: thể hiện tư duy chiến lược — một yêu cầu trong JD — và cho thấy em nghĩ xa hơn dự án đầu tiên; câu trả lời giúp em định vị đóng góp dài hạn của mình.", "t": ""}, {"n": 92, "c": 1, "g": "1.9", "q": "Nên hỏi gì ở cuối buổi để chốt, và câu nào không nên hỏi?", "a": "Câu mẫu: \"Qua buổi hôm nay, anh/chị còn băn khoăn gì về kinh nghiệm của em không ạ?\" và \"Bước tiếp theo của quy trình là gì ạ?\". Vì sao ghi điểm: cho em cơ hội giải tỏa nghi ngờ ngay tại chỗ và thể hiện sự tự tin. Không nên hỏi điều đã có trong JD, hỏi chuyện nghỉ phép/OT ở vòng chuyên môn, hoặc hỏi \"em có đậu không\".", "t": "Nếu interviewer nêu băn khoăn, đừng tranh luận — trả lời bằng 1 ví dụ cụ thể rồi cảm ơn."}, {"n": 93, "c": 1, "g": "1.10", "q": "Nguyên tắc của bạn khi đàm phán offer là gì?", "a": "① Chuẩn bị dữ liệu: mặt bằng thị trường, tổng thu nhập hiện tại, mức tối thiểu chấp nhận; ② đàm phán dựa trên giá trị em mang lại cho vị trí, không dựa trên nhu cầu cá nhân; ③ nhìn tổng gói, không chỉ lương cứng; ④ giữ thiện chí — người đàm phán với em hôm nay sẽ là đồng nghiệp ngày mai. Luôn cảm ơn và khẳng định hứng thú trước khi đề nghị điều chỉnh. Cách em đàm phán offer cũng là bản xem trước cách em sẽ đàm phán với khách.", "t": ""}, {"n": 94, "c": 1, "g": "1.10", "q": "Ngoài lương cứng, bạn có thể đàm phán những gì?", "a": "Các yếu tố thường linh hoạt hơn lương cứng: ① cơ chế thưởng dự án/doanh thu và cách tính; ② thời điểm review đầu tiên, ví dụ xét lại sau thử việc nếu lương khởi điểm chưa như kỳ vọng; ③ ngày bắt đầu; ④ hỗ trợ đào tạo tiếng Nhật, thi PMP/AWS; ⑤ chức danh và phạm vi trách nhiệm ghi rõ. Chọn 2–3 điều quan trọng nhất với em, đừng đòi tất cả cùng lúc.", "t": ""}, {"n": 95, "c": 1, "g": "1.10", "q": "Offer thấp hơn kỳ vọng, bạn xử lý thế nào?", "a": "① Cảm ơn và hỏi rõ cách công ty xác định mức này (khung của vị trí, đánh giá năng lực); ② đưa lại mức đề nghị có căn cứ (mặt bằng thị trường, kinh nghiệm cụ thể khớp JD); ③ đề xuất phương án trung gian: review lương sau thử việc với KPI rõ, điều chỉnh cơ chế thưởng, hỗ trợ khác; ④ quyết theo mức tối thiểu đã đặt trước, không quyết vì cảm xúc. Mọi thỏa thuận thêm phải nằm trong offer letter bằng văn bản.", "t": "\"Xét lại lương sau thử việc\" chỉ có giá trị khi ghi rõ tiêu chí và thời điểm trong văn bản."}, {"n": 96, "c": 1, "g": "1.10", "q": "Nhận offer nhưng cần thời gian suy nghĩ, bạn nói thế nào?", "a": "Cảm ơn, thể hiện hứng thú, và xin thời gian có hạn cụ thể: \"em rất cảm ơn và rất quan tâm; em xin phép phản hồi chính thức trước ngày X\" (thường vài ngày làm việc, tham khảo). Trong thời gian đó, hỏi rõ mọi điểm còn mơ hồ: thử việc, cơ chế thưởng, ngày bắt đầu. Phản hồi đúng hạn đã hẹn — công ty sẽ nhìn thấy sự giữ lời của em ngay từ trước ngày đầu đi làm.", "t": ""}, {"n": 97, "c": 1, "g": "1.10", "q": "Kế hoạch 30 ngày đầu của bạn là gì?", "a": "Mục tiêu: **học và xây quan hệ**. ① Gặp 1:1 sếp trực tiếp, onsite, BrSE, lead và các phòng ban liên quan; ② đọc hợp đồng, kế hoạch, Q&A list, báo cáo gần nhất, sổ rủi ro; ③ dự họp với khách để hiểu kỳ vọng và cách giao tiếp; ④ đo hiện trạng: tiến độ thật, chất lượng, effort. Đầu ra: bản đánh giá hiện trạng + top rủi ro, thống nhất với sếp. Chưa thay đổi lớn, trừ rủi ro khẩn cấp.", "t": "\"30 ngày đầu em lắng nghe\" chỉ thuyết phục khi kèm đầu ra cụ thể; không có đầu ra sẽ bị hiểu là thụ động."}, {"n": 98, "c": 1, "g": "1.10", "q": "60 ngày tiếp theo bạn làm gì?", "a": "Mục tiêu: **ổn định và cải thiện nhanh**. ① Chọn 2–3 cải tiến có tác động lớn từ bản đánh giá hiện trạng (ví dụ chuẩn hóa báo cáo tiến độ, change control, checklist review); ② thiết lập nhịp vận hành: họp định kỳ, KPI dự án, kênh escalation với onsite; ③ đánh giá năng lực từng thành viên, bắt đầu kế hoạch phát triển cho lead. Đầu ra: KPI dự án đo được hằng tuần và khách nhận báo cáo nhất quán.", "t": ""}, {"n": 99, "c": 1, "g": "1.10", "q": "Đến ngày thứ 90, bạn muốn đạt được gì?", "a": "Mục tiêu: **tự chủ và tạo kết quả**. ① Dự án chạy theo nhịp, các chỉ số tiến độ, chất lượng, effort nằm trong ngưỡng đã thống nhất; ② có ít nhất một kết quả cụ thể để báo cáo, như giảm bug lọt UAT hoặc đóng một rủi ro lớn; ③ tham gia estimate hoặc proposal cho cơ hội mới; ④ có kế hoạch phát triển cho team và đề xuất cải tiến cho văn phòng. Đây là nền cho kỳ review performance đầu tiên.", "t": ""}, {"n": 100, "c": 1, "g": "1.10", "q": "Làm sao bạn và công ty biết bạn đã thành công sau giai đoạn thử việc?", "a": "Đề xuất ngay tuần đầu thống nhất 3–5 tiêu chí đo được với sếp: ① mốc dự án đúng hạn, hoặc lệch nhưng báo trước và được khách chấp nhận; ② chất lượng: bug lọt sang khách trong ngưỡng; ③ phản hồi của khách và onsite qua họp định kỳ; ④ sự ổn định của team; ⑤ đóng góp ngoài dự án. Gặp sếp giữa kỳ để điều chỉnh. Tự đề xuất thước đo cho thấy em quản trị bản thân như quản trị dự án.", "t": "Kết buổi phỏng vấn bằng ý này là cách thể hiện tư duy Senior: tự đặt thước đo trước khi được giao."}, {"n": 101, "c": 2, "g": "2.1", "q": "Dự án khác vận hành (operation) ở điểm nào, và vì sao PM outsourcing cần phân biệt rõ?", "a": "Dự án là nỗ lực **tạm thời** tạo ra kết quả **duy nhất**, có điểm đầu–cuối; vận hành là công việc **lặp lại, liên tục** để duy trì kết quả đó. Trong outsourcing, ranh giới này quyết định hợp đồng và cách đo: dự án đo theo phạm vi–tiến độ–nghiệm thu, còn 運用保守 (unyou hoshu – vận hành & bảo trì) đo theo SLA, số ticket, thời gian phản hồi. Không tách rõ thì khách dễ đẩy việc vận hành vô hạn vào ngân sách dự án.", "t": "Ví dụ ghi điểm: sửa lỗi trong thời gian bảo hành thuộc dự án, còn yêu cầu mới phát sinh hằng tháng sau go-live phải chuyển sang hợp đồng vận hành."}, {"n": 102, "c": 2, "g": "2.1", "q": "Vòng đời dự án (project life cycle) khác vòng đời phát triển (development life cycle) thế nào?", "a": "Project life cycle là chuỗi pha từ khởi động đến đóng dự án; development life cycle là cách tạo ra sản phẩm bên trong: predictive (waterfall), iterative, incremental, adaptive hoặc hybrid. Dự án với khách Nhật thường theo pha 要件定義 (youken teigi – định nghĩa yêu cầu) → 基本設計 (kihon sekkei – thiết kế cơ bản) → 詳細設計 (shousai sekkei – thiết kế chi tiết) → lập trình → test, mỗi pha kết thúc bằng tài liệu được duyệt. Chọn development life cycle theo độ chắc của yêu cầu, không theo sở thích của team.", "t": ""}, {"n": 103, "c": 2, "g": "2.1", "q": "Năm nhóm quy trình (process groups) của PMBOK là gì? Chúng có phải các pha tuần tự không?", "a": "Gồm Initiating, Planning, Executing, Monitoring & Controlling, Closing. Chúng **không phải** pha tuần tự mà lặp lại trong từng pha và chồng lấn nhau; riêng Monitoring & Controlling chạy suốt dự án. Ví dụ pha 基本設計 vẫn có lập kế hoạch pha, thực hiện, theo dõi và đóng pha bằng 検収 (kenshuu – nghiệm thu) tài liệu thiết kế.", "t": "Bẫy kinh điển là đồng nhất process group với phase; nói \"process group lặp lại trong mỗi phase\" là điểm cộng."}, {"n": 104, "c": 2, "g": "2.1", "q": "PMBOK chuyển từ cách tiếp cận theo quy trình sang theo nguyên tắc và performance domains — điều đó thay đổi gì trong cách làm PM?", "a": "Bản 6 mô tả 5 process group, 10 knowledge area theo input–tool–output; bản 7 (2021) chuyển sang 12 principles (stewardship, value, systems thinking, tailoring…) và 8 performance domains (stakeholders, team, development approach & life cycle, planning, project work, delivery, measurement, uncertainty). Hệ quả: PM không \"chạy đủ process\" mà chọn cách làm tạo ra **outcome và giá trị**, đo bằng kết quả chứ không bằng số tài liệu. Công cụ cũ (WBS, EVM, risk register) vẫn dùng, nhưng được tailor theo bối cảnh.", "t": ""}, {"n": 105, "c": 2, "g": "2.1", "q": "Project charter gồm những gì, ai ký, và trong outsourcing thì charter thực tế nằm ở đâu?", "a": "Charter chính thức khởi động dự án và **trao quyền cho PM**: mục tiêu đo được, phạm vi cấp cao, milestone chính, ngân sách tổng, rủi ro cấp cao, stakeholder chính, tiêu chí thành công, sponsor. Sponsor ký, không phải PM. Trong outsourcing, nội dung này rải ở hợp đồng, proposal và tài liệu kickoff; em gom thành 1 trang tổng quan có 前提条件 (zentei jouken – điều kiện tiền đề) và 対象外 (taishougai – ngoài phạm vi) để hai bên xác nhận ngay buổi kickoff.", "t": "Nhấn mạnh charter trao quyền: không có người ký thì PM không có thẩm quyền điều phối nguồn lực."}, {"n": 106, "c": 2, "g": "2.1", "q": "Tailoring là gì? Cho ví dụ tailor quy trình cho dự án 3 tháng và dự án 18 tháng.", "a": "Tailoring là điều chỉnh quy trình, tài liệu, mức kiểm soát cho vừa quy mô, rủi ro, loại hợp đồng và văn hóa khách. Dự án 3 tháng, 5 người: kế hoạch 1 file, báo cáo tuần, risk register gọn, CR duyệt qua email. Dự án 18 tháng, 40 người: chia stage có gate, CCB họp định kỳ, EVM hằng tuần, configuration audit trước mỗi lần giao, báo cáo nhiều tầng. Nguyên tắc: mức kiểm soát tương xứng với rủi ro, không áp nguyên bộ quy trình \"cho đủ\".", "t": ""}, {"n": 107, "c": 2, "g": "2.1", "q": "Phân biệt project, program và portfolio. Senior PM ở công ty outsourcing liên quan thế nào với hai cấp sau?", "a": "Project tạo một kết quả cụ thể; program là nhóm dự án liên quan được quản lý phối hợp để đạt lợi ích chung; portfolio là tập dự án/program được chọn và ưu tiên theo chiến lược tổ chức. Senior PM thường phụ trách nhiều dự án cho cùng một khách, gần với program: chia sẻ nguồn lực, đồng bộ milestone, quản lý rủi ro chéo. Ở cấp portfolio, PM cung cấp dữ liệu tiến độ, margin, rủi ro để lãnh đạo quyết định ưu tiên.", "t": ""}, {"n": 108, "c": 2, "g": "2.1", "q": "PMO là gì, có những loại nào và PM nên tận dụng PMO ra sao?", "a": "PMO chuẩn hóa quản trị dự án, thường ở 3 mức: supportive (cung cấp template, dữ liệu), controlling (yêu cầu tuân thủ, audit), directive (trực tiếp quản lý dự án). PM tận dụng PMO để lấy dữ liệu dự án cũ cho estimate, template báo cáo, checklist audit, và làm kênh escalation khi thiếu nguồn lực. Đổi lại, PM nộp số liệu đúng hạn để PMO thấy sớm dự án có nguy cơ \"đỏ\".", "t": ""}, {"n": 109, "c": 2, "g": "2.1", "q": "Cơ cấu tổ chức functional, matrix, projectized ảnh hưởng đến quyền của PM thế nào? Công ty outsourcing thường ở dạng nào?", "a": "Functional: PM ít quyền, nhân sự thuộc trưởng bộ phận; projectized: PM nắm toàn quyền nguồn lực; matrix (weak/balanced/strong) nằm giữa. Công ty outsourcing thường là matrix: kỹ sư thuộc line manager, PM điều phối theo dự án, nên tranh chấp người giữa các dự án là chuyện thường ngày. Cách làm: chốt resource plan với line manager từ đầu, ghi rõ % allocation và thời gian; khi bị rút người thì escalate kèm tác động tiến độ cụ thể.", "t": "Câu này hay đi kèm \"PM có quyền gì khi bị rút người?\" — trả lời bằng resource plan đã thống nhất và số liệu tác động, không than phiền."}, {"n": 110, "c": 2, "g": "2.2", "q": "\"Integration management\" nghĩa là gì trong công việc hằng ngày của PM?", "a": "Integration là ra quyết định trade-off giữa các ràng buộc (phạm vi, tiến độ, chi phí, chất lượng, rủi ro) để dự án vận hành như một thể thống nhất, thay vì tối ưu từng mảng riêng lẻ. Hằng ngày: gộp kế hoạch con thành project management plan, quyết định nhận CR dựa trên tác động tổng thể, cân nguồn lực giữa sửa bug và làm tính năng mới. PM là người duy nhất nhìn toàn cục nên không thể giao integration cho ai khác.", "t": ""}, {"n": 111, "c": 2, "g": "2.2", "q": "Baseline là gì? Dự án có những baseline nào và khi nào được phép thay đổi?", "a": "Baseline là phiên bản kế hoạch **đã được phê duyệt**, dùng làm mốc đo hiệu suất: scope baseline (scope statement + WBS + WBS dictionary), schedule baseline và cost baseline; ba cái gộp lại là performance measurement baseline (PMB). Baseline chỉ đổi khi có CR được duyệt qua change control, không đổi chỉ vì đang chậm. Mỗi lần re-baseline phải lưu version cũ để còn đo được độ lệch lịch sử.", "t": "Đừng nói \"trễ thì re-baseline\" — câu đúng là re-baseline khi có thay đổi được duyệt, hoặc baseline cũ mất ý nghĩa và sponsor đồng ý."}, {"n": 112, "c": 2, "g": "2.2", "q": "Mô tả quy trình xử lý change request (CR) chuẩn từ lúc khách đưa yêu cầu đến khi đóng.", "a": "① Ghi nhận CR vào change log (người yêu cầu, nội dung, lý do, ngày); ② phân tích tác động tới phạm vi, 工数 (kousuu – công số/effort), tiến độ, chất lượng, rủi ro, hợp đồng; ③ trình phương án (làm ngay / gộp đợt sau / không làm) kèm chi phí; ④ người có thẩm quyền hoặc CCB duyệt/từ chối; ⑤ cập nhật baseline, tài liệu, thông báo team; ⑥ theo dõi đến khi nghiệm thu rồi đóng. CR bị từ chối cũng được lưu.", "t": "Với khách Nhật, tính cả thời gian 稟議 (ringi – trình duyệt nội bộ) của khách vào lịch CR, có khi mất 1–2 tuần (tham khảo)."}, {"n": 113, "c": 2, "g": "2.2", "q": "Change Control Board (CCB) gồm ai, và khi nào PM được tự duyệt thay đổi?", "a": "CCB thường gồm sponsor/đại diện khách, PM hai bên, BA hoặc tech lead, có thể thêm QA và bộ phận hợp đồng. Change management plan nên định ngưỡng thẩm quyền, ví dụ tham khảo: thay đổi không ảnh hưởng milestone và nằm trong 2–3 man-day buffer thì PM tự duyệt và ghi log; vượt ngưỡng hoặc đụng hợp đồng thì lên CCB. Ngưỡng rõ giúp vừa không nghẽn CCB vừa không lọt thay đổi lớn.", "t": "Nêu được ngưỡng phân quyền cụ thể cho thấy bạn đã vận hành change control thật, không chỉ thuộc lý thuyết."}, {"n": 114, "c": 2, "g": "2.2", "q": "Khách yêu cầu thay đổi qua chat trực tiếp với dev, không qua PM. Bạn xử lý thế nào?", "a": "① Xác nhận nội dung với dev, tạm chưa code; ② liên hệ khách theo 報連相 (hourensou – báo cáo, liên lạc, thảo luận): cảm ơn yêu cầu, xin đưa vào CR để đánh giá tác động; ③ gửi đánh giá trong thời hạn cam kết (vd 1–2 ngày làm việc); ④ phòng ngừa: thống nhất lại kênh nhận yêu cầu trong communication plan, nhắc team quy tắc \"yêu cầu mới → báo PM/BrSE (Bridge SE – kỹ sư cầu nối)\". Không từ chối khách mà đưa yêu cầu về đúng quy trình.", "t": ""}, {"n": 115, "c": 2, "g": "2.2", "q": "Configuration management khác change control ở điểm nào?", "a": "Change control quyết định **có thay đổi hay không**; 構成管理 (kousei kanri – quản lý cấu hình) đảm bảo **mọi thành phần được nhận diện, đánh version và nhất quán** sau thay đổi: tài liệu, source, môi trường, dữ liệu test. Bốn hoạt động chính: identification, status accounting, kiểm soát thay đổi trên configuration item, verification & audit. Lỗi kinh điển: CR đã duyệt nhưng tài liệu 基本設計 không lên version, dev và tester làm theo hai bản khác nhau.", "t": ""}, {"n": 116, "c": 2, "g": "2.2", "q": "Trong dự án phần mềm outsourcing, bạn đưa những gì vào danh sách configuration item (CI) và kiểm soát ra sao?", "a": "Danh sách CI lập từ đầu: tài liệu yêu cầu/thiết kế, source code, script DB, cấu hình môi trường, test case và test data, tài liệu bàn giao, cả bản estimate. Mỗi CI có owner, nơi lưu (Git, kho tài liệu), quy tắc đặt tên version và trạng thái draft/review/approved/baselined. Trước mỗi lần 納品 (nouhin – giao hàng), em chạy configuration audit: version tài liệu khớp bản release, release note khớp danh sách CR đã duyệt.", "t": ""}, {"n": 117, "c": 2, "g": "2.2", "q": "Khi nào nên gộp nhiều CR nhỏ thành một gói thay vì xử lý từng cái?", "a": "Gộp khi các CR cùng module, không gấp, và chi phí xử lý (phân tích, duyệt, test hồi quy) lớn hơn bản thân thay đổi. Gói CR theo đợt (vd 2 tuần/lần hoặc theo release) giúp khách duyệt một lần, team test hồi quy một lần và estimate chính xác hơn. Ngoại lệ: CR liên quan bảo mật, pháp lý hoặc chặn go-live thì xử lý riêng, ngay.", "t": ""}, {"n": 118, "c": 2, "g": "2.2", "q": "Sponsor phía khách nói: \"Thay đổi nhỏ thôi, làm luôn, không cần CR\". Bạn phản hồi thế nào mà không làm mất lòng?", "a": "Em đồng ý về tinh thần nhưng vẫn ghi nhận: \"Vâng, để hai bên cùng nắm, em ghi vào change log, tác động khoảng X giờ, không ảnh hưởng milestone\". Nếu dưới ngưỡng PM tự duyệt thì làm luôn nhưng có dấu vết; khi nhiều \"thay đổi nhỏ\" cộng dồn vượt buffer, em trình tổng lũy kế để khách thấy và quyết định. Mục tiêu là minh bạch, không phải tính tiền từng việc nhỏ.", "t": "Ý senior: phân biệt \"linh hoạt\" với \"mất kiểm soát\" — linh hoạt vẫn có log, tổng lũy kế có ngưỡng cảnh báo."}, {"n": 119, "c": 2, "g": "2.3", "q": "Quản lý phạm vi gồm những quy trình nào, và trong dự án với khách Nhật chúng nằm ở đâu?", "a": "Plan scope management → collect requirements → define scope → create WBS → validate scope → control scope. Yêu cầu, scope statement và WBS hình thành scope baseline; validate và control chạy suốt dự án. Với khách Nhật, collect và define nằm chủ yếu trong pha 要件定義, kết quả là tài liệu 要件定義書 được khách duyệt; WBS do vendor lập trong kế hoạch dự án, làm cơ sở estimate và theo dõi.", "t": ""}, {"n": 120, "c": 2, "g": "2.3", "q": "WBS là gì? Quy tắc 100% (100% rule) nghĩa là gì?", "a": "WBS phân rã toàn bộ deliverable và công việc của dự án thành các cấp nhỏ dần đến work package. Quy tắc 100%: tổng công việc ở các nút con bằng đúng 100% nút cha — không thiếu, không thừa — và toàn bộ WBS bao trùm 100% phạm vi, kể cả quản lý dự án, review, test, tài liệu, bàn giao. Đây là chỗ estimate hay hụt nhất: chỉ liệt kê tính năng mà quên các việc \"ẩn\".", "t": "Kể tên việc ẩn hay bị quên (PM, review, setup môi trường, data migration, hỗ trợ UAT, sửa lỗi bảo hành) là cách nhanh nhất chứng minh kinh nghiệm."}, {"n": 121, "c": 2, "g": "2.3", "q": "Work package nên nhỏ cỡ nào? Khi nào bạn dừng phân rã WBS?", "a": "Thông lệ tham khảo là 8–80 giờ công, hoặc không dài quá một chu kỳ báo cáo (1–2 tuần) để theo dõi được tiến độ thật. Em dừng phân rã khi work package: ① estimate được với độ tin cậy chấp nhận được; ② giao được cho một người/nhóm chịu trách nhiệm; ③ có tiêu chí \"xong\" rõ (vd code + unit test + review đạt). Chia quá nhỏ chỉ tăng chi phí quản lý mà không thêm thông tin.", "t": ""}, {"n": 122, "c": 2, "g": "2.3", "q": "WBS dictionary dùng để làm gì? Dự án nhỏ có cần không?", "a": "WBS dictionary mô tả chi tiết từng work package: nội dung, deliverable, tiêu chí chấp nhận, owner, estimate, phụ thuộc, tài liệu tham chiếu. Nó tránh việc team offshore, onsite và khách hiểu khác nhau về chữ \"xong\". Dự án nhỏ có thể tailor thành vài cột thêm trong file WBS Excel (mô tả, tiêu chí xong, owner) thay vì tài liệu riêng.", "t": ""}, {"n": 123, "c": 2, "g": "2.3", "q": "Scope statement khác requirement document ở điểm nào? Nên ghi gì để tránh tranh cãi về sau?", "a": "Requirement document mô tả **cần gì** (chức năng, phi chức năng, nghiệp vụ); scope statement mô tả **dự án sẽ giao gì**: deliverable, tiêu chí chấp nhận, ràng buộc, giả định và phần **loại trừ**. Để tránh tranh cãi, em ghi rõ danh sách 対象外, các 前提条件 (vd khách cấp môi trường, dữ liệu test, trả lời Q&A trong 2 ngày làm việc) và số vòng chỉnh sửa tài liệu được tính trong giá.", "t": "Danh sách out-of-scope và giả định là thứ cứu dự án Fixed Price khỏi tranh chấp — nhắc điều này kèm một ví dụ thật của bạn."}, {"n": 124, "c": 2, "g": "2.3", "q": "Requirement Traceability Matrix (RTM) là gì và bạn dùng nó thế nào?", "a": "RTM liên kết mỗi yêu cầu với nguồn gốc, thiết kế, module, test case, kết quả test và CR liên quan. Em dùng để: ① kiểm tra không yêu cầu nào bị bỏ sót khi test; ② phân tích tác động khi có CR (đổi yêu cầu X ảnh hưởng màn hình, API, test case nào); ③ chứng minh độ phủ khi nghiệm thu. Tiêu chí tham khảo trước UAT: 100% yêu cầu trong phạm vi có test case và kết quả pass hoặc được khách chấp nhận.", "t": ""}, {"n": 125, "c": 2, "g": "2.3", "q": "Scope creep khác gold plating thế nào? Phòng ngừa từng loại ra sao?", "a": "Scope creep là phạm vi phình ra **không qua kiểm soát**, thường từ khách hoặc do BA nhận thêm \"tiện thể\"; gold plating là **team tự làm thêm** ngoài yêu cầu để khách vui. Cả hai đều tốn effort không được trả tiền, tăng lỗi và khó nghiệm thu. Phòng ngừa: creep → mọi yêu cầu mới qua CR, đối chiếu RTM; gold plating → review và test bám spec, tiêu chí xong rõ, ý tưởng cải tiến đưa qua PM để khách chọn.", "t": "Bẫy: khen gold plating là \"tận tâm\". Cách đúng là đề xuất cải tiến cho khách quyết định, không tự ý làm."}, {"n": 126, "c": 2, "g": "2.3", "q": "Validate scope khác control scope và khác quality control thế nào?", "a": "Validate scope là **khách/sponsor chính thức chấp nhận** deliverable (kết quả là accepted deliverables, vd biên bản 検収); control scope là PM **theo dõi phạm vi so với baseline** và quản lý thay đổi. Quality control là team nội bộ kiểm tra deliverable **có đúng không**, thường làm trước validate scope. Thứ tự: QC
