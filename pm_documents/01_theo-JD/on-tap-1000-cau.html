合テスト tiếp tục dưới test lead. ③ 報連相: gửi 第一報 sự cố cho khách ngay; giới thiệu người thay BrSE; gặp 担当者 mới với hồ sơ bàn giao. ④ Trong 1–2 tuần: 障害報告書 + 再発防止, cập nhật kế hoạch test, thiết lập backup cố định cho vai trò cầu nối.", "t": "Câu tổng hợp kiểm tra khả năng xếp ưu tiên: nói thứ tự và lý do trước, rồi mới kể hành động."}, {"n": 801, "c": 9, "g": "9.1", "q": "Trong team offshore làm cho khách Nhật, vai trò PM, BrSE, Tech Lead, Dev, QA/QC và Comtor khác nhau thế nào?", "a": "PM chịu trách nhiệm cuối về **QCD** (chất lượng–chi phí–tiến độ), nguồn lực, rủi ro; BrSE (ブリッジSE, burijji SE – kỹ sư cầu nối) làm rõ yêu cầu với khách và chuyển thành task; Tech Lead quyết giải pháp kỹ thuật, review code; Dev hiện thực theo 詳細設計書 (shousai sekkeisho – tài liệu thiết kế chi tiết); QA/QC kiểm độc lập; Comtor dịch tài liệu và họp. Em chốt ranh giới bằng RACI ngay kick-off, vì lỗi hay gặp là BrSE bị coi như \"PM thứ hai\".", "t": "Nói được điểm chồng lấn PM–BrSE và cách tách sẽ ăn điểm hơn đọc định nghĩa."}, {"n": 802, "c": 9, "g": "9.1", "q": "Tỉ lệ BrSE:Dev và QA:Dev bạn thường dùng là bao nhiêu, khi nào cần điều chỉnh?", "a": "Tham khảo: BrSE:Dev khoảng 1:5–8, QA:Dev 1:3–5, Tech Lead 1 cho 5–8 dev. Em tăng BrSE khi yêu cầu còn biến động hoặc Q&A tồn nhiều (vd > 20 câu chưa đóng quá 3 ngày); tăng QA khi domain tài chính/bảo hiểm nhiều rule tính toán hoặc bug lọt sang khách vượt ngưỡng cam kết. Tỉ lệ chỉ là điểm xuất phát, số liệu thực tế của dự án mới là căn cứ.", "t": "Luôn kèm chữ \"tham khảo\" và tiêu chí điều chỉnh — nêu một con số cứng dễ bị hỏi vặn."}, {"n": 803, "c": 9, "g": "9.1", "q": "Bạn xây RACI nội bộ thế nào để tránh tình trạng \"ai cũng tưởng người khác làm\"?", "a": "Em liệt kê 15–25 hoạt động chính (xác nhận yêu cầu, estimate, review thiết kế, release, báo cáo tuần, trả lời Q&A khách…), gán R/A/C/I, mỗi hoạt động **đúng 1 A**. Sau đó soát 3 lỗi: hàng không có A, một người ôm quá nhiều R, người chỉ toàn I nhưng vẫn bị mời họp. RACI để trên wiki, xem lại mỗi khi đổi người hoặc đổi phase.", "t": ""}, {"n": 804, "c": 9, "g": "9.1", "q": "Span of control của PM nên là bao nhiêu người, và khi team vượt ngưỡng thì tổ chức lại thế nào?", "a": "Quản lý trực tiếp hiệu quả khoảng 6–8 người (tham khảo). Team 20–30 người thì em chia sub-team theo module hoặc theo luồng dev–test, mỗi sub-team có leader điều hành hằng ngày; em 1-on-1 trực tiếp với leader và key member. Dấu hiệu phải chia: PM không còn thời gian 1-on-1 hằng tháng, quyết định nhỏ dồn hết về PM, daily kéo dài quá 15 phút.", "t": ""}, {"n": 805, "c": 9, "g": "9.1", "q": "Khi quản lý 2–3 dự án song song, bạn phân bổ thời gian và sự chú ý thế nào?", "a": "Em phân bổ theo rủi ro, không chia đều: dự án đỏ hoặc đang ở mốc quan trọng nhận 50–60% thời gian; dự án ổn định giao leader vận hành, em giữ điểm chạm cố định (họp định kỳ tuần, duyệt báo cáo, gate release). Một dashboard chung (tiến độ, bug, effort, top 3 rủi ro) giúp em quét cả 3 dự án trong 15 phút mỗi sáng.", "t": "Bẫy: trả lời \"chia đều thời gian\" — Senior PM phải phân bổ theo rủi ro."}, {"n": 806, "c": 9, "g": "9.1", "q": "Có nên để một member làm đồng thời cho 2 dự án không?", "a": "Hạn chế; nếu bắt buộc (QA, BrSE, chuyên gia hạ tầng) thì tối đa 2 dự án và chia theo ngày cố định (vd thứ 2–4 cho dự án A) thay vì theo giờ, vì context switching ăn mất năng suất. Em ghi rõ % allocation trong kế hoạch nguồn lực, thống nhất trước ai được ưu tiên khi hai deadline đụng nhau, và theo dõi effort thực tế hằng tuần để phát hiện người bị kéo quá 100%.", "t": ""}, {"n": 807, "c": 9, "g": "9.1", "q": "Comtor và BrSE khác nhau thế nào, khi nào dự án chỉ cần Comtor?", "a": "Comtor chủ yếu chuyển ngữ; BrSE hiểu cả kỹ thuật lẫn nghiệp vụ nên phân tích, đề xuất và chịu trách nhiệm độ đúng của yêu cầu. Dự án maintain nhỏ, yêu cầu rõ, Tech Lead vững và khách chấp nhận trao đổi văn bản thì Comtor + Tech Lead có thể đủ. Dự án có 要件定義 (youken teigi – định nghĩa yêu cầu) hoặc domain phức tạp thì cần BrSE, vì Comtor dễ dịch đúng chữ nhưng sai ý nghiệp vụ.", "t": ""}, {"n": 808, "c": 9, "g": "9.1", "q": "Bạn phân biệt vai trò QA và QC trong team dự án Nhật thế nào?", "a": "QC kiểm sản phẩm: viết test case, chạy test, log bug. QA kiểm quy trình: review, checklist, metric chất lượng có được làm đúng và đủ không, phân tích xu hướng bug để cải tiến. Khách Nhật thường muốn báo cáo chất lượng có số (mật độ bug, tỉ lệ review), nên em giao người giữ vai QA theo dõi metric và đề xuất 改善 (kaizen – cải tiến liên tục), không chỉ đếm bug.", "t": ""}, {"n": 809, "c": 9, "g": "9.1", "q": "Tech Lead và PM nên phân quyền quyết định thế nào để không giẫm chân nhau?", "a": "Nguyên tắc: Tech Lead quyết \"làm thế nào\" (kiến trúc, công nghệ, chuẩn code, chia task kỹ thuật); PM quyết \"làm gì, khi nào, tốn bao nhiêu\" (phạm vi, ưu tiên, nguồn lực, cam kết với khách). Quyết định kỹ thuật làm đổi chi phí/tiến độ vượt ngưỡng (vd > 2 ngày công hoặc chạm mốc) thì Tech Lead đề xuất, PM duyệt. Em viết thành ma trận quyền ngay từ đầu dự án.", "t": ""}, {"n": 810, "c": 9, "g": "9.1", "q": "Dự án mới khởi động, bạn dựng team đủ người ngay hay ramp-up dần?", "a": "Ramp-up theo phase: giai đoạn yêu cầu/thiết kế chỉ cần BrSE, Tech Lead và 1–2 dev chủ chốt; thiết kế ổn định mới thêm dev; QA vào trước giai đoạn test 2–3 tuần để viết test viewpoint. Đổ người sớm khi yêu cầu chưa rõ chỉ sinh chi phí ngồi chờ và làm lại. Em lập resource histogram theo tuần và chốt với phòng ban liên quan trước 4–6 tuần (tham khảo) cho mỗi đợt tăng người.", "t": ""}, {"n": 811, "c": 9, "g": "9.1", "q": "Team thiếu Tech Lead đủ mạnh trong khi chờ tuyển, bạn xử lý thế nào?", "a": "① Xác định khoảng trống cụ thể: kiến trúc, review code hay hỗ trợ dev. ② Lấp tạm: mượn senior dự án khác 20–30% thời gian để review thiết kế và code lõi. ③ Giảm rủi ro: checklist review, pair programming cho phần quan trọng. ④ Chọn một senior dev trong team làm Tech Lead kế cận với lộ trình 3–6 tháng. Em không tự ôm vai Tech Lead nếu điều đó làm bỏ bê việc PM.", "t": ""}, {"n": 812, "c": 9, "g": "9.2", "q": "Mô hình Tuckman gồm những giai đoạn nào, PM làm gì ở mỗi giai đoạn?", "a": "**Forming** – làm rõ mục tiêu, vai trò, luật chơi; **Storming** – chủ động đưa va chạm lên bàn, phân xử theo nguyên tắc; **Norming** – chốt working agreement, giao dần quyền; **Performing** – PM lùi lại, gỡ cản trở và phát triển người; **Adjourning** – tổng kết, ghi nhận, bàn giao tri thức. Phong cách lãnh đạo đi dần từ chỉ dẫn sang ủy quyền.", "t": "Nói thêm: thay người hoặc đổi phase lớn có thể kéo team quay lại Storming — PM phải nhận ra sớm."}, {"n": 813, "c": 9, "g": "9.2", "q": "Ngày đầu tiên của một team dự án mới, bạn làm những gì?", "a": "Chuẩn bị trước: máy, tài khoản, quyền repo, tài liệu. Trong ngày: kick-off nội bộ 60–90 phút gồm bối cảnh khách và giá trị nghiệp vụ, mục tiêu QCD, vai trò–RACI, lịch họp, kênh liên lạc, quy định bảo mật; mỗi người chia sẻ thế mạnh và điều muốn học. Cuối ngày ai cũng có một việc nhỏ hoàn thành được để có cảm giác \"đã bắt đầu\".", "t": ""}, {"n": 814, "c": 9, "g": "9.2", "q": "Bạn xây working agreement (luật chơi của team) như thế nào?", "a": "Team tự đề xuất trong buổi 60 phút, PM chỉ gợi khung: giờ core, thời gian phản hồi chat (vd ≤ 2 giờ trong giờ làm), quy tắc commit/review, cách báo trễ (\"báo ngay khi thấy có thể trễ, không đợi đến hạn\"), quy tắc họp. Chốt dưới 10 điều, dán lên wiki, xem lại ở mỗi retro. Luật do team tự đặt thì tự giữ tốt hơn luật PM áp xuống.", "t": ""}, {"n": 815, "c": 9, "g": "9.2", "q": "Những nghi thức (ritual) nào bạn duy trì để gắn kết team?", "a": "Chỉ giữ nghi thức có mục đích: daily ≤ 15 phút; demo cuối sprint để team thấy sản phẩm chạy; 振り返り (furikaeri – nhìn lại, retro) luôn ra hành động cải tiến; ăn mừng milestone (release đầu, nghiệm thu, khách khen). Khi ăn mừng em nêu tên đóng góp cụ thể chứ không chỉ liên hoan. Ngân sách team building xin từ đầu dự án và gắn với các mốc.", "t": ""}, {"n": 816, "c": 9, "g": "9.2", "q": "Psychological safety là gì và bạn tạo nó trong team thế nào?", "a": "Là cảm giác an toàn khi nói \"em không biết\", báo lỗi, phản biện mà không bị phạt hay chê cười. Em làm bằng hành động: tự nhận lỗi của mình trước team, cảm ơn người báo bug/báo trễ sớm, retro blameless tập trung vào quy trình, hỏi ý junior trước senior. Chỉ báo kiểm tra: rủi ro và trễ hạn được báo sớm hơn, member dám đặt câu hỏi trong họp.", "t": "Liên hệ 報連相 (hou-ren-sou – báo cáo, liên lạc, thảo luận): thiếu an toàn tâm lý thì team giấu tin xấu đến phút chót."}, {"n": 817, "c": 9, "g": "9.2", "q": "Team chia ở Hà Nội, Đà Nẵng và một người onsite Nhật — làm sao để không thành \"ba team\"?", "a": "① Một nguồn thông tin: backlog, wiki, chat chung, quyết định được ghi lại, không chốt việc ở bàn nước. ② Họp chung bật camera, luân phiên người chủ trì, không để site đông người áp đảo. ③ Ghép cặp xuyên site (review chéo, pair) thay vì chia module theo địa điểm. ④ Onsite có slot cố định chia sẻ \"tiếng nói khách\". ⑤ Gặp mặt trực tiếp ở mốc lớn nếu có ngân sách.", "t": "Bẫy hay gặp: chia module theo site — nhanh chóng thành \"chúng tôi vs họ\"."}, {"n": 818, "c": 9, "g": "9.2", "q": "Làm sao để người onsite ở Nhật không bị cô lập với team offshore?", "a": "Người onsite chịu áp lực khách trực tiếp và lệch múi giờ 2 tiếng, nên em: 1-on-1 riêng 2 tuần/lần, mời vào daily vài buổi mỗi tuần, ghi nhận đóng góp của onsite công khai trong demo, và lên kế hoạch luân chuyển (vd 6–12 tháng, tham khảo) để không ai bị \"kẹt\" ở onsite. Ngược lại, onsite phải đưa feedback của khách về team đầy đủ, không lọc bớt.", "t": ""}, {"n": 819, "c": 9, "g": "9.2", "q": "Team làm hybrid (vài ngày remote), bạn giữ gắn kết thế nào?", "a": "Em thống nhất ngày lên văn phòng chung cho cả team (vd 2 ngày/tuần) để dồn việc cần tương tác: thiết kế, review khó, retro. Ngày remote dùng giờ core và quy tắc phản hồi rõ. Thêm điểm chạm nhẹ: kênh chat không bàn việc, cà phê online 15 phút. Đo bằng hành vi: người remote có được giao việc thú vị và lên tiếng trong họp như người ở văn phòng không.", "t": ""}, {"n": 820, "c": 9, "g": "9.2", "q": "Team mới ghép từ nhiều dự án, mỗi người quen một cách làm. Bạn thống nhất thế nào?", "a": "Em không áp cách của riêng mình: liệt kê các điểm cần chuẩn chung (coding convention theo yêu cầu khách, Git flow, Definition of Done, mẫu báo cáo), mời người giỏi nhất từng mảng đề xuất, team chốt và chạy thử 2 sprint rồi điều chỉnh ở retro. Điều khách đã quy định thì không bàn lại. Thói quen cũ tốt được đưa vào chuẩn mới để người đó thấy được tôn trọng.", "t": ""}, {"n": 821, "c": 9, "g": "9.2", "q": "Dự án kết thúc, team giải tán — bạn làm gì để giữ gắn kết và bài học?", "a": "Adjourning hay bị bỏ qua. Em làm: buổi tổng kết có số liệu QCD và bài học để 横展開 (yokotenkai – nhân rộng sang dự án khác); thư cảm ơn nêu đóng góp cụ thể từng người, gửi cả quản lý trực tiếp của họ; cập nhật đánh giá dự án vào hồ sơ performance; giới thiệu member sang dự án hợp nguyện vọng. Người rời dự án với cảm giác được ghi nhận sẽ muốn làm cùng mình lần sau.", "t": ""}, {"n": 822, "c": 9, "g": "9.3", "q": "Động lực của kỹ sư IT đến từ đâu, và tiền đóng vai trò gì?", "a": "Em dùng 2 khung: Herzberg — lương, điều kiện làm việc là yếu tố \"duy trì\": thiếu thì bất mãn, đủ chưa chắc hăng hái; Daniel Pink — động lực nội tại đến từ **autonomy** (tự chủ), **mastery** (giỏi lên), **purpose** (ý nghĩa). Nên em đảm bảo phần tiền công bằng, minh bạch, rồi tạo lửa bằng việc có thách thức, quyền quyết định và hiểu sản phẩm phục vụ ai.", "t": "Bẫy: nói \"tiền không quan trọng\" — kỹ sư sẽ không tin; hãy nói tiền là nền, không phải động cơ."}, {"n": 823, "c": 9, "g": "9.3", "q": "Bạn trao autonomy cho member thế nào mà vẫn kiểm soát được rủi ro?", "a": "Em giao \"kết quả + ràng buộc\", không giao từng bước: vd \"module tính phí, xong trước ngày X, pass test viewpoint của QA, effort ≤ Y ngày công\", người nhận tự chọn cách làm. Kiểm soát qua điểm chạm nhỏ (review thiết kế đầu, demo giữa chừng) và ngưỡng báo cáo (lệch > 1 ngày phải báo). Mức tự chủ tăng dần theo năng lực đã chứng minh.", "t": ""}, {"n": 824, "c": 9, "g": "9.3", "q": "Bạn ghi nhận (recognition) thành viên thế nào cho hiệu quả?", "a": "Ghi nhận phải **kịp thời, cụ thể, công khai đúng mức**: nói rõ hành vi và tác động (\"A phát hiện lỗi làm tròn phí trước UAT, tránh một vòng sửa với khách\"), trong vài ngày, trước team hoặc trong báo cáo gửi cấp trên. Lời cảm ơn của khách em chuyển đúng người. Với người hướng nội, em khen riêng và ghi vào hồ sơ review; em cũng ghi nhận cả việc \"vô hình\" như review kỹ, giúp đồng đội.", "t": ""}, {"n": 825, "c": 9, "g": "9.3", "q": "Dự án maintain nhiều năm, việc lặp lại, team chán. Bạn làm gì?", "a": "① Tạo mastery ngay trong maintain: mục tiêu cải tiến đo được (giảm 20% thời gian xử lý ticket, tự động hóa test hồi quy). ② Xoay vai: dev thử estimate, trả lời Q&A, phỏng vấn ứng viên. ③ Dành 10–15% thời gian (tham khảo) cho refactor hoặc đề xuất 改善 cho khách — khách Nhật thường trân trọng đề xuất chủ động. ④ Cho người muốn đổi môi trường luân chuyển có kế hoạch, thay vì để họ nghỉ.", "t": "Biến đề xuất cải tiến thành change request có doanh thu — ghi điểm cả với team lẫn công ty."}, {"n": 826, "c": 9, "g": "9.3", "q": "Dự án đỏ kéo dài 3 tháng, team mệt và mất tinh thần. Bạn giữ lửa thế nào?", "a": "Không hô hào, mà: ① nói thật tình hình và kế hoạch phục hồi với các mốc nhỏ thắng được trong 1–2 tuần; ② bảo vệ team: đàm phán giảm phạm vi/lùi mốc, xin thêm người, chặn yêu cầu mới; ③ ăn mừng từng mốc nhỏ; ④ theo dõi OT, cho nghỉ bù luân phiên; ⑤ có mặt cùng team lúc khó nhất. Người ta chịu được khó khi thấy đích và thấy PM đứng về phía mình.", "t": ""}, {"n": 827, "c": 9, "g": "9.3", "q": "Có nên tổ chức team building khi dự án đang đỏ, deadline gấp?", "a": "Không làm buổi lớn tốn nửa ngày giữa nước rút; nhưng giữ hoạt động nhỏ, ít tốn thời gian: bữa trưa chung, ăn tối khi OT, khen công khai sau mỗi mốc. Hoạt động lớn để sau milestone, như một buổi \"ăn mừng phục hồi\". Quan trọng hơn team building là giảm tải thật: bỏ họp không cần thiết, chặn việc ngoài phạm vi.", "t": "Câu trade-off — trả lời \"tùy\" kèm tiêu chí rõ ràng được đánh giá cao hơn \"có\" hay \"không\"."}, {"n": 828, "c": 9, "g": "9.3", "q": "Làm outsource, member không gặp người dùng cuối — làm sao để họ thấy \"purpose\"?", "a": "Em kể câu chuyện nghiệp vụ: hệ thống của khách bảo hiểm B phục vụ ai, một lỗi tính phí ảnh hưởng người dùng thế nào; mời BrSE hoặc khách chia sẻ 15 phút ở kick-off về bối cảnh kinh doanh; chuyển feedback của người dùng cuối về team. Purpose còn là sự phát triển của chính họ: dự án này giúp họ đạt kỹ năng, chứng chỉ gì (Cloud/AWS, tiếng Nhật).", "t": ""}, {"n": 829, "c": 9, "g": "9.3", "q": "Động lực của member trẻ (Gen Z) khác thế hệ trước thế nào, bạn điều chỉnh gì?", "a": "Em tránh khái quát theo thế hệ, nhưng thực tế nhóm trẻ thường cần: feedback thường xuyên (không đợi 6 tháng), lộ trình nhìn thấy được, linh hoạt giờ giấc, được giải thích \"vì sao\". Em điều chỉnh: 1-on-1 dày hơn, mục tiêu ngắn 1–3 tháng, giải thích lý do của quy trình Nhật (vì sao checklist, vì sao review kỹ) thay vì bắt tuân thủ. Chuẩn chất lượng thì không hạ.", "t": "Bẫy: nói \"Gen Z lười, thiếu cam kết\" — lập tức mất điểm leadership."}, {"n": 830, "c": 9, "g": "9.3", "q": "Một member giỏi nói \"em làm đủ việc, không muốn nhận thêm trách nhiệm\". Bạn xử lý thế nào?", "a": "Đó là lựa chọn hợp lệ nếu họ hoàn thành tốt việc hiện tại. Em hỏi để hiểu (giai đoạn cuộc sống, sợ thất bại, hay thấy thăng tiến không đáng), tôn trọng quyết định, giao việc chuyên sâu kỹ thuật thay cho trách nhiệm quản lý nếu họ thích, và nói rõ cánh cửa vẫn mở. Không ép lên leader, vì người không muốn quản lý thường quản lý kém.", "t": ""}, {"n": 831, "c": 9, "g": "9.3", "q": "Bạn đo tinh thần team bằng gì thay vì cảm tính?", "a": "Kết hợp khảo sát và chỉ báo hành vi: ① pulse survey ẩn danh 3–5 câu mỗi tháng (thang 1–5, xem xu hướng chứ không xem số tuyệt đối); ② số đề xuất cải tiến ở retro; ③ OT, nghỉ đột xuất, trễ hạn bị báo muộn; ④ tín hiệu trong 1-on-1. Điểm giảm 2 kỳ liên tiếp hoặc một nhóm tụt mạnh là trigger để em đào sâu, không đợi có người nộp đơn nghỉ.", "t": ""}, {"n": 832, "c": 9, "g": "9.4", "q": "Bạn tổ chức 1-on-1 thế nào: tần suất, thời lượng, nội dung?", "a": "Tham khảo: 30 phút, 2 tuần/lần với direct report và key member; 1 tháng/lần với người báo cáo qua leader. Đó là buổi **của member**: họ đặt chủ đề, em hỏi nhiều hơn nói. Nội dung xoay quanh 3 phần: đang vướng gì, cảm nhận/động lực, phát triển dài hạn. Kết thúc có 1–2 action, ghi ngắn và kiểm lại lần sau.", "t": "Bẫy: dùng 1-on-1 để hỏi tiến độ — tiến độ đã có daily và tool."}, {"n": 833, "c": 9, "g": "9.4", "q": "Những câu hỏi nào bạn hay dùng trong 1-on-1?", "a": "Câu mở em hay dùng: \"Tuần này việc gì làm em tốn năng lượng nhất?\", \"Có việc gì em muốn làm mà chưa được giao?\", \"Nếu em là PM, em sẽ đổi điều gì trong dự án?\", \"6 tháng nữa em muốn giỏi thêm điều gì?\". Câu cuối luôn là xin feedback cho chính em: \"Anh/chị nên làm khác điều gì?\". Tránh câu đóng kiểu \"ổn không em?\" vì đáp án luôn là \"ổn ạ\".", "t": ""}, {"n": 834, "c": 9, "g": "9.4", "q": "IDP (kế hoạch phát triển cá nhân) bạn xây với member gồm những gì?", "a": "① Mục tiêu nghề nghiệp 1–2 năm (vd lên Tech Lead, thành BrSE); ② khoảng cách kỹ năng so với mục tiêu; ③ 2–3 mục tiêu 6 tháng đo được, khớp chu kỳ review 2 lần/năm; ④ cách đạt theo tỉ lệ 70-20-10 (việc thực tế – học từ người khác – khóa học); ⑤ hỗ trợ cần có (dự án, mentor, chi phí thi). Em gắn IDP vào phân công thật, vd người muốn làm BrSE được trả lời Q&A khách có BrSE chính kèm.", "t": "Nối IDP với chính sách sẵn có của công ty (đào tạo tiếng Nhật, hỗ trợ thi Cloud/AWS/PMP) cho thấy bạn đã đọc kỹ JD."}, {"n": 835, "c": 9, "g": "9.4", "q": "Mô hình coaching GROW là gì? Cho ví dụ áp dụng.", "a": "GROW = **Goal** (muốn đạt gì) → **Reality** (hiện tại ra sao) → **Options** (có những cách nào) → **Will** (sẽ làm gì, khi nào). Ví dụ junior hay trễ task: G – ước lượng sát thực tế hơn; R – thường lệch 50% vì không chia nhỏ việc; O – chia task ≤ 1 ngày, hỏi senior trước khi estimate, ghi thực tế để so; W – áp dụng 2 sprint, xem lại ở 1-on-1. Coach đặt câu hỏi để member tự tìm ra, không đưa đáp án.", "t": ""}, {"n": 836, "c": 9, "g": "9.4", "q": "Khi nào bạn mentoring (chỉ dẫn), khi nào coaching (đặt câu hỏi)?", "a": "Tùy năng lực và mức rủi ro: người chưa có kiến thức về vấn đề → mentoring, chỉ cách làm và lý do; người đã có nền tảng → coaching để họ tự tư duy. Khi rủi ro cao, gấp (sự cố production) em chỉ dẫn trực tiếp, xong việc mới dùng buổi nhìn lại để coaching. Coaching người hoàn toàn chưa biết chỉ làm họ bối rối và tốn thời gian.", "t": ""}, {"n": 837, "c": 9, "g": "9.4", "q": "Bạn đào tạo một dev thành BrSE kế cận thế nào?", "a": "Lộ trình tham khảo 6–12 tháng: ① tiếng Nhật đủ đọc tài liệu (mục tiêu N2) và thuật ngữ nghiệp vụ; ② shadow BrSE chính: dự họp, đọc Q&A, viết biên bản; ③ tự xử lý Q&A nhỏ, BrSE chính duyệt trước khi gửi; ④ phụ trách trọn một module với khách. Song song rèn thói quen 確認 (kakunin – xác nhận lại hiểu biết) và viết email nghiệp vụ. Đo bằng số Q&A hiểu sai và phản hồi của khách.", "t": ""}, {"n": 838, "c": 9, "g": "9.4", "q": "Bạn đào tạo một sub-leader trong team như thế nào?", "a": "Em chọn người được đồng nghiệp tin và chủ động báo cáo, rồi giao quyền theo bậc: chủ trì daily → estimate một module → review code của junior → dẫn một sub-team 3–4 người với quyền phân task thật. 3 tháng đầu em làm \"lưới an toàn\": 1-on-1 hằng tuần, cùng xem quyết định khó, sai thì gỡ cùng chứ không lấy lại quyền. Trao quyền chứ không chỉ trao việc.", "t": ""}, {"n": 839, "c": 9, "g": "9.4", "q": "Bạn phát triển kỹ năng tiếng Nhật cho team dự án thế nào?", "a": "Gắn tiếng Nhật với việc thật: ① glossary nghiệp vụ Nhật–Việt dùng chung; ② đọc 設計書 (sekkeisho – tài liệu thiết kế) bản gốc, Comtor hỗ trợ khi vướng; ③ luân phiên viết daily report tiếng Nhật, Comtor sửa; ④ đặt mục tiêu JLPT trong IDP và tận dụng chương trình đào tạo tiếng Nhật của công ty. Dev đọc được tài liệu gốc thì giảm rõ lỗi hiểu sai do dịch qua nhiều tầng.", "t": ""}, {"n": 840, "c": 9, "g": "9.4", "q": "Member có thói quen 指示待ち (shiji machi – chờ chỉ thị). Bạn giúp họ chủ động thế nào?", "a": "Thường do môi trường cũ: từng bị phạt khi tự quyết, hoặc không được biết \"vì sao\". Em: ① luôn giải thích mục đích của việc; ② giao ownership một phần trọn vẹn; ③ yêu cầu \"mang vấn đề thì mang kèm đề xuất\" — 2 phương án và chọn 1; ④ khen hành vi chủ động kể cả khi kết quả chưa hoàn hảo; ⑤ nói rõ được tự quyết đến đâu. Sau 1–2 tháng đo bằng số đề xuất tự đưa ra.", "t": "Đừng đổ hết cho tính cách — chỉ ra môi trường đã tạo ra 指示待ち và PM sửa môi trường."}, {"n": 841, "c": 9, "g": "9.4", "q": "Bạn đánh giá hiệu quả mentoring thế nào?", "a": "Đo bằng thay đổi hành vi và kết quả, không bằng số buổi: mentee đạt mục tiêu IDP đúng hạn không; mức cần hỗ trợ giảm dần (số lần hỏi lại cùng một loại vấn đề); output cải thiện (bug, comment review); mentee bắt đầu kèm người khác. Em xin thêm feedback ẩn danh về mentor, và đưa kết quả mentoring vào tiêu chí đánh giá của senior/leader để việc kèm người được ghi nhận.", "t": ""}, {"n": 842, "c": 9, "g": "9.4", "q": "Senior giỏi nhưng không muốn chia sẻ kiến thức vì sợ mất vị thế. Bạn làm gì?", "a": "Em hiểu nỗi sợ đó và đổi hệ thống khuyến khích: ① đưa chia sẻ kiến thức vào tiêu chí đánh giá và điều kiện lên Tech Lead/Expert; ② ghi nhận công khai khi họ làm tech talk, viết tài liệu; ③ cho thấy team mạnh lên thì họ được giao việc khó, giá trị hơn. Song song giảm 属人化 (zokujinka – phụ thuộc vào một người) bằng review chéo và pair bắt buộc cho phần lõi.", "t": ""}, {"n": 843, "c": 9, "g": "9.5", "q": "Với review performance 2 lần/năm, bạn chuẩn bị đánh giá member thế nào?", "a": "Không dồn cuối kỳ: em ghi nhật ký hiệu suất ngắn mỗi tháng cho từng người (sự việc, số liệu, feedback khách), thống nhất mục tiêu đầu kỳ, check-in giữa kỳ. Trước buổi review: member tự đánh giá, em thu số liệu khách quan và feedback 360°, so với mục tiêu rồi mới chấm. Buổi review là trao đổi hai chiều, kết thúc bằng mục tiêu kỳ sau; nguyên tắc \"không có bất ngờ\" — vấn đề phải được nói trong 1-on-1 trước đó.", "t": ""}, {"n": 844, "c": 9, "g": "9.5", "q": "KPI bạn đặt cho dev, QA và BrSE trong dự án Nhật là gì?", "a": "Tham khảo: **Dev** — tỉ lệ task đúng hạn, mật độ bug do QA/khách phát hiện trên khối lượng, chất lượng review; **QA** — tỉ lệ bug lọt sang UAT/khách, độ phủ test viewpoint, tỉ lệ bug hợp lệ; **BrSE** — số Q&A hiểu sai yêu cầu, thời gian phản hồi khách, chất lượng tài liệu. Mỗi vai 3–5 KPI, cộng phần định tính (thái độ, teamwork, kèm người) khoảng 30–40%.", "t": "Bẫy: KPI số dòng code hay số bug tìm được — dễ bị lách và phá teamwork."}, {"n": 845, "c": 9, "g": "9.5", "q": "Bạn dùng OKR hay KPI cho team, và hai thứ khác nhau thế nào?", "a": "KPI đo hiệu suất vận hành ổn định (đúng hạn, chất lượng), dùng để đánh giá; OKR đặt mục tiêu tham vọng để thay đổi, đạt 60–70% vẫn là tốt, không nên gắn thẳng vào lương thưởng. Em dùng KPI cho phần đánh giá chính và 1–2 OKR cho phát triển, vd \"O: team tự giao tiếp được với khách; KR: 3 dev viết daily report tiếng Nhật, 50% Q&A trả lời không cần dịch\".", "t": ""}, {"n": 846, "c": 9, "g": "9.5", "q": "Làm sao đánh giá công bằng khi mỗi người làm module có độ khó khác nhau?", "a": "Em chuẩn hóa theo độ khó: so thực tế với estimate team đã thống nhất (không so số task), cân nhắc độ phức tạp và rủi ro, nhìn xu hướng cả kỳ thay vì một sự việc. Ghi rõ bối cảnh: người nhận module legacy không tài liệu không thể đánh giá như người làm màn hình CRUD. Kết quả được calibrate với các PM/leader khác để cùng một thang.", "t": ""}, {"n": 847, "c": 9, "g": "9.5", "q": "Làm feedback 360° thế nào để có ích chứ không thành chấm điểm cảm tính?", "a": "Chọn 3–5 người làm việc trực tiếp (leader, đồng nghiệp, QA, BrSE, có thể cả onsite); hỏi bằng câu hỏi hành vi (\"người này báo rủi ro sớm thế nào? cho ví dụ\") thay vì thang điểm chung; đảm bảo ẩn danh; chỉ dùng xu hướng lặp lại từ nhiều người. Feedback của khách Nhật thì quy về sự việc cụ thể, tránh hiểu sai sắc thái của lời nói gián tiếp.", "t": ""}, {"n": 848, "c": 9, "g": "9.5", "q": "Những bias phổ biến khi đánh giá là gì, bạn tránh bằng cách nào?", "a": "Hay gặp: **recency** (chỉ nhớ 1–2 tháng gần nhất), **halo/horn** (một điểm tốt/xấu lan sang mọi tiêu chí), **leniency/central tendency** (ai cũng tốt hoặc trung bình cho an toàn), **similar-to-me** (ưu ái người giống mình). Cách tránh tương ứng: nhật ký hiệu suất hằng tháng, chấm từng tiêu chí riêng có bằng chứng, calibration giữa các PM, và tự hỏi \"nếu người khác làm việc này mình chấm thế nào\".", "t": "Kể tên bias kèm biện pháp tương ứng — cấu trúc gọn và thuyết phục."}, {"n": 849, "c": 9, "g": "9.5", "q": "Buổi calibration giữa các PM/leader là gì, vì sao quan trọng?", "a": "Là buổi những người đánh giá đặt kết quả cạnh nhau để thống nhất thang, tránh \"PM dễ\" và \"PM khó\" gây bất công giữa các team. Mỗi người trình bằng chứng cho mức cao nhất và thấp nhất, xem phân bố có lệch không. Em mang số liệu và ví dụ hành vi; sẵn sàng điều chỉnh khi bằng chứng của mình yếu, nhưng bảo vệ member khi có dữ liệu.", "t": ""}, {"n": 850, "c": 9, "g": "9.5", "q": "Mô hình SBI là gì? Cho ví dụ một feedback khó.", "a": "SBI = **Situation** – **Behavior** – **Impact**. Ví dụ: \"Trong buổi họp với khách thứ Ba (S), em trả lời ngay 'được' khi khách hỏi thêm chức năng mà chưa kiểm effort (B); khách hiểu là đã cam kết, team phải làm thêm 3 ngày ngoài kế hoạch (I).\" Sau đó em hỏi \"em thấy thế nào?\" và cùng chốt cách làm lần sau. Nói về hành vi quan sát được, không nhận xét tính cách (\"em ẩu\").", "t": ""}, {"n": 851, "c": 9, "g": "9.5", "q": "Bạn gắn kết quả đánh giá với thưởng dự án thế nào cho minh bạch?", "a": "Nguyên tắc công bố từ đầu dự án: thưởng phụ thuộc kết quả chung (đúng hạn, chất lượng, lợi nhuận) và mức đóng góp cá nhân theo tiêu chí biết trước. Em đề xuất phân bổ kèm bằng chứng (vai trò, độ khó, kết quả, phản hồi khách) trong khung chính sách công ty — không chia đều cho yên ổn, không thưởng theo cảm tình. Member hiểu vì sao mình nhận mức đó dù không biết mức của người khác.", "t": ""}, {"n": 852, "c": 9, "g": "9.5", "q": "Member tự đánh giá xuất sắc, bạn đánh giá chỉ đạt. Bạn dẫn buổi review thế nào?", "a": "① Nghe trước: hỏi căn cứ của họ, ghi nhận phần đúng. ② Đưa bằng chứng theo từng tiêu chí: mục tiêu đầu kỳ, số liệu, sự việc. ③ Phân biệt \"làm nhiều\" với \"đạt mục tiêu\". ④ Nếu họ có dữ kiện em bỏ sót, em điều chỉnh. ⑤ Chốt cụ thể cần đạt gì để được xuất sắc kỳ sau. Khoảng cách lớn thường do mục tiêu đầu kỳ không rõ — đó cũng là bài học của em.", "t": "Nhận phần trách nhiệm của PM (mục tiêu chưa rõ, feedback chưa đủ sớm) thể hiện sự trưởng thành."}, {"n": 853, "c": 9, "g": "9.5", "q": "Member xin tăng lương giữa kỳ, trước kỳ review vài tháng. Bạn trả lời thế nào?", "a": "Không hứa, không từ chối ngay: lắng nghe lý do (mặt bằng thị trường, có offer ngoài, đang gánh trách nhiệm lớn hơn), giải thích chu kỳ review 2 lần/năm của công ty. Nếu có cơ sở, em chuẩn bị bằng chứng để đề xuất ở kỳ gần nhất hoặc trao đổi với HR về ngoại lệ. Em hẹn mốc trả lời cụ thể và giữ đúng hẹn; nếu có offer ngoài thì chuyển sang câu chuyện retention.", "t": ""}, {"n": 854, "c": 9, "g": "9.6", "q": "Member làm kém — bạn chẩn đoán nguyên nhân thế nào trước khi xử lý?", "a": "Em phân 3 nhóm: ① **năng lực** (thiếu kỹ năng, giao sai việc, chưa hiểu domain); ② **động lực** (chán, mâu thuẫn, không thấy tương lai); ③ **hoàn cảnh** (sức khỏe, gia đình, quá tải). Thu fact từ số liệu, leader và 1-on-1 hỏi mở; đồng thời soát lỗi hệ thống: kỳ vọng có rõ không, onboarding có đủ không. Mỗi nguyên nhân một cách xử lý: đào tạo, đổi việc, hỗ trợ hay kỷ luật.", "t": "Câu đầu tiên PM nên tự hỏi là \"mình đã giao việc và kỳ vọng rõ chưa\" — interviewer đánh giá cao người nhìn hệ thống trước."}, {"n": 855, "c": 9, "g": "9.6", "q": "PIP (performance improvement plan) bạn xây như thế nào?", "a": "PIP gồm: vấn đề cụ thể có bằng chứng; 2–4 mục tiêu đo được (vd task đúng hạn ≥ 85%, bug lọt ≤ mức trung bình team); thời hạn 1–3 tháng (tham khảo); hỗ trợ cụ thể (mentor, đào tạo, giảm tải); check-in hằng tuần; hệ quả nếu không đạt. Làm cùng HR theo quy chế công ty, member ký xác nhận đã hiểu. Mục tiêu thật của PIP là giúp người đó đạt, không phải thủ tục để cho nghỉ.", "t": ""}, {"n": 856, "c": 9, "g": "9.6", "q": "Khi nào bạn chọn chuyển vai trò cho member thay vì tiếp tục PIP?", "a": "Khi thái độ tốt nhưng không hợp vai hiện tại: dev tư duy logic, cẩn thận nhưng code chậm có thể hợp QA automation; người giao tiếp tốt, tiếng Nhật khá nhưng code yếu có thể theo hướng Comtor/BrSE. Em trao đổi thẳng, để họ chọn, có giai đoạn thử 1–2 tháng với tiêu chí đánh giá mới. Chuyển vai không phải \"đẩy đi\" mà là đặt đúng người đúng chỗ.", "t": ""}, {"n": 857, "c": 9, "g": "9.6", "q": "Khi nào phải cho member rời dự án hoặc rời công ty, và PM làm gì?", "a": "Khi đã chẩn đoán và hỗ trợ đủ (PIP có hỗ trợ thật) mà không cải thiện, hoặc vi phạm nghiêm trọng (bảo mật, gian lận). Rút khỏi dự án thì PM phối hợp phòng ban quyết; cho nghỉ việc thì PM không tự quyết, mà cung cấp hồ sơ bằng chứng cho HR/cấp trên xử lý theo quy chế công ty và Bộ luật Lao động. Em giữ thái độ tôn trọng, bàn giao đầy đủ, và rút kinh nghiệm khâu tuyển/onboard.", "t": "Bẫy: nói \"em cho nghỉ ngay\" — lộ ra chưa hiểu quy trình HR và pháp lý."}, {"n": 858, "c": 9, "g": "9.6", "q": "Xử lý \"toxic high performer\" — làm rất giỏi nhưng thái độ gây hại cho team — thế nào?", "a": "Em coi hành vi gây hại là vấn đề hiệu suất ngang chất lượng code: ① feedback riêng bằng SBI với ví dụ cụ thể (chê junior trước đám đông, từ chối review); ② đặt kỳ vọng hành vi rõ ràng, đưa vào tiêu chí đánh giá; ③ giảm phụ thuộc bằng chia sẻ kiến thức; ④ không thay đổi sau thời hạn thì chấp nhận rời họ dù ảnh hưởng ngắn hạn. Cái giá của một người toxic là cả team chậm lại và người giỏi khác bỏ đi.", "t": "Câu senior: cho thấy bạn dám đánh đổi năng suất ngắn hạn để giữ văn hóa team."}, {"n": 859, "c": 9, "g": "9.6", "q": "Khách Nhật rất quý một member giỏi, nhưng người này đang gây căng thẳng trong team. Bạn cân bằng thế nào?", "a": "Tách bạch hai việc: giá trị với khách là thật, hành vi trong team là vấn đề phải sửa. Em giữ người đó ở vai giao tiếp khách (điểm mạnh) nhưng đặt kỳ vọng hành vi rõ, đồng thời đào tạo người thứ hai đủ năng lực để khách không phụ thuộc một người. Chuyện nội bộ không đưa ra với khách; nếu cuối cùng phải thay người, em lên kế hoạch bàn giao và thông báo khách sớm.", "t": ""}, {"n": 860, "c": 9, "g": "9.6", "q": "Member đẩy source code của khách lên repo cá nhân public. Bạn xử lý thế nào?", "a": "① Khoanh vùng ngay: gỡ repo, thu hồi quyền, đổi secret, kiểm tra phạm vi lộ. ② Báo cấp trên và bộ phận bảo mật theo quy trình sự cố. ③ Báo khách theo hợp đồng và 報連相, nêu phạm vi ảnh hưởng và biện pháp. ④ Xử lý member theo quy chế, phân biệt cố ý hay thiếu hiểu biết. ⑤ 再発防止 (saihatsu boushi – phòng ngừa tái phát): đào tạo lại, chặn bằng kỹ thuật (secret scan, chặn push ra ngoài), 横展開 sang dự án khác.", "t": ""}, {"n": 861, "c": 9, "g": "9.6", "q": "Member hay đi muộn, nghỉ đột xuất, ảnh hưởng tiến độ. Bạn làm gì?", "a": "Nói chuyện riêng sớm, hỏi nguyên nhân trước (có thể là sức khỏe, gia đình) và nhắc lại quy định đã thống nhất. Có lý do chính đáng thì thử điều chỉnh giờ làm trong phạm vi chính sách; không thì ghi nhận bằng văn bản, đặt cam kết cụ thể và mốc kiểm tra 2–4 tuần. Lặp lại thì xử lý theo nội quy cùng HR. Không phê bình trước team.", "t": ""}, {"n": 862, "c": 9, "g": "9.6", "q": "Có nên công khai điểm đánh giá hay xếp hạng từng member trước team không?", "a": "Không công khai điểm đánh giá, thưởng cá nhân — đó là thông tin riêng và dễ gây so bì. Có thể công khai chỉ số chung của team (tiến độ, chất lượng) và ghi nhận đóng góp tích cực cụ thể. Bảng xếp hạng cá nhân theo bug hay số task khiến member chọn việc dễ, giấu lỗi và ngại giúp nhau.", "t": ""}, {"n": 863, "c": 9, "g": "9.6", "q": "Junior làm hỏng dữ liệu môi trường test của khách do thao tác sai. Bạn xử lý với member thế nào?", "a": "Khắc phục trước, tìm trách nhiệm sau: em cùng team khôi phục và báo khách. Với junior: buổi nhìn lại blameless hỏi \"vì sao hệ thống cho phép một junior làm được việc đó\" (quyền quá rộng, không review, không backup) thay vì quy kết cá nhân; junior tham gia viết 再発防止 để học. Chỉ khi cố tình làm trái quy trình đã được đào tạo mới xét trách nhiệm cá nhân.", "t": "Đây là câu kiểm tra psychological safety — phạt nặng junior thì lần sau lỗi sẽ bị giấu."}, {"n": 864, "c": 9, "g": "9.7", "q": "Mô hình Thomas–Kilmann gồm những phong cách xử lý xung đột nào, khi nào dùng?", "a": "Năm phong cách trên hai trục quyết đoán–hợp tác: **Competing** (áp đặt — sự cố khẩn, vi phạm bảo mật); **Collaborating** (cùng tìm win-win — vấn đề quan trọng, có thời gian); **Compromising** (mỗi bên nhượng một phần — gấp, hai bên ngang quyền); **Avoiding** (tạm né — chuyện nhỏ, cần để nguội); **Accommodating** (nhường — khi mình sai hoặc quan hệ quan trọng hơn). Không có phong cách đúng tuyệt đối, chỉ có đúng tình huống.", "t": "Cho một ví dụ dùng Competing đúng chỗ — chứng tỏ bạn không \"hòa cả làng\"."}, {"n": 865, "c": 9, "g": "9.7", "q": "Dev và QA tranh cãi \"đây là bug hay là spec\". Bạn xử lý thế nào?", "a": "① Quay về nguồn: tài liệu yêu cầu, 設計書, Q&A đã chốt với khách. ② Tài liệu không rõ → đó là lỗ hổng spec; BrSE hỏi khách, không để dev và QA tự định nghĩa. ③ Trong lúc chờ, đặt trạng thái \"pending spec\" thay vì cãi tiếp. ④ Chốt quy tắc bug triage có tiêu chí và người quyết cuối (BrSE/PM). Tranh cãi lặp lại là dấu hiệu khâu review yêu cầu đang yếu.", "t": ""}, {"n": 866, "c": 9, "g": "9.7", "q": "QA bị dev coi là \"người bắt lỗi\", quan hệ căng thẳng. Bạn cải thiện thế nào?", "a": "Đổi khung từ đối đầu sang cùng mục tiêu \"không lọt bug sang khách\": ① QA vào sớm từ review yêu cầu/thiết kế, chia sẻ test viewpoint trước khi dev code; ② bug report viết theo sự việc, không phán xét; ③ KPI chung cho dev và QA về bug lọt sang khách; ④ ghi nhận QA khi bắt được lỗi quan trọng trước UAT. Mỗi bug QA bắt được là một lần khách không phải nhìn thấy.", "t": ""}, {"n": 867, "c": 9, "g": "9.7", "q": "Senior và junior bất đồng cách làm, junior thấy bị áp đặt. Bạn làm gì?", "a": "Tách hai việc: quyết định kỹ thuật và cách giao tiếp. Về kỹ thuật, hai bên trình phương án theo tiêu chí chung (đúng yêu cầu, rủi ro, effort, khả năng bảo trì), Tech Lead chốt và giải thích lý do. Về giao tiếp, em feedback riêng với senior: giải thích \"vì sao\" thay vì ra lệnh, vì kèm junior là trách nhiệm của senior. Junior được ghi nhận nếu ý tưởng hay, dù cuối cùng không được chọn.", "t": ""}, {"n": 868, "c": 9, "g": "9.7", "q": "Team Hà Nội và Đà Nẵng đổ lỗi cho nhau khi tích hợp lỗi. Bạn xử lý thế nào?", "a": "① Dừng đổ lỗi bằng dữ liệu: log, commit, interface spec cho thấy lỗi nằm ở đâu. ② Nguyên nhân gốc thường là ranh giới: interface không rõ, thiếu integration test chung, không ai sở hữu việc tích hợp. ③ Lập owner tích hợp, contract API thống nhất, CI tích hợp chạy hằng ngày. ④ Về con người: retro chung hai site, ghép cặp xuyên site. Em không đứng về phía site mình đang ngồi.", "t": "Câu này kiểm tra bạn có thiên vị nơi mình ngồi không — trả lời bằng dữ liệu và cơ chế."}, {"n": 869, "c": 9, "g": "9.7", "q": "Khi nào PM nên làm trọng tài, khi nào để team tự giải quyết xung đột?", "a": "Để team tự xử khi: xung đột về cách làm, hai bên ngang hàng, chưa ảnh hưởng tiến độ, team đã ở Norming/Performing. PM vào cuộc khi: kéo dài quá vài ngày gây tắc việc, chạm cam kết với khách, có yếu tố xúc phạm cá nhân, hoặc liên quan quyền hạn/nguồn lực ngoài tầm team. Ngay cả khi làm trọng tài, em ưu tiên giúp hai bên tự thỏa thuận rồi mới quyết thay.", "t": ""}, {"n": 870, "c": 9, "g": "9.7", "q": "Hai member xung đột cá nhân, không còn nói chuyện với nhau. Bạn làm gì?", "a": "① Gặp riêng từng người, nghe góc nhìn và tìm fact, không phán xét. ② Gặp chung khi cả hai sẵn sàng, đặt luật: nói về hành vi và tác động, không công kích. ③ Tìm điểm chung (cùng muốn dự án tốt), chốt cam kết cụ thể về cách phối hợp. ④ Theo dõi 2–4 tuần. Không cải thiện và ảnh hưởng team thì cân nhắc tách sang module/dự án khác — giải pháp cuối, không phải đầu tiên.", "t": ""}, {"n": 871, "c": 9, "g": "9.7", "q": "Bạn xử lý thế nào khi chính mình bất đồng với Tech Lead về một quyết định?", "a": "Tranh luận riêng, không trước team, dựa trên dữ kiện và ma trận quyền đã thống nhất. Nếu là quyết định kỹ thuật thuộc quyền Tech Lead và rủi ro chấp nhận được, em tôn trọng và ủng hộ công khai (\"disagree and commit\"). Nếu chạm cam kết QCD với khách, em đưa trade-off rõ ràng lên cấp trên hoặc một chuyên gia trung lập. Trước team phải là một tiếng nói thống nhất.", "t": "\"Disagree and commit\" là tinh thần interviewer muốn nghe ở vị trí senior."}, {"n": 872, "c": 9, "g": "9.7", "q": "Xung đột nội bộ có mặt tích cực không? Làm sao khuyến khích \"xung đột tốt\"?", "a": "Có — tranh luận về ý tưởng giúp lộ rủi ro sớm, tránh groupthink, nhất là khi cả văn hóa Việt lẫn Nhật đều ngại phản đối trực diện. Em khuyến khích: ở review thiết kế chỉ định một người đóng vai phản biện, hỏi \"điều gì có thể làm phương án này thất bại?\", khen người dám nêu điểm yếu. Ranh giới rõ: tranh luận về vấn đề, không về con người.", "t": ""}, {"n": 873, "c": 9, "g": "9.8", "q": "Bạn quản lý OT trong dự án thế nào?", "a": "OT là công cụ ngắn hạn có kế hoạch, không phải cách bù estimate sai. Em: ① lập kế hoạch OT trước (ai, bao nhiêu giờ, mục đích, đến khi nào); ② theo dõi giờ OT từng người hằng tuần, ngưỡng cảnh báo nội bộ tham khảo > 20 giờ/tháng; ③ tuân thủ giới hạn của Bộ luật Lao động và quy chế công ty, có sự đồng ý của người lao động; ④ OT kéo dài > 2 tuần là tín hiệu phải xử lý gốc: phạm vi, estimate, nguồn lực.", "t": "Nói \"OT là triệu chứng, không phải giải pháp\" kèm cách theo dõi bằng số."}, {"n": 874, "c": 9, "g": "9.8", "q": "Dấu hiệu burnout của member là gì, bạn phát hiện sớm thế nào?", "a": "Dấu hiệu: chất lượng giảm đột ngột (bug tăng ở người vốn cẩn thận), trễ việc, im lặng trong họp, dễ cáu, nghỉ ốm nhiều, làm khuya thường xuyên dù không ai yêu cầu, hoài nghi về dự án. Em phát hiện qua dữ liệu (OT, commit lúc nửa đêm, nghỉ đột xuất) kết hợp 1-on-1. Thấy dấu hiệu thì hỏi thẳng và giảm tải ngay, không đợi họ nộp đơn.", "t": ""}, {"n": 875, "c": 9, "g": "9.8", "q": "Một member có dấu hiệu burnout nặng ngay giữa giai đoạn nước rút. Bạn làm gì?", "a": "① Sức khỏe trước: nói chuyện riêng, đề xuất nghỉ vài ngày hoặc giảm tải ngay. ② Phân bổ lại: chuyển phần nằm trên critical path cho người khác, giao họ việc ít áp lực thời gian. ③ Cập nhật kế hoạch, rủi ro; nếu chạm mốc thì báo cấp trên và khách sớm theo 報連相. ④ Sau nước rút: tìm nguyên nhân gốc (quá tải, thiếu hỗ trợ) để 再発防止. Một người gục giữa chừng tốn hơn nhiều so với cho nghỉ 2 ngày.", "t": ""}, {"n": 876, "c": 9, "g": "9.8", "q": "Khách Nhật dồn việc vào 年度末 (nendomatsu – cuối năm tài chính). Bạn chuẩn bị team thế nào?", "a": "Nhiều doanh nghiệp Nhật kết thúc năm tài chính cuối tháng 3, nên tháng 1–3 thường dồn release và nghiệm thu. Em chuẩn bị từ quý trước: ① hỏi khách kế hoạch 年度末 sớm để lập capacity plan; ② hạn chế key member nghỉ dài giai đoạn này nhưng bố trí nghỉ bù trước/sau; ③ cross-training, nguồn lực dự phòng; ④ chốt phạm vi ưu tiên với khách. Tết Nguyên đán thường rơi đúng giai đoạn này, phải tính từ đầu.", "t": "Chi tiết Tết Nguyên đán trùng 年度末 cho thấy bạn đã thực sự vận hành dự án Nhật."}, {"n": 877, "c": 9, "g": "9.8", "q": "Member có quyền từ chối OT không? Nhiều người từ chối OT lúc gấp thì sao?", "a": "Có — theo Bộ luật Lao động, làm thêm giờ cần người lao động đồng ý, trừ một số trường hợp đặc biệt luật quy định. Em không ép, không đánh giá thấp người từ chối OT. Nhiều người cùng từ chối là tín hiệu: em tìm lý do (mệt, kéo dài, không được ghi nhận), xoay vòng OT, ưu tiên lại phạm vi, xin thêm nguồn lực hoặc đàm phán mốc. Kế hoạch phải dựa vào OT bắt buộc là kế hoạch sai.", "t": "Bẫy: \"em sẽ thuyết phục mọi người OT vì dự án\" — nghe như tư duy quản lý cũ."}, {"n": 878, "c": 9, "g": "9.8", "q": "Khách liên tục đẩy yêu cầu gấp, bạn bảo vệ team mà vẫn giữ khách hài lòng thế nào?", "a": "Em làm \"lớp đệm\" có nguyên tắc: mọi yêu cầu gấp đi qua PM/BrSE, được đánh giá effort và tác động, rồi đưa khách lựa chọn (làm ngay thì lùi việc nào, hoặc phát sinh chi phí). Member không nhận việc trực tiếp ngoài kênh. Em đếm số yêu cầu \"gấp\" mỗi tháng; nếu thành thường xuyên, đưa số liệu vào họp định kỳ để thống nhất lại quy trình. Bảo vệ team không phải nói \"không\", mà là làm rõ trade-off.", "t": ""}, {"n": 879, "c": 9, "g": "9.8", "q": "Bạn sắp xếp nghỉ phép cho team thế nào để không ảnh hưởng dự án?", "a": "Đầu năm/đầu quý em thu kế hoạch nghỉ dài, đưa vào lịch dự án cùng lịch nghỉ lễ lớn của Nhật (Golden Week, Obon, nghỉ cuối năm) và Việt Nam. Quy tắc: key member không nghỉ trùng nhau, người nghỉ có backup đã được bàn giao, nghỉ ≥ 3 ngày báo trước 1–2 tuần (tham khảo). Em khuyến khích nghỉ đủ phép, vì người cả năm không nghỉ là rủi ro burnout.", "t": ""}, {"n": 880, "c": 9, "g": "9.8", "q": "PM có nên ở lại OT cùng team không?", "a": "Em có mặt ở thời điểm quan trọng (release, sự cố, đêm deploy) để gỡ vướng và quyết nhanh, nhưng không ngồi lại chỉ để \"làm gương\" khi không có việc của PM — điều đó tạo áp lực ngầm buộc người khác ở lại. Em cũng không nhắn việc lúc khuya trừ khi khẩn, vì member sẽ hiểu là phải trả lời. Giữ sức cho PM cũng là giữ chất lượng quyết định.", "t": ""}, {"n": 881, "c": 9, "g": "9.8", "q": "Sau giai đoạn OT dồn dập, bạn phục hồi team thế nào?", "a": "① Nghỉ bù có kế hoạch, luân phiên để dự án vẫn chạy. ② Một sprint \"nhẹ\" cho nợ kỹ thuật, tài liệu, cải tiến — ít áp lực nhưng có giá trị. ③ Retro riêng về nguyên nhân OT (estimate, phạm vi, rủi ro bỏ sót) để 再発防止. ④ Ghi nhận cụ thể đóng góp, đưa vào đánh giá và đề xuất thưởng dự án. Bỏ qua phục hồi thì giai đoạn khó tiếp theo team sẽ vỡ.", "t": ""}, {"n": 882, "c": 9, "g": "9.9", "q": "Vì sao kỹ sư nhảy việc, và PM tác động được phần nào?", "a": "Thường gặp: lương dưới thị trường, không thấy lộ trình, dự án nhàm/công nghệ cũ, quan hệ với quản lý trực tiếp, quá tải kéo dài. PM không quyết hết về lương nhưng tác động trực tiếp phần còn lại: phân việc có thử thách, IDP rõ, chặn quá tải, đối xử tôn trọng, và đề xuất tăng lương/thăng chức có bằng chứng ở mỗi kỳ review. Người ta thường rời người quản lý chứ không chỉ rời công ty.", "t": ""}, {"n": 883, "c": 9, "g": "9.9", "q": "Stay interview là gì và bạn làm thế nào?", "a": "Là buổi trò chuyện chủ động với người đang làm tốt để hiểu vì sao họ ở lại và điều gì có thể khiến họ đi — trước khi họ có ý định nghỉ (khác exit interview vốn chỉ để rút kinh nghiệm). Câu hỏi: \"Điều gì khiến em muốn tiếp tục ở đây?\", \"Nếu điều gì thay đổi, em sẽ cân nhắc rời đi?\", \"Em muốn học gì mà chưa có cơ hội?\". Em làm 1–2 lần/năm với key member và hành động ngay trên ít nhất một điều.", "t": ""}, {"n": 884, "c": 9, "g": "9.9", "q": "Exit interview làm thế nào để có thông tin thật?", "a": "Nên để HR hoặc người không phải quản lý trực tiếp thực hiện, vì người sắp nghỉ ít khi nói thật với PM của mình. Hỏi theo sự việc: \"Khi nào em bắt đầu nghĩ đến việc rời đi?\", \"Nếu điều gì khác đi thì em đã ở lại?\". Em tổng hợp xu hướng qua nhiều người (vd 3 người nghỉ cùng vì lộ trình) để đổi chính sách, thay vì xem từng ca riêng lẻ.", "t": ""}, {"n": 885, "c": 9, "g": "9.9", "q": "Key member báo nghỉ vì có offer cao hơn 30%. Bạn có đưa counter offer không?", "a": "Xác định lý do thật là tiền hay điều khác. Nếu chỉ là tiền và lương hiện tại thật sự dưới thị trường, em đề xuất điều chỉnh với cấp trên/HR trong khung chính sách (lẽ ra phải phát hiện sớm hơn). Nếu lý do là lộ trình, dự án hay quản lý, counter offer chỉ trì hoãn vài tháng và tạo tiền lệ bất công với người khác. Dù kết quả thế nào, em kích hoạt kế hoạch bàn giao ngay và không gây áp lực đạo đức.", "t": "Nêu được rủi ro của counter offer (tiền lệ, bất công nội bộ, chỉ trì hoãn) là tư duy hệ thống của senior."}, {"n": 886, "c": 9, "g": "9.9", "q": "Bus factor là gì, bạn đo và giảm bus factor thế nào?", "a": "Bus factor là số người tối thiểu phải rời đi để dự án đình trệ; bằng 1 nghĩa là 属人化 nặng. Em lập skill matrix (module × người, mức 0–3), mục tiêu mỗi module quan trọng có ít nhất 2 người ở mức tự làm được. Cách giảm: review chéo bắt buộc, luân phiên task, pair cho phần lõi, tài liệu hóa, BrSE và Tech Lead đều có người kế cận.", "t": "Đưa ra skill matrix cụ thể thuyết phục hơn câu chung chung \"tài liệu hóa đầy đủ\"."}, {"n": 887, "c": 9, "g": "9.9", "q": "Bạn tài liệu hóa kiến thức dự án thế nào mà không thành gánh nặng?", "a": "Tài liệu hóa đúng chỗ: ① tài liệu \"sống\" gần code (README, ghi chép quyết định kiến trúc ngắn, runbook vận hành); ② glossary nghiệp vụ Nhật–Việt; ③ FAQ đúc kết từ Q&A với khách; ④ video ngắn cho thao tác phức tạp. Đưa \"cập nhật tài liệu\" vào Definition of Done của task thay vì dồn cuối dự án. Chỉ số kiểm: người mới tự setup và nắm tổng quan trong 2–3 ngày (tham khảo).", "t": ""}, {"n": 888, "c": 9, "g": "9.9", "q": "Key member nghỉ, còn 30 ngày. Bạn tổ chức 引き継ぎ (hikitsugi – bàn giao) thế nào?", "a": "① Ngày 1–2: chọn người nhận (ưu tiên 2 người), lập danh mục: module, tài liệu, tài khoản, việc dở dang, đầu mối với khách. ② Tuần 1–2: shadowing — người nhận ngồi cùng; tuần 3: reverse shadowing — người nhận làm, người đi review. ③ Viết 引き継ぎ書 (hikitsugi-sho – tài liệu bàn giao) có checklist ký xác nhận. ④ Báo khách thay đổi nhân sự kèm kế hoạch bàn giao. ⑤ Thu hồi quyền truy cập đúng ngày cuối.", "t": "Reverse shadowing hay bị bỏ qua — người nhận phải \"làm thật\" khi người cũ vẫn còn đó."}, {"n": 889, "c": 9, "g": "9.9", "q": "Bạn phản ứng thế nào khi biết một member đang đi phỏng vấn nơi khác?", "a": "Không coi là phản bội, cũng không giả vờ không biết. Em tạo 1-on-1 tự nhiên hỏi về mức hài lòng và mong muốn phát triển — không truy hỏi \"em có đi phỏng vấn không\". Điều gì công ty đáp ứng được thì hành động; song song âm thầm tăng chia sẻ kiến thức ở module của người đó. Đối xử khác đi (ngừng giao việc hay, loại khỏi quyết định) chỉ đẩy họ đi nhanh hơn.", "t": ""}, {"n": 890, "c": 9, "g": "9.9", "q": "Ngoài lương, bạn có công cụ nào để giữ người giỏi?", "a": "① Việc có thử thách, công nghệ mới, cơ hội onsite hoặc làm việc trực tiếp với khách; ② lộ trình rõ (Tech Lead, BrSE, PM) gắn với kỳ review; ③ hỗ trợ học và thi chứng chỉ (tiếng Nhật, Cloud/AWS, PMP theo chính sách công ty); ④ ghi nhận đúng người; ⑤ quyền tự chủ, được tham gia quyết định; ⑥ môi trường không toxic. Em hỏi từng người điều gì quan trọng với họ, vì không có một công thức chung.", "t": ""}, {"n": 891, "c": 9, "g": "9.10", "q": "Phỏng vấn dev cho dự án Nhật, ngoài kỹ thuật bạn đánh giá gì?", "a": "Kỹ thuật để Tech Lead đánh giá; em tập trung: ① độ cẩn thận — đưa một đoạn spec ngắn, hỏi họ sẽ xác nhận gì trước khi code; ② thói quen 報連相 — \"kể lần em biết mình sẽ trễ, em đã làm gì\"; ③ thái độ với quy trình, review; ④ khả năng học tiếng Nhật, đọc tài liệu; ⑤ độ hợp với team hiện tại. Dự án Nhật cần người cẩn thận, minh bạch hơn người nhanh nhưng ẩu.", "t": ""}, {"n": 892, "c": 9, "g": "9.10", "q": "Bạn phỏng vấn một BrSE như thế nào?", "a": "Em kiểm 3 lớp: ① tiếng Nhật thực tế — đọc một đoạn yêu cầu tiếng Nhật, tóm tắt và chỉ ra điểm mơ hồ cần hỏi khách, viết thử email xác nhận; ② tư duy nghiệp vụ–kỹ thuật — chia yêu cầu thành task, estimate sơ bộ; ③ tình huống — khách đổi yêu cầu sát deadline thì làm gì. Chứng chỉ JLPT chỉ là điều kiện cần; khả năng phát hiện điểm mơ hồ mới là năng lực lõi của BrSE.", "t": "Bài test \"tìm điểm mơ hồ trong spec\" phân loại BrSE rất nhanh."}, {"n": 893, "c": 9, "g": "9.10", "q": "Kế hoạch onboarding 2 tuần cho thành viên mới vào dự án gồm những gì?", "a": "Tuần 1: môi trường, tài khoản, quy định bảo mật của khách; tổng quan nghiệp vụ và kiến trúc; coding convention, quy trình review, checklist; gán buddy; làm 1–2 task nhỏ được review kỹ. Tuần 2: nhận task thật cỡ 1–2 ngày, dự họp với BrSE, đọc tài liệu thiết kế tiếng Nhật có glossary. Cuối tuần 2: 30 phút với PM xem tiến bộ và vướng mắc. Đích đo được: tự hoàn thành task nhỏ mà không cần kèm sát.", "t": ""}, {"n": 894, "c": 9, "g": "9.10", "q": "Đào tạo fresher cho dự án Nhật, bạn tập trung vào những gì?", "a": "Ngoài kỹ thuật, fresher cần thói quen làm việc dự án Nhật: ① 報連相 — báo sớm, báo cả tin xấu; ② đọc hiểu 設計書, hỏi khi chưa rõ thay vì tự đoán; ③ tự review theo checklist trước khi gửi; ④ ghi chép, tuân thủ quy trình; ⑤ hiểu vì sao khách khắt khe về chất lượng. Em dùng buddy + task tăng dần độ khó + review kỹ trong 1–3 tháng đầu, đánh giá theo mốc rõ ràng.", "t": ""}, {"n": 895, "c": 9, "g": "9.10", "q": "Bạn ủy quyền (delegation) thế nào, làm sao biết nên giao đến mức nào?", "a": "Mức ủy quyền theo năng lực và rủi ro: \"làm theo hướng dẫn\" → \"đề xuất, PM duyệt\" → \"tự quyết, báo sau\" → \"tự quyết hoàn toàn\". Khi giao: nói rõ kết quả, giới hạn (ngân sách, mốc), quyền hạn và điểm kiểm tra. Việc em không ủy quyền: cam kết cuối với khách, đánh giá hiệu suất, quyết định nhân sự nhạy cảm. Giao việc mà không giao quyền là giao gánh nặng.", "t": ""}, {"n": 896, "c": 9, "g": "9.10", "q": "Situational leadership là gì? Ví dụ áp dụng với các member khác nhau trong cùng team.", "a": "Mô hình Hersey–Blanchard: phong cách thay đổi theo mức phát triển của từng người với từng việc — **Directing**, **Coaching**, **Supporting**, **Delegating**. Ví dụ: fresher → chỉ dẫn từng bước; dev 2 năm lần đầu làm BrSE → coaching (vừa chỉ vừa động viên); senior giỏi vừa gặp thất bại → supporting, lắng nghe, củng cố tự tin; Tech Lead vững → delegating. Cùng một người có thể ở mức khác nhau với việc khác nhau.", "t": ""}, {"n": 897, "c": 9, "g": "9.10", "q": "Bạn quản lý member lớn tuổi hơn hoặc giỏi kỹ thuật hơn mình thế nào?", "a": "Em xác định là khác vai chứ không phải hơn kém: họ là chuyên gia kỹ thuật, em chịu trách nhiệm điều phối và cam kết với khách. Tôn trọng bằng hành động: hỏi ý kiến họ trước quyết định kỹ thuật, giao việc khó với quyền tự chủ cao, ghi nhận công khai. Nhưng thỏa thuận chung (báo cáo, quy trình, deadline) áp dụng như mọi người. Xưng hô và lễ độ phù hợp với văn hóa trọng tuổi tác.", "t": "Bẫy: \"em sẽ chứng tỏ năng lực để họ phục\" — nghe như cạnh tranh; hãy nói về phân vai và tôn trọng."}, {"n": 898, "c": 9, "g": "9.10", "q": "Servant leadership có phù hợp với môi trường dự án Nhật vốn trọng thứ bậc không?", "a": "Servant leadership là lãnh đạo bằng phục vụ: gỡ cản trở, phát triển người, đặt thành công của team lên trước. Em kết hợp: với khách và cấp trên, PM là đầu mối chịu trách nhiệm rõ ràng, đúng thứ bậc; với team nội bộ, em là servant leader — chặn yêu cầu ngoài luồng, lo nguồn lực, để team tập trung. Phục vụ không có nghĩa là thiếu quyết đoán: khi sự cố hay deadline gấp, em vẫn chỉ đạo trực tiếp.", "t": ""}, {"n": 899, "c": 9, "g": "9.10", "q": "Có nên đề bạt dev giỏi kỹ thuật nhất làm leader không?", "a": "Không mặc định. Leader cần năng lực khác: phân việc, kèm người, chịu trách nhiệm kết quả của người khác. Em xét bằng hành vi đã thấy (từng kèm junior chưa, xử lý bất đồng ra sao), cho thử vai nhỏ 2–3 tháng có hỗ trợ, và đề xuất lộ trình chuyên gia song song để người giỏi kỹ thuật không phải \"lên quản lý mới được tăng lương\". Đề bạt sai có thể mất cả một dev giỏi lẫn một leader tốt.", "t": "Nhắc \"dual career ladder\" (lộ trình kép chuyên gia/quản lý) là câu trả lời mang tầm senior."}, {"n": 900, "c": 9, "g": "9.10", "q": "Làm sao bạn biết mình đang lãnh đạo tốt, và xin feedback từ cấp dưới thế nào?", "a": "Em nhìn 3 nhóm chỉ báo: kết quả (QCD dự án), sức khỏe team (pulse survey, OT, tỉ lệ nghỉ việc) và mức tự chủ (bao nhiêu việc team tự giải quyết không cần em). Feedback từ dưới lên: khảo sát ẩn danh mỗi kỳ review, câu hỏi cố định cuối 1-on-1, retro có mục dành cho PM. Quan trọng là hành động và nói lại đã thay đổi gì; thước đo cuối cùng: team vẫn chạy tốt khi em vắng một tuần.", "t": ""}, {"n": 901, "c": 10, "g": "10.1", "q": "Nếu được tham gia build-up chi nhánh Đà Nẵng, anh/chị chia lộ trình từ 0 lên 300 người như thế nào?", "a": "Tôi chia theo mốc có điều kiện chuyển, không theo ngày cứng: ① **0→30 (khởi động)** — 1–2 dự án mồi, đội lõi gồm PM, tech lead, BrSE (ブリッジSE, burijji SE – kỹ sư cầu nối), QA lead, hạ tầng bảo mật đạt chuẩn; ② **30→100 (ổn định)** — 2–3 account, process đồng bộ HQ, vị trí chủ chốt có người dự phòng; ③ **100→300 (mở rộng)** — tự làm pre-sales/estimate, có mũi nhọn domain, đào tạo nội bộ. Chỉ chuyển mốc khi đạt chỉ số chất lượng, utilization, attrition và hài lòng khách.", "t": "Interviewer muốn nghe \"điều kiện chuyển giai đoạn\" (gate), không chỉ con số headcount."}, {"n": 902, "c": 10, "g": "10.1", "q": "Điều kiện cụ thể để chi nhánh chuyển từ khoảng 30 người lên 100 người là gì?", "a": "Tôi đặt gate đo được (ngưỡng tham khảo): ① ≥ 2 dự án mồi được nghiệm thu đúng hạn, defect sau release trong ngưỡng cam kết; ② billable rate ≥ 75–80% trong 3 tháng liên tiếp; ③ mỗi dự án có người dự phòng cho vai PM/tech lead/BrSE; ④ attrition không cao hơn mức chung của công ty; ⑤ pipeline đã có đơn hàng cho 1–2 quý tới. Thiếu ② và ⑤ mà vẫn tuyển ồ ạt sẽ tạo bench lớn và đốt margin.", "t": ""}, {"n": 903, "c": 10, "g": "10.1", "q": "Trước khi nhận dự án khách Nhật ở site mới, hạ tầng và ISMS tối thiểu cần chuẩn bị những gì?", "a": "Khách Nhật thường gửi **セキュリティチェックシート (sekyuriti chekku shiito – bảng kiểm bảo mật)** trước khi ký, nên tôi chuẩn bị theo đúng các mục đó: kiểm soát ra vào bằng thẻ, camera, khu dự án tách biệt; máy không quyền admin, khóa USB, mã hóa ổ cứng; VPN/VDI và log truy cập; NDA từng người; quy trình báo cáo sự cố bảo mật. Nếu công ty có chứng nhận ISO/IEC 27001 thì cần mở rộng phạm vi chứng nhận sang site Đà Nẵng và chạy internal audit trước khi khách đến kiểm tra.", "t": "Đừng nói \"công ty có ISO là đủ\" — khách tài chính thường muốn bằng chứng riêng cho chính site sẽ làm dự án."}, {"n": 904, "c": 10, "g": "10.1", "q": "\"Phòng dev an toàn\" cho dự án tài chính Nhật khác phòng làm việc thường ở điểm nào?", "a": "Khác ở 3 lớp: ① **vật lý** — khu riêng chỉ thành viên dự án được vào, cấm điện thoại/camera, clean desk, camera giám sát lưu log; ② **logic** — dữ liệu khách chỉ truy cập qua VDI/jump server, không copy ra ngoài, dùng dữ liệu đã mask thay vì dữ liệu thật; ③ **quy trình** — danh sách người được phép do khách duyệt, cấp/thu quyền có biên bản, kiểm tra định kỳ. PM giữ danh sách này luôn khớp với **体制図 (taiseizu – sơ đồ tổ chức dự án)** đã nộp khách.", "t": ""}, {"n": 905, "c": 10, "g": "10.1", "q": "Chi nhánh mới nên kế thừa gì từ HQ và nên tự chủ ở đâu?", "a": "Kế thừa nguyên vẹn: quy trình chất lượng, template tài liệu, tiêu chuẩn bảo mật, chính sách nhân sự, công cụ quản lý — để khách thấy cùng một chuẩn dù làm ở site nào. Tự chủ ở: cách tuyển dụng và employer branding địa phương, chương trình fresher, hoạt động gắn kết, cải tiến vận hành nhỏ. Nguyên tắc của tôi là **\"cùng chuẩn, khác cách triển khai\"**: muốn đổi chuẩn thì đề xuất ngược về HQ để áp dụng toàn công ty, không tạo phiên bản riêng của chi nhánh.", "t": ""}, {"n": 906, "c": 10, "g": "10.1", "q": "Dự án \"mồi\" đầu tiên của chi nhánh nên được chọn theo tiêu chí nào?", "a": "Tôi chọn dự án: ① quy mô vừa (tham khảo 5–10 người, 3–6 tháng); ② domain/công nghệ đội đã có nền; ③ khách đã có quan hệ tốt với công ty, sẵn lòng \"cho cơ hội\"; ④ phạm vi rõ, rủi ro kỹ thuật thấp; ⑤ có khả năng mở rộng nếu làm tốt. Tránh dự án trọn gói gấp, hệ thống lõi tài chính hoặc khách hoàn toàn mới. Dự án mồi không cần lãi cao nhất — nó cần **một thành công kể lại được** để làm case cho khách tiếp theo.", "t": "Câu ghi điểm: \"Dự án mồi là để bán năng lực chi nhánh, không chỉ để có doanh thu\"."}, {"n": 907, "c": 10, "g": "10.1", "q": "Làm sao để chi nhánh mới không phụ thuộc kéo dài vào HQ?", "a": "Phụ thuộc lúc đầu là bình thường; rủi ro là phụ thuộc không có lối ra. Tôi làm 3 việc: ① lập ma trận \"HQ làm → ĐN học → ĐN làm\" cho từng chức năng (estimate, pre-sales, BrSE, QA, review kiến trúc), mỗi chức năng có mốc chuyển giao; ② mỗi lần HQ hỗ trợ đều có người Đà Nẵng đi kèm để học; ③ đo tỉ lệ việc ĐN tự xử lý, ví dụ % estimate do ĐN làm. Mục tiêu tham khảo: sau 12–18 tháng ĐN tự lo trọn dự án quy mô vừa.", "t": ""}, {"n": 908, "c": 10, "g": "10.1", "q": "Rủi ro lớn nhất khi vận hành chi nhánh mới là gì và kiểm soát thế nào?", "a": "Tôi thấy 4 rủi ro chính: ① **thiếu leader** (PM, tech lead, BrSE) → luân chuyển người từ HQ 6–12 tháng và đào tạo kế cận ngay; ② **đơn hàng không đều** → bench tăng, cần dự báo cùng sales; ③ **chất lượng lần đầu kém** làm mất niềm tin khách → QA review chéo với HQ cho 2–3 dự án đầu; ④ **văn hóa tách rời** HQ → sinh hoạt chung, luân chuyển, kênh chia sẻ. Tôi theo dõi trong risk register cấp chi nhánh, review hàng tháng với lãnh đạo.", "t": ""}, {"n": 909, "c": 10, "g": "10.1", "q": "Trong 90 ngày đầu tham gia chi nhánh Đà Nẵng, anh/chị sẽ làm gì?", "a": "30 ngày đầu **lắng nghe**: gặp lãnh đạo ĐN và HQ, các PM, xem P&L, pipeline, chất lượng các dự án đang chạy. Đến ngày 60: chọn 1–2 vấn đề ưu tiên (ví dụ thiếu BrSE, process chưa đồng bộ) và đề xuất kế hoạch có chỉ số. Đến ngày 90: có kết quả nhìn thấy được ở dự án mình phụ trách và đóng góp 1 việc ngoài dự án như template, buổi đào tạo hoặc hỗ trợ một proposal. Tôi không thay đổi lớn khi chưa hiểu bối cảnh.", "t": "Tránh nói \"sẽ thay đổi toàn bộ quy trình\" khi chưa biết hiện trạng — cả lãnh đạo VN lẫn khách Nhật đều đánh giá thấp kiểu này."}, {"n": 910, "c": 10, "g": "10.1", "q": "Chi nhánh đang 30 người thì một khách lớn yêu cầu tăng 40 người trong 2 tháng. Anh/chị xử lý thế nào?", "a": "① Xác nhận fact: khách cần đủ 40 cùng lúc hay theo đợt, skill gì, cam kết bao lâu. ② Đề xuất ramp-up theo đợt (ví dụ 10–15–15), lõi là leader từ HQ/site khác cộng người ĐN có kinh nghiệm, rồi mới đến fresher tốt. ③ Báo khách năng lực thật và kế hoạch theo **報連相 (hourensou – báo cáo, liên lạc, thảo luận)**, không hứa đủ người khi chưa có. ④ Giữ tỉ lệ senior/junior tối thiểu (tham khảo 1:3); về lâu dài dự báo nhu cầu 1–2 quý với sales để lần sau không bị động.", "t": "Bẫy: nhận hết để có doanh thu rồi vỡ chất lượng — với khách Nhật, mất niềm tin khó lấy lại hơn mất một đơn hàng."}, {"n": 911, "c": 10, "g": "10.1", "q": "Ở giai đoạn 0→30 người, chi nhánh cần cơ cấu vai trò tối thiểu nào?", "a": "Ngoài lãnh đạo chi nhánh, đội lõi gồm: 1–2 PM, tech lead cho mỗi stack chính, ít nhất 1 BrSE hoặc comtor (phiên dịch IT), QA lead, 1 người IT–admin lo hạ tầng và bảo mật, HR tuyển dụng tại chỗ. Giai đoạn đầu một người có thể kiêm 2 vai nhưng không kiêm vai xung đột, ví dụ dev tự QA sản phẩm của mình. BrSE là nút thắt lớn nhất vì khách Nhật cần đầu mối tiếng Nhật ổn định, nên tôi tìm người dự phòng ngay từ đầu.", "t": ""}, {"n": 912, "c": 10, "g": "10.2", "q": "Nguồn nhân lực IT ở Đà Nẵng đến từ đâu và anh/chị khai thác thế nào?", "a": "Tôi chia 3 nguồn: ① **sinh viên/fresher** từ ĐH Bách khoa – ĐH Đà Nẵng, ĐH Duy Tân, ĐH FPT Đà Nẵng, VKU và các trường miền Trung; ② **người có kinh nghiệm đang làm ở Đà Nẵng**; ③ **người gốc miền Trung** đang ở Hà Nội, TP.HCM hoặc Nhật muốn về quê. Mỗi nguồn một cách tiếp cận: ① hợp tác trường, thực tập có mentor; ② referral, sự kiện kỹ thuật; ③ chiến dịch \"về quê\" với dự án Nhật đủ thách thức và lộ trình rõ.", "t": ""}, {"n": 913, "c": 10, "g": "10.2", "q": "Hợp tác với các trường đại học ở Đà Nẵng nên làm gì để thật sự hiệu quả?", "a": "Không dừng ở ngày hội việc làm. Tôi đề xuất: ① thực tập 2–3 tháng có mentor và mini project theo quy trình Nhật; ② seminar/thỉnh giảng về quy trình outsourcing Nhật, chất lượng, Git, test; ③ học bổng hoặc cuộc thi lập trình nhỏ để nhận diện người giỏi sớm; ④ đo kết quả: % thực tập sinh được nhận, % qua thử việc, đánh giá sau 6 tháng theo từng trường. Trường nào cho tỉ lệ cao thì đầu tư sâu hơn.", "t": ""}, {"n": 914, "c": 10, "g": "10.2", "q": "Làm sao kéo kỹ sư gốc miền Trung đang làm ở Hà Nội, TP.HCM hoặc Nhật về Đà Nẵng?", "a": "Động lực về quê thường là gia đình và chất lượng sống; rào cản là nỗi lo \"về Đà Nẵng thì dự án kém, chậm thăng tiến\". Tôi xử lý rào cản: ① dự án khách Nhật lĩnh vực tài chính, bảo hiểm, sản xuất, công nghệ tương đương site lớn; ② lộ trình lên leader rõ vì chi nhánh đang mở rộng — đây là lợi thế thật; ③ người về từ Nhật có vai trò BrSE/điều phối onsite, dùng được tiếng Nhật. Kênh hiệu quả: referral, cộng đồng người miền Trung, LinkedIn.", "t": ""}, {"n": 915, "c": 10, "g": "10.2", "q": "Cạnh tranh tuyển dụng với các công ty IT khác tại Đà Nẵng, anh/chị tạo khác biệt bằng gì?", "a": "Không cạnh tranh chỉ bằng lương vì luôn có nơi trả cao hơn. Tôi dựa vào điều JD thể hiện: dự án khách Nhật trong tài chính, bảo hiểm, sản xuất; đào tạo tiếng Nhật; hỗ trợ thi Cloud/AWS/PMP; review performance 2 lần/năm nên tăng trưởng nhanh hơn; định hướng làm sản phẩm riêng. Cộng thêm cơ hội tham gia xây chi nhánh từ đầu — vai trò leader đến sớm hơn so với công ty đã ổn định.", "t": "Khi nói về employer branding, chỉ dùng fact có trong JD — đừng bịa chính sách công ty."}, {"n": 916, "c": 10, "g": "10.2", "q": "Anh/chị thiết kế chương trình fresher kèm tiếng Nhật cho chi nhánh như thế nào?", "a": "Khóa 3–4 tháng (tham khảo), 3 luồng song song: ① kỹ thuật theo stack dự án sắp cần; ② quy trình Nhật — đọc **基本設計 (kihon sekkei – thiết kế cơ bản)**, viết test case, báo cáo theo hourensou, quy tắc chất lượng; ③ tiếng Nhật để đọc tài liệu và giao tiếp cơ bản (tham khảo: mục tiêu JLPT N4, người có nền hướng tới N3). Cuối khóa làm mini project giả lập khách Nhật, chấm theo tiêu chí rõ. Vào dự án thật, fresher shadow 1–2 tháng trước khi nhận task độc lập.", "t": ""}, {"n": 917, "c": 10, "g": "10.2", "q": "Chi nhánh thiếu BrSE trầm trọng, anh/chị giải quyết ngắn hạn và dài hạn thế nào?", "a": "Ngắn hạn: chia sẻ BrSE từ HQ theo lịch, dùng comtor kết hợp PM/tech lead đọc được tiếng Nhật, chuẩn hóa template Q&A và báo cáo để giảm phụ thuộc vào giao tiếp tự do. Dài hạn: chọn 3–5 dev giỏi có tiếng Nhật N3 trở lên vào lộ trình \"BrSE dự bị\" — học nghiệp vụ, đi họp cùng BrSE chính, đi onsite ngắn hạn; tuyển thêm người về từ Nhật. Chỉ số theo dõi: số dự án có BrSE dự phòng.", "t": ""}, {"n": 918, "c": 10, "g": "10.2", "q": "Employer branding cho chi nhánh mới nên tập trung vào thông điệp nào?", "a": "Thông điệp phải thật và kiểm chứng được. Tôi chọn 3 trụ: ① **\"Làm dự án Nhật chất lượng cao ngay tại Đà Nẵng\"** — kể case dự án thật khi khách đã cho phép; ② **\"Cùng xây chi nhánh, lên leader sớm\"**; ③ **\"Học tiếng Nhật, được hỗ trợ thi Cloud/PMP\"**. Kênh: bài chia sẻ kỹ thuật của chính kỹ sư ĐN, sự kiện ở trường, câu chuyện người về quê. Kênh mạnh nhất vẫn là nhân viên hài lòng giới thiệu bạn bè.", "t": "Nói rõ phải xin phép khách trước khi dùng tên hoặc case dự án — khách Nhật rất nhạy cảm chuyện này."}, {"n": 919, "c": 10, "g": "10.2", "q": "Ở cấp chi nhánh, anh/chị giữ chân nhân sự thế nào khi đối thủ trả lương cao hơn?", "a": "Tôi tách nhóm **key person** (leader, BrSE, người nắm domain) khỏi phần còn lại và chấp nhận một mức nghỉ việc tự nhiên. Với key person: lộ trình rõ, review 2 lần/năm gắn tăng lương, cơ hội onsite, chứng chỉ, dự án thách thức, và điều chỉnh lương theo dữ liệu thị trường trước khi họ nhận offer. Ở cấp chi nhánh, tôi đo attrition theo nhóm và đọc exit interview mỗi quý để sửa nguyên nhân gốc, thay vì tăng lương chữa cháy từng trường hợp.", "t": ""}, {"n": 920, "c": 10, "g": "10.2", "q": "Anh/chị đo hiệu quả tuyển dụng của chi nhánh bằng những chỉ số nào?", "a": "Hai nhóm: **tốc độ/chi phí** — time-to-fill, tỉ lệ nhận offer, chi phí tuyển theo kênh; **chất lượng** — % qua thử việc, đánh giá performance sau 6 tháng, attrition trong 12 tháng đầu, % đến từ referral. Nhóm chất lượng quan trọng hơn: tuyển nhanh mà 6 tháng sau nghỉ thì tốn gấp đôi. Mỗi quý tôi so các chỉ số theo kênh để dồn ngân sách vào kênh tốt nhất.", "t": ""}, {"n": 921, "c": 10, "g": "10.2", "q": "Có ý kiến tuyển thật nhiều fresher thay middle/senior để giảm chi phí. Anh/chị phản biện thế nào?", "a": "Đồng ý một phần: fresher giảm cost per head và tạo nguồn dài hạn. Nhưng phải nhìn bằng số: fresher cần 3–6 tháng mới billable đầy đủ, chiếm thời gian mentor của senior, rủi ro defect cao hơn với khách Nhật khắt khe. Tôi đề xuất cơ cấu kim tự tháp có kiểm soát, ví dụ senior : middle : junior ≈ 1 : 2 : 3 (tham khảo), chỉ tăng fresher khi đủ mentor, và tính margin theo cả vòng đời dự án thay vì chỉ lương tháng.", "t": "Câu senior: quy về margin và rủi ro chất lượng có số, không trả lời đúng/sai cảm tính."}, {"n": 922, "c": 10, "g": "10.3", "q": "Anh/chị lập transition plan chuyển một dự án đang chạy từ Hà Nội vào Đà Nẵng thế nào?", "a": "Kế hoạch **引継ぎ (hikitsugi – bàn giao)** gồm 4 pha: ① **chuẩn bị** — đánh giá tài liệu, nợ kỹ thuật, ai nắm kiến thức gì; chọn đội ĐN; xin đồng ý của khách; ② **KT (knowledge transfer)** — tài liệu, walkthrough code, nghiệp vụ; ③ **shadowing** — ĐN làm cùng, HN chịu trách nhiệm; ④ **reverse shadowing** — ĐN làm chính, HN giám sát; sau đó mới bàn giao chính thức. Mỗi pha có exit criteria đo được, người chủ chốt HN hỗ trợ thêm 1–2 tháng sau bàn giao.", "t": "Khách Nhật hay hỏi \"người cũ còn hỗ trợ đến khi nào\" — chuẩn bị sẵn câu trả lời bằng lịch cụ thể."}, {"n": 923, "c": 10, "g": "10.3", "q": "Exit criteria để kết thúc giai đoạn shadowing là gì?", "a": "Ngưỡng tham khảo: ① đội ĐN tự xử lý ≥ 80% task trong 2 sprint liên tiếp không cần HN can thiệp; ② năng suất đạt ≥ 85–90% đội cũ; ③ defect rate không tăng so với baseline; ④ trả lời Q&A nghiệp vụ của khách đúng hạn; ⑤ checklist KT được ký đủ (môi trường, deploy, vận hành, sự cố thường gặp). Chưa đạt thì kéo dài shadowing — không bàn giao chỉ vì \"đến ngày\".", "t": ""}, {"n": 924, "c": 10, "g": "10.3", "q": "Khách Nhật lo ngại khi biết dự án sẽ chuyển sang site mới Đà Nẵng. Anh/chị trấn an thế nào?", "a": "① Hiểu nỗi lo thật: sợ chất lượng giảm, mất người quen, rủi ro bảo mật. ② Đưa kế hoạch cụ thể: chuyển theo pha, người chủ chốt cũ ở lại trong giai đoạn chuyển, đầu mối liên lạc không đổi. ③ Đưa bằng chứng: site đạt cùng tiêu chuẩn bảo mật, mời khách tham quan trực tiếp hoặc online, báo cáo chỉ số chất lượng hàng tuần. ④ Bắt đầu từ phần rủi ro thấp, đặt điểm kiểm tra cùng khách trước khi chuyển phần lõi.", "t": "Khách cần **安心 (anshin – sự yên tâm)** hơn lời hứa: đưa kế hoạch, số liệu và quyền dừng lại cho khách."}, {"n": 925, "c": 10, "g": "10.3", "q": "Phân bổ dự án giữa các site Hà Nội, TP.HCM, Đà Nẵng nên dựa trên tiêu chí nào?", "a": "Tôi dùng ma trận 5 tiêu chí: ① năng lực sẵn có của site (stack, domain, tiếng Nhật); ② mức rủi ro dự án — khách mới, hệ thống lõi, trọn gói gấp nên đặt ở đội đã trưởng thành; ③ khả năng mở rộng nhân sự tại site; ④ chi phí; ⑤ mục tiêu chiến lược — ví dụ cố ý đưa dự án domain sản xuất về ĐN để xây mũi nhọn. Không phân theo \"site nào đang trống người\", vì đó là cách tạo ra dự án thất bại.", "t": ""}, {"n": 926, "c": 10, "g": "10.3", "q": "Làm sao chuẩn hóa process giữa các site để khách thấy chất lượng đồng nhất?", "a": "① Một bộ quy trình và template chung (WBS, Q&A list, báo cáo tuần, checklist review, test report); ② chỉ số chất lượng chung với định nghĩa thống nhất (defect density, tỉ lệ review, tỉ lệ rework); ③ audit chéo — QA site này audit dự án site kia mỗi quý; ④ cộng đồng PM/QA liên site chia sẻ bài học; ⑤ công cụ quản lý chung. Cách làm nội bộ có thể khác, nhưng đầu ra giao cho khách phải giống nhau.", "t": ""}, {"n": 927, "c": 10, "g": "10.3", "q": "Mô hình \"đội ĐN là phần mở rộng của dự án HN\" và \"site ĐN làm trọn dự án\" — anh/chị chọn thế nào?", "a": "Mô hình mở rộng dễ bắt đầu, tận dụng leader HN, nhưng chi phí phối hợp cao và đội ĐN khó trưởng thành vì chỉ nhận task. Mô hình làm trọn tạo ownership, xây leader ĐN, nhưng rủi ro ban đầu cao hơn. Tôi đi theo lộ trình: bắt đầu bằng module rõ ràng, sau 2–3 tháng giao trọn một module end-to-end, rồi trọn dự án. Tránh chia lâu dài theo layer kiểu \"HN thiết kế, ĐN code\" vì trách nhiệm chất lượng bị cắt đôi.", "t": "Nêu trade-off cả hai phía rồi mới chọn — đó là cách trả lời của senior."}, {"n": 928, "c": 10, "g": "10.3", "q": "Đang chuyển giao thì người nắm kiến thức chủ chốt ở Hà Nội xin nghỉ việc. Anh/chị xử lý thế nào?", "a": "① Xác nhận thời gian còn lại và phần kiến thức chưa chuyển, xếp theo rủi ro. ② Ngay lập tức: giảm việc mới của người đó, ưu tiên KT phần rủi ro cao — ghi video walkthrough, tài liệu vận hành, ghép người ĐN ngồi cùng. ③ Báo khách theo hourensou: ảnh hưởng, kế hoạch bù, đề xuất lùi mốc nếu cần. ④ **再発防止 (saihatsu boushi – phòng ngừa tái phát)**: quy định mỗi mảng kiến thức có ít nhất 2 người nắm (bus factor ≥ 2) trước khi bắt đầu mọi đợt chuyển giao.", "t": ""}, {"n": 929, "c": 10, "g": "10.3", "q": "Làm sao đo một đợt chuyển giao sang Đà Nẵng đã thành công?", "a": "So với baseline trước chuyển giao, đo sau 3 và 6 tháng: ① chất lượng — defect ở UAT/production không tăng; ② tiến độ — tỉ lệ đúng hạn milestone; ③ khách — điểm khảo sát, số lần phàn nàn; ④ đội — attrition, mức tự chủ; ⑤ kinh tế — margin dự án sau chuyển. Chỉ số nào xấu đi quá ngưỡng đã thống nhất với lãnh đạo, tôi kích hoạt hỗ trợ lại từ HN và báo minh bạch, không che giấu.", "t": ""}, {"n": 930, "c": 10, "g": "10.3", "q": "Chi nhánh Đà Nẵng nên chuyên môn hóa theo domain/công nghệ hay làm đa năng?", "a": "Giai đoạn đầu (dưới 100 người) nên đa năng vừa phải để không phụ thuộc một khách. Khi đủ quy mô, chọn 1–2 mũi nhọn để có nhận diện — ví dụ domain sản xuất hoặc dịch vụ test — dựa trên nhu cầu khách hiện có, năng lực sẵn và nguồn tuyển tại ĐN. Chuyên môn hóa giúp bán dễ hơn nhưng phải kiểm soát **rủi ro tập trung**: tôi giữ không account nào chiếm quá khoảng 40% doanh thu chi nhánh (tham khảo).", "t": ""}, {"n": 931, "c": 10, "g": "10.3", "q": "Cần chuẩn bị gì khi khách Nhật đến thăm hoặc audit site Đà Nẵng lần đầu?", "a": "① Gửi agenda trước 1–2 tuần, xác nhận người tham dự và mục tiêu; ② tài liệu tiếng Nhật về chi nhánh, **体制 (taisei – cơ cấu tổ chức)**, quy trình chất lượng, bảo mật; ③ tour khu làm việc bảo mật, demo kiểm soát ra vào, quản lý thiết bị; ④ để thành viên chủ chốt tự giới thiệu; ⑤ sau chuyến thăm gửi biên bản, trả lời các điểm khách lưu ý đúng hạn đã hẹn. Chi tiết nhỏ như đúng giờ, danh thiếp, phòng họp gọn gàng đều được để ý.", "t": ""}, {"n": 932, "c": 10, "g": "10.4", "q": "P&L của một dự án outsourcing gồm những dòng chính nào?", "a": "**Doanh thu** (theo man-month hoặc trọn gói, ghi nhận theo nghiệm thu/tiến độ) trừ **chi phí trực tiếp** — lương và bảo hiểm thành viên, BrSE/comtor, onsite (vé, lưu trú, phụ cấp), license, hạ tầng riêng, đào tạo riêng cho dự án — ra **gross margin**. Trừ tiếp chi phí gián tiếp phân bổ (văn phòng, quản lý, sales) ra lợi nhuận đóng góp. PM tối thiểu phải nắm gross margin dự án và biết yếu tố nào làm nó biến động hàng tháng.", "t": ""}, {"n": 933, "c": 10, "g": "10.4", "q": "Gross margin dự án là gì và PM tác động đến nó bằng cách nào?", "a": "Gross margin = (doanh thu − chi phí trực tiếp) / doanh thu. PM tác động qua: ① kiểm soát effort thực tế so với kế hoạch, giảm rework; ② cơ cấu đội hợp lý, không để senior làm việc junior làm được; ③ mọi phát sinh đi qua change request có tính phí; ④ cắt chi phí onsite không cần thiết; ⑤ nghiệm thu đúng hạn để ghi nhận doanh thu. Tôi xem margin hàng tháng, lệch hơn 5 điểm % so với kế hoạch (tham khảo) thì phân tích nguyên nhân và báo cấp trên.", "t": "\"Rework và phát sinh không tính phí là hai thứ ăn margin nhiều nhất\" — câu này rất thuyết phục nếu kèm ví dụ thật."}, {"n": 934, "c": 10, "g": "10.4", "q": "Utilization rate và billable rate khác nhau thế nào, nên đặt mục tiêu bao nhiêu?", "a": "**Utilization** = giờ làm việc có mã dự án (kể cả việc nội bộ) / giờ khả dụng; **billable rate** = giờ khách trả tiền / giờ khả dụng. Mục tiêu tham khảo cho kỹ sư delivery khoảng 80–85% billable; leader thấp hơn vì còn quản lý, đào tạo. 100% không phải tốt — không còn thời gian học, không có dự phòng, dễ burnout. Ở cấp chi nhánh tôi xem thêm tỉ lệ người billable trên tổng headcount, vì bộ máy gián tiếp phình nhanh cũng làm lỗ.", "t": ""}, {"n": 935, "c": 10, "g": "10.4", "q": "Bench management là gì, chi nhánh xử lý nhân sự bench thế nào?", "a": "Bench là nhân sự chưa được gán vào dự án có doanh thu. Tôi quản lý theo 3 hướng: ① **phòng** — dự báo nhu cầu 1–2 quý cùng sales, lên lịch release người từ dự án sắp kết thúc; ② **dùng** — bench học kỹ năng/tiếng Nhật theo pipeline, làm POC cho pre-sales, công cụ nội bộ, shadow dự án sắp mở rộng; ③ **giới hạn** — bench kéo dài quá 1–2 tháng thì xem xét chuyển site hoặc vai trò. Mức bench an toàn tham khảo 5–10% headcount, đủ đáp ứng đơn gấp.", "t": ""}, {"n": 936, "c": 10, "g": "10.4", "q": "Cost per head tính thế nào và vì sao Đà Nẵng có thể là lợi thế chi phí?", "a": "Cost per head = tổng chi phí (lương, bảo hiểm, phúc lợi, văn phòng, thiết bị, quản lý phân bổ) / số nhân sự, tính theo tháng. Đà Nẵng thường có chi phí thuê văn phòng và mức lương thấp hơn HN/HCM ở cùng trình độ — đây là nhận định chung, cần kiểm bằng dữ liệu HR thực tế của công ty. Lợi thế chỉ có thật khi năng suất và chất lượng tương đương; nếu phải kéo nhiều người HQ hỗ trợ hoặc rework nhiều thì lợi thế biến mất.", "t": "Không đưa con số lương thị trường cụ thể khi không có nguồn — nói \"cần kiểm dữ liệu\" là câu trả lời chín chắn."}, {"n": 937, "c": 10, "g": "10.4", "q": "Những chi phí \"ẩn\" nào thường làm dự án offshore Nhật lỗ?", "a": "① **BrSE/comtor**: dịch tài liệu, họp, Q&A tốn nhiều effort hơn dự tính; ② **onsite**: vé, visa, lưu trú, thời gian chưa billable; ③ **đào tạo** domain và tiếng Nhật cho người mới; ④ **rework** do hiểu sai yêu cầu; ⑤ **evidence và tài liệu chất lượng** theo yêu cầu khắt khe (ảnh chụp kết quả test, báo cáo review); ⑥ **thời gian chờ** khách trả lời Q&A; ⑦ chi phí thay người giữa chừng. Tôi tách các mục này thành dòng riêng trong ngân sách và theo dõi thực tế hàng tháng.", "t": ""}, {"n": 938, "c": 10, "g": "10.4", "q": "PM chịu trách nhiệm gì với thưởng dự án/doanh thu?", "a": "JD có thưởng dự án/doanh thu, nên PM chịu trách nhiệm trực tiếp với các yếu tố tạo ra nó: giao đúng hạn, đạt chất lượng để nghiệm thu và ghi nhận doanh thu, giữ margin, mở ra cơ hội mở rộng. Với đội, tôi công khai tiêu chí phân bổ thưởng dựa trên đóng góp đo được — chất lượng, trách nhiệm, hỗ trợ người khác — tránh chia đều cảm tính. Thưởng không bao giờ được đổi bằng cắt giảm test hay ép OT để \"kịp số\".", "t": "Nhấn \"không đổi chất lượng lấy số\" — interviewer thường kiểm tra thái độ này."}, {"n": 939, "c": 10, "g": "10.4", "q": "Giữa dự án, anh/chị phát hiện dự án đang lỗ. Anh/chị làm gì?", "a": "① Xác nhận fact: lỗ do effort vượt, phát sinh chưa tính phí, cơ cấu đội hay estimate sai từ đầu; dự báo lỗ đến cuối dự án. ② Hành động ngay: dừng việc ngoài phạm vi, tối ưu cơ cấu đội, gom phát sinh làm căn cứ change request. ③ Báo cấp trên sớm theo hourensou kèm 2–3 phương án; đàm phán với khách khi có căn cứ phạm vi rõ ràng. ④ Ghi bài học cho estimate và hợp đồng sau, **横展開 (yokotenkai – nhân rộng bài học)** sang các dự án tương tự.", "t": ""}, {"n": 940, "c": 10, "g": "10.4", "q": "Khi nào nên chấp nhận một dự án margin thấp?", "a": "Khi có giá trị chiến lược đo được: ① dự án mồi mở account có tiềm năng lớn; ② xây năng lực domain/công nghệ công ty đang cần; ③ lấp bench cao trong thời gian ngắn; ④ tạo case cho chi nhánh mới. Điều kiện: mục tiêu rõ (ví dụ sau 6 tháng mở rộng thêm người hoặc điều chỉnh giá ở hợp đồng sau), có giới hạn lỗ, có lãnh đạo duyệt. Không nhận margin thấp chỉ vì sợ mất khách.", "t": "Trả lời kiểu \"đầu tư có điều kiện thoát\", không phải \"nhận hết\" hay \"từ chối hết\"."}, {"n": 941, "c": 10, "g": "10.4", "q": "Chi nhánh có utilization cao nhưng margin vẫn thấp — nguyên nhân có thể là gì?", "a": "Tôi kiểm lần lượt các giả thuyết: ① giá bán thấp — rate cũ chưa điều chỉnh, giảm giá để giữ khách, yên yếu làm doanh thu quy đổi giảm; ② cơ cấu đội nặng senior so với rate khách trả; ③ effort thực lớn hơn effort được tính tiền — phát sinh, rework; ④ chi phí gián tiếp của chi nhánh mới (quản lý, văn phòng) chia trên headcount còn ít; ⑤ hỗ trợ từ HQ không được phân bổ đúng. Mỗi giả thuyết có dữ liệu để kiểm trước khi hành động.", "t": ""}, {"n": 942, "c": 10, "g": "10.4", "q": "Làm sao cân bằng đầu tư đào tạo (không billable) với mục tiêu margin?", "a": "Tôi coi đào tạo là khoản đầu tư có ngân sách riêng, không phải chi phí \"giấu\" trong dự án: ① đặt % thời gian đào tạo theo vai (tham khảo 5–10% cho junior); ② gắn nội dung với pipeline — học thứ dự án sắp cần; ③ tận dụng bench và chính sách hỗ trợ thi Cloud/AWS/PMP; ④ đo ROI đơn giản: thời gian từ đào tạo đến billable, số người có chứng chỉ khách yêu cầu. Đào tạo đúng chỗ giúp bán được rate cao hơn về sau.", "t": ""}, {"n": 943, "c": 10, "g": "10.5", "q": "Làm sao biến một dự án nhỏ thành account lớn với khách Nhật?", "a": "Khách Nhật mở rộng dựa trên **信頼 (shinrai – niềm tin)** tích lũy, nên thứ tự là: ① làm thật tốt dự án đầu — đúng hạn, ít lỗi, báo cáo minh bạch; ② hiểu nghiệp vụ và kế hoạch IT của khách, không chỉ phần mình làm; ③ chủ động đề xuất cải tiến nhỏ có giá trị; ④ khi khách nhắc việc mới, có ngay đề xuất kèm đội sẵn sàng. Lộ trình điển hình: maintain → phát triển tính năng → hệ thống mới → đồng hành DX.", "t": ""}, {"n": 944, "c": 10, "g": "10.5", "q": "Upsell và cross-sell khác nhau thế nào trong outsourcing? Cho ví dụ.", "a": "**Upsell** là tăng quy mô cùng loại dịch vụ: từ 5 lên 15 người, từ maintain 1 hệ thống lên nhiều hệ thống. **Cross-sell** là bán thêm loại dịch vụ khác: khách đang thuê phát triển → thêm test độc lập, migration lên cloud, vận hành, tự động hóa bằng AI. Ví dụ: khách sản xuất C thuê maintain hệ thống quản lý kho; đội thấy nhiều thao tác nhập tay lặp lại → đề xuất POC tự động hóa → thành dự án mới.", "t": ""}, {"n": 945, "c": 10, "g": "10.5", "q": "Chuyển từ hợp đồng 準委任 theo dự án sang ラボ型 có lợi gì cho hai bên, cần điều kiện gì?", "a": "**準委任 (jun'inin – hợp đồng tính theo công/thời gian)** thường gắn với từng dự án; **ラボ型 (rabo-gata – mô hình lab/ODC)** là đội cố định dài hạn dành riêng cho khách. Khách lợi: đội ổn định, giữ kiến thức, linh hoạt đổi ưu tiên; công ty lợi: doanh thu đều, dễ lập kế hoạch nhân sự. Điều kiện: khách có lượng việc liên tục, đã tin năng lực đội, có người phía khách quản lý backlog. PM phải chứng minh năng suất bằng số để lab không bị xem là \"nuôi người\".", "t": ""}, {"n": 946, "c": 10, "g": "10.5", "q": "Anh/chị đo mức hài lòng của khách Nhật bằng cách nào?", "a": "Kết hợp: ① khảo sát định kỳ (theo quý hoặc cuối phase) về chất lượng, tiến độ, giao tiếp, đề xuất cải tiến; ② chỉ số khách quan — số phàn nàn, defect khách tìm thấy, tỉ lệ đúng hạn; ③ họp review định kỳ cấp quản lý để nghe điều khách không viết ra. Câu \"**問題ない (mondai nai – không có vấn đề gì)**\" chưa chắc là hài lòng; tôi hỏi tiếp \"có điểm nào muốn chúng tôi làm tốt hơn không\" để mở cửa cho góp ý thật.", "t": "Đừng chỉ khảo sát người phụ trách trực tiếp; hãy hỏi cả cấp quản lý quyết định ngân sách phía khách."}, {"n": 947, "c": 10, "g": "10.5", "q": "NPS tính thế nào và có hạn chế gì khi dùng với khách Nhật?", "a": "NPS = % người chấm 9–10 (promoter) − % người chấm 0–6 (detractor) trên thang 0–10. Hạn chế: số người trả lời trong một account ít nên điểm dao động mạnh; người Nhật thường tránh chấm cực trị nên NPS có thể thấp dù khách vẫn hài lòng (nhận định chung). Vì vậy tôi dùng NPS như xu hướng của chính account qua các kỳ, kèm comment định tính và hành vi thực tế: khách có gia hạn, mở rộng, giới thiệu bộ phận khác không.", "t": "So xu hướng của chính account qua các kỳ thay vì so với benchmark Âu–Mỹ."}, {"n": 948, "c": 10, "g": "10.5", "q": "PM phối hợp với sales/pre-sales thế nào để tăng trưởng account?", "a": "PM là \"tai mắt\" bên trong account: ① chia sẻ tín hiệu cơ hội với sales hàng tháng — khách nhắc hệ thống mới, ngân sách năm sau, khó khăn của bộ phận khác; ② hỗ trợ estimate, viết phần giải pháp và thể chế đội trong proposal tiếng Nhật; ③ tham gia họp với khách ở vai người sẽ giao hàng — khách Nhật tin người làm thực tế hơn người bán; ④ thống nhất ranh giới: PM không hứa giá thay sal
